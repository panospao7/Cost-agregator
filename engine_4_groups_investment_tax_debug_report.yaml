      - "E4-CURRENT-032"
      - "E4-CURRENT-033"

definition_of_done:
  - "All group/investment/tax DB writes respect DatabaseWriteBarrier."
  - "Group lifecycle mutation and event insert are atomic."
  - "Group-linked expense ownership side effects dispatch only after the final outer transaction commits."
  - "Group members always have nonzero joinedAt."
  - "Every group expense path enforces group currency or explicitly supports converted multi-currency groups."
  - "Group balance calculation uses historical membership/split participation and active same-currency settlements only."
  - "Hard delete cannot leave expense shared flags inconsistent."
  - "Shared budget offset includes archived obligations where applicable and exposes source buckets/failures."
  - "Investment UI does not call raw mixed-currency getPortfolioSummary()."
  - "Portfolio summary, performances, allocation, and history are MoneyAggregate/dataQuality-backed."
  - "Investment transaction ledger has FK and supports buy/sell/dividend/fees or feature is clearly single-lot only."
  - "Investment validation rejects NaN/infinity/invalid currency/blank symbol/bad dates."
  - "Tax estimates use filing currency consistently and declare FX/rate basis."
  - "Tax income/deductions convert per transaction date or equivalent historical grouping."
  - "Business reports do not raw-sum mixed currencies and do not hardcode euro."
  - "Business CSV uses formula-safe sanitizer and privacy/redaction policy."
  - "Tax settings validate country/currency/fiscal dates and persist durably."
  - "Business/tax lifecycle API either persists every accepted field or rejects unsupported fields."
  - "Tax/business report runs are auditable with settings, rate source, FX basis, row counts, and partial warnings."

