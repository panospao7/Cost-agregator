  T10_business_tax_lifecycle:
    tracker_status: "FIXED"
    actual_status: "PARTIAL"
    notes:
      - "TransactionLifecycleCoordinator.updateBusinessFlags() writes UPDATED event for isBusinessExpense/requiresReceipt."
      - "businessUsePercent/taxCategory/vatEligible are no-op."
