positive_findings:
  - "GroupLifecycleCoordinator now exists and is the intended user-facing lifecycle entry point."
  - "GroupTransactionCoordinator fixes currentUserGroupKey on create/add member."
  - "createSystemExpenseAndLinkToGroup() uses SideEffectMode.DEFER and post-commit dispatch."
  - "GroupSettlementEntity/Dao and GroupLifecycleEventEntity/Dao exist."
  - "SettlementCalculator rejects mixed-currency balances."
  - "SharedExpenseBudgetOffsetEngine uses convertAsOf and exposes partial/warning fields."
  - "InvestmentTracker.addHolding() inserts holding + initial InvestmentValue + BUY InvestmentTransaction atomically."
  - "InvestmentTracker.updatePrice() atomically updates current price + value history."
  - "InvestmentTracker has MoneyAggregate portfolio summary and stale-price dataQuality."
  - "Portfolio history now carries forward latest known values instead of undercounting missing days."
  - "TaxSettingsRepository persists country, filing currency, fiscal-year start, VAT flag, report policy."
  - "TaxEstimator includes MoneyAggregate fields on TaxEstimate/TaxYearSummary."
  - "Mileage fallback deduction is fixed in BusinessExpenseRepository."
  - "TaxRateProvider exists as an extension point."

issues:
  - id: "E4-CURRENT-001"
    severity: "P0_RESTORE_SAFETY"
    status: "OPEN"
    title: "Group writes do not use DatabaseWriteBarrier"
    evidence:
      - "GroupLifecycleCoordinator does not inject DatabaseWriteBarrier."
      - "GroupTransactionCoordinator does not inject DatabaseWriteBarrier."
      - "createGroup/addMember/removeMember/addExpense/archive/delete/recordSettlement all perform DB writes."
    impact:
      - "Groups, members, expenses, settlements, and lifecycle events can mutate DB during restore/backup/restart-required mode."
    fix:
      - "Inject DatabaseWriteBarrier into GroupLifecycleCoordinator."
      - "Check writes before every public write method."
      - "Add static guard for direct Group*Dao mutators."
    tests:
      - "restore_blocks_group_create_add_member_add_expense"
      - "restore_blocks_group_settlement_and_archive"
      - "group_dao_mutator_guard_blocks_unapproved_callers"

  - id: "E4-CURRENT-002"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Group lifecycle events are not atomic with mutations"
    evidence:
      - "GroupLifecycleCoordinator calls groupCoordinator methods, then emitLifecycleEvent() afterward."
      - "removeMember() calls memberDao.delete(member), then emitLifecycleEvent()."
      - "recordSettlement() inserts settlement, then emitLifecycleEvent()."
    impact:
      - "A group mutation can commit without its lifecycle audit event."
      - "An event insert failure leaves mutation without durable trace."
    fix:
      - "Move mutation + lifecycle event insert into one database.withTransaction."
      - "Use a single GroupLifecycleCoordinator-owned transaction or lower-level transaction callback."
    tests:
      - "group_create_event_failure_rolls_back_or_records_diagnostic"
      - "settlement_and_event_are_atomic"
      - "member_remove_and_event_are_atomic"

  - id: "E4-CURRENT-003"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Linked group expense ownership update can dispatch side effects before outer group transaction commits"
    evidence:
      - "GroupTransactionCoordinator.addExpenseWithLink() opens database.withTransaction."
      - "Inside it calls normalizeLinkedSystemExpense()."
      - "normalizeLinkedSystemExpense() calls TransactionLifecycleCoordinator.updateOwnership()."
      - "updateOwnership() writes event and dispatches post-update side effects after its own transaction."
    impact:
      - "Budget/analytics/recurring side effects can run before the groupExpense insert transaction fully commits."
      - "If outer group transaction later fails, side effects can observe rolled-back/incomplete state."
    fix:
      - "Add TransactionLifecycleCoordinator.updateOwnershipDbOnly(..., SideEffectMode.DEFER)."
      - "Collect post-commit actions and dispatch after outer group transaction commits."
    tests:
      - "addExpenseWithLink_outer_failure_does_not_dispatch_ownership_side_effects"
      - "linked_expense_update_event_and_group_link_commit_together"

  - id: "E4-CURRENT-004"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Group member joinedAt can remain 0"
    evidence:
      - "GroupMember.joinedAt default is 0L sentinel."
      - "GroupLifecycleCoordinator.addMember() delegates to groupCoordinator.addMemberToGroup() without passing joinedAt."
      - "GroupTransactionCoordinator.addMemberToGroup() creates GroupMember(... joinedAt default)."
      - "createGroupWithMembers() preserves caller-provided member.joinedAt; lifecycle create does not enforce nonzero timestamps."
    impact:
      - "Historical split participation, audit ordering, and member deletion validation can be wrong."
    fix:
      - "Set joinedAt=timeProvider.now() in all group member creation paths."
      - "Backfill existing joinedAt=0 rows."
    tests:
      - "addMember_sets_joinedAt_now"
      - "createGroup_sets_all_member_joinedAt_nonzero"
      - "migration_backfills_group_member_joinedAt_zero"

  - id: "E4-CURRENT-005"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Standalone group expense path can still bypass single-currency policy"
    evidence:
      - "GroupLifecycleCoordinator.addExpense() checks effectiveCurrency == group.defaultCurrency."
      - "GroupTransactionCoordinator.addExpenseToGroup() resolves currency ?: group.defaultCurrency but does not reject mismatch."
      - "SharedExpenseManager has TODO about enforcing single-currency groups."
    impact:
      - "Direct or legacy callers can create mixed-currency group expenses."
      - "Settlement and shared budget offset assumptions can be violated."
    fix:
      - "Enforce currency policy inside GroupTransactionCoordinator low-level methods too."
      - "Make lifecycle coordinator the only production write entry point."
    tests:
      - "low_level_addExpenseToGroup_rejects_currency_mismatch"
      - "legacy_sharedExpenseManager_rejects_currency_mismatch"

  - id: "E4-CURRENT-006"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "removeMember() balance check and delete are race-prone"
    evidence:
      - "GroupLifecycleCoordinator.removeMember() computes balance, then calls memberDao.delete(member)."
      - "No database.withTransaction wraps balance check + delete."
      - "No write barrier is checked."
    impact:
      - "Concurrent group expense/settlement insert can make the balance stale before delete."
      - "Member can be deleted while becoming referenced/outstanding."
    fix:
      - "Run member validation, outstanding balance query, and delete in one transaction."
      - "Use affected-row result and lifecycle event in same transaction."
    tests:
      - "removeMember_concurrent_expense_insert_does_not_delete_member"
      - "removeMember_uses_transaction_and_writeBarrier"

  - id: "E4-CURRENT-007"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "GroupBalanceCalculator uses current member count for historical equal splits"
    evidence:
      - "calculateMemberBalance() gets memberCount = memberDao.getMemberCount(groupId)."
      - "For SplitType.EQUAL it computes expense.totalAmount / memberCount."
      - "It does not use joinedAt/date participation logic like SplitCalculator."
    impact:
      - "Adding/removing members can rewrite historical owed shares."
      - "Outstanding balance gate can block/allow deletion incorrectly."
    fix:
      - "Use SplitCalculator.calculateMemberShare() with actual member list and expense date."
      - "Respect joinedAt and custom split participation."
    tests:
      - "old_equal_split_not_recomputed_when_new_member_added_later"
      - "removeMember_balance_uses_expense_date_participation"

  - id: "E4-CURRENT-008"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "GroupBalanceCalculator ignores settlement status and currency"
    evidence:
      - "calculateMemberBalance() sums all settlements by fromMemberId/toMemberId."
      - "GroupSettlementEntity has status but calculator does not filter status='RECORDED'/'COMPLETED'."
      - "It does not check settlement.currency against group.defaultCurrency."
    impact:
      - "Cancelled/foreign-currency settlements can alter balances."
    fix:
      - "Filter active settlement statuses."
      - "Reject/diagnose settlement currency mismatch."
    tests:
      - "cancelled_settlement_does_not_affect_balance"
      - "foreign_currency_settlement_rejected_or_ignored_with_diagnostic"

  - id: "E4-CURRENT-009"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "recordSettlement() lacks amount/self/idempotency validation"
    evidence:
      - "GroupLifecycleCoordinator.recordSettlement() validates group active, currency, and member ownership."
      - "It does not require amount > 0 or finite."
      - "It does not reject fromMemberId == toMemberId."
      - "No duplicate/idempotency key exists."
    impact:
      - "Zero/negative/self settlements can be inserted."
      - "Repeated taps can create duplicate settlement rows."
    fix:
      - "Require finite positive amount and from != to."
      - "Add optional idempotency key or unique client operation ID."
    tests:
      - "recordSettlement_rejects_zero_negative_nan_amount"
      - "recordSettlement_rejects_self_settlement"
      - "recordSettlement_double_tap_is_idempotent"

  - id: "E4-CURRENT-010"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Hard delete cleanup is non-atomic and bypasses lifecycle"
    evidence:
      - "deleteGroupAtomic() deletes group rows in database.withTransaction."
      - "Then linkedExpenseIds.forEach { expenseDao.clearSharedExpenseFlags(expenseId) } runs after the transaction."
      - "It writes one best-effort TransactionEvent using System.currentTimeMillis."
    impact:
      - "Crash can leave group deleted but expense shared flags still set."
      - "Expense flag cleanup lacks per-expense lifecycle events and side effects."
    fix:
      - "Do flag cleanup and audit in one transaction or make hard-delete disabled outside debug/admin."
      - "Route flag cleanup through TransactionLifecycleCoordinator with deferred side effects."
      - "Use TimeProvider."
    tests:
      - "hard_delete_group_and_expense_flag_cleanup_are_atomic"
      - "hard_delete_uses_timeProvider_and_lifecycle_events"

  - id: "E4-CURRENT-011"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Shared budget offsets ignore archived groups"
    evidence:
      - "SharedExpenseBudgetOffsetEngine comment says getActiveGroupsWithDetails() excludes archived groups."
      - "Past shared liabilities can remain relevant after archive."
    impact:
      - "Budget adjusted spend can drop historical shared obligations after user archives a group."
    fix:
      - "Use time-bounded all-groups query or include archived groups with isArchived flag."
    tests:
      - "archived_group_expense_still_contributes_to_historical_budget_offset"
      - "budget_offset_marks_archived_group_contribution"

  - id: "E4-CURRENT-012"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Shared budget offset MoneyAggregates lose original source buckets"
    evidence:
      - "Engine converts each row with convertAsOf, then creates MoneyAggregate.singleCurrency(total, homeCurrency)."
      - "Original per-currency buckets and conversion failure details are not preserved in aggregate sourceBuckets."
    impact:
      - "UI/debug cannot see which currencies contributed or failed."
    fix:
      - "Build MoneyAggregate from row-level converted outputs with source buckets and conversion failures."
      - "Expose sourceBuckets in BudgetStatus adjusted-spend UI."
    tests:
      - "shared_budget_offset_aggregate_preserves_source_currency_buckets"
      - "shared_budget_offset_conversion_failure_preserves_currency_and_count"

  - id: "E4-CURRENT-013"
    severity: "P0_RESTORE_SAFETY"
    status: "OPEN"
    title: "Investment writes do not use DatabaseWriteBarrier"
    evidence:
      - "InvestmentTracker.addHolding() writes Investment, InvestmentValue, InvestmentTransaction."
      - "InvestmentTracker.updatePrice() writes Investment and InvestmentValue."
      - "InvestmentTracker does not inject DatabaseWriteBarrier."
    impact:
      - "Investment writes can occur during restore/backup/restart-required state."
    fix:
      - "Inject DatabaseWriteBarrier and check in addHolding/updatePrice/future transaction methods."
      - "Restrict raw InvestmentDao/InvestmentValueDao/InvestmentTransactionDao writes."
    tests:
      - "restore_blocks_investment_addHolding"
      - "restore_blocks_investment_updatePrice"
      - "investment_dao_mutator_guard_blocks_unapproved_callers"

  - id: "E4-CURRENT-014"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "InvestmentViewModel still uses raw mixed-currency summary and empty performance list"
    evidence:
      - "InvestmentViewModel.loadPortfolioData() calls investmentTracker.getPortfolioSummary()."
      - "Then _investments.value = emptyList()."
    impact:
      - "UI does not show actual performances."
      - "Portfolio summary can raw-sum EUR/USD/GBP holdings."
    fix:
      - "Use getPortfolioSummaryAggregate() and getInvestmentPerformances()."
      - "Expose MoneyAggregate, InvestmentDataQuality, and display currency in UI state."
    tests:
      - "investment_viewmodel_uses_aggregate_summary"
      - "investment_viewmodel_loads_non_empty_performance_list"

  - id: "E4-CURRENT-015"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "getPortfolioSummaryAggregate still returns raw mixed-currency PortfolioSummary"
    evidence:
      - "Method computes totalValue and totalInvested raw before building MoneyAggregate."
      - "It returns Triple<PortfolioSummary, MoneyAggregate, InvestmentDataQuality>."
      - "PortfolioSummary.totalValue/totalInvested remain raw Double."
    impact:
      - "Callers can accidentally use raw summary fields even from the aggregate API."
    fix:
      - "Create PortfolioSummaryAggregate with totalValueAggregate, costBasisAggregate, gainLossAggregate."
      - "Remove raw summary from aggregate API."
    tests:
      - "aggregate_summary_exposes_no_raw_cross_currency_total"
      - "portfolio_gain_loss_aggregate_currency_safe"

  - id: "E4-CURRENT-016"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Investment conversion basis is latest-rate and silently defaults to EUR"
    evidence:
      - "MoneyAggregateBuilder.fromBuckets(... currencyConverter) uses latest/current conversion path."
      - "homeCurrency read failure defaults to EUR."
    impact:
      - "Portfolio values can shift with latest FX rate without explicit rate-basis label."
      - "Settings failure can relabel portfolio as EUR."
    fix:
      - "Add InvestmentValuationBasis: CURRENT_MARKET_VALUE_AT_LATEST_RATE."
      - "Expose HomeCurrencyResolution warning."
    tests:
      - "portfolio_summary_declares_latest_rate_basis"
      - "investment_home_currency_failure_sets_warning_not_silent_EUR"

  - id: "E4-CURRENT-017"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "getInvestmentPerformances attaches portfolio-level aggregates to every row"
    evidence:
      - "currentValueAggregate/costBasisAggregate are computed once from all investments."
      - "Each InvestmentPerformance receives the same aggregate."
    impact:
      - "Per-holding row can display portfolio aggregate as if it belongs to that holding."
    fix:
      - "Add portfolioAggregate to parent view state."
      - "For each performance, attach only that holding's MoneyAggregate."
    tests:
      - "investment_performance_row_aggregate_contains_only_that_holding"
      - "portfolio_aggregate_not_duplicated_on_each_row"

  - id: "E4-CURRENT-018"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Portfolio value history still raw-sums mixed currencies"
    evidence:
      - "getPortfolioValueHistory() sums latestTotalValue into dayMap[dayKey] as Double."
      - "dailyAggregates is empty and marked future."
    impact:
      - "History chart can combine USD+EUR+GBP as one number."
      - "No per-day conversion failure/staleness metadata exists."
    fix:
      - "Build DailyPortfolioValue with MoneyAggregate and dataQuality per day."
      - "Convert each holding value by valuation basis."
    tests:
      - "portfolio_history_daily_value_is_currency_safe"
      - "portfolio_history_dailyAggregates_populated"

  - id: "E4-CURRENT-019"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Portfolio allocation denominator and numerator can disagree"
    evidence:
      - "Allocation denominator uses getPortfolioSummaryAggregate() from currentPrice*quantity."
      - "Per-type numerator uses investmentValueDao.getLatestValue(h.id)?.totalValue ?: 0.0."
      - "If no latest value exists, holding contributes to denominator but zero to numerator."
    impact:
      - "Allocation percentages can undercount or not sum to 100%."
    fix:
      - "Use the same value source for denominator and numerator."
      - "Fallback to currentPrice*quantity when latest value missing, with stale/missing warning."
    tests:
      - "allocation_percentages_sum_to_one_when_all_rates_available"
      - "allocation_missing_latest_value_uses_current_price_or_marks_partial"

  - id: "E4-CURRENT-020"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Investment transaction ledger is only a shell"
    evidence:
      - "InvestmentTransaction entity supports type string BUY/SELL/DIVIDEND."
      - "addHolding() inserts one BUY."
      - "No SELL/DIVIDEND/FEE/SPLIT operations were verified."
      - "InvestmentTransaction has no FK to Investment."
    impact:
      - "Multi-lot, partial sell, dividend, realized P&L, and cost-basis calculations are not supported."
      - "Orphan transaction rows are possible."
    fix:
      - "Add FK holdingId -> investments.id."
      - "Add lifecycle methods recordBuy/recordSell/recordDividend/recordSplit."
      - "Derive quantity/cost basis from ledger or explicitly mark single-lot mode."
    tests:
      - "investment_transaction_has_foreign_key"
      - "partial_sell_updates_quantity_and_realized_gain"
      - "dividend_transaction_recorded_and_reported"

  - id: "E4-CURRENT-021"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Investment validation is incomplete"
    evidence:
      - "addHolding() checks quantity > 0, purchasePrice > 0, currency nonblank."
      - "It does not check Double.isFinite(), ISO currency format, symbol/name nonblank, purchaseDate > 0, currentPrice > 0, or nonnegative finite fees."
      - "updatePrice() does not validate newPrice."
    impact:
      - "NaN/Infinity/blank symbol/invalid currency can enter investment math."
    fix:
      - "Use CurrencyCode and MoneyAmount validation."
      - "Validate all numeric fields finite and domain-valid."
    tests:
      - "investment_add_rejects_nan_quantity_infinite_price_invalid_currency"
      - "investment_updatePrice_rejects_zero_negative_nan"

  - id: "E4-CURRENT-022"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Investment date/time logic still uses Calendar and local timezone"
    evidence:
      - "getPortfolioValueHistory() uses getStartOfDay()/getDayKey() based on java.util.Calendar."
    impact:
      - "History buckets can shift across timezones/DST and differ from analytics java.time contracts."
    fix:
      - "Use java.time LocalDate/ZoneId policy and include timezone in output."
    tests:
      - "portfolio_history_bucket_stable_across_dst"
      - "investment_tracker_no_java_util_Calendar"

  - id: "E4-CURRENT-023"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Tax conversion basis is latest-rate, not historical/filing-period basis"
    evidence:
      - "buildDeductibleAggregate() groups totals by currency and calls MoneyAggregateBuilder.fromBuckets."
      - "buildIncomeAggregate() does the same."
      - "No per-transaction convertAsOf(expense.date) is used."
    impact:
      - "Historical tax estimates can change when latest FX rates change."
      - "Tax numbers can disagree with accounting exports/analytics."
    fix:
      - "Use per-transaction historical conversion or currency+rate-date grouping."
      - "Expose TaxRateBasis/FxRateBasis in TaxEstimate."
    tests:
      - "tax_deductible_uses_transaction_date_rate"
      - "tax_income_uses_transaction_date_rate"
      - "tax_summary_does_not_change_when_latest_rate_changes_after_year"

  - id: "E4-CURRENT-024"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Tax filing currency and home currency can diverge incorrectly"
    evidence:
      - "buildDeductibleAggregate() uses homeCurrency if available, otherwise filingCurrency."
      - "TaxEstimate notes say filing currency."
      - "TaxableIncomeAggregate displayCurrency is filingCurrency."
    impact:
      - "Deductible display amount may be home currency while tax calculation is presented as filing currency."
    fix:
      - "Use filingCurrency as the tax calculation/display currency."
      - "If home currency differs, convert explicitly and record warning."
    tests:
      - "tax_estimate_uses_filing_currency_not_home_currency"
      - "home_vs_filing_currency_difference_recorded_in_tax_warning"

  - id: "E4-CURRENT-025"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "estimateTaxes() accepts raw estimatedAnnualIncome"
    evidence:
      - "estimateTaxes(... estimatedAnnualIncome: Double) multiplies by period fraction."
      - "No currency parameter or MoneyAggregate is attached to this input."
    impact:
      - "Caller can pass income in any currency and it is treated as filing currency."
    fix:
      - "Accept MoneyAmount/MoneyAggregate for estimated income."
      - "Require incomeCurrency or derive only from stored income aggregate."
    tests:
      - "estimateTaxes_requires_income_currency"
      - "estimated_income_converted_to_filing_currency"

  - id: "E4-CURRENT-026"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Tax category legacy map raw-sums mixed currencies"
    evidence:
      - "getTaxYearSummary() builds categorizedDeductions by summing row.total into Map<String, Double>."
      - "categorizedDeductionsAggregate exists but legacy map remains populated."
    impact:
      - "Callers using categorizedDeductions still get mixed-currency totals."
    fix:
      - "DeprecationLevel.ERROR for categorizedDeductions or populate only when single-currency."
      - "UI/report must use categorizedDeductionsAggregate."
    tests:
      - "tax_summary_legacy_categorizedDeductions_not_used_by_ui"
      - "multi_currency_tax_categories_use_aggregate_only"

  - id: "E4-CURRENT-027"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "BusinessExpenseReportGenerator still raw-sums and hardcodes euro"
    evidence:
      - "generateReport() sums expense.effectiveAmount into totalExpenses/category/project maps."
      - "formattedReport uses '€${String.format(...) }'."
      - "It does not inject TaxSettingsRepository or CurrencyConverter."
    impact:
      - "Business reports can be financially wrong for non-EUR or mixed-currency users."
    fix:
      - "Use filingCurrency or report policy from TaxSettingsRepository."
      - "Use MoneyAggregate for totals/category/project."
      - "Format through CurrencyFormatter."
    tests:
      - "business_report_uses_filing_currency_formatter"
      - "business_report_category_totals_are_currency_safe"

  - id: "E4-CURRENT-028"
    severity: "P1_SECURITY_PRIVACY"
    status: "OPEN"
    title: "Business CSV formula and privacy safety are weak"
    evidence:
      - "escapeCSV() only quotes comma/quote/newline."
      - "It does not neutralize formula-leading =,+,-,@."
      - "CSV includes raw merchant, businessPurpose, businessProject, notes, locations."
    impact:
      - "Spreadsheet formula injection is possible."
      - "Sensitive business notes/locations can be exported without redaction policy."
    fix:
      - "Use CsvCellSanitizer for every text cell."
      - "Add business report privacy/export mode."
    tests:
      - "business_csv_neutralizes_formula_merchant_notes_project"
      - "business_csv_redacted_mode_removes_notes_and_locations"

  - id: "E4-CURRENT-029"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Business report uses direct Dispatchers.IO"
    evidence:
      - "BusinessExpenseReportGenerator uses withContext(Dispatchers.IO)."
      - "Most refactored code uses injected @IoDispatcher."
    impact:
      - "Tests are harder and dispatcher policy is inconsistent."
    fix:
      - "Inject @IoDispatcher."
    tests:
      - "business_report_generator_uses_injected_dispatcher"

  - id: "E4-CURRENT-030"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Tax settings validation and persistence semantics are weak"
    evidence:
      - "TaxSettingsRepository uses SharedPreferences.apply()."
      - "setTaxCountry/setFilingCurrency accept arbitrary strings."
      - "setFiscalYearStartDay coerces 1..31 without validating month/day combinations."
    impact:
      - "Invalid country/currency/fiscal date can enter tax calculations."
      - "Async apply can lose settings on crash."
    fix:
      - "Validate ISO country/currency."
      - "Use commit() or DataStore transaction for tax-critical settings."
      - "Validate fiscal date against month/year rules."
    tests:
      - "tax_settings_reject_invalid_country_currency"
      - "tax_settings_reject_feb_31"
      - "tax_settings_write_is_durable"

  - id: "E4-CURRENT-031"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "TaxRateProvider is only partial and demo-oriented"
    evidence:
      - "TaxRateProvider.getRate() returns standardVatRate/reducedVatRates/currency."
      - "TaxEstimator still loads income brackets from TaxConfigurationFactory."
      - "Tracker says DemoTaxRateProvider/static seed data."
    impact:
      - "Users may treat estimates as authoritative while brackets/VAT may be static/demo."
    fix:
      - "Provider must include versioned jurisdiction/bracket/VAT/mileage tables or clearly expose demo/estimate-only status."
      - "Persist tax rate source metadata in TaxEstimate."
    tests:
      - "tax_estimate_exposes_rate_source_metadata"
      - "demo_tax_rate_provider_sets_estimate_only_warning"

  - id: "E4-CURRENT-032"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Business/tax lifecycle update API persists only part of the accepted contract"
    evidence:
      - "TransactionLifecycleCoordinator.updateBusinessFlags() persists isBusinessExpense and requiresReceipt."
      - "businessUsePercent, taxCategory, vatEligible are no-op."
      - "businessPurpose/businessCategory/businessProject are not handled by this API."
    impact:
      - "Callers can believe tax fields were persisted when they were ignored."
      - "Business reporting can miss intended metadata."
    fix:
      - "Rename to updateBusinessFlagsOnly or implement schema/migration for full fields."
      - "Add lifecycle method for businessPurpose/category/project."
    tests:
      - "updateBusinessFlags_rejects_unsupported_tax_fields"
      - "business_category_project_purpose_update_writes_transaction_event"

  - id: "E4-CURRENT-033"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Tax/business diagnostics and report ledger are missing"
    evidence:
      - "No TaxEstimateRun/BusinessReportRun event table was found in reviewed code."
      - "Business report generation returns in-memory data/string only."
    impact:
      - "Cannot audit which tax settings/rates/currency basis produced a report."
    fix:
      - "Add TaxReportRun or PipelineDiagnosticEvent records with settings version, rate source, FX basis, row count, partial warnings."
    tests:
      - "tax_estimate_writes_diagnostic_with_rate_source_and_fx_basis"
      - "business_report_writes_report_run_checksum_and_warnings"

