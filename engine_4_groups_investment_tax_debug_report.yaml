      - "Settings use SharedPreferences.apply() and weak validation."

  T04_vat_estimation:
    tracker_status: "DEFERRED_DESIGN"
    actual_status: "STILL_ESTIMATE_ONLY"
    notes:
      - "Field renamed/represented as estimatedVatPortion with LOW confidence."
      - "Still assumes standard VAT rate over deductible aggregate."

  T05_business_report_euro_formatting:
    tracker_status: "FIXED"
    actual_status: "OPEN"
    notes:
      - "BusinessExpenseReportGenerator formatted report still hardcodes €."
      - "It does not use TaxSettingsRepository.getBusinessReportCurrencyPolicy()."

  T06_business_report_mixed_currency:
    tracker_status: "PARTIAL"
    actual_status: "OPEN_FOR_REPORT_GENERATOR"
    notes:
      - "TaxEstimator has aggregate fields."
      - "BusinessExpenseReportGenerator still sums Expense.effectiveAmount raw by category/project."

  T07_business_csv_formula_safety:
    tracker_status: "FIXED"
    actual_status: "OPEN"
    notes:
      - "BusinessExpenseReportGenerator.escapeCSV() only quotes comma/quote/newline."
