meta:
  repo: "panospao7/Cost-agregator"
  commit: "4113e38f0d838a29d2d13d82a483ba573280721c"
  engine_group: "#4 - Groups / Investment / Tax Engines"
  review_mode: "static GitHub source/debugging session; no local Gradle/device execution"
  verdict: "IMPROVED_BUT_NOT_CLEAN"
  summary: >
    Engine group #4 is improved but not clean. Groups now have GroupLifecycleCoordinator,
    current-user invariant fixes, persistent settlements, lifecycle events, and deferred
    create-expense side effects in one path. Investment now has MoneyAggregate summary,
    atomic price update, carry-forward history, BUY transaction insert, and stale price
    flags. Tax now has TaxSettingsRepository, MoneyAggregate fields, fiscal-year settings,
    mileage fallback, and TaxRateProvider. However, there are still serious correctness
    gaps: group writes are not globally write-barrier guarded, lifecycle events are not
    atomic with mutations, linked group expense ownership can still dispatch side effects
    inside an outer transaction, group balances use current member count for historical
    splits, investment UI still uses raw mixed-currency summary and empty performance list,
    investment history still raw-sums currencies, business reports still raw-sum and hardcode
    euro formatting, and tax conversion basis/filing currency semantics remain inconsistent.

tracker_reconciliation:
  G01_current_user_member_invariant:
    tracker_status: "FIXED"
    actual_status: "MOSTLY_FIXED"
    notes:
      - "GroupTransactionCoordinator sets currentUserGroupKey=groupId on current-user inserts."
      - "GroupLifecycleCoordinator enforces exactly one current user on create."
      - "But GroupMember.joinedAt can still remain 0 in lifecycle create/add paths if caller did not set it."
      - "Low-level DAO/direct paths remain public."

  G02_group_expense_side_effects_inside_outer_txn:
    tracker_status: "FIXED"
    actual_status: "PARTIAL"
    notes:
      - "createSystemExpenseAndLinkToGroup() uses SideEffectMode.DEFER and dispatches after outer transaction."
      - "But addExpenseWithLink() calls TransactionLifecycleCoordinator.updateOwnership() inside database.withTransaction; updateOwnership dispatches post-update side effects before the outer group transaction commits."
      - "GroupLifecycleCoordinator.emitLifecycleEvent() itself dispatches BudgetMonitor/side effects outside any atomic event/mutation contract."

  G03_linked_expense_normalization_bypasses_lifecycle:
    tracker_status: "PARTIAL"
    actual_status: "PARTIAL"
    notes:
      - "normalizeLinkedSystemExpense() now routes through TransactionLifecycleCoordinator.updateOwnership()."
      - "But it is called inside an outer Room transaction, so side-effect timing is still unsafe."
      - "Hard-delete cleanup still directly calls ExpenseDao.clearSharedExpenseFlags()."

  G04_mixed_currency_settlements:
    tracker_status: "FIXED"
    actual_status: "MOSTLY_FIXED_WITH_DIRECT_PATH_GAPS"
    notes:
      - "SettlementCalculator rejects mixed-currency balances."
      - "GroupLifecycleCoordinator.recordSettlement() requires settlement currency == group.defaultCurrency."
      - "But GroupSettlementDao remains public and SettlementCalculator.recordSettlement() helper can insert without group currency validation."

  G05_group_currency_consistency:
    tracker_status: "FIXED"
    actual_status: "PARTIAL"
    notes:
      - "GroupLifecycleCoordinator.addExpense() enforces group.defaultCurrency."
      - "GroupTransactionCoordinator.addExpenseWithLink() checks linked Expense.currency against group.defaultCurrency."
      - "But GroupTransactionCoordinator.addExpenseToGroup() standalone path accepts currency ?: group.defaultCurrency without rejecting mismatches."
      - "Legacy SharedExpenseManager still has TODO about enforcing single-currency groups."

  G06_shared_budget_offsets_conversion_failures:
    tracker_status: "PARTIAL"
    actual_status: "PARTIAL"
    notes:
      - "BudgetSpendBreakdown now has isPartial, conversionWarnings, failedConversionCount, and MoneyAggregate fields."
      - "But aggregates are reconstructed as single home-currency totals, losing original source buckets and detailed failure provenance."
      - "Archived groups are still intentionally excluded."

  G07_shared_offset_historical_rates:
    tracker_status: "FIXED"
    actual_status: "MOSTLY_FIXED"
    notes:
      - "SharedExpenseBudgetOffsetEngine uses convertAsOf(expense.date/groupExpense.date)."
      - "Home currency fallback to EUR remains silent except log."

  G08_hard_delete_path_bypass:
    tracker_status: "FIXED"
    actual_status: "PARTIAL"
    notes:
      - "GroupLifecycleCoordinator.deleteGroupPermanently() requires confirmPermanentDelete and archive-first."
      - "Low-level GroupTransactionCoordinator.permanentlyDeleteGroup()/deleteGroupAtomic() remains public through the domain interface."
      - "Hard-delete clears linked expense flags outside the delete transaction and writes TransactionEvent best-effort with System.currentTimeMillis."

  G09_direct_member_delete:
    tracker_status: "FIXED"
    actual_status: "PARTIAL"
    notes:
      - "GroupLifecycleCoordinator.removeMember() validates member, current-user, and outstanding balance."
      - "It then calls memberDao.delete(member) directly, outside database.withTransaction and without DatabaseWriteBarrier."
      - "Legacy SharedExpenseManager.removeMember() can still use SharedExpenseDataPort.removeMember()."

  G10_runBlocking_domain_calculators:
    tracker_status: "DEFERRED_DESIGN"
    actual_status: "NOT_OBSERVED_IN_REVIEWED_GROUP_FILES"
    notes:
      - "No runBlocking was found in reviewed GroupLifecycleCoordinator/SettlementCalculator/SharedExpenseManager snippets."
      - "Still needs repository-wide grep before closing tracker item."

  I01_portfolio_raw_sums_mixed_currency:
    tracker_status: "FIXED"
    actual_status: "PARTIAL"
    notes:
      - "getPortfolioSummaryAggregate() returns MoneyAggregate."
