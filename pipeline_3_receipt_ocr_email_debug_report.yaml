meta:
  repo: "panospao7/Cost-agregator"
  commit: "4113e38f0d838a29d2d13d82a483ba573280721c"
  pipeline: "3 - Receipt Capture / OCR / Email / Bank Statement"
  review_mode: "static GitHub source/debugging session; no local Gradle/device execution"
  verdict: "NOT_CLEAN"
  summary: >
    Pipeline 3 is much improved but still not clean. The refactor added
    ReceiptLifecycleCoordinator, ReceiptLinkService, duplicate detection,
    receipt events, raw OCR sanitization, PDF partial metadata, and matching
    persistence. However, there are still serious correctness/privacy/atomicity
    holes. The biggest risks are: privacy leaks in bank statements/email notes,
    sanitized OCR being reused as processing/dedupe input, OCR failures being
    misclassified, weak duplicate persistence/race handling, incomplete atomicity
    across receipt save/update/events/reviews, and public direct repository
    mutation APIs that still bypass lifecycle/link/audit contracts.

tracker_reconciliation:
  P3-P0-01_createdAt_zero:
    tracker_status: "FIXED"
    actual_status: "MOSTLY_FIXED_NOT_GLOBALLY_ENFORCED"
    notes:
      - "Normal OCR success, parse failure, manual fallback, email, and bank statement paths now set createdAt."
      - "Coordinator repairs createdAt=0 on main processReceiptInput update."
      - "But ScannedReceipt default remains 0L, and public insertReceipt(receipt) does not repair timestamps."
      - "Any approved direct insert caller can still persist createdAt=0/updatedAt=0."

  P3-P1-01_receipt_save_update_event_atomic:
    tracker_status: "FIXED"
    actual_status: "PARTIAL"
    notes:
      - "Coordinator update + RECEIPT_SAVED/PDF_PARTIAL events are atomic."
      - "Repository insert + coordinator metadata/event update are still split across phases."
      - "Duplicate branch update + DUPLICATE_DETECTED event are not wrapped in one transaction."
      - "Bank statement receipt/event/review/status lifecycle is not atomic."

  P3-P1-02_receipt_link_restore_guard:
    tracker_status: "FIXED"
    actual_status: "PARTIAL"
    notes:
      - "ReceiptLinkService now checks RestoreMaintenanceMode."
      - "It does not use the standard DatabaseWriteBarrier."
      - "Parent receipt/expense validation happens outside the link transaction."
      - "Deprecated/direct match methods in ReceiptRepository still bypass ReceiptLinkService."

  P3-P1-03_matching_result_computed_not_persisted:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL_FIXED_WITH_BUGS"
    notes:
      - "AutoMatch now calls ReceiptLinkService."
      - "Suggested match updates ScannedReceipt and writes MATCH_SUGGESTED."
      - "AutoMatch ignores Result.failure from linkReceiptToExpense and logs success anyway."
      - "Suggested update + event are non-atomic and bypass write barrier."

  P3-P1-04_receipt_created_expense_link_atomic:
    tracker_status: "PARTIAL"
    actual_status: "PARTIAL"
    notes:
      - "ReceiptLifecycleCoordinator.createExpenseFromReceipt wraps create+link in database.withTransaction and uses SideEffectMode.DEFER."
      - "Email process uses createExpense(..., DEFER) + link inside transaction and throws on link failure."
      - "ReceiptRepository deprecated ERROR-level convenience method still contains old non-atomic create→link logic."
      - "Nested coordinator/link transactions need DB-backed tests to prove rollback/side-effect timing."

  P3-P1-05_direct_repository_methods_bypass_lifecycle:
    tracker_status: "PARTIAL"
    actual_status: "OPEN"
    notes:
      - "Write barrier exists on some direct methods."
      - "But insertReceipt, deleteReceipt, clearAllScannedReceipts, linkReceiptToExpense, saveMatchSuggestion, approveMatchSuggestion, rejectAllSuggestions, clearMatchForReceipt remain public."
      - "Several bypass ReceiptEvent, ReceiptExpenseLink, restore guard, link cleanup, and side effects."

positive_findings:
  - "ReceiptLifecycleCoordinator is now the intended central receipt entry point."
  - "ReceiptLinkService exists and owns main receipt-expense links."
  - "ReceiptRepository.processReceipt() sets createdAt for success, parse-failure, and manual fallback records."
  - "Receipt parser now accepts homeCurrency fallback instead of hardcoded EUR for normal OCR parse."
  - "PDF partial processing metadata exists and coordinator writes PDF_PARTIAL event."
  - "Batch import now routes through ReceiptLifecycleCoordinator with createReview=true."
  - "ReceiptSideEffectDispatcher now persists AutoMatch/Suggested outcomes, at least partially."
  - "Email receipt duplicate handling was strengthened with fingerprint and duplicateDetector checks."
  - "ReceiptOcrService uses UUID filenames for persisted receipt images."
  - "ReceiptLinkService link/unlink operations are transactional for join row + legacy receipt field + receipt event."

issues:
  - id: "P3-CURRENT-001"
    severity: "P0_PRIVACY"
    status: "OPEN"
    title: "Bank statement lifecycle stores raw OCR text without applying privacy rawOcrStorageMode"
    evidence:
      - "BankStatementLifecycleProcessor creates ScannedReceipt(rawOcrText = ocrResult.fullText)."
      - "It does not inject PrivacySettingsRepository or RawContentSanitizer."
      - "ReceiptRepository.processStatement uses sanitizeOcrBeforeInsert(), but the lifecycle processor path does not."
    impact:
      - "Full bank statement OCR text can be persisted even when raw OCR storage is REDACTED, METADATA_ONLY, or DO_NOT_STORE."
      - "This can store highly sensitive financial data against user privacy settings."
    fix:
      - "Inject PrivacySettingsRepository into BankStatementLifecycleProcessor."
      - "Sanitize statement rawOcrText before insert."
      - "Compute duplicate/text fingerprints from ephemeral raw OCR before sanitization."
    tests:
      - "bank_statement_metadata_only_stores_no_raw_ocr_text"
      - "bank_statement_redacted_stores_redacted_ocr_text"
      - "bank_statement_parser_still_uses_ephemeral_raw_text"

  - id: "P3-CURRENT-002"
    severity: "P0_PRIVACY"
    status: "OPEN"
    title: "Email subject privacy leak through created Expense.notes"
    evidence:
      - "processEmailReceipt sanitizes EmailReceiptSource.emailSubject."
      - "But CreateExpenseRequest notes = \"Imported from email: $subject\" uses raw subject."
    impact:
      - "A redacted/private email subject can be persisted in the expense table even when emailReceiptStorageMode/rawOcrStorageMode requires redaction."
    fix:
      - "Use sanitizedSubject or a generic privacy-safe note."
      - "Prefer metadata linking over raw subject in Expense.notes."
    tests:
      - "email_receipt_redacted_subject_not_persisted_in_expense_notes"
      - "email_receipt_do_not_store_subject_not_persisted_anywhere"

  - id: "P3-CURRENT-003"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Sanitized OCR text is used for text fingerprinting, causing false duplicates"
    evidence:
      - "ReceiptRepository.processReceipt() stores sanitizeOcrBeforeInsert(ocrResult.fullText) into ScannedReceipt.rawOcrText."
      - "ReceiptLifecycleCoordinator later computes textFingerprint from receipt.rawOcrText."
      - "In STORE_REDACTED mode, rawOcrText becomes '[REDACTED]' for every receipt."
    impact:
      - "All redacted receipts can receive the same text fingerprint."
      - "Second and later redacted receipts may be falsely marked duplicate by TEXT_FINGERPRINT."
      - "In METADATA_ONLY/DO_NOT_STORE, text dedupe silently disappears."
    fix:
      - "Separate ProcessedReceiptDraft(ephemeralRawText, storedRawText)."
      - "Compute fingerprints from ephemeral raw text; persist only sanitized raw text."
    tests:
      - "redacted_ocr_receipts_do_not_all_match_same_text_fingerprint"
      - "metadata_only_ocr_uses_ephemeral_text_for_duplicate_detection"
      - "stored_raw_text_policy_does_not_change_dedupe_semantics"

  - id: "P3-CURRENT-004"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "OCR failures can be misclassified as OCR_COMPLETED"
    evidence:
      - "ReceiptRepository OCR catch saves manual record, then updates rawOcrText to sanitizeOcrBeforeInsert('Scan failed')."
      - "Coordinator detects OCR failure only when rawOcrText equals '[OCR Failed or Skipped]' or starts with 'Scan Failed:'."
      - "'Scan failed' lowercase/no-colon and redacted/empty values do not match."
    impact:
      - "OCR failure records can be saved as OCR_COMPLETED."
      - "No OCR_FAILED event is written for that path."
      - "Review/debug UI cannot distinguish OCR failure from OCR success with no parsed fields."
    fix:
      - "Repository result must carry explicit stage/status, not infer from raw text."
      - "Set processingStatus=OCR_FAILED in saveManualReceiptRecord/OCR catch."
      - "Coordinator should trust explicit processingStatus."
    tests:
      - "ocr_exception_sets_OCR_FAILED_status"
      - "ocr_exception_writes_OCR_FAILED_event"
      - "ocr_failure_redacted_raw_text_still_sets_OCR_FAILED"

  - id: "P3-CURRENT-005"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Receipt insert and lifecycle metadata/event are still not atomic"
    evidence:
      - "ReceiptRepository.processReceipt() inserts ScannedReceipt and optionally PendingReview."
      - "ReceiptLifecycleCoordinator later updates sourceType/documentType/status/fingerprints and writes ReceiptEvent."
      - "Only update+event are in one transaction, not the original insert+metadata+event."
    impact:
      - "Crash/cancellation after repository insert but before coordinator update leaves UNKNOWN/CAPTURED receipt with no lifecycle event."
      - "Asset file may exist with incomplete DB lifecycle state."
    fix:
      - "Repository should return ProcessedReceiptDraft, not persist."
      - "Coordinator should insert final ScannedReceipt + review + events in one transaction."
    tests:
      - "receipt_insert_metadata_event_are_atomic"
      - "event_insert_failure_rolls_back_receipt_insert"
      - "no_successful_receipt_without_receipt_saved_event"

  - id: "P3-CURRENT-006"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Pre-OCR duplicate hash is inconsistent with stored imageHash"
    evidence:
      - "ReceiptRepository pre-OCR computes assetStore.computeUriHash(imageUri)."
      - "Coordinator stores imageHash from assetStore.computeFileHash(saved compressed image path)."
      - "ReceiptOcrService recompresses images to UUID .jpg, changing bytes/hash."
    impact:
      - "Exact duplicate image imports usually will not be skipped pre-OCR."
      - "Expensive OCR repeats unnecessarily."
      - "Duplicate prevention relies on later, weaker post-OCR checks."
    fix:
      - "Store both originalContentHash and storedAssetHash."
      - "Use originalContentHash for pre-OCR dedupe."
    tests:
      - "same_source_uri_second_import_skips_ocr_by_original_hash"
      - "stored_asset_hash_and_original_hash_are_distinct_fields"

  - id: "P3-CURRENT-007"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Pre-OCR duplicate return path can delete or mutate the existing receipt"
    evidence:
      - "ReceiptRepository.processReceipt() returns existingMatch as ProcessReceiptResult when pre-OCR hash matches."
      - "Coordinator treats returned receipt as a newly inserted ghost row."
      - "Exact-hash branch calls scannedReceiptDao.delete(receipt)."
    impact:
      - "If pre-OCR dedupe ever starts matching correctly, coordinator can delete the existing canonical receipt."
      - "Or it can re-update/re-dispatch side effects on an existing receipt as if it were new."
    fix:
      - "Return a typed outcome: NewProcessedReceipt vs DuplicateExistingReceipt."
      - "Coordinator must immediately return duplicate existing without delete/update/side effects."
    tests:
      - "pre_ocr_duplicate_returns_existing_without_deleting_it"
      - "pre_ocr_duplicate_does_not_dispatch_side_effects_again"

  - id: "P3-CURRENT-008"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "No unique fingerprint constraints; duplicate races remain possible"
    evidence:
      - "ScannedReceipt indexes do not include unique imageHash/textFingerprint/sourceFingerprint/semanticFingerprint."
      - "DuplicateDetector does read-before-write checks."
      - "Concurrent identical imports can both pass checks before either writes fingerprints."
    impact:
      - "Duplicate receipt rows can be created under concurrency."
      - "ScannedReceiptDao.insert(IGNORE) does not protect fingerprint uniqueness."
    fix:
      - "Add partial unique indexes where appropriate, or a ReceiptFingerprint table with unique(type,value)."
      - "Insert/resolve fingerprint claims inside the same transaction as receipt creation."
    tests:
      - "parallel_identical_receipt_import_creates_one_canonical_receipt"
      - "fingerprint_claim_conflict_returns_existing_receipt_id"

  - id: "P3-CURRENT-009"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Email text/semantic fingerprints are computed but not persisted"
    evidence:
      - "processEmailReceipt computes emailTextFingerprint and emailSemanticFingerprint."
      - "ScannedReceipt inserted for email does not set textFingerprint or semanticFingerprint."
    impact:
      - "Future email duplicateDetector checks cannot find prior email receipts by text/semantic fingerprint."
      - "Blank/changed Message-ID duplicates can still create duplicate receipt rows unless emailReceiptDao fingerprint catches them."
    fix:
      - "Set textFingerprint=emailTextFingerprint and semanticFingerprint=emailSemanticFingerprint on inserted email receipt."
      - "Use privacy-safe fingerprinting from ephemeral body before sanitization."
    tests:
      - "email_receipt_duplicate_by_text_fingerprint_skipped"
      - "email_receipt_duplicate_by_semantic_fingerprint_skipped"
      - "email_blank_message_id_still_dedupes_by_semantic"

  - id: "P3-CURRENT-010"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Email Message-ID dedupe compares raw ID against sanitized sourceFingerprint"
    evidence:
      - "Dedup precheck calls scannedReceiptDao.getBySourceFingerprint(messageId)."
      - "Inserted email receipt sets sourceFingerprint = sanitizeEmailMessageId(messageId, emailStorageMode) ?: ''."
      - "Default emailReceiptStorageMode is STORE_REDACTED, which stores '[REDACTED]'."
    impact:
      - "Message-ID dedupe fails in default redacted mode."
      - "STORE_METADATA_ONLY stores a hash, but precheck still queries raw messageId."
      - "STORE_REDACTED can make all email sourceFingerprint values identical."
    fix:
      - "Use stable HMAC/hash of messageId for sourceFingerprint regardless of display redaction."
      - "Query using the same normalized/sanitized fingerprint function."
    tests:
      - "email_message_id_duplicate_detected_in_redacted_mode"
      - "email_message_id_duplicate_detected_in_metadata_only_mode"
      - "redacted_email_source_fingerprint_not_constant_for_all_messages"

  - id: "P3-CURRENT-011"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "ReceiptInputValidator MIME fallback is not honored by ReceiptOcrService"
    evidence:
      - "Validator falls back to extension when ContentResolver.getType(uri) is null."
      - "ReceiptOcrService.processUri() re-calls getType(uri) and rejects null/empty MIME."
    impact:
      - "A valid jpg/pdf with null provider MIME can pass validation then fail OCR as unsupported."
    fix:
      - "Return resolved MIME from validator and pass it into OCR service."
      - "Or move MIME detection/sniffing to a shared ReceiptMimeDetector used by both."
    tests:
      - "jpg_null_provider_mime_passes_validator_and_ocr"
      - "pdf_null_provider_mime_passes_validator_and_ocr"
      - "ocr_service_uses_shared_mime_detector"

  - id: "P3-CURRENT-012"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Auto-match side effect ignores linkReceiptToExpense failure"
    evidence:
      - "ReceiptSideEffectDispatcher AutoMatch calls receiptLinkService.linkReceiptToExpense(...)."
      - "The returned Result is not checked."
      - "The code logs Auto-matched even if Result.failure is returned."
    impact:
      - "Receipt can remain unlinked while logs imply success."
      - "No SIDE_EFFECT_FAILED event is written for normal Result.failure cases."
    fix:
      - "Capture result and throw/write failure event when isFailure."
      - "Write AUTO_MATCHED event only after successful link."
    tests:
      - "auto_match_link_failure_writes_side_effect_failed_event"
      - "auto_match_success_creates_link_and_receipt_event"
      - "already_linked_auto_match_does_not_log_success"

  - id: "P3-CURRENT-013"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Suggested match update and event are non-atomic and bypass barrier"
    evidence:
      - "ReceiptSideEffectDispatcher Suggested path calls scannedReceiptDao.update(), then receiptEventDao.insert()."
      - "No database.withTransaction around the pair."
      - "No DatabaseWriteBarrier/RestoreMaintenanceMode check at this shared mutation point."
    impact:
      - "Receipt can show SUGGESTED without MATCH_SUGGESTED audit event, or vice versa."
      - "If restore starts between save and side effect, suggestion writes may still occur."
    fix:
      - "Add ReceiptMatchService.saveSuggestion() with write barrier and transaction."
      - "Or move suggestion persistence into ReceiptLinkService/Coordinator."
    tests:
      - "match_suggestion_update_and_event_are_atomic"
      - "match_suggestion_blocked_during_restore"

  - id: "P3-CURRENT-014"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Direct ReceiptRepository match/link methods still bypass lifecycle"
    evidence:
      - "ReceiptRepository.linkReceiptToExpense updates ScannedReceipt only."
      - "saveMatchSuggestion, approveMatchSuggestion, rejectAllSuggestions, clearMatchForReceipt directly update ScannedReceipt."
      - "These methods do not create ReceiptExpenseLink or ReceiptEvent and do not check restore/write barrier."
    impact:
      - "Legacy callers can create inconsistent receipt match state."
      - "Warranty/return/item categorization links are not updated."
      - "Audit trail is incomplete."
    fix:
      - "Make these methods private/internal or DeprecationLevel.ERROR."
      - "Route through ReceiptLinkService / ReceiptMatchService."
      - "Add static guard forbidding direct scannedReceiptDao match mutations."
    tests:
      - "legacy_match_methods_not_available_in_release"
      - "approve_match_uses_receipt_link_service"
      - "clear_match_writes_unlink_event_and_clears_join_table"

  - id: "P3-CURRENT-015"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Direct receipt delete/clear methods can leave orphan links and inconsistent assets"
    evidence:
      - "ReceiptRepository.deleteReceipt deletes asset then scannedReceipt row; it does not delete ReceiptExpenseLink rows or write RECEIPT_DELETED."
      - "clearAllScannedReceipts deletes assets and scanned_receipts but not link/email/event cleanup."
      - "ReceiptExpenseLink has no foreign keys."
    impact:
      - "Orphan receipt_expense_links can remain."
      - "Asset can be deleted while DB row remains if DB delete fails."
      - "No audit trail for direct deletion/clear."
    fix:
      - "Only allow ReceiptLifecycleCoordinator.deleteReceipt for normal flows."
      - "Move destructive clear to debug-only maintenance with full cleanup and audit."
      - "Add orphan-link diagnostic."
    tests:
      - "direct_delete_not_available_in_release"
      - "delete_receipt_removes_links_and_writes_event"
      - "clear_all_receipts_debug_only_cleans_links_email_sources"

  - id: "P3-CURRENT-016"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Bank statement import is not atomic or resumable"
    evidence:
      - "BankStatementLifecycleProcessor inserts statement receipt, writes event, loops pending reviews, updates status, writes PROCESSING_COMPLETE as separate operations."
      - "Per-transaction failures are caught and processing continues."
      - "PendingReview insert result is not checked in the processor loop."
    impact:
      - "Crash can leave a statement receipt with only some reviews and no PROCESSING_COMPLETE."
      - "reviewsCreated can be incorrect if insert is ignored/failed."
      - "No resumable import state exists."
    fix:
      - "Use one transaction for receipt + event + review inserts + final status, or define explicit partial/resumable semantics."
      - "Check pendingReviewDao.insert return value."
      - "Persist per-row import outcomes."
    tests:
      - "bank_statement_receipt_reviews_complete_event_are_atomic"
      - "bank_statement_pending_review_insert_conflict_not_counted_created"
      - "bank_statement_partial_failure_has_resumable_state"

  - id: "P3-CURRENT-017"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "CancellationException is swallowed and can create fallback records"
    evidence:
      - "ReceiptRepository.processReceipt catches Exception around OCR and parse paths without rethrowing CancellationException."
      - "ReceiptLifecycleCoordinator.processReceiptInput outer catch also catches Exception."
    impact:
      - "Cancelled batch/worker/UI operation can still write manual fallback receipts."
      - "Structured concurrency cancellation semantics are broken."
    fix:
      - "In every catch(Exception), if e is CancellationException rethrow."
      - "Add lint/static guard for broad catch in pipeline code."
    tests:
      - "receipt_processing_cancellation_does_not_insert_fallback_receipt"
      - "batch_cancellation_stops_without_partial_manual_records"

  - id: "P3-CURRENT-018"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Broad parse catch misclassifies DB/normalizer/pending-review failures as PARSE_FAILED"
    evidence:
      - "ReceiptRepository try block includes parse, merchant normalization, receipt insert, pending review creation."
      - "Any exception enters the 'Parsing Failed' path and inserts a PARSE_FAILED receipt."
    impact:
      - "Database conflict, normalizer failure, classifier failure, or pending review failure can be incorrectly reported as parser failure."
      - "Can create duplicate/fallback rows for infrastructure errors."
    fix:
      - "Narrow try/catch: parse-only exceptions map to PARSE_FAILED."
      - "DB/normalizer/classifier errors should return infrastructure failure and roll back."
    tests:
      - "pending_review_insert_failure_not_classified_parse_failed"
      - "normalizer_failure_not_classified_parse_failed"
      - "db_insert_conflict_returns_insert_conflict_not_parse_failed"

  - id: "P3-CURRENT-019"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "ReceiptLinkService parent validation happens outside transaction and there are no FKs"
    evidence:
      - "linkReceiptToExpense loads receipt and expense before database.withTransaction."
      - "ReceiptExpenseLink entity has no foreign keys."
    impact:
      - "A receipt/expense can be deleted between validation and link insert."
      - "Orphan links are possible under race/direct deletes."
    fix:
      - "Validate parent rows inside the same transaction as link insert."
      - "Consider adding FKs or a periodic orphan cleanup diagnostic."
    tests:
      - "link_parent_deleted_race_does_not_create_orphan_link"
      - "receipt_expense_link_orphan_diagnostic_detects_broken_links"

  - id: "P3-CURRENT-020"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Unlink does not clear receipt item categorization expenseId"
    evidence:
      - "ReceiptLinkService.linkReceiptToExpense calls receiptItemCategorizationDao.linkToExpense."
      - "unlinkReceiptFromExpense clears warranty/return expenseId but does not clear receipt item categorization expenseId."
    impact:
      - "After unlink, line-item categorizations can still point to the old expense."
      - "Budget/item-level reports can include stale associations."
    fix:
      - "Add receiptItemCategorizationDao.unlinkFromExpense(receiptId, expenseId) or clearByReceiptId."
      - "Run it inside the unlink transaction."
    tests:
      - "unlink_receipt_clears_item_categorization_expense_ids"
      - "relink_updates_item_categorization_to_new_expense"

  - id: "P3-CURRENT-021"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Raw storage policy disables or corrupts local side effects"
    evidence:
      - "SideEffectDispatcher passes receipt.rawOcrText to warranty extraction."
      - "receipt.rawOcrText may already be redacted or empty by storage policy."
    impact:
      - "Local-only warranty extraction and possibly item categorization can fail when user disables raw retention."
      - "Processing behavior depends on storage preference instead of explicit processing/privacy permissions."
    fix:
      - "Use ephemeral OCR text for local side effects before sanitizing stored DB fields."
      - "Persist only sanitized text according to policy."
    tests:
      - "metadata_only_raw_ocr_still_allows_local_warranty_extraction_when_enabled"
      - "do_not_store_raw_ocr_persists_no_text_but_processing_succeeds"

  - id: "P3-CURRENT-022"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Validation failures and early exits lack durable receipt diagnostics"
    evidence:
      - "processReceiptInput validation failure returns Result.failure with Timber only."
      - "Restore-blocked receipt input returns failure without ReceiptEvent/PipelineDiagnosticEvent."
      - "SideEffectDispatcher writes RECEIVED after save, not when input is received."
    impact:
      - "Debugging still cannot answer whether a URI was received, rejected by validation, blocked by restore, or failed before receipt creation."
    fix:
      - "Write PipelineDiagnosticEvent for receipt_input RECEIVED / VALIDATION_FAILED / RESTORE_BLOCKED / OCR_START / OCR_FAILED."
      - "Reserve ReceiptEvent for events after receiptId exists."
    tests:
      - "invalid_uri_writes_pipeline_diagnostic_validation_failed"
      - "restore_blocked_receipt_input_writes_diagnostic"
      - "receipt_received_event_semantics_not_used_for_side_effect_dispatch"

  - id: "P3-CURRENT-023"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Exact-hash duplicate ghost cleanup leaks asset and lacks event"
    evidence:
      - "Coordinator exact-hash duplicate branch deletes ScannedReceipt ghost row."
      - "It does not delete the newly saved asset file."
      - "It does not write DUPLICATE_DETECTED event for the ghost/current receipt."
    impact:
      - "Duplicate imports can leave orphan receipt asset files."
      - "No durable audit explains why the current import disappeared."
    fix:
      - "If deleting a ghost row, delete its asset post-commit."
      - "Write PipelineDiagnosticEvent or ReceiptEvent before cleanup."
    tests:
      - "exact_hash_duplicate_cleanup_deletes_ghost_asset"
      - "exact_hash_duplicate_cleanup_writes_duplicate_diagnostic"

  - id: "P3-CURRENT-024"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Unlink writes success event even if no link row existed"
    evidence:
      - "ReceiptExpenseLinkDao.unlink returns Unit."
      - "unlinkReceiptFromExpense always writes RECEIPT_UNLINKED_FROM_EXPENSE after delete query."
    impact:
      - "Audit trail can claim a link was removed when there was no link."
    fix:
      - "Make DAO unlink return affected row count."
      - "Only write unlink event when count > 0, otherwise return NotLinked."
    tests:
      - "unlink_nonexistent_link_returns_failure_without_event"
      - "unlink_existing_link_writes_event"

  - id: "P3-CURRENT-025"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Receipt item category propagation bypasses TransactionLifecycleCoordinator"
    evidence:
      - "ReceiptLinkService directly calls expenseDao.updateCategory(expenseId, bestCategoryId)."
      - "Comment acknowledges lifecycle bypass due circular dependency."
    impact:
      - "Expense category can change without TransactionEvent UPDATED, budget side effects, cache invalidation, or learning hooks."
    fix:
      - "Introduce ExpenseCategoryAssignmentPort implemented through transaction lifecycle."
      - "Or emit post-commit command handled outside ReceiptLinkService."
    tests:
      - "receipt_item_category_assignment_writes_transaction_updated_event"
      - "link_service_does_not_call_expenseDao_updateCategory_directly"

  - id: "P3-CURRENT-026"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Receipt debug export ignores explicit debug-data consent"
    evidence:
      - "PrivacySettings has debugDataPersistenceEnabled."
      - "ReceiptRepository.exportParserDebugData exports rawOcrText for all receipts."
      - "No privacy setting check is visible in exportParserDebugData/debugReceipt."
    impact:
      - "Raw OCR text can be exposed through debug export even when debug persistence/consent is disabled."
    fix:
      - "Require debugDataPersistenceEnabled or explicit one-time export consent."
      - "Redact according to rawOcrStorageMode."
    tests:
      - "parser_debug_export_blocked_without_debug_consent"
      - "parser_debug_export_respects_raw_ocr_storage_mode"

  - id: "P3-CURRENT-027"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Bank statement processor does not use DatabaseWriteBarrier"
    evidence:
      - "BankStatementLifecycleProcessor checks RestoreMaintenanceMode directly."
      - "No DatabaseWriteBarrier injection/use in the processor."
    impact:
      - "Future write-barrier semantics beyond restore mode will not apply to bank statement imports."
    fix:
      - "Inject DatabaseWriteBarrier and call checkWritesAllowed('BankStatementLifecycleProcessor.processBankStatement')."
    tests:
      - "bank_statement_import_blocked_by_databaseWriteBarrier"

  - id: "P3-CURRENT-028"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "ReceiptLinkService uses RestoreMaintenanceMode directly instead of DatabaseWriteBarrier"
    evidence:
      - "ReceiptLinkService injects RestoreMaintenanceMode, not DatabaseWriteBarrier."
    impact:
      - "Link/unlink is not aligned with the shared write-barrier contract."
    fix:
      - "Replace direct restore check with DatabaseWriteBarrier."
    tests:
      - "receipt_link_uses_databaseWriteBarrier"
      - "receipt_unlink_uses_databaseWriteBarrier"

  - id: "P3-CURRENT-029"
    severity: "P3_LOW"
    status: "OPEN"
    title: "Camera temp URI filename can collide"
    evidence:
      - "ReceiptOcrService.createTempImageUri and ReceiptAssetStore.createTempImageUri use camera_${System.currentTimeMillis()}.jpg."
    impact:
      - "Two camera intents in the same millisecond could share a temp path."
    fix:
      - "Use UUID for temp camera filenames too."
    tests:
      - "parallel_create_temp_photo_uri_generates_unique_paths"

  - id: "P3-CURRENT-030"
    severity: "P3_LOW"
    status: "OPEN"
    title: "Receipt event taxonomy is still stringly typed"
    evidence:
      - "ReceiptEvent.eventType uses string literals like RECEIPT_SAVED, OCR_FAILED, PDF_PARTIAL, MATCH_SUGGESTED, SIDE_EFFECT_FAILED."
    impact:
      - "Typos and inconsistent event names are easy."
      - "AI/debug tools cannot rely on a closed enum."
    fix:
      - "Add ReceiptLifecycleEventType enum or constants and migrate writers."
    tests:
      - "all_receipt_event_types_are_from_known_registry"

recommended_fix_order:
  - pr: "PR1"
    title: "Critical privacy + ephemeral processing payload"
    include:
      - "BankStatementLifecycleProcessor applies rawOcrStorageMode."
      - "Email expense notes use sanitized/generic subject."
      - "Introduce ProcessedReceiptDraft with ephemeralRawText vs storedRawText."
      - "Compute fingerprints/side effects from ephemeral raw text only."
    closes:
      - "P3-CURRENT-001"
      - "P3-CURRENT-002"
      - "P3-CURRENT-003"
      - "P3-CURRENT-021"

  - pr: "PR2"
    title: "Status/provenance correctness and cancellation safety"
    include:
      - "Explicit ReceiptProcessStage instead of raw-text sentinel detection."
      - "Fix OCR_FAILED classification."
      - "Narrow parse catch."
      - "Rethrow CancellationException in all receipt pipeline catches."
    closes:
      - "P3-CURRENT-004"
      - "P3-CURRENT-017"
      - "P3-CURRENT-018"

  - pr: "PR3"
    title: "Atomic lifecycle save"
    include:
      - "Repository returns draft; coordinator owns final insert+review+events transaction."
      - "Duplicate branch update+event transaction."
      - "No successful receipt without RECEIPT_SAVED or diagnostic."
    closes:
      - "P3-CURRENT-005"
      - "P3-CURRENT-022"
      - "P3-CURRENT-023"

  - pr: "PR4"
    title: "Duplicate hardening"
    include:
      - "Store originalContentHash separately from storedAssetHash."
      - "Typed duplicate outcome; never delete existing canonical receipt."
      - "Unique fingerprint claim table or partial unique indexes."
      - "Persist email text/semantic/source fingerprints consistently."
    closes:
      - "P3-CURRENT-006"
      - "P3-CURRENT-007"
      - "P3-CURRENT-008"
      - "P3-CURRENT-009"
      - "P3-CURRENT-010"

  - pr: "PR5"
    title: "Input MIME consistency"
    include:
      - "Shared ReceiptMimeDetector used by validator and OCR service."
      - "Header/magic sniff fallback, not extension only."
    closes:
      - "P3-CURRENT-011"

  - pr: "PR6"
    title: "Matching/link lifecycle cleanup"
    include:
      - "Check AutoMatch Result."
      - "Transaction-safe match suggestion service."
      - "Remove/deprecate direct ReceiptRepository match methods."
      - "Link parent validation inside transaction."
      - "Unlink affected-row count and item-categorization cleanup."
    closes:
      - "P3-CURRENT-012"
      - "P3-CURRENT-013"
      - "P3-CURRENT-014"
      - "P3-CURRENT-019"
      - "P3-CURRENT-020"
      - "P3-CURRENT-024"

  - pr: "PR7"
    title: "Bank statement import contract"
    include:
      - "DatabaseWriteBarrier."
      - "Atomic/resumable import state."
      - "Check pendingReview insert result."
      - "Durable diagnostics for no-transactions/failure exits."
    closes:
      - "P3-CURRENT-016"
      - "P3-CURRENT-027"

  - pr: "PR8"
    title: "Lifecycle bypass/static guard"
    include:
      - "Make direct delete/clear/insert/match methods internal/debug-only or ERROR deprecated."
      - "Static allowlist for ScannedReceiptDao mutations."
      - "Debug export privacy gate."
      - "Receipt event enum."
    closes:
      - "P3-CURRENT-015"
      - "P3-CURRENT-026"
      - "P3-CURRENT-030"

definition_of_done:
  - "No bank statement/email/receipt raw text is persisted contrary to privacy settings."
  - "Parser, duplicate detector, warranty, categorization, and matching use ephemeral processing payloads, not sanitized DB text."
  - "OCR failure, parse failure, validation failure, duplicate, and success outcomes are explicit typed outcomes."
  - "Repository does not insert partial receipt rows before lifecycle metadata/events are ready."
  - "No successful ScannedReceipt lacks createdAt, updatedAt, sourceType, documentType, processingStatus, and a lifecycle event or diagnostic."
  - "Pre-OCR dedupe uses originalContentHash and cannot delete the canonical existing receipt."
  - "Fingerprint duplicate races are protected by DB-level uniqueness/claim semantics."
  - "Email messageId/text/semantic dedupe works in STORE_RAW, STORE_REDACTED, STORE_METADATA_ONLY, and DO_NOT_STORE."
  - "ReceiptInputValidator and ReceiptOcrService share one MIME detector."
  - "Auto-match failure is durable and not logged as success."
  - "Suggestion update + event are atomic."
  - "Unlink clears warranty, return-window, and item-categorization expense links correctly."
  - "All normal receipt deletes go through ReceiptLifecycleCoordinator and clean join rows."
  - "Bank statement import is either fully atomic or explicitly resumable with durable partial state."
  - "No production code can call raw ScannedReceiptDao mutators outside an allowlist."
  - "All broad receipt pipeline catches rethrow CancellationException."

