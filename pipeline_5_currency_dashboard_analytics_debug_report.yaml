meta:
  repo: "panospao7/Cost-agregator"
  commit: "4113e38f0d838a29d2d13d82a483ba573280721c"
  pipeline: "5 - Currency / Dashboard / Analytics"
  review_mode: "static GitHub source/debugging session; no local Gradle/device execution"
  verdict: "IMPROVED_BUT_NOT_CLEAN"
  summary: >
    Pipeline 5 is substantially better than the old debug report. MoneyAggregate,
    MoneyAggregateBuilder, AnalyticsCurrencyNormalizer, AnalyticsInputAssembler,
    MultiCurrencyRepository, dashboard warning fields, and safe weekly/daily drilldown
    paths now exist. However, it is not clean. The remaining risk is not lack of
    primitives; it is inconsistent consumption. Some dashboard/analytics paths use
    historical-ish conversion, others use latest-rate aggregate conversion, some
    widgets still raw-sum DashboardExpense.effectiveAmount, budget status quality is
    dropped by dashboard DTOs, recurring forecast inputs remain unnormalized, and
    several UI models still expose naked Double amounts without currency/quality.

tracker_reconciliation:
  P5-P1-01_historical_totals_use_latest_rate:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL_FIXED_BUT_NOT_CORRECT"
    notes:
      - "AnalyticsRepository.getSpendingSummary() now calls getHomeCurrencyPurchaseTotalHistorical()."
      - "But that historical method converts one per-currency bucket at the period midpoint, not each transaction at its own expense.date."
      - "It silently falls back to latest-rate conversion if no midpoint historical rate exists."
      - "Many totals still use latest-rate APIs: monthly, yearly, category, merchant, weekly, daily, budget spent."

  P5-P1-02_exchange_rate_getRate_ambiguous:
    tracker_status: "FIXED"
    actual_status: "PARTIAL"
    notes:
      - "ExchangeRateDao.getRate() now has ORDER BY lastUpdated DESC LIMIT 1."
      - "But with historical rows, newest lastUpdated is not necessarily newest validDate."
      - "If an old historical rate is imported today, latest-rate conversion can pick the old validDate."
      - "Preferred ordering should be explicit latest-current semantics, e.g. validDate DESC then lastUpdated DESC, or a separate current-rate table/query."

  P5-P1-03_dashboard_adapter_drops_money_quality:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL"
    notes:
      - "DashboardContractsAdapter.observeSpendingSummary() now preserves isPartial and warningMessage."
      - "DashboardContractsAdapter.observeCategoryBreakdown() now preserves isPartial and warningMessage."
      - "But MoneyAggregate/sourceBuckets/conversionFailures are still dropped."
      - "BudgetStatusSnapshot drops isPartial/conversionWarning/currency."
      - "PeriodSummary, TopCategories, SpendingTrend, FinancialRunway, BudgetBlockParty, and many widgets are naked Double-only models."

  P5-P1-04_weekly_daily_drilldown_broken:
    tracker_status: "TODO_ONLY"
    actual_status: "MOSTLY_FIXED_WITH_QUALITY_GAPS"
    notes:
      - "TotalsAggregationEngine.getWeeklyTotals(), getDailyTotals(), getDailyTotalsForRange() now use MultiCurrencyRepository.getHomeCurrencyWeeklyTotals/DailyTotals."
      - "They no longer return forced empty lists."
      - "But weekly/daily aggregates use latest-rate conversion, not transaction-date conversion."
      - "They fail to pass transactionCounts into MoneyAggregateBuilder, so transactionCount and failedTransactionCount can be zero."
      - "PeriodTotal does not preserve MoneyAggregate/isPartial/warnings in these reactive methods."

  P5-P1-05_dashboard_widgets_raw_sum_effectiveAmount:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "ComputeDashboardWidgetsUseCase.computeSpendingTrend() explicitly has a TODO and sums exp.effectiveAmount."
      - "computeBlockParty() passes raw ctx.expenseEntities to SynthesisEngine; SynthesisEngine prefers expensesByDay effectiveAmount over dailyHistory."
      - "ForecastInputAssembler normalizes actual expenses, but recurringPatterns and confirmedOccurrences are still summed raw by SynthesisEngine."

  P5-P1-06_stale_rate_not_propagated:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL"
    notes:
      - "AnalyticsCurrencyNormalizer now emits STALE_EXCHANGE_RATE warnings."
      - "AnalyticsInputAssembler now populates staleRateCount."
      - "But stale detection compares expense.date to conversion.timestamp/lastUpdated, not ExchangeRate.validDate."
      - "If a historical rate is imported recently, stale detection can incorrectly treat it as fresh."
      - "Latest-rate MoneyAggregate paths can distinguish stale rates via convertMultiple(), but dashboard widgets often drop quality metadata."

  P5-P1-07_MultiCurrencyRepository_builder_use:
    tracker_status: "TODO_ONLY"
    actual_status: "MOSTLY_FIXED_WITH_EXCEPTIONS"
    notes:
      - "aggregateToMoneyAggregate() and aggregateCurrencyTotalsToMoneyAggregate() now use MoneyAggregateBuilder with transactionCounts."
      - "getHomeCurrencyPurchaseTotalHistorical() manually builds MoneyAggregate and does not preserve all bucket/fallback quality."
      - "weekly/daily row-scan paths use MoneyAggregateBuilder but omit transactionCounts."

  P5-P1-08_budget_vs_actual_not_normalized:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL_BUT_STILL_NOT_CLEAN"
    notes:
      - "BudgetRepository is improved: budget limits can convert as-of period end and spent uses MultiCurrencyRepository."
      - "But spent uses latest-rate purchase totals, while budget limit uses period-end historical conversion."
      - "DashboardContractsAdapter maps BudgetStatus to BudgetStatusSnapshot and drops isPartial/conversionWarning/currency."
      - "AdvancedAnalyticsEngine.getCategoryAnalytics() remains deprecated and compares normalized spend against budget snapshots converted with latest rates."

positive_findings:
  - "MoneyAggregate is established as the intended approved aggregate type."
  - "MoneyAggregateBuilder centralizes per-currency bucket conversion and failed transaction counts."
  - "CurrencyConverter.convertAsOf() exists and is used by AnalyticsCurrencyNormalizer."
  - "AnalyticsCurrencyNormalizer normalizes Expense/ExpenseSnapshot lists before analytics arithmetic."
  - "AnalyticsInputAssembler now carries AnalyticsDataQuality including staleRateCount, missingRateCount, invalidCurrencyCount, confidencePenalty, confidenceMultiplier, and warnings."
  - "AnalyticsRepository.getSpendingSummary() now includes aggregate and isPartial."
  - "Dashboard SpendingSummary and DashboardCategoryBreakdown now carry partial/warning fields."
  - "TotalsAggregationEngine weekly/daily drilldown no longer returns hardcoded empty lists."
  - "BudgetRepository has moved away from raw DAO sums for current budget status and budget suggestions."
  - "ForecastInputAssembler normalizes actual expense snapshots and planned expenses before many forecast calculations."

issues:
  - id: "P5-CURRENT-001"
    severity: "P0_FINANCIAL_CORRECTNESS"
    status: "OPEN"
    title: "Historical aggregate method uses period midpoint, not per-transaction historical rates"
    evidence:
      - "MultiCurrencyRepository.getHomeCurrencyPurchaseTotalHistorical() groups totals by currency."
      - "It computes midpoint = startDate + (endDate - startDate) / 2."
      - "It calls convertAsOf(ct.total, ct.currency, homeCurrency, midpoint)."
    impact:
      - "A yearly/monthly total can use one FX rate for all transactions in a currency bucket."
      - "Daily history from AnalyticsCurrencyNormalizer can disagree with the headline summary total."
      - "Name says Historical, but semantics are midpoint-bucket valuation."
    fix:
      - "Replace with row-level conversion by expense.date, or group by currency + rate-valid-day."
      - "Return a MoneyAggregate whose sourceBuckets include all source buckets and whose warnings identify missing/stale per-date rates."
    tests:
      - "historical_total_uses_each_expense_date_rate"
      - "summary_total_equals_sum_of_normalized_daily_history_when_all_rates_available"
      - "midpoint_rate_not_used_for_cross_month_period"

  - id: "P5-CURRENT-002"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Historical aggregate silently falls back to latest rate without marking partial or warning"
    evidence:
      - "getHomeCurrencyPurchaseTotalHistorical() tries convertAsOf()."
      - "If null, it calls currencyConverter.convert()."
      - "If latest conversion succeeds, it adds converted amount and no ConversionFailure/warning."
    impact:
      - "A supposedly historical dashboard total can be partly latest-rate valued with no visible caveat."
      - "Audit/debug cannot tell which currencies/dates used fallback."
    fix:
      - "Represent fallback as RATE_BASIS_FALLBACK warning."
      - "Expose conversionBasis per source bucket: AS_OF_TRANSACTION_DATE, AS_OF_PERIOD_MIDPOINT, LATEST_FALLBACK."
    tests:
      - "historical_total_latest_fallback_sets_partial_warning"
      - "historical_total_reports_fallback_currency_and_transaction_count"

  - id: "P5-CURRENT-003"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Latest-rate lookup orders by lastUpdated, not validDate"
    evidence:
      - "ExchangeRateDao.getRate(): ORDER BY lastUpdated DESC LIMIT 1."
      - "ExchangeRate has historical uniqueness on fromCurrency + toCurrency + validDate."
    impact:
      - "Importing old historical rates after newer current rates can make convert() select an old validDate."
      - "Current dashboard cards, latest-rate totals, and rate existence checks can be wrong."
    fix:
      - "Create getLatestCurrentRateForPair() with deterministic policy."
      - "Usually ORDER BY validDate DESC, lastUpdated DESC, with clear validDate=0 sentinel handling."
    tests:
      - "getRate_prefers_newest_validDate_over_newest_import_time"
      - "getRate_tiebreaks_same_validDate_by_lastUpdated"
      - "manual_validDate_zero_policy_is_explicit"

  - id: "P5-CURRENT-004"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Weekly/daily MoneyAggregate transaction counts are zero"
    evidence:
      - "getHomeCurrencyWeeklyTotals() builds buckets = group.map { Pair(it.effectiveAmount, it.currency) }."
      - "It calls MoneyAggregateBuilder.fromBuckets(buckets, homeCurrency, currencyConverter) without transactionCounts."
      - "MoneyAggregateBuilder defaults missing transactionCounts to 0."
    impact:
      - "PeriodTotal.transactionCount for weekly/daily drilldown can be 0 even when transactions exist."
      - "Conversion failure warnings can say zero affected transactions."
    fix:
      - "Pass transactionCounts = List(group.size) { 1 } for per-row buckets."
      - "Or pre-aggregate to currency buckets with counts."
    tests:
      - "weekly_total_transaction_count_matches_purchase_count"
      - "daily_total_failed_conversion_reports_affected_transaction_count"
      - "weekly_total_source_bucket_counts_are_nonzero"

  - id: "P5-CURRENT-005"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Weekly/daily/monthly dashboard totals still use latest-rate basis"
    evidence:
      - "getHomeCurrencyWeeklyTotals()/DailyTotals use MoneyAggregateBuilder, which calls convertMultiple(), which calls latest-rate convert()."
      - "getHomeCurrencyMonthlyTotals() also uses latest-rate aggregate helpers."
      - "TotalsAggregationEngine uses these for dashboard drilldown and averages."
    impact:
      - "Trend/drilldown period reports are not period-accurate for FX."
      - "Week/day/month totals can disagree with AnalyticsRepository daily normalization."
    fix:
      - "Add historical weekly/daily/monthly aggregate APIs based on normalized rows."
      - "Use latest-rate APIs only in explicitly named current-valuation widgets."
    tests:
      - "weekly_total_uses_expense_date_rate"
      - "daily_total_uses_expense_date_rate"
      - "monthly_total_equals_sum_of_historical_daily_totals"

  - id: "P5-CURRENT-006"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Monthly totals are type-agnostic and can include deposits/transfers"
    evidence:
      - "MultiCurrencyRepository.getHomeCurrencyMonthlyTotals() uses getAllMonthlyTotalsBetweenByCurrency()."
      - "DAO comment says type-agnostic includes PURCHASE, DEPOSIT, TRANSFER, UNKNOWN."
      - "TotalsAggregationEngine.getMonthlyTotals() uses getHomeCurrencyMonthlyTotals() for spending dashboard."
    impact:
      - "Monthly spending dashboard can include income/deposits/transfers."
      - "Yearly totals use purchase-only, so yearly and monthly views can disagree."
    fix:
      - "Add getHomeCurrencyPurchaseMonthlyTotals()."
      - "Dashboard spending views should use purchase-only unless explicitly net-cashflow."
    tests:
      - "monthly_spending_total_excludes_deposits"
      - "monthly_spending_total_excludes_transfers"
      - "yearly_total_equals_sum_of_purchase_months"

  - id: "P5-CURRENT-007"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Category breakdown uses latest-rate totals while spending summary uses historical-ish totals"
    evidence:
      - "AnalyticsRepository.getSpendingSummary() calls getHomeCurrencyPurchaseTotalHistorical()."
      - "AnalyticsRepository.getCategoryBreakdown() calls getHomeCurrencyPurchaseCategoryTotals(), documented latest-rate."
    impact:
      - "Category totals may not add up to the headline period total."
      - "Percentages can be based on a different FX basis than the summary card."
    fix:
      - "Use one NormalizedAnalyticsInput for both summary and category breakdown."
      - "Category breakdown should group normalized row amounts by category."
    tests:
      - "category_breakdown_sum_matches_spending_summary_total"
      - "category_breakdown_uses_expense_date_rates"

  - id: "P5-CURRENT-008"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Dashboard spending trend raw-sums mixed-currency effectiveAmount"
    evidence:
      - "ComputeDashboardWidgetsUseCase.computeSpendingTrend() has TODO P5-P1-05."
      - "It groups DashboardExpense rows and does daily[dayIdx] += exp.effectiveAmount."
    impact:
      - "Six-month trend can sum EUR + USD + GBP as if same currency."
      - "Trend can disagree with period summary and analytics."
    fix:
      - "Make computeSpendingTrend suspend and normalize dashboard expenses using AnalyticsCurrencyNormalizer or prebuilt NormalizedAnalyticsInput."
    tests:
      - "dashboard_spending_trend_does_not_raw_sum_mixed_currency"
      - "spending_trend_current_month_matches_summary_daily_history"

  - id: "P5-CURRENT-009"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Block Party actuals prefer raw expense sums over normalized daily history"
    evidence:
      - "ComputeDashboardWidgetsUseCase.computeBlockParty() passes ctx.expenseEntities from raw DashboardExpense."
      - "SynthesisEngine.calculateBlockPartyData() computes actualFromExpenses = expensesByDay[day]?.sumOf { it.effectiveAmount }."
      - "It uses actualFromExpenses ?: actualFromHistory, so raw expenses override normalized dailyHistory."
    impact:
      - "BudgetBlockParty actual spent values can be mixed-currency."
      - "A normalized dailyHistory safety path exists but is bypassed whenever expense rows are present."
    fix:
      - "Pass normalized ExpenseSnapshot rows to calculateBlockPartyData()."
      - "Or make calculateBlockPartyData require NormalizedAnalyticsInput."
    tests:
      - "block_party_actuals_use_normalized_expenses"
      - "block_party_actuals_match_summary_daily_history_for_mixed_currency"

  - id: "P5-CURRENT-010"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Forecast recurring patterns and confirmed occurrences are not normalized"
    evidence:
      - "ForecastInputAssembler normalizes actual expenses and planned expenses."
      - "mergeRecurringPatterns() TODO says patterns retain original currency amounts."
      - "SynthesisEngine sums confirmedOccurrences.expectedAmount and recurringPatterns.averageAmount without converting expectedCurrency/currency."
    impact:
      - "FinancialRunway totalCommitted/totalLikely and projected points can mix currencies."
      - "Recurring bills in non-home currency distort forecast and block-party targets."
    fix:
      - "Normalize RecurringPattern.averageAmount and ConfirmedOccurrence.expectedAmount in ForecastInputAssembler."
      - "Set all forecast input money to displayCurrency/homeCurrency before SynthesisEngine."
    tests:
      - "forecast_recurring_pattern_amounts_are_home_currency"
      - "confirmed_occurrence_amounts_are_home_currency"
      - "synthesis_rejects_mixed_currency_forecast_input"

  - id: "P5-CURRENT-011"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Budget spent and budget limit use different FX bases"
    evidence:
      - "BudgetRepository.convertBudgetAmountToHomeCurrencyAsOf() converts budget limit at periodEnd."
      - "BudgetRepository.getAggregateSpent() uses MultiCurrencyRepository.getHomeCurrencyPurchaseTotal/categoryTotals, which are latest-rate."
    impact:
      - "Budget percentUsed can compare historical budget-limit conversion against latest-rate actual spending."
      - "Budget utilization can shift just because today’s FX rates changed."
    fix:
      - "Use historical normalized spend for budget period actuals."
      - "Use a defined budget policy: budget-limit-as-period-start/end/latest, and apply consistently."
    tests:
      - "budget_percent_uses_same_rate_basis_for_limit_and_spend"
      - "budget_spent_does_not_change_when_latest_rate_changes_after_period"

  - id: "P5-CURRENT-012"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Dashboard budget DTO drops budget currency quality"
    evidence:
      - "BudgetRepository returns BudgetStatus with isPartial and conversionWarning."
      - "DashboardContractsAdapter.observeBudgetStatuses() maps to BudgetStatusSnapshot without isPartial, conversionWarning, or currency."
      - "BudgetStatusSnapshot only carries raw Double budgetAmount/spentAmount/remainingAmount/percentUsed."
    impact:
      - "Dashboard budget health widget cannot warn that budget status is unreliable due to FX conversion."
    fix:
      - "Extend BudgetStatusSnapshot with currency, isPartial, warningMessage, and maybe MoneyAggregate fields."
    tests:
      - "dashboard_budget_status_preserves_conversion_warning"
      - "dashboard_budget_status_preserves_currency"
      - "budget_widget_shows_partial_warning"

  - id: "P5-CURRENT-013"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "TopCategories widget defaults currency to EUR"
    evidence:
      - "CategorySpending has currency default = 'EUR'."
      - "ComputeDashboardWidgetsUseCase.computeCategoryTotals() creates CategorySpending without passing currency."
      - "DashboardCategoryBreakdown does not carry currency."
    impact:
      - "If home currency is USD/GBP/etc., top category MoneyAmount formatting can show EUR."
      - "Amount may be in home currency but labelled as EUR."
    fix:
      - "Carry displayCurrency through DashboardCategoryBreakdown."
      - "Pass processedData.summary.currency into CategorySpending."
    tests:
      - "top_categories_use_home_currency_not_default_EUR"
      - "dashboard_category_breakdown_carries_display_currency"

  - id: "P5-CURRENT-014"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "PeriodSummary and several dashboard widgets lack currency and quality fields"
    evidence:
      - "DashboardWidget.PeriodSummary(todaySpent, weekSpent, monthSpent) has no currency/isPartial/warning."
      - "FinancialRunway, SafeToSpend, BudgetBlockParty, SpendingTrend, MonteCarloForecast wrapper expose mostly raw Double models."
    impact:
      - "Even when upstream knows data is partial or in a specific home currency, widget UI cannot show reliable warnings/labels."
    fix:
      - "Introduce MoneyDisplay or DashboardMoneyAmount with amount, currency, isPartial, warningMessage."
      - "Use it across dashboard widgets."
    tests:
      - "period_summary_carries_currency_and_partial_warning"
      - "financial_runway_carries_currency"
      - "spending_trend_carries_data_quality"

  - id: "P5-CURRENT-015"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Stale-rate detection uses lastUpdated instead of validDate"
    evidence:
      - "AnalyticsCurrencyNormalizer flags stale when expense.date - conversion.timestamp > sevenDaysMs."
      - "CurrencyConverter.convertAsOf() returns timestamp = exchangeRate.lastUpdated."
      - "ExchangeRate.validDate is the actual historical validity date."
    impact:
      - "A stale old rate imported today can look fresh."
      - "A valid old historical rate with old lastUpdated can look stale even if validDate is correct."
    fix:
      - "Expose validDate/rateAgeBasis in ConversionResult."
      - "Stale historical quality should compare requested expense date against validDate coverage, not import/update time."
    tests:
      - "stale_historical_rate_detected_by_validDate_not_lastUpdated"
      - "recently_imported_old_rate_still_marked_stale_when_validDate_too_old"
      - "old_lastUpdated_but_correct_validDate_not_marked_stale"

  - id: "P5-CURRENT-016"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Historical aggregate failure buckets are excluded from sourceBuckets and transactionCount"
    evidence:
      - "getHomeCurrencyPurchaseTotalHistorical() adds MoneyBucket only for home/successful conversion/fallback-success paths."
      - "If conversion fails, it adds ConversionFailure but not a source bucket for the failed currency."
      - "AnalyticsRepository uses currentAggregate.totalTransactionCount for transactionCount."
    impact:
      - "Dashboard transactionCount can count only included transactions, not all period purchases."
      - "sourceBuckets does not transparently show excluded currencies."
    fix:
      - "Always include sourceBuckets for all currency totals."
      - "Use separate includedTransactionCount/excludedTransactionCount if needed."
    tests:
      - "historical_total_sourceBuckets_include_failed_currency"
      - "spending_summary_transactionCount_includes_failed_conversion_transactions_or_explicitly_names_included_count"

  - id: "P5-CURRENT-017"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Silent EUR fallback remains widespread"
    evidence:
      - "MultiCurrencyRepository.resolveHomeCurrency() catches and defaults to EUR."
      - "AnalyticsRepository, AnalyticsInputAssembler, BudgetRepository, and ForecastInputAssembler have similar getOrDefault('EUR') or fallback behavior."
    impact:
      - "Settings/DataStore failure can silently relabel/convert dashboard and analytics as EUR."
      - "User sees plausible but wrong currency."
    fix:
      - "Introduce HomeCurrencyResolution: Resolved, DefaultedFirstRun, Failed."
      - "Only first-run default should be silent; failure should propagate warning."
    tests:
      - "home_currency_settings_failure_surfaces_dashboard_warning"
      - "first_run_default_EUR_is_not_reported_as_error"
      - "forecast_input_records_home_currency_resolution_failure"

  - id: "P5-CURRENT-018"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Deprecated raw aggregate DAO methods remain callable"
    evidence:
      - "ExpenseDao still exposes deprecated getTotalForPeriod, getDailyTotalsForPeriod, getWeeklyTotalsForPeriod, getMonthlyTotalsForPeriod, getAverageDailySpend, getTotalDepositsForPeriod, category raw sums, and business raw sums."
      - "Deprecation level is warning, not ERROR."
    impact:
      - "Future code can reintroduce raw mixed-currency aggregation."
    fix:
      - "Add static guard/CI allowlist for raw aggregate method calls."
      - "Rename unsafe methods with unsafeRaw prefix and later DeprecationLevel.ERROR."
    tests:
      - "currency_guard_blocks_getTotalForPeriod_in_production"
      - "currency_guard_blocks_getWeeklyTotalsForPeriod_in_production"
      - "currency_guard_blocks_sumOf_effectiveAmount_outside_normalized_context"

  - id: "P5-CURRENT-019"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Category percentages still hide partial-conversion semantics"
    evidence:
      - "AnalyticsRepository.getCategoryBreakdown() computes totalSpent as sum of aggregate.displayAmount."
      - "It does now carry isPartial/warning per category."
      - "But parent-level percentage caveat is not carried as a structured field."
    impact:
      - "Charts can show percentages that exclude failed currency buckets while looking precise."
    fix:
      - "Add parent breakdown quality: isPartial, excludedTransactionCount, warningMessage."
      - "UI should label percentages as based only on convertible transactions when partial."
    tests:
      - "category_percentage_parent_partial_when_any_category_partial"
      - "category_chart_shows_percentages_based_on_convertible_transactions_warning"

  - id: "P5-CURRENT-020"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Dashboard DataProvider injects AnalyticsCurrencyNormalizer but does not build canonical normalized dashboard input"
    evidence:
      - "DashboardDataProvider constructor has analyticsCurrencyNormalizer."
      - "getAllDataFlow() and getProcessedDataFlow() pass raw DashboardExpense lists through."
      - "ComputeDashboardWidgetsUseCase then normalizes only some subpaths indirectly."
    impact:
      - "Normalization responsibility is scattered across adapters, repositories, ForecastInputAssembler, and widget code."
      - "Regressions like raw spending trend are easy."
    fix:
      - "Build DashboardNormalizedInput once in DashboardDataProvider."
      - "ComputeDashboardWidgetsUseCase should consume normalized input plus raw display rows."
    tests:
      - "dashboard_provider_builds_normalized_input_once"
      - "widgets_use_normalized_input_for_arithmetic"

  - id: "P5-CURRENT-021"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "AdvancedAnalyticsEngine deprecated budget category analytics remains reachable"
    evidence:
      - "getCategoryAnalytics() is deprecated but public."
      - "Comment says budget amounts may not be normalized and to use BudgetVsActualEngine."
      - "It compares normalized total to BudgetSnapshot.amount."
    impact:
      - "Any caller still using it gets potentially wrong budget utilization."
    fix:
      - "DeprecationLevel.ERROR or route method internally through canonical budget-vs-actual service."
    tests:
      - "deprecated_category_analytics_not_used_by_dashboard"
      - "category_analytics_budget_utilization_uses_normalized_budget_status"

  - id: "P5-CURRENT-022"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Reactive dashboard category previous-period query uses nested first()"
    evidence:
      - "DashboardContractsAdapter.observeCategoryBreakdown() calls analyticsRepository.getCategoryBreakdown(previousStart, previousEnd).map {...}.first() inside map."
      - "Comment marks this as P2-22."
    impact:
      - "Extra nested flow subscription and recomputation on each emission."
      - "Can create sluggish dashboard behavior as analytics grows."
    fix:
      - "Use combine(currentBreakdownFlow, previousBreakdownFlow)."
    tests:
      - "category_breakdown_previous_period_combined_without_nested_first"

  - id: "P5-CURRENT-023"
    severity: "P3_LOW"
    status: "OPEN"
    title: "Stale comments contradict current code"
    evidence:
      - "TotalsAggregationEngine header still says weekly/daily use raw DAO and MCR equivalents do not exist."
      - "Later code comments say A02-FIXED and use MCR."
      - "DashboardContractsAdapter budget comment says BudgetRepository raw sums may mix currencies, but BudgetRepository is now partially currency-aware."
    impact:
      - "AI agents and maintainers can follow stale comments and make wrong changes."
    fix:
      - "Update comments after code changes."
      - "Move current contracts to docs/architecture currency dashboard contract."
    tests:
      - "static_grep_no_stale_MCR_equivalent_missing_comments"

recommended_fix_order:
  - pr: "PR1"
    title: "Define and enforce rate-basis contract"
    include:
      - "Create explicit RateBasis enum: LATEST_CURRENT, AS_OF_TRANSACTION_DATE, AS_OF_PERIOD_END, LATEST_FALLBACK."
      - "Fix ExchangeRateDao latest lookup to use deterministic validDate policy."
      - "Add ConversionResult.validDate/rateBasis."
    closes:
      - "P5-CURRENT-001"
      - "P5-CURRENT-002"
      - "P5-CURRENT-003"
      - "P5-CURRENT-015"

  - pr: "PR2"
    title: "Historical normalized aggregate APIs"
    include:
      - "Add row/date-based historical totals for total/category/month/week/day."
      - "Make summary, category breakdown, and totals dashboard use same historical basis."
      - "Add purchase-only monthly totals."
    closes:
      - "P5-CURRENT-005"
      - "P5-CURRENT-006"
      - "P5-CURRENT-007"

  - pr: "PR3"
    title: "Fix weekly/daily drilldown counts and quality propagation"
    include:
      - "Pass transaction counts to MoneyAggregateBuilder in weekly/daily paths."
      - "PeriodTotal should carry MoneyAggregate or CurrencyQuality."
      - "Include failed source buckets in historical aggregate."
    closes:
      - "P5-CURRENT-004"
      - "P5-CURRENT-016"

  - pr: "PR4"
    title: "Canonical normalized dashboard input"
    include:
      - "DashboardDataProvider builds DashboardNormalizedInput."
      - "ComputeDashboardWidgetsUseCase consumes normalized values for all arithmetic."
      - "Fix spending trend and block-party actuals."
    closes:
      - "P5-CURRENT-008"
      - "P5-CURRENT-009"
      - "P5-CURRENT-020"

  - pr: "PR5"
    title: "Normalize recurring forecast money"
    include:
      - "Normalize RecurringPattern and ConfirmedOccurrence amounts in ForecastInputAssembler."
      - "Make SynthesisEngine reject mixed-currency forecast inputs."
    closes:
      - "P5-CURRENT-010"

  - pr: "PR6"
    title: "Budget dashboard currency quality"
    include:
      - "Align budget spent and budget limit rate bases."
      - "Extend BudgetStatusSnapshot with currency/isPartial/warning."
      - "Disable or reroute deprecated AdvancedAnalyticsEngine budget comparison."
    closes:
      - "P5-CURRENT-011"
      - "P5-CURRENT-012"
      - "P5-CURRENT-021"

  - pr: "PR7"
    title: "Dashboard model money contract"
    include:
      - "Add DashboardMoneyAmount or MoneyDisplay model."
      - "Carry currency/isPartial/warning into PeriodSummary, TopCategories, SpendingTrend, FinancialRunway, BudgetBlockParty."
      - "Fix TopCategories EUR default."
    closes:
      - "P5-CURRENT-013"
      - "P5-CURRENT-014"
      - "P5-CURRENT-019"

  - pr: "PR8"
    title: "Guardrails and cleanup"
    include:
      - "HomeCurrencyResolution instead of silent EUR fallback."
      - "CI guard against raw aggregate DAO calls and raw sumOf effectiveAmount."
      - "Remove stale comments."
      - "Fix nested previous-category flow."
    closes:
      - "P5-CURRENT-017"
      - "P5-CURRENT-018"
      - "P5-CURRENT-022"
      - "P5-CURRENT-023"

definition_of_done:
  - "Every dashboard/analytics period report declares and uses one rate basis."
  - "Historical totals convert each transaction by expense.date, or by a provably equivalent date-rate grouping."
  - "No historical aggregate silently falls back to latest rate without a warning."
  - "ExchangeRate latest lookup is deterministic and not confused by historical import lastUpdated."
  - "Summary total, daily history, category breakdown, monthly totals, weekly totals, and daily drilldown reconcile under the same basis."
  - "Dashboard spending totals are purchase-only unless the widget is explicitly net-cashflow."
  - "Weekly/daily PeriodTotal transactionCount and failedTransactionCount are correct."
  - "All dashboard arithmetic consumes normalized home-currency values."
  - "Recurring patterns and confirmed occurrences are normalized before SynthesisEngine sums them."
  - "Budget spent and budget limit use the same documented basis."
  - "Budget dashboard widgets preserve currency, partial state, and conversion warnings."
  - "No UI widget formats home-currency values as default EUR unless homeCurrency is actually EUR."
  - "Home currency settings failure is surfaced as a warning, not silent EUR fallback."
  - "CI blocks unsafe raw aggregate DAO calls and raw sumOf effectiveAmount in production code."
  - "Deprecated budget/category analytics paths are not used by dashboard."

