meta:
  repo: "panospao7/Cost-agregator"
  commit: "4113e38f0d838a29d2d13d82a483ba573280721c"
  engine_group: "#1 - Warranty / Subscription / Location / NLP Engines"
  review_mode: "static GitHub source/debugging session; no local Gradle/device execution"
  verdict: "IMPROVED_BUT_NOT_CLEAN"
  summary: >
    Engine group #1 is materially improved versus the old report. Warranty protected
    value now has a MoneyAggregate path, return refunds can store currency through
    repository path, subscription price timestamps and atomic price changes are improved,
    GPS access is privacy-gated, location money models exist, legacy NLP uses keyset
    paging/category pushdown, assistant largest query is currency-aware, and assistant
    result dataQuality exists. However, the group is not clean. The largest remaining
    risks are incomplete write-barrier coverage, incomplete warranty/return lifecycle
    events, manual warranty placeholder privacy leakage, bill negotiation still being
    in-memory/non-persistent, static market rates not actually provider-driven, raw
    subscription recommendation/savings math, cloud query redaction uncertainty/TODO,
    and deprecated/legacy public APIs that can still bypass the fixed paths.

tracker_reconciliation:
  W01_warranty_protected_value_currency_safe:
    tracker_status: "FIXED"
    actual_status: "MOSTLY_FIXED_WITH_CAVEATS"
    notes:
      - "WarrantyTrackerRepository.getTotalProtectedValueAggregate() uses MoneyAggregateBuilder."
      - "WarrantyDao.getTotalProtectedValueByCurrency() uses effective ownership-adjusted SQL CASE."
      - "Deprecated raw getTotalProtectedValue() is still public/callable."
      - "Unlinked warranties are grouped under COALESCE(e.currency,'EUR') with zero totals and txCount, which can distort counts."
      - "Rate basis is latest/current via MoneyAggregateBuilder, not explicitly documented."

  W02_return_refund_currency:
    tracker_status: "FIXED"
    actual_status: "FIXED_FOR_REPOSITORY_PATH_PARTIAL_GLOBALLY"
