issues:
  - id: "E1-CURRENT-001"
    severity: "P0_RESTORE_SAFETY"
    status: "OPEN"
    title: "Warranty write paths do not consistently use DatabaseWriteBarrier"
    evidence:
      - "addWarranty() writes warranty + lifecycle event in database.withTransaction but does not call writeBarrier.checkWritesAllowed()."
      - "addWarrantyIgnoreConflicts() also writes without visible writeBarrier check."
      - "upsertReturnWindowForReceipt() inserts/updates return windows without visible writeBarrier check."
      - "reconcileExpiredItems() updates warranty/return statuses without visible writeBarrier check."
    impact:
      - "Warranty/return mutations can occur during restore/backup/restart-required maintenance."
      - "Lifecycle-event writes can mutate the DB during maintenance."
    fix:
      - "Call DatabaseWriteBarrier in every warranty/return write entry point."
      - "Or introduce WarrantyLifecycleCoordinator as the only write owner."
    tests:
      - "restore_blocks_addWarranty"
      - "restore_blocks_addWarrantyIgnoreConflicts"
      - "restore_blocks_upsertReturnWindowForReceipt"
      - "restore_blocks_reconcileExpiredItems"

  - id: "E1-CURRENT-002"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Warranty lifecycle event coverage is incomplete"
    evidence:
      - "CREATED and CLAIMED are written in some repository paths."
      - "No events are visible for RETURN_WINDOW_CREATED, RETURN_WINDOW_RETURNED, WARRANTY_EXPIRED, RETURN_WINDOW_EXPIRED, LINKED_TO_EXPENSE, UNLINKED_FROM_EXPENSE, DELETE, UPDATE, AI_EXTRACT_FAILED."
      - "Event types are raw strings."
    impact:
      - "Debugging warranty/return-window behavior still requires DB diffs/logcat."
      - "Expiry worker/reconcile actions are invisible."
    fix:
      - "Add WarrantyLifecycleCoordinator and closed WarrantyLifecycleEventType enum."
      - "Write events for every state transition."
    tests:
      - "addReturnWindow_writes_RETURN_WINDOW_CREATED"
      - "markAsReturned_writes_RETURN_WINDOW_RETURNED"
      - "reconcileExpiredItems_writes_expired_events"

  - id: "E1-CURRENT-003"
    severity: "P1_PRIVACY"
    status: "OPEN"
    title: "Manual warranty placeholder still stores raw product name as OCR text"
    evidence:
      - "createManualPlaceholderReceipt() sets rawOcrText = 'Manual warranty entry: $productName'."
      - "It only fixed currency by using homeCurrency."
      - "No documentType=MANUAL_PLACEHOLDER is visible in the constructed ScannedReceipt."
    impact:
      - "Private product names can enter raw OCR retention/export/debug paths."
      - "Placeholder receipts may be treated like real OCR receipts."
    fix:
      - "Use metadata/display fields only, not rawOcrText."
      - "Set documentType='MANUAL_PLACEHOLDER' and processingStatus clearly."
      - "Apply rawOcrStorageMode/privacy sanitizer."
    tests:
      - "manual_warranty_placeholder_stores_no_raw_product_in_rawOcrText"
      - "manual_warranty_placeholder_documentType_is_MANUAL_PLACEHOLDER"

  - id: "E1-CURRENT-004"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Low-confidence warranty extraction is discarded instead of review-routed"
    evidence:
      - "MIN_CLOUD_CONFIDENCE = 0.5."
      - "toWarrantyEntityOrNull() returns null when confidence < 0.5."
      - "Then lowConfidence = confidence <= 0.3f is unreachable for cloud results below threshold."
    impact:
      - "Receipts with weak but useful warranty signals get no review draft."
      - "User cannot correct/approve missed warranty extraction."
    fix:
      - "Use three bands: auto-accept, needs-review draft, discard."
      - "Persist review/diagnostic event for discarded extraction."
    tests:
      - "cloud_warranty_confidence_0_4_creates_review_draft"
      - "cloud_warranty_confidence_0_1_discards_with_diagnostic"

  - id: "E1-CURRENT-005"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Warranty protected-value aggregate still has count and rate-basis caveats"
    evidence:
      - "WarrantyDao groups COALESCE(e.currency,'EUR') even for unlinked warranties."
      - "MoneyAggregateBuilder conversion basis is not explicitly historical/as-of purchase date."
      - "Deprecated raw getTotalProtectedValue() remains callable."
    impact:
      - "Protected value counts can include zero/unlinked warranties as EUR rows."
      - "FX basis is unclear for warranty value reporting."
    fix:
      - "Separate linked/unlinked counts."
      - "Use explicit rate basis: current replacement value vs purchase-date historical value."
      - "Block raw aggregate usage with static guard."
    tests:
      - "unlinked_warranty_not_counted_as_EUR_transaction"
      - "protected_value_declares_rate_basis"
      - "no_production_call_to_raw_getTotalProtectedValue"

  - id: "E1-CURRENT-006"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "SubscriptionManagerEngine writes bypass DatabaseWriteBarrier"
    evidence:
      - "validateAndCreate(), acceptCandidate(), recordUsage(), recordPriceChange() do not inject/check DatabaseWriteBarrier."
      - "They write subscriptions, candidates, usage, and price history."
    impact:
      - "Subscription writes can occur during restore/backup/restart-required maintenance."
    fix:
      - "Inject DatabaseWriteBarrier into SubscriptionManagerEngine."
      - "Check it before every write method."
    tests:
      - "restore_blocks_validateAndCreate"
      - "restore_blocks_acceptCandidate"
      - "restore_blocks_recordUsage"
      - "restore_blocks_recordPriceChange"

  - id: "E1-CURRENT-007"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Subscription validation is incomplete and acceptCandidate bypasses it"
    evidence:
      - "validateAndCreate() only checks amount > 0, currency nonblank length 3, merchant nonblank."
      - "Currency '123' passes length check."
      - "Double.POSITIVE_INFINITY passes amount > 0."
      - "acceptCandidate() inserts candidate values directly without validation."
    impact:
      - "Invalid currency/money can enter recurring/subscription/budget/forecast paths."
    fix:
      - "Use CurrencyCode validation and finite positive money validation."
      - "Route acceptCandidate through the same validator."
    tests:
      - "subscription_rejects_currency_123"
      - "subscription_rejects_infinite_amount"
      - "acceptCandidate_validates_candidate_amount_currency_merchant"

  - id: "E1-CURRENT-008"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Subscription recommendation and savings math still uses raw Double"
    evidence:
      - "generateRecommendations() uses subscription.amount for potentialSavings."
      - "calculatePotentialSavings() returns raw Double and sums recommendation savings."
      - "No MoneyAggregate or monthly-equivalent normalization is used for savings."
    impact:
      - "Annual, weekly, and monthly subscriptions are mixed."
      - "EUR/USD/GBP potential savings can be summed as one number."
    fix:
      - "Return MoneyAggregate + rate basis for potential savings."
      - "Normalize to monthly equivalent before recommendation savings."
    tests:
      - "potential_savings_monthly_normalizes_annual_subscription"
      - "potential_savings_multi_currency_returns_MoneyAggregate"

  - id: "E1-CURRENT-009"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Bill negotiation outcome is still in-memory and ignores new price"
    evidence:
      - "recordNegotiationOutcome() calls recordNegotiationAttempt() only."
      - "negotiationHistory is a private mutableList."
      - "newPrice is not used."
      - "No recurring amount or SubscriptionPriceHistory update occurs."
    impact:
      - "User-visible negotiation results are lost on process death."
      - "Successful negotiation does not update subscription cost."
      - "No audit/history exists."
    fix:
      - "Add NegotiationOutcome entity/DAO."
      - "On success/partial success, transactionally update recurring subscription amount and insert price history."
    tests:
      - "negotiation_success_persists_outcome"
      - "negotiation_success_updates_subscription_price"
      - "negotiation_history_survives_process_restart"

  - id: "E1-CURRENT-010"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Bill negotiation still exposes raw billing-cycle price in scripts/opportunities"
    evidence:
      - "NegotiationOpportunity.currentPrice is raw subscription.amount."
      - "generateNegotiationScript() uses subscription.amount/currentPrice in text."
      - "Comment says script should use monthlyEquivalentPrice, but code does not."
    impact:
      - "Annual subscription of 120/year can be presented as 120/month in negotiation script."
      - "User advice can be financially misleading."
    fix:
      - "Add rawBillingAmount/rawFrequency/monthlyEquivalentPrice fields."
      - "Use monthlyEquivalentPrice in all monthly comparison/script text."
    tests:
      - "annual_subscription_script_says_10_per_month_not_120"
      - "opportunity_contains_raw_and_monthly_amounts"

  - id: "E1-CURRENT-011"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "MarketRateProvider exists but SmartBillNegotiationEngine still uses hardcoded static rates"
    evidence:
      - "SmartBillNegotiationEngine constructor injects RecurringExpenseRepository and SubscriptionPriceHistoryDao only."
      - "marketRates is a private map initialized with System.currentTimeMillis()."
      - "No provider/currency/region source is wired into opportunity analysis."
    impact:
      - "Rates are demo data but can be shown as real advice."
      - "Staleness check is weak because every process start refreshes lastUpdated to now."
    fix:
      - "Inject MarketRateProvider."
      - "Persist rate source, currency, region, validFrom/validTo, fetchedAt, confidence."
      - "Label static provider as demo."
    tests:
      - "negotiation_engine_uses_injected_marketRateProvider"
      - "static_demo_rates_surface_demo_warning"
      - "market_rate_staleness_survives_process_restart"

  - id: "E1-CURRENT-012"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Bill negotiation records wrong metadata"
    evidence:
      - "recordNegotiationOutcome() records providerName='Subscription #id'."
      - "serviceType is hardcoded ServiceType.MOBILE."
      - "currentRate is hardcoded 0.0."
    impact:
      - "Even the in-memory history is inaccurate."
    fix:
      - "Load subscription and opportunity metadata before recording outcome."
      - "Persist typed fields."
    tests:
      - "negotiation_outcome_records_real_serviceType_provider_currentRate"

  - id: "E1-CURRENT-013"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Cloud financial-query redaction is not clean"
    evidence:
      - "CloudQueryInterpretationService imports CloudPayloadRedactor."
      - "buildRequestBody() source includes TODO saying to apply CloudPayloadRedactor before building prompt."
      - "Secondary constructors use CompositePrivacyGate(emptyList(), NO_OP), which can fail open in main source."
    impact:
      - "Raw user financial query text can be sent to cloud or tests can accidentally instantiate an allow-all gate."
      - "Provider/model/redaction/payload provenance is not durable."
    fix:
      - "Require PreparedCloudPayload for cloud query prompts."
      - "Wire EffectiveCloudAiPolicyResolver and CloudPayloadRedactor before prompt JSON creation."
      - "Move no-op constructors to test source/internal @VisibleForTesting only."
    tests:
      - "cloud_query_redacts_merchant_person_account_text_before_http"
      - "no_allow_all_privacy_gate_constructor_in_main_source"
      - "cloud_query_audit_records_redaction_payload_hash"

  - id: "E1-CURRENT-014"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "CloudQueryInterpretationService swallows broad exceptions including cancellation"
    evidence:
      - "interpret() catches Exception and returns unsupported parse failure."
      - "No explicit CancellationException rethrow was visible."
    impact:
      - "Coroutine/worker cancellation can be converted into a normal unsupported result."
      - "Restore/backup cancellation semantics can be weakened."
    fix:
      - "Rethrow CancellationException before generic catch handling."
    tests:
      - "cloud_query_cancellation_rethrows"

  - id: "E1-CURRENT-015"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Legacy NLP location filters are parsed but not applied"
    evidence:
      - "NaturalLanguageSearchEngine creates QueryDataQuality(unsupportedLocations = interpretation.locations != null)."
      - "Repository query pushes category/merchant/type/keyword but not location."
    impact:
      - "Query like 'spending in Paris' can return non-Paris results with only a warning."
      - "If UI hides/underplays warning, user receives misleading results."
    fix:
      - "Either implement location filter using expense coordinates/place fields or return Unsupported for location-specific queries."
    tests:
      - "legacy_nl_location_query_returns_unsupported_or_filters_location"
      - "location_unsupported_warning_visible_in_ui"

  - id: "E1-CURRENT-016"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Legacy NLP keyset path still materializes all result pages"
    evidence:
      - "NaturalLanguageExpenseQueryRepositoryImpl.getExpensesBetween() loops keyset pages and returns a List."
      - "NaturalLanguageSearchEngine preFiltered accumulates all pages before amount filtering."
    impact:
      - "Large date ranges can still allocate large memory and block UI/background work."
    fix:
      - "Stream pages through filters or add bounded result + continuation cursor."
    tests:
      - "nl_search_large_range_respects_memory_bound"
      - "nl_search_returns_continuation_cursor"

  - id: "E1-CURRENT-017"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Home-currency fallback to EUR is silent in warranty/subscription aggregates"
    evidence:
      - "WarrantyTrackerRepository.getTotalProtectedValueAggregate() falls back to EUR on homeCurrency failure."
      - "SubscriptionManagerEngine.getTotalMonthlySubscriptionCostAggregate() also falls back to EUR."
    impact:
      - "Settings/DataStore failure can relabel user totals as EUR with no warning."
    fix:
      - "Use HomeCurrencyResolution and propagate warning/partial state."
    tests:
      - "warranty_home_currency_failure_sets_warning"
      - "subscription_home_currency_failure_sets_warning"

  - id: "E1-CURRENT-018"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Location diagnostics are not durable"
    evidence:
      - "LocationResolver logs privacy-denied GPS via Timber."
      - "External geocoding/privacy/cache/correction outcomes are not obviously written to PipelineDiagnosticEvent."
    impact:
      - "Cannot debug why a merchant was not located from DB alone."
    fix:
      - "Add LocationResolutionEvent or PipelineDiagnosticEvent rows for GPS_DENIED, CACHE_HIT, CORRECTION_HIT, GEOCODER_DENIED, GEOCODER_FAILED, RESOLVED."
    tests:
      - "gps_privacy_denied_writes_location_diagnostic"
      - "geocoder_failure_writes_location_diagnostic"

  - id: "E1-CURRENT-019"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Deprecated/raw APIs remain callable"
    evidence:
      - "WarrantyTrackerRepository.getTotalProtectedValue() is deprecated but public."
      - "SubscriptionManagerEngine.getTotalMonthlySubscriptionCost() is deprecated but public."
      - "Legacy NaturalLanguageSearchEngine is deprecated but still active/callable."
    impact:
      - "Future code can reintroduce raw mixed-currency or legacy behavior."
    fix:
      - "DeprecationLevel.ERROR where feasible."
      - "Static guard forbidding raw aggregate APIs in production code."
    tests:
      - "no_production_call_to_raw_warranty_total"
      - "no_production_call_to_raw_subscription_total"

recommended_fix_order:
  - pr: "PR1"
    title: "Restore/write-barrier hardening"
    include:
      - "DatabaseWriteBarrier in all warranty/return/subscription write paths."
      - "Guard reconcileExpiredItems, addWarrantyIgnoreConflicts, upsertReturnWindowForReceipt, recordUsage, recordPriceChange."
    closes:
      - "E1-CURRENT-001"
      - "E1-CURRENT-006"

  - pr: "PR2"
    title: "Warranty lifecycle and privacy cleanup"
    include:
      - "Complete WarrantyLifecycleEvent coverage with enum types."
      - "Return-window lifecycle events."
      - "Manual placeholder stores no raw product in rawOcrText."
      - "Low-confidence warranty review routing."
    closes:
      - "E1-CURRENT-002"
      - "E1-CURRENT-003"
      - "E1-CURRENT-004"

  - pr: "PR3"
    title: "Subscription validation and money quality"
    include:
      - "Finite money + CurrencyCode validation."
      - "acceptCandidate uses same validation."
      - "Potential savings as MoneyAggregate/monthly equivalent."
      - "HomeCurrencyResolution warnings."
    closes:
      - "E1-CURRENT-005"
      - "E1-CURRENT-007"
      - "E1-CURRENT-008"
      - "E1-CURRENT-017"

  - pr: "PR4"
    title: "Bill negotiation persistence and monthly contract"
    include:
      - "NegotiationOutcome entity/DAO."
      - "Successful outcome updates subscription + price history atomically."
      - "Inject MarketRateProvider."
      - "Use monthlyEquivalentPrice in scripts/UI."
      - "Persist typed outcome metadata."
    closes:
      - "E1-CURRENT-009"
      - "E1-CURRENT-010"
      - "E1-CURRENT-011"
      - "E1-CURRENT-012"

  - pr: "PR5"
    title: "Cloud query privacy contract"
    include:
      - "PreparedCloudPayload for financial query prompts."
      - "EffectiveCloudAiPolicyResolver."
      - "Remove allow-all main-source constructors."
      - "Rethrow CancellationException."
      - "Cloud-call audit."
    closes:
      - "E1-CURRENT-013"
      - "E1-CURRENT-014"

  - pr: "PR6"
    title: "Location and NLP diagnostics/UX"
    include:
      - "Location query either applies location filter or returns Unsupported."
      - "Durable location resolution diagnostics."
      - "Stream/bound legacy NL results."
      - "Deprecation/static guards for raw APIs."
    closes:
      - "E1-CURRENT-015"
      - "E1-CURRENT-016"
      - "E1-CURRENT-018"
      - "E1-CURRENT-019"

definition_of_done:
  - "All warranty/return/subscription writes are blocked by DatabaseWriteBarrier during restore/backup/restart-required mode."
  - "Warranty and return-window lifecycle has durable typed events for create/update/link/unlink/expire/claim/return/delete/failure."
  - "Manual warranty placeholder stores no raw product text in rawOcrText and has explicit MANUAL_PLACEHOLDER document type."
  - "Low-confidence warranty extraction creates review/diagnostic instead of silent discard."
  - "Warranty protected-value aggregate separates linked/unlinked counts and declares rate basis."
  - "Subscription creation, candidate acceptance, usage, and price change reject invalid finite money/currency."
  - "Subscription potential savings are monthly-normalized and MoneyAggregate-backed."
  - "Bill negotiation outcomes persist and successful outcomes update subscription amount/price history atomically."
  - "Bill negotiation scripts and UI compare monthly-to-monthly and preserve raw billing-cycle fields separately."
  - "SmartBillNegotiationEngine uses injected MarketRateProvider with currency, region, source, valid date, and stale warnings."
  - "Cloud financial-query interpretation always uses effective privacy policy + redacted PreparedCloudPayload."
  - "No allow-all PrivacyGate constructor exists in main production source."
  - "Legacy NLP location queries are either truly filtered or rejected as unsupported with visible warning."
  - "Large NLP queries are bounded/streamed and do not materialize unbounded pages."
  - "Home-currency resolution failure surfaces warning instead of silent EUR fallback."
  - "Deprecated raw mixed-currency APIs are blocked by static guard or DeprecationLevel.ERROR."

