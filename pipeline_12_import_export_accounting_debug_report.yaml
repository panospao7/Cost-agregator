definition_of_done:
  - "CSV and JSON exports can be imported into a fresh DB through a real app import lifecycle."
  - "Roundtrip tests prove totals, categories, currencies, source, business fields, and receipt links survive."
  - "Export uses a true snapshot: count, validation, and streamed rows share one operationId."
  - "Plaintext export requires explicit policy; encryptExport=true actually returns encrypted file and deletes plaintext."
  - "Expense export has its own privacy capability and redaction modes."
  - "Export manifest lists schema version, privacy mode, timezone, filters, row count, checksum, included fields, and excluded fields."
  - "ReceiptExpenseLink metadata is exported and imported via ReceiptLinkService."
  - "BusinessCategory, BusinessProject, RequiresReceipt, ownership/share, transfer, location, and source-link fields are either exported or explicitly excluded in manifest."
  - "Accounting exporters use a documented original/effective amount policy."
  - "Conversion status/rate basis/rate date/partial warnings are exported."
  - "No non-finite money is silently converted to zero without row-level warning."
  - "QuickBooks IIF uses the same hardened sanitizer policy."
  - "Export/read/privacy barriers are enforced by an ExportCoordinator, not only the ViewModel."
  - "ExportRun ledger records STARTED/SNAPSHOT_CREATED/FILE_WRITTEN/ENCRYPTED/COMPLETED/FAILED/CANCELLED."
  - "Machine JSON is timezone-stable and schema-validated."

