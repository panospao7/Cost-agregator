meta:
  repo: "panospao7/Cost-agregator"
  commit: "4113e38f0d838a29d2d13d82a483ba573280721c"
  pipeline: "8 - Privacy / AI / Redaction"
  review_mode: "static GitHub source/debugging session; no local Gradle/device execution"
  verdict: "IMPROVED_BUT_NOT_CLEAN"
  summary: >
    Pipeline 8 has better infrastructure than the old report: PrivacyGate,
    CompositePrivacyGate, NotApplicable/FailClosed decisions, context sanitizing,
    RawStorageMode, SecureKeyStorage, some write-time redaction, and partial worker
    cancellation now exist. But the pipeline is not clean. The highest-risk gaps
    are: PrivacySettings.redactBeforeCloud is not authoritative in cloud services,
    notification DO_NOT_STORE still stores raw text, bank-statement OCR/debug text
    ignores rawOcrStorageMode, redacted/metadata-only storage can break parsing,
    DataStore corruption still enables notification capture, retention coverage is
    incomplete, and test/no-op privacy gates remain in main-source constructors.

tracker_reconciliation:
  P8-P1-01_privacy_changes_do_not_stop_active_workers:
    tracker_status: "FIXED"
    actual_status: "PARTIAL"
    notes:
      - "PrivacySettingsRepositoryImpl.updateSettings() now calls applyPrivacyChange()."
      - "It cancels ai_daily_briefing, location_backfill, merchant_key_backfill, and several notification-related workers."
      - "It does not stop NotificationCaptureService or cancel in-flight cloud/location calls."
      - "It also cancels data_retention when notification capture is disabled, which can prevent sensitive raw-data purge."

  P8-P1-02_PrivacySettings_and_AiSettings_disagree:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL_INFRA_EXISTS_NOT_WIRED"
    notes:
      - "EffectiveCloudAiPolicyResolver exists."
      - "CloudAiPrivacyGate TODO explicitly says resolver is not wired."
      - "Most cloud providers still use AiSettings.redactBeforeCloud or input.redactBeforeCloud instead of authoritative PrivacySettings."
      - "Privacy redaction can be bypassed when PrivacySettings.redactBeforeCloud=true but AiSettings.redactBeforeCloud=false."

  P8-P1-03_audit_logging_noisy:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL"
    notes:
      - "PrivacyDecision.NotApplicable and FailClosed now exist."
      - "CompositePrivacyGate writes one final audit decision."
      - "But unhandled capabilities default to Allowed/fail-open."
      - "Audit rows still lack mandatory provider/model/redaction/payload/raw-text/raw-image provenance."

  P8-P1-04_audit_context_sensitive_data:
    tracker_status: "TODO_ONLY"
    actual_status: "MOSTLY_FIXED_WITH_CAVEATS"
    notes:
      - "PrivacyAuditLoggerImpl now allowlists context keys and length-limits values."
      - "Unknown context keys are dropped."
      - "But allowed string fields are still caller-supplied and not typed or hashed."

  P8-P1-05_raw_data_stored_first_purged_later:
    tracker_status: "PARTIAL"
    actual_status: "PARTIAL_WITH_P0_GAPS"
    notes:
      - "RawStorageMode exists."
      - "ReceiptRepository applies sanitizeOcrBeforeInsert()."
      - "Notification path mishandles DO_NOT_STORE and sends sanitized DB payload into parser."
      - "BankStatementLifecycleProcessor stores ocrResult.fullText directly."

  P8-P1-06_retention_scope_incomplete:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "DataRetentionWorker TODO still says AI artifacts, chats, diagnostics, and email receipt sources are not covered."
      - "Current worker purges only raw notifications and scanned_receipts.rawOcrText."

  P8-P1-07_bank_statement_cloud_raw_prompt:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL_BUT_STILL_RISKY"
    notes:
      - "CloudReceiptAssistService.suggestFromText() now applies redaction."
      - "But it uses AiSettings.redactBeforeCloud, not authoritative PrivacySettings."
      - "It uses CloudPayloadPurpose.RECEIPT_ASSIST for bank statements; no BANK_STATEMENT purpose exists."

  P8-P1-08_purpose_aware_payload_contract:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "CloudPayloadRedactor exists."
      - "DefaultCloudPayloadRedactor TODO says all purposes use same sanitizer."
      - "No PreparedCloudPayload contract."
      - "Providers still build JSON/prompts manually."

  P8-P1-09_notification_gate_too_late:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL"
    notes:
      - "NotificationCaptureService has fast cached pre-extraction privacy flag."
      - "Default is fail-closed until settings emit."
      - "Service is not stopped when capture is disabled."
      - "Service-level denied/drop diagnostics are still Timber-only."

  P8-P1-10_location_gate_coverage:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL"
    notes:
      - "Reviewed Geoapify, Google Places, and Nominatim: they self-check EXTERNAL_GEOCODING."
      - "No static guard enforces every future/existing provider, Overpass path, GPS path, and worker path."

  P8-P1-11_raw_backup_export:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL"
    notes:
      - "Release raw export appears improved from Pipeline 7."
      - "BackupPrivacyGate still models raw export as allowed when encryptedBackupEnabled=false."
      - "ExportAnonymizer sanitizes only scanned_receipts.rawOcrText and raw_notifications raw fields."

  P8-P1-12_privacy_denied_visibility:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "PrivacyBlocked.kt exists in tree."
      - "Reviewed providers mostly return null, Unsupported, or AiServiceResult.Failure(Disabled)."
      - "No unified privacy-denied UX/debug model is enforced."

positive_findings:
  - "PrivacySettings includes cloud, notification, location, backup, raw-storage, and debug toggles."
  - "RawStorageMode supports STORE_RAW, STORE_REDACTED, STORE_METADATA_ONLY, DO_NOT_STORE."
  - "CompositePrivacyGate now supports NotApplicable and FailClosed and writes a final audit decision."
  - "PrivacyAuditLoggerImpl has an allowlist-based context sanitizer."
  - "EffectiveCloudAiPolicyResolver exists and ORs PrivacySettings/AiSettings redaction."
  - "Cloud providers use SecureKeyStorage instead of BuildConfig API keys."
  - "CloudReceiptAssistService wraps OkHttp responses in use{} and suppresses image upload when redaction is required."
  - "DataRetentionWorker uses WorkerExecutionGuard."
  - "Geoapify/Google/Nominatim geocoding services self-check EXTERNAL_GEOCODING."
  - "ExportAnonymizer removes raw OCR and raw notification content from redacted DB copies."

issues:
  - id: "P8-CURRENT-001"
    severity: "P0_PRIVACY"
    status: "OPEN"
    title: "PrivacySettings.redactBeforeCloud is not authoritative for cloud text prompts"
    evidence:
      - "EffectiveCloudAiPolicyResolver exists but CloudAiPrivacyGate TODO says it is not wired."
      - "CloudReceiptAssistService.suggest()/suggestFromText() use AiSettings.redactBeforeCloud."
      - "CloudDashboardBriefingService, CloudCategorizationAssistService, CloudDedupeJudgeService, and CloudReviewExplanationService derive redaction from AiSettings or default."
      - "CloudWarrantyExtractionService trusts a caller-provided shouldRedactBeforeCloud parameter."
    impact:
      - "If PrivacySettings.redactBeforeCloud=true but AiSettings.redactBeforeCloud=false, raw cloud text can be sent."
      - "Privacy settings are not the source of truth."
    fix:
      - "Inject EffectiveCloudAiPolicyResolver into all cloud services."
      - "Use policy.redactBeforeCloud for all text payloads."
      - "Make PrivacySettings denial/redaction override all AI route settings."
    tests:
      - "privacy_redact_true_ai_redact_false_still_redacts_all_cloud_prompts"
      - "privacy_cloud_disabled_ai_enabled_blocks_all_cloud_services"
      - "cloud_warranty_extraction_uses_effective_policy_not_caller_boolean"

  - id: "P8-CURRENT-002"
    severity: "P0_PRIVACY"
    status: "OPEN"
    title: "RawNotification DO_NOT_STORE falls through to raw storage"
    evidence:
      - "NotificationCaptureService special-cases STORE_METADATA_ONLY and STORE_REDACTED."
      - "All other modes, including DO_NOT_STORE, use the raw-storage branch with title/text/combinedBody/extrasJson."
    impact:
      - "User choosing DO_NOT_STORE can still persist raw notification content."
    fix:
      - "Use exhaustive when(rawNotificationStorageMode)."
      - "For DO_NOT_STORE, process from ephemeral text but persist no raw notification body/extras."
    tests:
      - "raw_notification_do_not_store_persists_no_title_text_bigText_or_extras"
      - "raw_notification_do_not_store_still_allows_ephemeral_processing"

  - id: "P8-CURRENT-003"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Redacted/metadata notification storage is also used as parser input"
    evidence:
      - "NotificationCaptureService builds RawNotification with null or '[REDACTED]' fields before repository.processAndSave()."
      - "NotificationProcessingPipeline parses from RawNotification fields."
    impact:
      - "STORE_REDACTED and STORE_METADATA_ONLY can degrade parsing even though raw text existed in memory."
      - "Privacy storage policy changes functional behavior."
    fix:
      - "Separate EphemeralNotificationPayload from StoredRawNotification."
      - "Parser receives ephemeral combinedBody; DB receives sanitized storage representation."
    tests:
      - "metadata_only_notification_parses_original_text_but_persists_no_raw_text"
      - "redacted_notification_parses_original_text_but_persists_redacted_text"

  - id: "P8-CURRENT-004"
    severity: "P0_PRIVACY"
    status: "OPEN"
    title: "Bank statement path stores raw OCR/debug text ignoring rawOcrStorageMode"
    evidence:
      - "BankStatementLifecycleProcessor creates ScannedReceipt(rawOcrText = ocrResult.fullText)."
      - "DebugData(rawText = ocrResult.fullText) is returned."
      - "Processor does not inject PrivacySettingsRepository or RawContentSanitizer."
    impact:
      - "Sensitive bank-statement OCR can be persisted or exposed even when raw OCR storage is redacted/metadata-only/do-not-store."
    fix:
      - "Sanitize stored rawOcrText according to rawOcrStorageMode."
      - "Use ephemeral raw OCR only for parser/AI validation."
      - "Redact or omit DebugData.rawText unless debugDataPersistenceEnabled and explicit user consent."
    tests:
      - "bank_statement_do_not_store_persists_no_raw_ocr_text"
      - "bank_statement_debug_raw_text_redacted_without_debug_consent"

  - id: "P8-CURRENT-005"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Privacy settings corruption still enables notification capture"
    evidence:
      - "PrivacySettingsRepositoryImpl corruption handler returns emptyPreferences()."
      - "toPrivacySettings() maps missing NOTIFICATION_CAPTURE_ENABLED to true."
      - "KDoc claims fail-closed, but notification capture fails open."
    impact:
      - "If privacy settings are corrupt/unreadable, notification capture can remain enabled."
    fix:
      - "Distinguish first-run defaults from corruption fallback."
      - "On corruption, set notificationCaptureEnabled=false."
    tests:
      - "datastore_corruption_disables_notification_capture"
      - "first_run_default_can_enable_notification_capture_without_marking_corruption"

  - id: "P8-CURRENT-006"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Disabling notification capture cancels data_retention worker"
    evidence:
      - "applyPrivacyChange() cancels data_retention when notificationCaptureEnabled changes true→false."
    impact:
      - "Turning off capture can also stop the worker that purges old sensitive raw data."
      - "This is opposite of privacy intent."
    fix:
      - "Never cancel data_retention because a capture source is disabled."
      - "If raw storage settings become stricter, enqueue retention/purge immediately."
    tests:
      - "disable_notification_capture_does_not_cancel_data_retention"
      - "switch_raw_storage_to_do_not_store_triggers_immediate_purge"

  - id: "P8-CURRENT-007"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Runtime privacy applier is hardcoded and incomplete"
    evidence:
      - "applyPrivacyChange() hardcodes WorkManager unique names."
      - "It does not stop NotificationCaptureService."
      - "It does not cancel in-flight cloud calls or external geocoding calls."
      - "It calls transform(old) after edit instead of using the exact persisted updated settings."
    impact:
      - "Settings changes are not guaranteed to take effect immediately across services."
      - "Worker-name drift can leave sensitive work scheduled."
    fix:
      - "Create PrivacyRuntimePolicyApplier backed by WorkerRegistry/WorkerSpec."
      - "Use exact old/new settings from the edit transaction."
      - "Notify active services and cloud/location routers."
    tests:
      - "disable_cloud_ai_cancels_and_blocks_inflight_cloud_work"
      - "disable_notification_capture_stops_or_blocks_listener_service"
      - "privacy_applier_uses_worker_registry_names"

  - id: "P8-CURRENT-008"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "CompositePrivacyGate fails open for unhandled capabilities"
    evidence:
      - "If no gate returns Allowed/Denied/FailClosed, CompositePrivacyGate logs warning and returns Allowed."
      - "PrivacyCapability includes TIMBER_PII_LOGGING, RAW_NOTIFICATION_RETENTION, RAW_OCR_RETENTION, DEBUG_DATA_PERSISTENCE."
    impact:
      - "Adding a new capability without a concrete gate silently permits it."
      - "TIMBER_PII_LOGGING is effectively unenforced."
    fix:
      - "Require explicit owner for every PrivacyCapability."
      - "Fail closed for unhandled sensitive capabilities or add NonSensitive marker."
    tests:
      - "all_privacy_capabilities_have_gate_owner"
      - "unhandled_sensitive_capability_fails_closed"

  - id: "P8-CURRENT-009"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Cloud privacy audit lacks provider/model/redaction/payload provenance"
    evidence:
      - "PrivacyAuditLoggerImpl records capability, decision, reason, sanitized context, timestamp, caller."
      - "Cloud providers log HTTP correlation IDs but do not write cloud-call audit rows with model/payload/redaction fields."
    impact:
      - "Cannot answer which provider/model was called, whether redaction was applied, whether raw text/image was sent, or which payload hash was used."
    fix:
      - "Add CloudAiCallAudit or extend PrivacyAuditEvent."
      - "Every cloud provider writes ATTEMPTED/BLOCKED/SENT/FAILED with provider, modelId, redactionApplied, rawTextIncluded, rawImageUploaded, payloadHash, correlationId."
    tests:
      - "cloud_receipt_call_audit_has_model_payloadHash_redaction"
      - "cloud_image_suppressed_audit_rawImageUploaded_false"
      - "cloud_http_failure_audit_has_correlationId"

  - id: "P8-CURRENT-010"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Audit context sanitizer is safer but still caller-string based"
    evidence:
      - "Allowed context keys include operation, caller, entityType, entityId, provider, modelId, payloadHash, receiptId."
      - "Values are stored if <=200 chars; unknown keys are dropped."
    impact:
      - "A future caller can still place sensitive text inside an allowed key."
      - "No typed context or value-level classification exists."
    fix:
      - "Replace Map<String,String> with PrivacyAuditContext typed fields."
      - "Validate IDs/hashes by format and hash free-form values."
    tests:
      - "audit_context_rejects_operation_value_that_looks_like_raw_text"
      - "audit_context_requires_payloadHash_format"

  - id: "P8-CURRENT-011"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Data retention coverage remains incomplete"
    evidence:
      - "DataRetentionWorker TODO lists AI artifacts, chat messages, diagnostics, and email receipt sources as missing."
      - "Current worker purges only raw notifications and scanned_receipts.rawOcrText."
    impact:
      - "Sensitive AI prompts/responses, chat text, debug diagnostics, email sender/subject/body, and location data may persist indefinitely."
    fix:
      - "Introduce RetentionTarget registry."
      - "Add retention targets for ai_artifacts, ai_chat_messages, email_receipt_sources, service diagnostics, debug tables, and location PII."
    tests:
      - "retention_purges_ai_artifact_prompts"
      - "retention_purges_email_receipt_sources"
      - "retention_purges_debug_diagnostics_when_disabled"

  - id: "P8-CURRENT-012"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Bank-statement cloud text path uses wrong redaction purpose and wrong policy source"
    evidence:
      - "CloudReceiptAssistService.suggestFromText() checks CLOUD_AI_BANK_STATEMENT."
      - "It redacts with CloudPayloadPurpose.RECEIPT_ASSIST."
      - "It uses AiSettings.redactBeforeCloud, not EffectiveCloudAiPolicy."
    impact:
      - "Bank statement prompts are not governed by a statement-specific policy."
      - "Highly sensitive statement descriptions can be sent raw under settings disagreement."
    fix:
      - "Add CloudPayloadPurpose.BANK_STATEMENT_VALIDATION."
      - "Use EffectiveCloudAiPolicy.redactBeforeCloud."
      - "Emit cloud-call audit metadata."
    tests:
      - "bank_statement_suggestFromText_uses_bank_statement_redaction_purpose"
      - "bank_statement_privacy_redact_true_ai_false_still_redacts"

  - id: "P8-CURRENT-013"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "No PreparedCloudPayload contract; providers manually build prompts"
    evidence:
      - "DefaultCloudPayloadRedactor TODO says all purposes use same sanitizer."
      - "Cloud services call Request.Builder().post(...) after locally building prompt JSON."
      - "No PreparedCloudPayload type is required."
    impact:
      - "Provider redaction behavior is inconsistent and hard to audit."
      - "Amounts, dates, package names, category names, item text, and merchant-like values may be sent without a formal purpose decision."
    fix:
      - "Create CloudPayloadPolicy.prepare(purpose, payload, effectivePolicy): PreparedCloudPayload."
      - "Cloud providers accept only PreparedCloudPayload."
      - "Static guard: no cloud HTTP post without prepared payload."
    tests:
      - "all_cloud_providers_use_prepared_cloud_payload"
      - "redactBeforeCloud_true_never_sends_raw_merchant_field"
      - "receipt_image_upload_requires_prepared_payload_rawImageUploaded_false_when_redacted"

  - id: "P8-CURRENT-014"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "No-op allow-all privacy gates live in main-source cloud service constructors"
    evidence:
      - "CloudReceiptAssistService secondary constructors create object PrivacyGate returning Allowed."
      - "CloudDashboardBriefingService, CloudCategorizationAssistService, CloudDedupeJudgeService, CloudReviewExplanationService, CloudReceiptItemCategorizationService, and CloudWarrantyExtractionService have similar test constructors or CompositePrivacyGate(emptyList)."
    impact:
      - "A production caller could accidentally instantiate a cloud service with an allow-all or empty/fail-open privacy gate."
    fix:
      - "Move test constructors/fakes to test source set."
      - "Mark as @VisibleForTesting internal where possible."
      - "Static guard: no object : PrivacyGate returning Allowed in main source."
    tests:
      - "no_allow_all_privacy_gate_in_main_source"
      - "cloud_services_require_injected_privacy_gate_in_production"

  - id: "P8-CURRENT-015"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Privacy-denied outcomes are not unified for UX/debugging"
    evidence:
      - "Cloud services return null, Unsupported, or AiServiceResult.Failure(Disabled)."
      - "Notification denied paths are mostly Timber logs."
      - "PrivacyBlocked.kt exists but reviewed providers do not consistently return it."
    impact:
      - "Users see generic feature failure instead of specific privacy-disabled state."
    fix:
      - "Use shared PrivacyBlocked/PrivacyDeniedResult across privacy-sensitive pipelines."
      - "Expose recent privacy denials in diagnostics UI."
    tests:
      - "cloud_ai_denied_returns_privacy_blocked_state"
      - "notification_capture_denied_visible_in_diagnostics"
      - "geocoding_denied_returns_privacy_disabled_state"

  - id: "P8-CURRENT-016"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Location privacy coverage is improved but not mechanically enforced"
    evidence:
      - "Geoapify, Google Places, and Nominatim reviewed paths check EXTERNAL_GEOCODING."
      - "LocationPrivacyGate TODO says coverage is not statically guaranteed."
    impact:
      - "Future provider or alternate call path can make external location/network call without privacy gate."
    fix:
      - "Wrap all GeocodingService/NearbyService implementations behind PrivacyAwareGeocodingService."
      - "Static guard: provider classes must inject PrivacyGate or accept an AllowedLocationToken."
    tests:
      - "all_geocoding_services_are_privacy_aware"
      - "external_geocoding_disabled_blocks_geoapify_google_nominatim_photon"
      - "overpass_disabled_when_external_geocoding_disabled"

  - id: "P8-CURRENT-017"
    severity: "P1_PRIVACY"
    status: "OPEN"
    title: "Redacted backup/export sanitization covers only two raw-content tables"
    evidence:
      - "ExportAnonymizer strips scanned_receipts.rawOcrText and raw_notifications raw fields."
      - "ExportAnonymizer TODO lists ai_artifacts, ai_chat_messages, merchant_locations, and email_receipt_sources as not covered."
      - "BackupPrivacyGate still allows RAWBACKUP_EXPORT when encryptedBackupEnabled=false."
    impact:
      - "A redacted backup/export can still contain AI/chat/email/location PII."
      - "Raw export policy is still represented as a runtime privacy toggle, not release/debug-only hard policy."
    fix:
      - "Add versioned column-level redaction policy for every PII-bearing table."
      - "Make raw plaintext export debug-only or require explicit one-time consent plus BuildConfig.DEBUG."
    tests:
      - "redacted_export_sanitizes_ai_chat_email_location_tables"
      - "raw_export_rejected_in_release_even_if_encryptedBackupEnabled_false"

  - id: "P8-CURRENT-018"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "OCR raw-storage policy can corrupt downstream processing semantics"
    evidence:
      - "ReceiptRepository stores rawOcrText = sanitizeOcrBeforeInsert(ocrResult.fullText)."
      - "The persisted receipt now contains '[REDACTED]' or empty text depending on rawOcrStorageMode."
    impact:
      - "Any later dedupe, warranty, debug, matching, or review path reading ScannedReceipt.rawOcrText gets sanitized text instead of a structured ephemeral processing payload."
      - "Storage preference can change app behavior."
    fix:
      - "Introduce ProcessedReceiptDraft(ephemeralRawOcrText, storedRawOcrText)."
      - "Run parser/dedupe/side effects from ephemeral text; persist only sanitized text."
    tests:
      - "raw_ocr_metadata_only_does_not_break_local_warranty_or_dedupe"
      - "stored_raw_ocr_policy_does_not_change_receipt_processing_outcome"

recommended_fix_order:
  - pr: "PR1"
    title: "Make PrivacySettings authoritative for cloud policy"
    include:
      - "Wire EffectiveCloudAiPolicyResolver into CloudAiPrivacyGate and all cloud providers."
      - "Use policy.redactBeforeCloud everywhere."
      - "Remove caller-provided redaction booleans for cloud services."
    closes:
      - "P8-CURRENT-001"
      - "P8-CURRENT-007"
      - "P8-CURRENT-012"

  - pr: "PR2"
    title: "Fix write-time raw storage privacy"
    include:
      - "Exhaustive RawStorageMode handling for notifications."
      - "DO_NOT_STORE persists no raw text/extras."
      - "Separate ephemeral processing payload from stored sanitized entities."
    closes:
      - "P8-CURRENT-002"
      - "P8-CURRENT-003"
      - "P8-CURRENT-004"
      - "P8-CURRENT-018"

  - pr: "PR3"
    title: "Fail-closed privacy settings and runtime application"
    include:
      - "DataStore corruption disables notification capture."
      - "Do not cancel retention on capture disable."
      - "PrivacyRuntimePolicyApplier using WorkerRegistry and active service hooks."
    closes:
      - "P8-CURRENT-005"
      - "P8-CURRENT-006"

  - pr: "PR4"
    title: "Cloud payload contract and provenance"
    include:
      - "PreparedCloudPayload."
      - "Purpose-specific redaction policy, including BANK_STATEMENT_VALIDATION."
      - "CloudAiCallAudit provider/model/payloadHash/rawText/rawImage/redaction/correlationId."
    closes:
      - "P8-CURRENT-009"
      - "P8-CURRENT-013"

  - pr: "PR5"
    title: "Audit and denial model cleanup"
    include:
      - "Fail closed or explicitly classify unhandled capabilities."
      - "Typed PrivacyAuditContext."
      - "Unified PrivacyBlocked UX/debug result."
    closes:
      - "P8-CURRENT-008"
      - "P8-CURRENT-010"
      - "P8-CURRENT-015"

  - pr: "PR6"
    title: "Retention and backup/export privacy coverage"
    include:
      - "RetentionTarget registry for AI/chat/email/debug/location."
      - "ExportAnonymizer versioned redaction policy for all PII tables."
      - "Raw export debug-only/release-blocked."
    closes:
      - "P8-CURRENT-011"
      - "P8-CURRENT-017"

  - pr: "PR7"
    title: "Static guardrails"
    include:
      - "Remove no-op privacy gates from main source."
      - "Static guard for cloud HTTP without PreparedCloudPayload."
      - "Static guard for geocoding providers without PrivacyGate."
      - "Static guard for direct Timber PII logging in sensitive packages."
    closes:
      - "P8-CURRENT-014"
      - "P8-CURRENT-016"

definition_of_done:
  - "PrivacySettings is the authoritative privacy source; AiSettings can never weaken it."
  - "PrivacySettings.redactBeforeCloud=true guarantees every cloud text prompt is redacted."
  - "Every cloud provider uses EffectiveCloudAiPolicy and PreparedCloudPayload."
  - "Bank statement cloud validation has its own purpose-specific redaction."
  - "No raw notification text/extras are persisted in DO_NOT_STORE."
  - "Redacted/metadata-only storage does not break parsing because processing uses ephemeral payloads."
  - "Bank statement OCR/debug text respects rawOcrStorageMode and debugDataPersistenceEnabled."
  - "DataStore corruption disables notification capture, cloud AI, location, and debug persistence."
  - "Disabling a privacy source does not cancel retention; stricter storage modes trigger purge."
  - "CompositePrivacyGate has explicit owners for every capability and does not fail open for sensitive capabilities."
  - "Audit events include provider/model/redaction/payload/raw-text/raw-image provenance."
  - "Audit context is typed and cannot store raw body/prompt/OCR text."
  - "Retention covers notifications, OCR, email, AI artifacts, AI chats, diagnostics, and location PII."
  - "Redacted backup/export sanitizes all PII-bearing tables or explicitly excludes them by manifest policy."
  - "No no-op allow-all PrivacyGate exists in main production source."
  - "Privacy-denied outcomes are visible in UI/debug diagnostics."

