            Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                Text(formatDateTime(tx.transactionDateTime), style = MaterialTheme.typography.bodySmall)
                Text("Confidence: ${(tx.confidence * 100).toInt()}%", style = MaterialTheme.typography.labelSmall)
            }
            if (tx.parsingNotes.isNotEmpty()) {
