    """.trimIndent()
    
    val result = GreekNationalBankParser().parseHeader(text)
    
    assertEquals("81300913597", result.accountNumber)
    assertEquals("GR2201108130000081300913597", result.iban)
    assertEquals(1602.57, result.balance, 0.01)
}

@Test
fun `parse European number format`() {
    val parser = GreekNationalBankParser()
    
    assertEquals(1602.57, parser.parseAmount("1.602,57"), 0.01)
    assertEquals(4.00, parser.parseAmount("-4,00"), 0.01)
    assertEquals(1000000.00, parser.parseAmount("1.000.000,00"), 0.01)
}

@Test
fun `parse transaction line`() {
    val line = "12/02/202615:22:23 11/02/2026 705 040 MASOUTIS Χ -4,00 1.602,57"
    
    val result = GreekNationalBankParser().parseTransactionLine(line)
    
    assertNotNull(result)
    assertEquals("MASOUTIS", result!!.merchant)
    assertEquals(-4.00, result.amount, 0.01)
    assertEquals(TransactionType.PURCHASE, result.transactionType)
}
