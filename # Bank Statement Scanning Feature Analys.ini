## 6. Debug Output Feature Design

### 6.1 Debug Screen Architecture

**New Screen: DebugViewerScreen**

```kotlin
@Composable
fun DebugViewerScreen(
    rawText: String,
    parsedResult: BankStatementParseResult?,
    onClose: () -> Unit
) {
    var selectedTab by remember { mutableStateOf(0) }
    
    Column {
        TabRow(selectedTab) {
            Tab(selected = selectedTab == 0, onClick = { selectedTab = 0 }) {
                Text("Raw Text")
            }
            Tab(selected = selectedTab == 1, onClick = { selectedTab = 1 }) {
                Text("Parsed Data")
            }
            Tab(selected = selectedTab == 2, onClick = { selectedTab = 2 }) {
                Text("Parsing Log")
            }
        }
        
        when (selectedTab) {
            0 -> RawTextTab(rawText)
            1 -> ParsedDataTab(parsedResult)
            2 -> ParsingLogTab(parsedResult?.parsingErrors)
        }
    }
}
```

