## 5. Proposed Enhancements

### 5.1 PDF Processing Pipeline

**New Component: BankStatementProcessor**

```kotlin
class BankStatementProcessor @Inject constructor(
    private val pdfTextExtractor: PdfTextExtractor,
    private val bankStatementParser: BankStatementParser,
    private val transactionBatchInserter: TransactionBatchInserter
) {
    sealed class ProcessingState {
        object Idle : ProcessingState()
        data class ExtractingText(val progress: Float) : ProcessingState()
        data class ParsingTransactions(val current: Int, val total: Int) : ProcessingState()
        data class Reviewing(val transactions: List<ParsedTransaction>) : ProcessingState()
        data class Complete(val imported: Int, val skipped: Int) : ProcessingState()
        data class Error(val message: String) : ProcessingState()
    }
    
    fun processPdf(uri: Uri): Flow<ProcessingState>
}
```

### 5.2 Enhanced Bank Statement Parser

**New Parser: GreekNationalBankParser**

```kotlin
class GreekNationalBankParser : BankStatementParser {
    
    companion object {
        // Header patterns
        val ACCOUNT_HEADER = Regex("""Κίνηση Λογαριασμού (\d+) από (\d+/\d+/\d+) έως (\d+/\d+/\d+)""")
        val IBAN_PATTERN = Regex("""ΙΒΑΝΛογαριασμού:\s*([A-Z]{2}\d+)""")
        val BALANCE_PATTERN = Regex("""ΛογιστικόΥπόλοιπο:\s*([\d.,]+)€""")
        
        // Transaction patterns
        val TRANSACTION_LINE = Regex(
            """(\d{2}/\d{2}/\d{4})(\d{2}:\d{2}:\d{2})\s+""" +
            """(\d{2}/\d{2}/\d{4})\s+""" +
            """(\d{3}\s+\d{3})\s+""" +
            """(.+?)\s+""" +
            """([ΧΠ])\s+""" +
            """(-?[\d.,]+)\s+""" +
            """([\d.,]+)"""
        )
    }
    
    override fun parse(text: String): BankStatementParseResult {
        val header = parseHeader(text)
        val transactions = parseTransactions(text)
        return BankStatementParseResult(header, transactions)
    }
    
    private fun parseAmount(amountStr: String): Double {
        // Convert Greek/European format: 1.602,57 -> 1602.57
        return amountStr
            .replace(".", "")
            .replace(",", ".")
            .toDoubleOrNull() ?: 0.0
    }
}
```

### 5.3 PDF Text Extraction (Android)

**Option 1: Apache PDFBox Android**
```kotlin
class PdfBoxTextExtractor @Inject constructor() : PdfTextExtractor {
    override suspend fun extractText(uri: Uri): String = withContext(Dispatchers.IO) {
        val inputStream = context.contentResolver.openInputStream(uri)
        val document = PDDocument.load(inputStream)
        val stripper = PDFTextStripper()
        stripper.text = document.text
        document.close()
        stripper.text
    }
}
```

**Option 2: iText 7 (AGPL)**
```kotlin
class ITextPdfExtractor @Inject constructor() : PdfTextExtractor {
    override suspend fun extractText(uri: Uri): String = withContext(Dispatchers.IO) {
        val reader = PdfReader(context.contentResolver.openInputStream(uri))
        val strategy = SimpleTextExtractionStrategy()
        val text = StringBuilder()
        for (i in 1..reader.numberOfPages) {
            text.append(PdfTextExtractor.getTextFromPage(reader, i, strategy))
        }
        reader.close()
        text.toString()
    }
}
```

