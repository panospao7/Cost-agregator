## 4. Gap Analysis & Identified Issues

### 4.1 Current Limitations

| Issue | Impact | Priority |
|-------|--------|----------|
| No PDF text extraction | Cannot process PDF statements directly | HIGH |
| No Greek bank statement format support | Fails on analyzed statement type | HIGH |
| No debug output for OCR/parser | Difficult to troubleshoot parsing failures | MEDIUM |
| Single-transaction focus | Cannot batch import multiple transactions | HIGH |
| No column-aware PDF parsing | Misaligned field extraction | HIGH |

### 4.2 Missing Features for Bank Statements

1. **PDF Parsing Capability**
   - Currently only handles images via ML Kit
   - Need PDF text extraction (pdfplumber/iText equivalent for Android)
   - Options: Apache PDFBox Android, iText 7, or custom extraction

2. **Multi-Transaction Extraction**
   - Receipt parser expects single transaction
   - Bank statements contain 50-500+ transactions
   - Need batch processing with progress indication

3. **European Number Format Handling**
   - Current parser likely expects US format (1,602.57)
   - Greek format uses (1.602,57)
   - Need locale-aware number parsing

4. **Greek Language Support**
   - Merchant names contain Greek characters (Σκλαβενίτης, Μασούτης)
   - Category keywords need Greek mappings
   - Date formats use Greek abbreviations

### 4.3 Debug Output Gaps

**Current State:**
- `rawOcrText` is stored in database but not exposed to user
- No UI to view parsing intermediate results
- No confidence score display
- No step-by-step parsing breakdown

