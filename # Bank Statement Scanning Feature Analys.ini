## 2. Bank Statement PDF Format Analysis

### 2.1 Analyzed Document: Greek National Bank Statement

The uploaded bank statement (`statementpdfexport13-02-2026.pdf`) reveals a structured format:

**Header Information:**
```
Κίνηση Λογαριασμού 81300913597 από 1/1/2025 έως 13/2/2026
ΕίδοςΛογαριασμού: ΑΠΛΟΤΑΜΙΕΥΤΗΡΙΟΦΥΣΙΚΩΝΠΡΟΣΩΠΩΝ
ΛογιστικόΥπόλοιπο: 1.602,57€
ΙΒΑΝΛογαριασμού: GR2201108130000081300913597
Δικαιούχος: ΧΑΡΑΛΑΜΠΙΔΗΣΠΑΝΑΓΙΩΤΗΣΚΥΡΙΑΚΟΣ
ΔιαθέσιμοΥπόλοιπο: 1.582,38€
```

**Transaction Table Columns:**
| Column (Greek) | English Translation | Example Value |
|----------------|---------------------|---------------|
| Ημερομηνία/Ώρα | Date/Time | 12/02/202615:22:23 |
| Valeur | Value Date | 11/02/2026 |
| Κατάστημα | Branch Code | 705 040 |
| Συν | With/Type | Χ (Debit) or Π (Credit) |
| Περιγραφή | Description/Merchant | MASOUTIS |
| Ποσό | Amount | -4,00 |
| ΛογιστικόΥπόλοιπο | Balance | 1.602,57 |

### 2.2 Key Parsing Challenges

1. **Greek Text Encoding**: All labels and merchant names are in Greek
2. **No Column Separators**: Text is extracted without clear column boundaries
3. **Concatenated Date/Time**: `12/02/202615:22:23` needs splitting
4. **European Number Format**: `1.602,57` uses comma as decimal, period as thousands
5. **Transaction Type Indicators**: `Χ` for debit, `Π` for credit
6. **Multi-page Documents**: Statement spans 21 pages with header/footer on each

### 2.3 Sample Transaction Pattern

```
12/02/202615:22:23 11/02/2026 705 040 MASOUTIS Χ -4,00 1.602,57
```

**Regex Pattern Needed:**
```kotlin
val transactionPattern = Regex(
    """(\d{2}/\d{2}/\d{4}\d{2}:\d{2}:\d{2})\s+""" +  // DateTime
    """(\d{2}/\d{2}/\d{4})\s+""" +                   // Valeur Date
    """(\d{3}\s+\d{3})\s+""" +                       // Branch Code
    """(.+?)\s+""" +                                  // Merchant (greedy)
    """([ΧΠ])\s+""" +                                // Type indicator
    """(-?[\d.,]+)\s+""" +                          // Amount
    """([\d.,]+)"""                                  // Balance
)
```

