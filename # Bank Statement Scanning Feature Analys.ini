## 1. Current Implementation Overview

### 1.1 Architecture Layers

The Expense Tracker application follows a clean architecture pattern with distinct layers:

| Layer | Purpose | Key Components |
|-------|---------|----------------|
| **Presentation Layer** | UI & ViewModels | MainActivity, ReceiptScanScreen, ReceiptScanViewModel, AddExpenseSheet |
| **Domain Layer** | Business Logic | Parsers (Revolut, GreekBank, GoogleWallet), CategorizationEngine, ConfidenceRouter |
| **Data Layer** | Persistence | Room Database, DAOs, Entities (Expense, ScannedReceipt, PendingReview) |
| **Infrastructure** | DI & Services | Hilt Modules, NotificationCaptureService, ReceiptOcrService |

### 1.2 Existing Scanning Components

The current receipt/document scanning implementation includes:

**ReceiptScanScreen.kt** - UI for camera-based receipt capture:
- Camera permission handling
- Image capture via CameraX or similar
- Gallery image selection option
- Preview of captured image

**ReceiptOcrService.kt** - OCR processing service:
- Uses ML Kit Text Recognition (`com.google.mlkit:text-recognition:16.0.1`)
- Extracts text from receipt images
- Returns raw OCR text for parsing

**ReceiptParser.kt** - Receipt text parser:
- Parses OCR output to extract:
  - Total amount
  - Merchant name
  - Transaction date
  - Line items (optional)
  - Tax amounts

**BankStatementParser.kt** - Bank statement specific parser:
- Handles structured bank statement formats
- Extracts multiple transactions from single document
- Currently supports limited bank formats

