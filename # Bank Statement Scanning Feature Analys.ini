### 6.5 Integration with Existing Receipt Scan Flow

**Modified ReceiptScanViewModel:**

```kotlin
@HiltViewModel
class ReceiptScanViewModel @Inject constructor(
    private val receiptOcrService: ReceiptOcrService,
    private val bankStatementProcessor: BankStatementProcessor,
    private val scannedReceiptDao: ScannedReceiptDao
) : ViewModel() {
    
    private val _uiState = MutableStateFlow<ScanState>(ScanState.Idle)
    val uiState: StateFlow<ScanState> = _uiState.asStateFlow()
    
    // NEW: Store debug data
    private val _debugData = MutableStateFlow<DebugData?>(null)
    val debugData: StateFlow<DebugData?> = _debugData.asStateFlow()
    
    sealed class ScanState {
        object Idle : ScanState()
        object Loading : ScanState()
        data class Processing(val stage: String, val progress: Float) : ScanState()
        data class MultipleTransactionsFound(val count: Int) : ScanState()
        data class SingleResult(val result: ParsedTransaction) : ScanState()
        data class Error(val message: String) : ScanState()
    }
    
    data class DebugData(
        val rawText: String,
        val parseResult: Any?,
        val processingTime: Long,
        val parserUsed: String
    )
    
    fun processDocument(uri: Uri, isPdf: Boolean) {
        viewModelScope.launch {
            _uiState.value = ScanState.Processing("Extracting text...", 0f)
            
            val startTime = System.currentTimeMillis()
            
            try {
                val rawText = if (isPdf) {
                    bankStatementProcessor.extractPdfText(uri)
                } else {
                    receiptOcrService.recognizeText(uri).text
                }
                
                _uiState.value = ScanState.Processing("Parsing...", 0.5f)
                
                val result = bankStatementProcessor.processPdf(uri)
                    .first { it is ProcessingState.Complete || it is ProcessingState.Reviewing }
                
                val processingTime = System.currentTimeMillis() - startTime
                
                // Store debug data
                _debugData.value = DebugData(
                    rawText = rawText,
                    parseResult = result,
                    processingTime = processingTime,
                    parserUsed = "GreekNationalBankParser"
                )
                
                when (result) {
                    is ProcessingState.Reviewing -> {
                        _uiState.value = ScanState.MultipleTransactionsFound(result.transactions.size)
                    }
                    // ... other states
                }
            } catch (e: Exception) {
                _uiState.value = ScanState.Error(e.message ?: "Unknown error")
            }
        }
    }
    
    // NEW: Expose raw debug data
    fun getDebugInfo(): DebugData? = _debugData.value
}
```

