definition_of_done:
  - "Email service compiles with no EmailReceiptData name collision."
  - "Raw email body/sender/subject/messageId/parsedItems obey emailReceiptStorageMode."
  - "Expense.notes never stores raw email subject."
  - "Message-ID dedupe works in raw, redacted, metadata-only, and do-not-store modes."
  - "Content dedupe includes provider/orderNumber/currency/date/amount and avoids false positives."
  - "Every EmailReceiptSource insert conflict becomes Duplicate or rollback/error."
  - "Email text/semantic fingerprints are persisted."
  - "DuplicateSkipped links existing expense and dispatches side effects exactly once."
  - "Validation/insert-conflict/low-confidence cases create PendingReview or structured non-success result."
  - "Coordinator uses DatabaseWriteBarrier and does not write DB diagnostics while restore writes are blocked."
  - "CancellationException is rethrown."
  - "Parser registry is DI-driven and records parser provenance."
  - "Email currency parsing uses shared money/currency primitives."
  - "Durable diagnostics exist from EMAIL_RECEIVED through PARSE/DEDUPE/REVIEW/EXPENSE/LINK/FAILED."
  - "Batch/mailbox import has sync run, per-message status, cursor/checkpoint, summary, and resume."
  - "No raw sender/subject/body appears in logs, redacted backups, or retention-exempt tables."

