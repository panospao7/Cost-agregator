meta:
  repo: "panospao7/Cost-agregator"
  commit: "4113e38f0d838a29d2d13d82a483ba573280721c"
  pipeline: "11 - Email Receipt Ingestion"
  review_mode: "static GitHub source/debugging session; no local Gradle/device execution"
  verdict: "IMPROVED_BUT_NOT_CLEAN"
  summary: >
    Pipeline 11 is much improved versus the older report. The service now mostly
    acts as detector/parser and delegates mutation to ReceiptLifecycleCoordinator.
    The coordinator creates the receipt, EmailReceiptSource, ReceiptEvent, expense,
    receipt-expense link, and dispatches side effects. It also has write-barrier
    checks, content-only fingerprinting, privacy sanitization attempts, diagnostic
    events, and DuplicateSkipped handling. However, it is not clean. Serious
    remaining risks include a likely EmailReceiptData name collision/compile risk,
    raw subject leakage into Expense.notes, wrong privacy mode usage for email
    body/sender/subject, broken message-ID dedupe under sanitized storage,
    source insert conflicts still partly ignored, transaction side effects likely
    double-dispatched, low-confidence receipts still auto-create expenses, and no
    mailbox/sync ledger.

tracker_reconciliation:
  P11-P1-01_fingerprint_includes_message_id:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL_FIXED_WITH_FALSE_POSITIVE_RISK"
    notes:
      - "EmailReceiptIngestionService.createFingerprint() no longer includes messageId."
      - "But fingerprint is only merchant + amount + 5-minute date bucket."
      - "currency, provider, orderNumber, sender, and parser provenance are ignored."
      - "Same merchant+amount+date can collapse distinct orders."

  P11-P1-02_existing_expense_duplicate_failure:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL_FIXED"
    notes:
      - "ReceiptLifecycleCoordinator.processEmailReceipt() now handles CreateExpenseResult.DuplicateSkipped by linking to existingExpenseId."
      - "But ValidationFailed, InsertConflict, and Error are effectively logged/ignored and final result can still be Success with empty expenseIds."
      - "No PendingReview route exists for these cases."

  P11-P1-03_two_competing_lifecycle_paths:
    tracker_status: "TODO_ONLY"
    actual_status: "MOSTLY_FIXED_WITH_BUGS"
    notes:
      - "Service delegates to ReceiptLifecycleCoordinator.processEmailReceipt()."
      - "Coordinator now owns receipt/source/event/expense/link flow."
      - "But service still has unused legacy dependencies and dispatches transaction post-creation side effects again after coordinator already did."

  P11-P1-04_raw_email_privacy:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL_WITH_P0_LEAKS"
    notes:
      - "Coordinator now sanitizes rawOcrText and EmailReceiptSource fields."
      - "But email body/sender/subject use rawOcrStorageMode, not emailReceiptStorageMode."
      - "Expense.notes stores raw subject."
      - "parsedItems can preserve raw purchased item names independent of email raw storage policy."

  P11-P1-05_restore_write_barrier:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL"
    notes:
      - "Service calls DatabaseWriteBarrier at entry."
      - "Coordinator processEmailReceipt checks RestoreMaintenanceMode directly instead of DatabaseWriteBarrier."
      - "Coordinator tries to emit a DB diagnostic when writes are blocked by restore, which itself violates the write-block intent."

  P11-P1-06_email_source_insert_conflicts_ignored:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL"
    notes:
      - "Coordinator checks insertOrIgnore return."
      - "If conflict and matching fingerprint exists, it deletes the newly inserted receipt and returns Duplicate."
      - "If conflict is from emailMessageId but fingerprint differs/missing, it continues with no EmailReceiptSource row."

  P11-P1-07_receipt_side_effects_skipped:
    tracker_status: "TODO_ONLY"
    actual_status: "FIXED_BUT_DOUBLE_TRANSACTION_SIDE_EFFECT_BUG"
    notes:
      - "Coordinator dispatches sideEffectDispatcher.dispatchAfterSave(saved)."
      - "Coordinator also dispatches transaction post-creation side effects."
      - "Service dispatches transaction post-creation side effects again for same expenseIds."

  P11-P1-08_no_pending_review_route:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "ParsedEmailReceipt.confidence is ignored for routing."
      - "EmailReceiptSource.confidence is hardcoded to 1.0."
      - "ScannedReceipt.confidence is hardcoded to 0.7f."
      - "ValidationFailed does not create PendingReview."

  P11-P2-09_parser_registry_hardcoded:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "Service directly constructs AmazonReceiptParser, UberReceiptParser, AppleReceiptParser."
      - "No Hilt multibinding parser registry."

  P11-P2-10_currency_amount_support_narrow:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL"
    notes:
      - "Amount parsing was improved with localized AmountUtils."
      - "Base parser still visibly centers EUR/USD/GBP symbols/codes."
      - "Provider defaults still silently choose EUR/USD/GBP in ambiguous cases."

  P11-P2-11_durable_parse_diagnostics:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL"
    notes:
      - "Coordinator writes PipelineDiagnosticEvent for some duplicate/error cases."
      - "No EMAIL_RECEIVED, PROVIDER_DETECTED, PARSE_FAILED before receipt creation, REVIEW_CREATED, EXPENSE_SKIPPED, or LINK_FAILED durable ledger."
      - "Service parse failure is still in-memory ParseError + Timber."

  P11-P2-12_mailbox_sync_ledger:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "No EmailAccountConnection, EmailSyncRun, EmailMessageImport, folder/cursor/page-token model."

  P11-P2-13_batch_progress_backpressure:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "processBatch() is still emails.map { processEmailReceipt(...) }."
      - "No summary, checkpoint, cancellation policy, progress, durable failed-message list, or retry semantics."

positive_findings:
  - "Service now checks DatabaseWriteBarrier before processing."
  - "Service no longer manually inserts receipts/sources/expenses in the main path."
  - "Service fingerprint no longer includes messageId."
  - "ReceiptLifecycleCoordinator.processEmailReceipt() exists and owns most mutation."
  - "Email receipt save/source/event/expense/link are inside database.withTransaction."
  - "CreateExpenseResult.DuplicateSkipped is now linked to the email receipt."
  - "Link failure throws, so the outer transaction should roll back receipt/source/expense work."
  - "RawContentSanitizer is used for some email fields."
  - "PipelineDiagnosticEvent is used for some duplicate/error outcomes."
  - "Receipt-side effects are dispatched after save."

issues:
  - id: "P11-CURRENT-001"
    severity: "P0_BUILD_OR_COMPILE_RISK"
    status: "NEEDS_VERIFICATION"
    title: "EmailReceiptData name collision in EmailReceiptIngestionService"
    evidence:
      - "File imports com.yourname.expensetracker.domain.receipt.EmailReceiptData."
      - "Same file also declares data class EmailReceiptData at the bottom in data.email package."
      - "processEmailReceipt() constructs EmailReceiptData with fields messageId/from/body/amount/merchant/currency/date/items, which match the domain model, not the local batch model."
    impact:
      - "Kotlin name resolution may bind to the local data.email.EmailReceiptData or produce an ambiguous/conflicting import."
      - "If so, current source is compile-broken or fragile."
    fix:
      - "Rename bottom batch DTO to EmailBatchReceiptInput."
      - "Use fully-qualified domain EmailReceiptData in coordinator call or alias import as LifecycleEmailReceiptData."
    tests:
      - "gradle_compileDebugKotlin_passes"
      - "static_grep_no_duplicate_EmailReceiptData_declaration_in_service_file"

  - id: "P11-CURRENT-002"
    severity: "P0_PRIVACY"
    status: "OPEN"
    title: "Raw email subject is persisted into Expense.notes"
    evidence:
      - "ReceiptLifecycleCoordinator.processEmailReceipt() creates CreateExpenseRequest notes = \"Imported from email: $subject\"."
      - "This bypasses sanitizedSubject and emailReceiptStorageMode."
    impact:
      - "Private order names, addresses, account hints, delivery info, or merchant-specific PII can be copied into normal expense rows."
      - "Even if EmailReceiptSource is redacted, the subject leaks elsewhere."
    fix:
      - "Use sanitized/generic note like 'Imported from email receipt'."
      - "Store source subject only in privacy-governed EmailReceiptSource metadata."
    tests:
      - "email_receipt_redacted_subject_not_persisted_in_expense_notes"
      - "email_receipt_do_not_store_subject_not_persisted_in_expense_notes"

  - id: "P11-CURRENT-003"
    severity: "P0_PRIVACY"
    status: "OPEN"
    title: "Email body/sender/subject use rawOcrStorageMode instead of emailReceiptStorageMode"
    evidence:
      - "Coordinator reads settings.rawOcrStorageMode and settings.emailReceiptStorageMode."
      - "rawEmailBody is sanitized with sanitizeRawOcr(rawEmailBody, rawOcrStorageMode)."
      - "emailSender/emailSubject are sanitized with ocrStorageMode."
      - "emailReceiptStorageMode is only used for messageId."
    impact:
      - "If user disables raw email retention but allows OCR retention, raw email body/sender/subject may still be stored."
      - "Email privacy setting is not authoritative."
    fix:
      - "Apply emailReceiptStorageMode to email body, sender, subject, and messageId."
      - "Use rawOcrStorageMode only for camera/gallery OCR text."
    tests:
      - "email_storage_metadata_only_stores_no_raw_body_even_when_rawOcr_store_raw"
      - "email_storage_redacted_redacts_sender_subject_body"
      - "email_storage_do_not_store_persists_no_raw_email_fields"

  - id: "P11-CURRENT-004"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Message-ID dedupe is broken under sanitized email storage"
    evidence:
      - "Precheck uses scannedReceiptDao.getBySourceFingerprint(messageId) with raw messageId."
      - "Saved ScannedReceipt.sourceFingerprint uses sanitizeEmailMessageId(messageId, emailStorageMode)."
      - "EmailReceiptSource.emailMessageId also stores sanitized messageId."
    impact:
      - "In REDACTED/METADATA_ONLY/DO_NOT_STORE modes, raw lookup may never find the stored value."
      - "Same message can be reprocessed."
      - "If redaction returns a constant value, unique emailMessageId can also conflict across unrelated emails."
    fix:
      - "Create stable messageIdFingerprint = HMAC/hash(messageId) for dedupe."
      - "Store display value separately from dedupe fingerprint."
      - "Query using the exact same canonicalization/sanitization function."
    tests:
      - "same_message_id_duplicate_detected_in_redacted_mode"
      - "same_message_id_duplicate_detected_in_metadata_only_mode"
      - "redacted_message_id_not_constant_unique_conflict_for_all_emails"

  - id: "P11-CURRENT-005"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "EmailReceiptSource insert conflict still can leave receipt without source"
    evidence:
      - "insertOrIgnore(emailSource) result is checked only for -1."
      - "On -1, code resolves only by emailReceiptDao.getByFingerprint(fingerprint)."
      - "If conflict is caused by emailMessageId and fingerprint differs, existing remains null and flow continues."
    impact:
      - "ScannedReceipt and Expense can be created without EmailReceiptSource."
      - "Future dedupe/source diagnostics cannot find the email source row."
    fix:
      - "Resolve insert conflict by messageIdFingerprint and fingerprint."
      - "If any source conflict occurs, return Duplicate or rollback and write diagnostic."
    tests:
      - "email_source_message_id_conflict_with_changed_fingerprint_returns_duplicate"
      - "insertOrIgnore_minus_one_never_continues_without_source_row"

  - id: "P11-CURRENT-006"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Transaction post-creation side effects are double-dispatched"
    evidence:
      - "ReceiptLifecycleCoordinator.processEmailReceipt() dispatches transactionLifecycleCoordinator.dispatchPostCreationSideEffects for each expenseId after commit."
      - "EmailReceiptIngestionService.processEmailReceipt() also dispatches coordinator.dispatchPostCreationSideEffects for same expenseIds after coordinator returns Success."
    impact:
      - "Recurring matching, recommendations, dashboard invalidations, learning hooks, or other downstream effects can run twice."
      - "If any side effect is not idempotent, email-created expenses can produce duplicate downstream state."
    fix:
      - "Let coordinator be the only side-effect owner."
      - "Remove service-level transaction side-effect loop."
    tests:
      - "email_receipt_created_expense_dispatches_transaction_side_effects_once"
      - "recurring_match_not_called_twice_for_email_receipt_expense"

  - id: "P11-CURRENT-007"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Content fingerprint is too coarse and orderNumber is discarded"
    evidence:
      - "ParsedEmailReceipt has orderNumber."
      - "Service does not pass orderNumber into domain EmailReceiptData."
      - "createFingerprint() uses merchant.lowercase + amount + dateBucket only."
      - "currency and provider are not included."
    impact:
      - "Two distinct orders from same merchant with same amount/date can be incorrectly treated as duplicates."
      - "Different currencies with same numeric amount can collide."
    fix:
      - "Use provider + canonical merchant + amount + currency + transaction date + orderNumber when available."
      - "Store messageFingerprint and contentFingerprint separately."
    tests:
      - "same_merchant_same_amount_same_day_different_order_number_not_duplicate"
      - "same_merchant_same_amount_different_currency_not_duplicate"
      - "forwarded_same_order_different_messageId_dedupes_by_contentFingerprint"

  - id: "P11-CURRENT-008"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Email text/semantic fingerprints are computed but not persisted"
    evidence:
      - "Coordinator computes emailTextFingerprint and emailSemanticFingerprint."
      - "ScannedReceipt created for email does not set textFingerprint or semanticFingerprint."
    impact:
      - "ReceiptDuplicateDetector cannot find prior email receipts by text/semantic fingerprint in future imports."
      - "Dedupe depends mostly on EmailReceiptSource.fingerprint and message/source fields."
    fix:
      - "Persist textFingerprint and semanticFingerprint on ScannedReceipt."
      - "Compute from ephemeral raw body before storage sanitization."
    tests:
      - "email_receipt_persists_text_and_semantic_fingerprints"
      - "same_email_body_different_message_id_dedupes_by_text_fingerprint"

  - id: "P11-CURRENT-009"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Low-confidence and validation-failed email receipts do not route to PendingReview"
    evidence:
      - "ParsedEmailReceipt.confidence is ignored."
      - "EmailReceiptSource.confidence is hardcoded to 1.0."
      - "ScannedReceipt.confidence is hardcoded to 0.7f."
      - "CreateExpenseResult.ValidationFailed is only Timber.w."
    impact:
      - "Uncertain parsed receipts can become approved expenses."
      - "Invalid but saved receipts can return Success with no expense/review action."
    fix:
      - "Add EmailReceiptImportPolicy thresholds."
      - "Route medium/low confidence or validation failure to PendingReview."
      - "Persist parser confidence and warnings."
    tests:
      - "low_confidence_email_receipt_creates_pending_review"
      - "validation_failed_email_expense_creates_pending_review"
      - "unknown_provider_receipt_does_not_auto_create_approved_expense"

  - id: "P11-CURRENT-010"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Coordinator writes diagnostic event while restore writes are blocked"
    evidence:
      - "processEmailReceipt() checks restoreMaintenanceMode.isWritesAllowed()."
      - "When false, it calls emitEmailReceiptDiagnostic(), which inserts PipelineDiagnosticEvent into DB."
    impact:
      - "Restore/backup write barrier is violated by diagnostic write."
      - "During DB swap/verification this can mutate or crash against the DB being restored."
    fix:
      - "Use DatabaseWriteBarrier consistently."
      - "For restore-block diagnostics, use restore-safe sidecar/log sink or skip DB writes."
    tests:
      - "email_coordinator_restore_block_does_not_insert_db_diagnostic"
      - "email_coordinator_uses_databaseWriteBarrier"

  - id: "P11-CURRENT-011"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Non-created expense outcomes can become successful empty email ingestion"
    evidence:
      - "CreateExpenseResult.Created and DuplicateSkipped link an expense."
      - "ValidationFailed logs warning."
      - "else branch does nothing."
      - "Method then returns EmailReceiptProcessResult.Success(receiptId, emptyExpenseIds)."
    impact:
      - "Caller sees Success although expense was not created/linked and review was not created."
      - "User/debugger cannot tell why email receipt produced no transaction."
    fix:
      - "Add result states: NeedsReview, ExpenseValidationFailed, ExpenseInsertConflict, LinkedExisting."
      - "Create PendingReview or return structured partial result."
    tests:
      - "email_expense_insert_conflict_not_reported_success_empty"
      - "email_validation_failure_returns_needs_review_or_error"

  - id: "P11-CURRENT-012"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "CancellationException is swallowed by service"
    evidence:
      - "EmailReceiptIngestionService.processEmailReceipt() has catch (e: Exception)."
      - "It returns ParseError for all exceptions."
    impact:
      - "Batch/worker cancellation can be converted into ParseError and continue processing next emails."
      - "Restore/backup cancellation semantics can be violated if email import becomes worker-backed."
    fix:
      - "Rethrow CancellationException in all broad catches."
    tests:
      - "email_ingestion_cancellation_rethrows_and_stops_batch"

  - id: "P11-CURRENT-013"
    severity: "P1_PRIVACY"
    status: "OPEN"
    title: "Raw sender is logged"
    evidence:
      - "Service logs provider detection with sender included."
      - "Error log includes sender."
    impact:
      - "Email addresses can leak into logcat/debug logs."
    fix:
      - "Log provider and hashed/domain-only sender."
      - "Use privacy-aware logger for PII-bearing fields."
    tests:
      - "email_ingestion_logs_do_not_include_raw_sender"

  - id: "P11-CURRENT-014"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Parser registry remains hardcoded"
    evidence:
      - "Service owns private val amazonParser = AmazonReceiptParser(), uberParser, appleParser."
    impact:
      - "Adding providers requires editing service."
      - "Parser priority and feature flags are hard to test."
    fix:
      - "Introduce EmailReceiptProviderParser with Hilt multibindings."
      - "Parser selection should return providerId/parserVersion/confidence/fallbackUsed."
    tests:
      - "new_email_provider_added_without_modifying_service"
      - "parser_registry_records_attempted_parsers"

  - id: "P11-CURRENT-015"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Durable diagnostics are still incomplete"
    evidence:
      - "Parse failure before coordinator returns ParseError only."
      - "Provider detected/parser attempts are Timber only."
      - "Coordinator writes only limited duplicate/restore diagnostic events."
    impact:
      - "Cannot answer 'email received but did nothing' from DB alone."
    fix:
      - "Add EmailIngestionEvent or expand PipelineDiagnosticEvent stages."
      - "Write RECEIVED, PROVIDER_DETECTED, PARSER_FAILED, PARSED, RECEIPT_SAVED, EXPENSE_CREATED, NEEDS_REVIEW, LINK_FAILED."
    tests:
      - "parse_failure_writes_email_ingestion_event"
      - "provider_detected_writes_email_ingestion_event"
      - "link_failure_writes_email_ingestion_event"

  - id: "P11-CURRENT-016"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Batch import still lacks summary, checkpoint, and backpressure"
    evidence:
      - "processBatch() maps emails to processEmailReceipt() results."
      - "No EmailBatchIngestionSummary or import run ledger."
    impact:
      - "Large mailbox imports cannot resume safely or report progress."
      - "Failed messages are not durable."
    fix:
      - "Create EmailReceiptImportWorker with EmailSyncRun/EmailMessageImport if mailbox sync is in scope."
      - "Return summary counts."
    tests:
      - "batch_import_reports_summary_counts"
      - "batch_import_resume_after_crash_skips_completed_messages"

  - id: "P11-CURRENT-017"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "No mailbox/provider account sync lifecycle"
    evidence:
      - "Service accepts raw email body/sender/subject/receivedAt/messageId only."
      - "No Gmail/Outlook/IMAP account, folder, cursor, page token, or message import table."
    impact:
      - "Real provider ingestion cannot safely resume, retry, or de-duplicate per folder/account."
    fix:
      - "Add EmailAccountConnection, EmailSyncRun, EmailMessageImport."
      - "Checkpoint after each page/message."
    tests:
      - "email_sync_resume_after_crash"
      - "email_sync_partial_failure_records_failed_message"

  - id: "P11-CURRENT-018"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Expense/source provenance is weak"
    evidence:
      - "ParsedEmailReceipt.orderNumber is discarded."
      - "CreateExpenseRequest has scannedReceiptId but no emailSourceId/messageFingerprint/orderNumber."
      - "TransactionEvent metadata for email source is not clearly populated."
    impact:
      - "Cannot trace an expense back to provider order number or exact email source."
      - "Duplicate/reconciliation/debugging is weaker."
    fix:
      - "Persist emailSourceId/orderNumber/contentFingerprint into TransactionEvent metadata or a source-link table."
    tests:
      - "email_created_transaction_event_contains_email_source_id"
      - "email_created_transaction_event_contains_order_number_hash"

  - id: "P11-CURRENT-019"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Currency parsing and defaulting remain ambiguous"
    evidence:
      - "BaseEmailParser amount regex visibly focuses EUR/USD/GBP."
      - "Provider parsers still default to EUR or USD in ambiguous cases."
    impact:
      - "CAD/AUD/CHF/PLN/RON/TRY/JPY receipts can parse incorrectly or be mislabeled."
      - "Missing currency should be review/warning, not silent default."
    fix:
      - "Use shared money/currency parser."
      - "If currency is ambiguous, route to review or mark assumedCurrency."
    tests:
      - "email_receipt_CAD_parses_currency"
      - "email_receipt_missing_currency_goes_to_review_or_warning"

  - id: "P11-CURRENT-020"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Home-currency DataStore read happens inside DB transaction"
    evidence:
      - "processEmailReceipt() calls currencySettingsRepository.homeCurrency().first() inside database.withTransaction."
    impact:
      - "Room transaction can be held while awaiting DataStore/Flow I/O."
      - "Increases lock duration and deadlock/flakiness risk."
    fix:
      - "Resolve homeCurrency before entering database.withTransaction."
    tests:
      - "email_process_resolves_home_currency_before_db_transaction"

  - id: "P11-CURRENT-021"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Retention/redacted export coverage for email artifacts remains incomplete"
    evidence:
      - "Pipeline 8 review found DataRetentionWorker and ExportAnonymizer do not fully cover email_receipt_sources."
      - "Email source/body/subject privacy depends on write-time sanitization and later retention is still weak."
    impact:
      - "Old email source metadata or parsed item text can persist beyond user expectation."
    fix:
      - "Add email retention target and redacted-backup policy for EmailReceiptSource, parsedItems, notes, and source fingerprints."
    tests:
      - "email_retention_purges_email_receipt_sources"
      - "redacted_backup_excludes_email_subject_sender_body_items"

  - id: "P11-CURRENT-022"
    severity: "P3_LOW"
    status: "OPEN"
    title: "Legacy dependencies and transactionRunner remain in service"
    evidence:
      - "EmailReceiptIngestionService still injects receiptParser, processReceiptUseCase, expenseDao, emailReceiptDao, receiptLinkService, categorizationEngine, privacySettingsRepository, transactionRunner."
      - "Several appear unused after delegation refactor."
      - "transactionRunner is not used by processEmailReceipt()."
    impact:
      - "Confuses ownership boundaries and future agents."
      - "Increases test setup burden."
    fix:
      - "Remove unused dependencies."
      - "Keep service as pure detector/parser/delegate."
    tests:
      - "static_grep_email_service_no_unused_legacy_dependencies"

recommended_fix_order:
  - pr: "PR1"
    title: "Build/name safety and side-effect correctness"
    include:
      - "Rename batch EmailReceiptData to EmailBatchReceiptInput."
      - "Alias/fully-qualify domain EmailReceiptData."
      - "Remove service-level duplicate transaction side-effect dispatch."
    closes:
      - "P11-CURRENT-001"
      - "P11-CURRENT-006"

  - pr: "PR2"
    title: "Critical privacy fixes"
    include:
      - "Use emailReceiptStorageMode for email body/sender/subject/messageId."
      - "Remove raw subject from Expense.notes."
      - "Apply email privacy to parsedItems and redacted exports/retention."
      - "Remove raw sender from logs."
    closes:
      - "P11-CURRENT-002"
      - "P11-CURRENT-003"
      - "P11-CURRENT-013"
      - "P11-CURRENT-021"

  - pr: "PR3"
    title: "Dedupe and source insert hardening"
    include:
      - "Stable messageIdFingerprint."
      - "Separate messageFingerprint and contentFingerprint."
      - "Include currency/provider/orderNumber in content fingerprint."
      - "Persist text/semantic fingerprints."
      - "Resolve every insertOrIgnore conflict."
    closes:
      - "P11-CURRENT-004"
      - "P11-CURRENT-005"
      - "P11-CURRENT-007"
      - "P11-CURRENT-008"

  - pr: "PR4"
    title: "Review/error routing"
    include:
      - "Use parser confidence."
      - "Route low-confidence/validation/insert-conflict cases to PendingReview or structured error."
      - "Do not return Success with empty expenseIds unless explicitly ReceiptOnly."
    closes:
      - "P11-CURRENT-009"
      - "P11-CURRENT-011"

  - pr: "PR5"
    title: "Restore/cancellation/transaction hygiene"
    include:
      - "Coordinator uses DatabaseWriteBarrier."
      - "No DB diagnostics while restore writes blocked."
      - "Rethrow CancellationException."
      - "Resolve home currency before DB transaction."
    closes:
