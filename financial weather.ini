```kotlin
class ForecastAccuracyTracker {
    fun recordForecastPerformance(
        forecast: FinancialForecast,
        actualOutcome: Money
    ) {
        val prediction = forecast.components.totalLikely
        val error = abs(actualOutcome - prediction)
        val errorPercentage = error / actualOutcome
        
        // Store for model improvement
        database.accuracyLog.insert(
            AccuracyRecord(
                forecastId = forecast.id,
                predicted = prediction,
                actual = actualOutcome,
                error = error,
                errorPercentage = errorPercentage,
                horizon = forecast.horizon,
                userSegment = getUserSegment()  // Regular vs irregular spender
            )
        )
        
        // Adjust confidence scoring for future forecasts
        if (errorPercentage < 0.10) {
            increaseConfidenceWeights()
        } else if (errorPercentage > 0.25) {
            decreaseConfidenceWeights()
        }
    }
}

