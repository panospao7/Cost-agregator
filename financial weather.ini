### **C. Anomaly Detection (Momentum Outliers)**

```kotlin
data class SpendingAnomaly(
    val transaction: Transaction,
    val anomalyType: AnomalyType,
    val severity: Severity,
    val context: String
)

enum class AnomalyType {
    UNUSUAL_AMOUNT,        // 3+ std deviations from merchant average
    UNUSUAL_TIME,          // Outside typical hours
    UNUSUAL_FREQUENCY,     // Too many in short period
    UNUSUAL_MERCHANT,      // First time + high value
    UNUSUAL_CATEGORY       // Spike vs historical
}

class AnomalyDetector {
    fun detectAnomalies(
        recentTransactions: List<Transaction>,
        historicalContext: TransactionHistory
    ): List<SpendingAnomaly> {
        
        // Z-Score Analysis
        for (tx in recentTransactions) {
            val merchantHistory = historicalContext.forMerchant(tx.merchant)
            val zScore = (tx.amount - merchantHistory.mean) / merchantHistory.stdDev
            
            if (abs(zScore) > 3.0) {
                yield(SpendingAnomaly(
                    transaction = tx,
                    anomalyType = UNUSUAL_AMOUNT,
                    severity = when {
                        abs(zScore) > 5.0 -> CRITICAL
                        abs(zScore) > 4.0 -> HIGH
                        else -> MEDIUM
                    },
                    context = "€${tx.amount} is ${zScore.format()}× your average at ${tx.merchant}"
                ))
            }
        }
        
        // Frequency Detection
        val txCountToday = recentTransactions.filterToday()
        val avgDailyTxCount = historicalContext.averageDailyTransactions()
        if (txCountToday > avgDailyTxCount * 2.5) {
            yield(SpendingAnomaly(
                anomalyType = UNUSUAL_FREQUENCY,
                severity = MEDIUM,
                context = "${txCountToday} transactions today (avg: ${avgDailyTxCount.format()})"
            ))
        }
    }
}
```

