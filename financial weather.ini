## 🔧 **ENGINE 1: Pattern Detection**

### **A. Recurring Transaction Detector**

```kotlin
data class RecurringPattern(
    val merchantId: String,
    val categoryId: String,
    val frequency: Frequency,          // WEEKLY, MONTHLY, QUARTERLY
    val averageAmount: Money,
    val variance: Double,              // Std deviation
    val confidence: Double,            // 0.0 - 1.0
    val nextExpectedDate: LocalDate,
    val dateFlexibility: Int,          // ± days
    val detectionBasis: List<TransactionId>  // Proof
)

enum class Frequency {
    WEEKLY,
    BIWEEKLY,
    MONTHLY,
    QUARTERLY,
    YEARLY,
    CUSTOM(days: Int)
}

class RecurringDetector {
    fun detectPatterns(transactions: List<Transaction>): List<RecurringPattern> {
        // Algorithm:
        // 1. Group by normalized merchant name
        // 2. Calculate intervals between transactions
        // 3. Find modal interval (most common gap)
        // 4. Check consistency:
        //    - At least 3 occurrences
        //    - Interval variance < 20%
        //    - Amount variance < 15%
        // 5. Score confidence based on:
        //    - Number of occurrences (more = higher)
        //    - Consistency of timing
        //    - Consistency of amount
    }
}
```

**Detection Tiers:**

| Confidence | Criteria | Action |
|-----------|----------|--------|
| **HIGH (90%+)** | 5+ occurrences, <10% variance | Auto-add to forecast |
| **MEDIUM (70-89%)** | 3-4 occurrences, <20% variance | Show with "likely" tag |
| **LOW (50-69%)** | 2-3 occurrences, <30% variance | Suggest user confirmation |

