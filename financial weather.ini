### **3. Cross-Budget Intelligence**

```kotlin
// Detect budget trade-offs:
class BudgetBalancer {
    fun detectTradeoffs(): List<TradeoffSuggestion> {
        val overBudgets = budgets.filter { it.status == OVER_PACE }
        val underBudgets = budgets.filter { it.status == UNDER_BUDGET }
        
        return overBudgets.flatMap { over ->
            underBudgets.map { under ->
                TradeoffSuggestion(
                    from = under.category,
                    to = over.category,
                    amount = min(under.surplus, over.deficit),
                    rationale = """
                        You're €${over.deficit} over on ${over.category.name}.
                        You have €${under.surplus} left in ${under.category.name}.
                        Want to reallocate?
                    """.trimIndent()
                )
            }
        }
    }
}

