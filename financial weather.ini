## 📊 **NARRATIVE GENERATOR: Human-Readable Output**

```kotlin
data class ForecastNarrative(
    val headline: String,
    val weatherIcon: WeatherIcon,
    val summary: String,
    val details: List<NarrativeSection>,
    val tone: NarrativeTone
)

enum class WeatherIcon {
    CLEAR_SKIES,      // 🌤️ Comfortable buffer
    PARTLY_CLOUDY,    // ⛅ Moderate, watch spending
    CLOUDY,           // ☁️ Tight, limited discretionary
    RAINY,            // 🌧️ Multiple bills, over pace
    STORMY            // ⛈️ Budget danger, immediate action
}

enum class NarrativeTone {
    POSITIVE,         // "Great job staying on track!"
    NEUTRAL,          // "Typical week ahead"
    CAUTIONARY,       // "Watch your dining budget"
    URGENT            // "Action needed to avoid overspend"
}

class NarrativeGenerator {
    fun generate(forecast: FinancialForecast): ForecastNarrative {
        val riskLevel = forecast.components.riskLevel
        val bufferAmount = forecast.components.discretionaryBudget
        
        // Example outputs:
        return when {
            riskLevel == LOW && bufferAmount > 200.EUR -> ForecastNarrative(
                headline = "Smooth Sailing Ahead",
                weatherIcon = CLEAR_SKIES,
                summary = """
                    You have €${bufferAmount.format()} in discretionary budget 
                    after known bills and goals. On track with all budgets.
                """.trimIndent(),
                details = buildDetails(forecast),
                tone = POSITIVE
            )
            
            riskLevel == MEDIUM -> ForecastNarrative(
                headline = "Moderate Week",
                weatherIcon = PARTLY_CLOUDY,
                summary = """
                    €${forecast.components.totalCommitted.format()} in known 
                    expenses. Your dining budget is 85% spent with 12 days left.
                """.trimIndent(),
                details = buildDetails(forecast),
                tone = CAUTIONARY
            )
            
            riskLevel == HIGH -> ForecastNarrative(
                headline = "Tight Week Ahead",
                weatherIcon = STORMY,
                summary = """
                    ⚠️ 3 bills charging (€145) and you're over pace on 2 budgets. 
                    Only €67 discretionary remaining.
                """.trimIndent(),
                details = buildDetails(forecast),
                tone = URGENT
            )
            
            else -> // ... other cases
        }
    }
    
    private fun buildDetails(forecast: FinancialForecast): List<NarrativeSection> {
        return listOf(
            NarrativeSection(
                title = "Known Bills",
                icon = "⚡",
                items = forecast.components.recurringExpenses.map {
                    "${it.merchantName}: €${it.averageAmount} in ${it.daysUntil} days"
                }
            ),
            NarrativeSection(
                title = "Budget Health",
                icon = "📊",
                items = forecast.components.budgetStatus
                    .filter { it.value.status != UNDER_BUDGET }
                    .map { (cat, burn) ->
                        "${cat.name}: ${burn.percentUsed}% used, ${burn.daysRemaining} days left"
                    }
            ),
            NarrativeSection(
                title = "Planned Expenses",
                icon = "📝",
                items = forecast.components.plannedExpenses.map {
                    "${it.description}: ~€${it.estimatedAmount}"
                }
            )
        )
    }
}
```

