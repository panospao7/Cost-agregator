## ⚙️ **Advanced Features**

### **1. Confidence Intervals & Scenarios**

```kotlin
data class ForecastRange(
    val optimistic: Money,      // 10th percentile
    val likely: Money,          // 50th percentile (median)
    val pessimistic: Money,     // 90th percentile
    val confidence: Double      // Statistical confidence
)

// Monte Carlo simulation:
class ScenarioSimulator {
    fun simulateWeek(
        patterns: List<RecurringPattern>,
        momentum: SpendingVelocity,
        iterations: Int = 1000
    ): ForecastRange {
        
        val outcomes = (1..iterations).map {
            var total = 0.EUR
            
            // Sample from recurring (with date/amount variance)
            patterns.forEach { pattern ->
                if (Random.nextDouble() < pattern.confidence) {
                    total += pattern.averageAmount * Random.normal(1.0, pattern.variance)
                }
            }
            
            // Sample from discretionary (based on momentum)
            val dailyDiscretionary = momentum.currentRate * Random.normal(1.0, 0.15)
            total += dailyDiscretionary * 7
            
            total
        }.sorted()
        
        return ForecastRange(
            optimistic = outcomes.percentile(10),
            likely = outcomes.percentile(50),
            pessimistic = outcomes.percentile(90),
            confidence = 0.80
        )
    }
}

