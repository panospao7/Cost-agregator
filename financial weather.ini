## 📈 **ENGINE 2: Momentum Analysis**

### **A. Spending Velocity Calculator**

```kotlin
data class SpendingVelocity(
    val period: Period,                    // WEEK, MONTH
    val currentRate: Money,                // Amount per day
    val historicalAverage: Money,
    val percentageChange: Double,          // vs historical
    val acceleration: Double,              // Rate of change
    val projectedTotal: Money,             // If pace continues
    val budgetStatus: BudgetStatus
)

class VelocityAnalyzer {
    fun calculateCurrentVelocity(
        timeframe: Period = Period.WEEK
    ): SpendingVelocity {
        val daysElapsed = timeframe.daysElapsed()
        val daysRemaining = timeframe.daysRemaining()
        val spentSoFar = transactionsInPeriod.sum()
        val dailyRate = spentSoFar / daysElapsed
        
        val projection = spentSoFar + (dailyRate * daysRemaining)
        val historicalAvg = last12Periods.average()
        
        return SpendingVelocity(
            period = timeframe,
            currentRate = dailyRate,
            historicalAverage = historicalAvg / timeframe.days,
            percentageChange = (projection - historicalAvg) / historicalAvg,
            acceleration = calculateAcceleration(),
            projectedTotal = projection,
            budgetStatus = compareToBudget(projection)
        )
    }
    
    private fun calculateAcceleration(): Double {
        // Compare first half vs second half of period
        val firstHalfRate = firstHalf.dailyAverage()
        val secondHalfRate = secondHalf.dailyAverage()
        return (secondHalfRate - firstHalfRate) / firstHalfRate
    }
}
```

**Velocity States:**

```
🚀 ACCELERATING:  +15% daily rate vs period start
➡️  STEADY:       ±5% variance
🛑 DECELERATING: -15% daily rate vs period start
⚠️  DANGER:       Projected to exceed budget by 20%+
```

