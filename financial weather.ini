## 🧠 **SYNTHESIS ENGINE: The Orchestrator**

```kotlin
data class FinancialForecast(
    val horizon: ForecastHorizon,
    val generatedAt: Instant,
    val confidence: OverallConfidence,
    val components: ForecastComponents,
    val narrative: ForecastNarrative,
    val actionableInsights: List<Insight>
)

enum class ForecastHorizon {
    NEXT_7_DAYS,
    NEXT_30_DAYS,
    REST_OF_MONTH,
    CUSTOM(days: Int)
}

data class ForecastComponents(
    // From Pattern Engine
    val recurringExpenses: List<RecurringPattern>,
    val categoryPredictions: Map<Category, CategoryForecast>,
    
    // From Momentum Engine
    val currentVelocity: SpendingVelocity,
    val budgetStatus: Map<Category, BudgetBurn>,
    val anomalies: List<SpendingAnomaly>,
    
    // From Intention Engine
    val plannedExpenses: List<PlannedExpense>,
    val goalReserves: Money,
    
    // Synthesis
    val totalCommitted: Money,        // High confidence
    val totalLikely: Money,           // Medium confidence
    val discretionaryBudget: Money,   // What's truly free
    val riskLevel: RiskLevel
)

data class CategoryForecast(
