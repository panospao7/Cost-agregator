data class SavingsGoal(
    val id: UUID,
    val name: String,
    val targetAmount: Money,
    val targetDate: LocalDate?,
    val currentAmount: Money,
    val autoContribution: AutoContribution?,
    val protectionLevel: ProtectionLevel
)

data class AutoContribution(
    val type: ContributionType,
    val amount: Money
)

enum class ContributionType {
    FIXED_MONTHLY,          // €50/month
    PERCENTAGE_INCOME,      // 10% of detected income
    ROUND_UP_SIMULATION,    // Virtual round-ups
    SURPLUS_SWEEP           // Transfer under-budget amount
}

enum class ProtectionLevel {
    STRICT,      // Block spending if it endangers goal
    WARNING,     // Alert but allow
    TRACKING     // Just track, no interference
}

// Integration with forecast:
fun calculateTrueAvailableBalance(): Money {
    val rawBalance = currentBalance
    val strictGoalReserves = goals
        .filter { it.protectionLevel == STRICT }
        .sumOf { it.monthlyContributionNeeded() }
    
    return rawBalance - strictGoalReserves - upcomingBills
}
