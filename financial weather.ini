### **4. External Context (Advanced)**

```kotlin
// Optional: Public holidays, payday cycles, local events
class ContextEnricher {
    fun enrichForecast(
        baseForecast: FinancialForecast,
        context: ExternalContext
    ): FinancialForecast {
        
        var adjusted = baseForecast
        
        // Payday boost
        if (context.hasPaydayInPeriod()) {
            adjusted = adjusted.copy(
                narrative = adjusted.narrative.copy(
                    summary = "Payday this week - historically you spend 25% more"
                )
            )
        }
        
        // Holiday spending
        if (context.hasHolidayInPeriod()) {
            val holidayMultiplier = historicalHolidaySpend / historicalAvgSpend
            adjusted = adjusted.adjustPrediction(holidayMultiplier)
        }
        
        return adjusted
    }
}

data class ExternalContext(
    val paydayDates: List<LocalDate>,
    val publicHolidays: List<Holiday>,
    val localEvents: List<Event>  // Concerts, sports, etc.
)
