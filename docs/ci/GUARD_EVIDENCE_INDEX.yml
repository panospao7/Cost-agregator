# GUARD_EVIDENCE_INDEX — tracked exact-SHA evidence records (PR-GR-10D).
#
# Compact index of evidence bundles; NOT a copy of raw logs. Rules:
# - No raw source, absolute local paths, user data, tokens, logs, or secrets.
# - A record is "current" only by qualifying content, never by position.
# - A record may support VERIFIED_AT_SHA only when (a) two capture runs
#   recorded matching semanticDigestSha256 values, (b) reproducible: true,
#   and (c) all required command results are recorded.
# - Field provenance for capture records:
#     semanticDigestSha256  = SHA-256 of the run's semantic-summary.json
#                             (recorded in the bundle's output-sha256.txt).
#     artifactManifestSha256 = the capture's input-manifest digest
#                             (input_manifest_sha256 recorded inside
#                             semantic-summary.json; run-invariant).
# - status vocabulary: COMPLETE | INCOMPLETE | HISTORICAL.
# - HISTORICAL records never support current-state claims; single-capture
#   records are never VERIFIED_AT_SHA evidence.
