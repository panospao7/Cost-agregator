# GUARD_DOCUMENT_INDEX — machine-readable map of every guard-related document
# (PR-GR-10D deliverable 1).
#
# Rules:
# - Every document that claims a guard state, command, policy authority,
#   baseline meaning, source scope, release status, or PR completion state
#   appears exactly once.
# - classification vocabulary (closed):
#     CURRENT_ARCHITECTURE | CURRENT_OPERATIONS | CURRENT_EVIDENCE |
#     NORMATIVE_TARGET | HISTORICAL_RECORD | PLAN_OR_BACKLOG |
#     GENERATED_REFERENCE
# - HISTORICAL_RECORD documents are preserved but visibly bannered; they are
#   never current-state authority.
# - PLAN_OR_BACKLOG documents may describe future work but must not present it
#   as active implementation.
# - Current documents may not rely on historical prose as authority; current
#   status/counts come from docs/ci/GUARD_EVIDENCE_INDEX.yml via the generated
#   references (GUARD_COMMANDS.generated.md / GUARD_STATUS.generated.md).
# - lastReviewedSha is the exact SHA at which the entry's classification and
#   current-state claims were last reviewed.
# - Enforced by scripts/ci/verify_guard_docs_truth.py (registered guard
#   guard_docs_truth).
schemaVersion: 1
