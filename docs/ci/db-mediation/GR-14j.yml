# GR-14j — structured coroutine-launch admission (owner-approved design).
#
# PROBLEM (probe-verified in this batch): the async family's 328 rows are
# held by ~350 uncertain inbound edges — 219 coroutine launches
# (207 viewModelScope.launch), ~17 structured suspend carriers
# (withPermit/withTimeoutOrNull/collect), ~16 project helpers — and the
# GR-13 tier order lets those uncertain edges preempt LOCAL canonical
# scope proofs (updateType's runWrite wrap alone flipped nothing).  With
# launch edges permanently uncertain, the async family can never close
# and the GR-14 zero gate is unreachable.
#
# OWNER-APPROVED DESIGN (2026-09-07): the maintenance barrier is app-global
# state (RestoreMaintenanceMode) checked at the mutation site at execution
# time; caller-side context is irrelevant to barrier correctness.  A
# launch on a REVIEWED STRUCTURED receiver (name-exact closed set —
# ViewModel-/service-owned CoroutineScope properties, cancelled with their
# owner; tree-wide grep evidence) resolves EXACTLY with context inherited.
# Deliberately STRICTER overall: writers with their own canonical scope
# prove independent of launch callers; writers WITHOUT local scope on a
# launch-reachable path become COUNTEREXAMPLES (definite unguarded call
# paths) — the honest classification that drives the remaining scope
# batches (GR-14k+).  Launches on unknown receivers (GlobalScope, injected
# dispatchers, parameters) stay async-uncertain.
#
# Engine changes:
#   - AnalysisContract.structured_launch_receivers (validated plain
#     identifiers);
#   - STRUCTURED_LAUNCH_METHODS = ("launch",) closed constant;
#   - _lambda_regions admits launch-on-reviewed-receiver as transparent
#     (context inherited, edge exact);
#   - _chain_admitted_by_engine_carriers generalizes the GR-14f
#     resolution-preservation fallback to admitted launch chains;
#   - inline carrier set extended with evidence-backed structured suspend
#     carriers: withTimeoutOrNull, collect (context-inheriting per-emission
#     flow terminal), withPermit (semaphore, like withLock), and the
#     project wrapper safeRecordMatchEvent (inline try/catch, cancellation
#     rethrown).  .PostCommitAction (9 edges) and .finally (19 edges)
#     labels are evidence-unclear and deliberately NOT admitted.
# Production receiver set (closed): viewModelScope, scope, workTracker,
#   serviceScope, diagnosticScope.
#
# Demonstration unit (production): TransactionLifecycleCoordinator.updateType
# mutations wrapped in writeBarrier.runWrite canonical scope — with the
# engine change its 2 rows prove (the earlier probe, now completing).
#
# Shadow delta (the inversion, before = post-GR-14i):
#   proven_helper:            31 -> 39   (+8; updateType x2 + 6 more
#     locally-scoped writers on launch-reachable paths)
#   unproven_async:          328 -> 305  (-23)
#   counterexamples:           0 -> 4    (the inversion: RecommendationRepository.
#     clearForUser x1, TransactionLifecycleCoordinator.updateTransferDetails
#     x3 — unscoped writers, honestly now definite violations; these are
#     the GR-14k work queue)
#   unproven_ambiguous:        6 -> 12   (exposed by exact edges)
#   unproven_external_entry:  64 -> 69   (exposed by exact edges)
#
# Validation:
#   - python: structured-launch module 7/7, carrier module 12/12, CLI
