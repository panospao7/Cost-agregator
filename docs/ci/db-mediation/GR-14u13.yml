  This batch stops mediation pseudo-sites (call-edge offsets, not mutations) from
  widening the GR-11/GR-12 opacity gate, so a callable whose real mutation sites
  are correctly dominated by a write barrier is no longer flipped to UNSUPPORTED
  by an incidental lambda region.  It changes no policy, baseline, exception or
