manifestStatement: >
  A restore-internal database write is deliberately exempt from the global write
  barrier, because the restore must write the restore database during a restore
  window; the previous contract had no way to express that, so such a write was
  reported as an unguarded call path.  This batch adds a third canonical scope
  form for it - receiver-exact and mode-gated, with its own proof state,
  PROVEN_RESTORE_INTERNAL - without touching the V1 or V2 contracts, and proves
  the guard from the scope's lexical containment of the mutation plus
  propagation of restore-internal context across exact call edges.  On its own
  the change moves no row; combined with the single-implementor exactness rule it
  turns the one restore-internal counterexample into a proof, so the board gains
  eighteen proven helpers and one restore-internal proof with zero
  counterexamples, zero regressions, a deterministic board, and policy, baseline
  and exception bytes unchanged.
