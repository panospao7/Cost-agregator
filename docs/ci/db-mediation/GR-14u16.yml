# GR-14u16 (§D7 Bug 2b, largest single cause) — the barrier-scope form now
# matches the REAL `runWrite` API.  ZERO board delta at this level; the value is
# that canonical guarded bodies become MODELABLE (unmodelable observed callables
# 82 -> 59) instead of being refused wholesale.
#
# ROOT CAUSE (found by GR-14u15's reason census, handoff §D7):
#   `DatabaseWriteBarrier.runWrite` is
#     `suspend fun <T> runWrite(operation: DatabaseAccessOperation, block: suspend () -> T): T`
#   (DatabaseWriteBarrier.kt:33) — the operation argument is REQUIRED, so the only
#   legal call shape is `writeBarrier.runWrite(op) { ... }` (or `runWrite(op, { ... })`).
#   But the tokenizer's `_RE_BARRIER_SCOPE` was
#     r"\bwriteBarrier\s*\.\s*runWrite\s*\{"
#   (tokenizer.py:39) — it demanded the brace IMMEDIATELY after `runWrite`, i.e. a
#   bare `runWrite { ... }` that CANNOT be written against this signature.  Real
#   usage therefore missed the BARRIER_SCOPE branch and fell into
#   `_RE_LIKE_BARRIER` (tokenizer.py:49), which fails the WHOLE body with
#   `DB_STRUCTURAL_MODEL_BARRIER_FORM_UNRECOGNIZED`.
#   Measured: that reason accounted for 47 of the 82 unmodelable observed
#   callables — the single largest cause — and it includes the notification-capture
#   writers guarded in GR-14u6 (`NotificationIntakeCoordinator.capture` /
#   `.captureForRetry`, NotificationIntakeCoordinator.kt:140 and :248) and
#   `TransactionLifecycleCoordinator.createExpenseMutation`.
#   `_RE_WORKER_GUARD` (tokenizer.py:45) ALREADY allows the parenthesised form
#   (`runGuardedWithContext|runGuarded\s*(?:\([^()]*\))?\s*\{`), so the barrier
#   scope was the odd one out — an oversight, not a design choice.
#
# FIX: make the argument list optional, mirroring _RE_WORKER_GUARD, with one level
# of parenthesis nesting so `runWrite(DatabaseAccessOperation("...")) {` matches:
#   r"\bwriteBarrier\s*\.\s*runWrite\s*(?:\((?:[^()]|\([^()]*\))*\))?\s*\{"
# The existing safety guards are untouched: the canonical-receiver requirement,
# the `lambda-before-barrier-scope` escape check (tokenizer.py:731) and the
# like-barrier tripwire for every other receiver.
#
# FIXTURE PINS (scripts/ci/test_gr14u16_barrier_scope_form.py, 5):
#   - accepted: `runWrite(op) { ... }` (THE REAL FORM — failed pre-fix with
#     barrier-form-unrecognized, verified RED before the change);
#   - accepted: bare `runWrite { ... }` (back-compat with the old regex);
#   - documented limitation: `runWrite(op, { ... })` STILL fails closed — its
#     lambda sits inside the argument list, a different shape, and guessing is
#     refused; the call remains visible to the text-only barrier scan, which is
#     what keeps such a body out of counterexamples via GR-14u15;
#   - still fail-closed: `other.runWrite(op) { ... }` (unknown receiver) is not a
#     barrier scope;
#   - still fail-closed: a barrier scope nested in an enclosing lambda escapes.
#
# SHADOW DELTA on the current board: 0 rows — report BYTE-IDENTICAL to the
# committed GR-14u15 report (da296160...) and deterministic across a double run.
# The newly modelable bodies belong to rows that are still decided by earlier
