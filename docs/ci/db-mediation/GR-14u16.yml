manifestStatement: >
  The tokenizer recognized only a bare `writeBarrier.runWrite { ... }`, a shape
  that cannot be written against the real API because runWrite requires an
  operation argument; genuine `runWrite(operation) { ... }` guards were therefore
  rejected as an unrecognized barrier form, making the entire enclosing body
  unmodelable.  This batch accepts the real form (mirroring the worker-guard
  pattern that already allowed a parenthesised argument list) while keeping every
  existing safety guard: only the canonical receiver may open a barrier scope, an
  enclosing lambda still escapes, and the argument list form remains fail-closed.
  It changes no policy, baseline, exception or authorization bytes, leaves the D4
  gate bit-for-bit identical, leaves the mediation board byte-identical, and the
  report remains shadow-only (reportOnly: true).
