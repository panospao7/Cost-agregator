# DAO getter) that the scanner's receiver text never produces.  The stale
# rows matched zero D4 observations, which the GR-13 shadow reported as the
# only two UNSUPPORTED_SOURCE / GR13_NO_D4_OBSERVATION rows of the run.
#
# This batch REMOVES those two dead policy rows.  It changes NO source
# architecture, NO baseline, and authorizes NOTHING new: each write remains
# authorized by its surviving exact row (DataRetentionWorker.doWork|auditDao
# — PROVEN_WORKER_MEDIATED in the GR-13 shadow; WorkerRunLoggerImpl.start|dao
# — unproven_async_or_escaping_callback, owed later GR-14 work).
#
# Schema deviations from the PR-GR-14 plan (documented, intentional):
#   1. No production Kotlin changes — Pattern E removes dead POLICY entries
#      whose zero-observation status is proven by the GR-13 shadow report;
#      the plan's "prove no remaining caller or mutation observation exists"
#      evidence is the shadow report's UNSUPPORTED_SOURCE classification
#      itself (GR13_NO_D4_OBSERVATION), double-checked against a live
#      scan_db_access observation sink on the start tree.
#   2. behaviorPreservation is N/A per field: no behavior, transaction,
#      cancellation, retry, lifecycle, worker-result, or privacy path is
#      touched by removing authorization rows that never matched a
#      resolution.
#
# Candidate-artifact note (inherited owed-debt, not repaired here):
# db_ownership_policy.signatures.candidate.yml already trails the active
# policy by the 6 post-GR-14b keys recorded in GUARD_EVIDENCE_INDEX.yml;
# this batch widens that drift by 2 removed keys (active 477 -> 475).  The
# sanctioned --generate path regenerates from the archived legacy inputs and
# cannot represent post-activation rows, so the sync stays a dedicated
# truth-sync commit, exactly as GR-14a's drift was handled by 9d145697.
