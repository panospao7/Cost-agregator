# GR-14e — GUARD_UNGUARDED_PATH family closure + mediation prover fixes.
#
# Scope: the 11 DEFINITE_VIOLATION counterexample rows of the GR-13
# remediation seed (family GR14_GUARD_UNGUARDED_PATH), the program's only
# DEFINITE_VIOLATION risk class.
#
# Diagnosis (build/guard-debug/gr14e/, prove_dump.py harness): the shadow's
# direct-site bridge never credited ANY caller barrier because
# _DirectSiteProver._compute compared ProofStatus.PROVEN ("PROVEN") against
# the lowercase literal "proven" (always false), and the precompute prefilter
# requested proofs only for edges whose DIRECT target was a subject
# callable, dropping the transitive hops (caller -> intermediate helper ->
# subject) so guard context leaked "none" through proven intermediates.
# With both fixed, 9 of the 11 rows closed WITHOUT code changes or with the
# entry barriers below:
#   - RecommendationRepository.expireAll x2 (barrier added at the
#     RecommendationInvalidator entries; sole caller chain)
#   - SourceStatsRepository.insertIfNotExists (barrier added at
#     ConfidenceRouter.ensureSourceStats)
#   - FinancialHealthScoreV2.saveToHistory x3 (barrier added at
#     ComputeDashboardWidgetsUseCase.computeHealthScoreV2; transitive path
#     proved only after the prefilter fix)
#   - RecurringLifecycleCoordinator.updateOccurrenceStatus x2 (barriers
#     added at the three unguarded convenience roots skipOccurrence /
#     cancelOccurrence / markOccurrenceMissed)
#   - TransactionLifecycleCoordinator.updateBusinessExpensePatch x2
#     (barrier added at the deprecated updateBusinessFlags shim root)
#
# Remaining debt (1 row, NOT closed here):
#   - GroupLifecycleCoordinator.emitLifecycleEvent ->
#     GroupLifecycleEventDao.insert: recordSettlement's barrier exists
#     (post-GR-12 canonical call, first statement of the entry) but the
#     prover's body parser returns DB_DIRECT_BARRIER_PROOF_UNSUPPORTED for
#     the expression-body `= withContext(ioDispatcher) { ... withTransaction
#     { ... } }` shape, so dominance is unprovable to the engine.  Repair
#     belongs to the parser-capability family (same class of work as the
#     GR-07 expression-body enablement, commit acc563f2); it is NOT a
#     missing-barrier violation.
