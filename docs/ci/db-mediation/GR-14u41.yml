# GR-14u41 — `++`/`--` statement termination in _split_statements
# (tokenizer, one feature).
#
# DEFECT: _CONT_END = set("+-*/%,:?.&|<>!(`[") exists so binary-operator
# line continuations (`val x = a +\n b`) split correctly, but its `+`/`-`
# members also made a STATEMENT-ENDING postfix increment a continuation:
# `duplicatesSkipped++` glued with every following line until a line
# ended without a continuation char.  In
# BankStatementLifecycleProcessor.processBankStatement the L594
# `duplicatesSkipped++` was followed by masked-comment gap lines and the
# multi-line `transactionRunner.runInTransaction(...) {
# checkWritesAllowed(...) ... }` statement; the glued L594-L613
# composite matched _RE_BARRIER_CHECK, whose paren closes mid-statement
# with a non-empty tail, and refused unknown-construct
# (DB_STRUCTURAL_MODEL_BODY_UNSUPPORTED, L594-L613).  This was the ONLY
# remaining tokenizer finding for the callable under full production
# parameters (settled by the u40 orchestrator probe at board c15d5385).
#
# FIX (tokenizer, one feature):
#   - _split_statements: at depth 0 with a statement started, an
#     ADJACENT doubled `+`/`-` (`++`/`--`) terminates the statement
#     through both operator chars, like a `;` (part span
#     `(stmt_start, i+2)`, stmt_start reset, scan index jumps past the
#     second operator char so it cannot re-trigger) — and ONLY under
#     two guards (strict-review refinement):
#       (a) `stmt_start < i` — the operator must not OPEN the
#           statement, so statement-initial prefix forms (`++x`) keep
#           their pre-fix behavior (the line splits at the newline as
#           the one `++x` leaf it always was);
#       (b) the remainder of the line after the operator must strip to
#           empty (_line_remainder_blank) — so MID-STATEMENT forms
#           (`if (cond) x++ else y`, the SourceLinkBackfillWorker
#           L202/L257 shape, and `a++ + b`) keep gluing into the one
#           statement _parse_if/expression parsing handled before.
#   - ADJACENCY remains the increment discriminator, NOT a
#     next-non-whitespace peek: `val y = a +\n +b` (single `+` at end
#     of line, unary `+` leading the next line) keeps the continuation
#     path as ONE statement.
#   - `+=`/`-=` never match (the char after `+`/`-` is `=`) — assignment
#     continuation behavior is intentionally unchanged.  A single
#     `+`/`-` followed by any other char keeps the existing continuation
#     behavior (`val z = a + b` on one line unchanged).
#   - Masked text contains no strings or comments (mask_kotlin_source
#     guarantee), so a doubled `+`/`-` inside a literal can never reach
#     the scan.
#
