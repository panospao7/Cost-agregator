manifestStatement: >
  A call through an interface-typed receiver was always uncertain, even when the
  corpus contains exactly one implementation and no anonymous implementation
  sites, so eighteen rows that have exactly one possible runtime target could not
  be proven.  This batch resolves such a dispatch as an exact edge to the member
  found in scope, guarded by a complete implementor walk, an anonymous-site count
  and an overload check, while every ambiguous shape keeps its uncertainty.  Its
  projection surfaced one counterexample - a restore-internal write against the
  fresh restore database, exempt from the global barrier by design - which was
  triaged as a second sanctioned guard form rather than a defect; with contract V3
  (GR-14u25) expressing that form, the batch lands: eighteen rows become proven
  helpers and the restore write becomes an explicit restore-internal proof, with
  zero counterexamples, zero regressions, a deterministic board, and policy,
  baseline and exception bytes unchanged.
