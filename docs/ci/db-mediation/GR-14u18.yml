manifestStatement: >
  LegacyDataMigrationService migrated categories from a legacy backup into the
  live database without checking the write barrier, so a legacy import could write
  while a restore was in progress.  This batch injects the canonical barrier and
  checks it at the category write path, catching a blocked write locally and
  skipping the table instead of failing the run, which is the same fail-closed
  shape the notification and receipt writers use.  It alters no business rule or
  lifecycle path, changes no policy, baseline, exception or authorization bytes,
  leaves the current mediation board unchanged, and reduces the D6 projection from
  one genuine unguarded call path to none.  Main-source Kotlin compilation passes;
  no test constructs this service.
