#   The final board's `callEdgeStates` moves by +4 exact_synchronous / +1
#   unresolved_target versus the pre-catch run purely because the added
#   catch/log calls are extra corpus edges; proof states and every entry are
#   byte-identical, so this is not a semantics change.
