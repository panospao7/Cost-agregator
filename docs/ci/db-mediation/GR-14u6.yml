#   localGuard none -> direct, reason GR13_UNCERTAIN_CALL_EDGE ->
#   GR13_ALL_PATHS_GUARDED): the 5 capture writers above.
#   proven->unproven regressions: 0.  Deterministic double-run BYTE-IDENTICAL
