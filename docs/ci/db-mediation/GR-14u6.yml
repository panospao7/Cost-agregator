# GR-14u6 — notification-capture write-barrier guards + `super.<member>`
# resolution (ambiguous 174 -> 169; proven_helper 49 -> 54).
#
# This batch is a JOINT fix discovered by the GR-14u5 census and gated by a
# mandatory Step-0 projection.  It has two parts that MUST ship together:
#
# (A) PRODUCTION (the real bug): the notification-capture coordinator/service
#     writers were unguarded at the mutation site and reachable from framework
#     callbacks (`NotificationCaptureService.onListenerConnected` /
#     `onNotificationPosted`).  Note the honest scope: the SERVICE already
#     pre-checked `restoreMaintenanceMode.isWritesAllowed()` for the
#     captureNotification path (`NotificationCaptureService.kt:379-392`,
#     pre-existing), so this was NOT a total absence of a check for
#     capture/captureForRetry — but the writer methods themselves carried no
#     canonical barrier, the onListenerConnected repairer/recovery path
#     (`:292-297`) had no check at all, and every path had a TOCTOU window
#     between any pre-check and the actual write.  The unguarded writers:
#       - NotificationIntakeCoordinator.capture / captureForRetry  -> intakeDao.insertOrIgnore
#       - NotificationIntakePayloadRepairer.repairLegacyPlaintextTransientRows
#                                                                  -> intakeDao.purgeVisiblePayload
#                                                                  -> intakeDao.encryptAndClearVisiblePayload
#       - NotificationIntakeRecoveryScheduler.recoverPending       -> intakeDao.releaseStaleProcessing
#     Their worker sibling `NotificationIntakeWorker` already guards every
#     intake DAO write via `executionGuard.runGuardedWithContext(...)`, and all
#     5 rows are `barrierMode: helper` in the policy — so the unguarded service
#     path was a genuine gap that could interleave writes with a restore.
#     Fix: inject `DatabaseWriteBarrier` into the 3 @Singleton classes; wrap the
#     DAO mutations in `writeBarrier.runWrite(DatabaseAccessOperation(...)) { }`
#     (the canonical direct scope) and catch `DatabaseAccessBlockedException`
#     BOTH at an early `checkWritesAllowed` and around the `runWrite` itself
#     (skip-on-block: capture returns `Dropped`; captureForRetry/repairer/
#     scheduler log-and-return).  Catching at the runWrite is required — the
#     call sites have no enclosing try / CoroutineExceptionHandler, so an
#     uncaught block in the TOCTOU window would crash the process.
#
# (B) ENGINE: `CallGraphBuilder.receiver_fqcn_for_call` handled `this`/`this@X`
#     but had NO `super`/`super@X` case, so `super.onCreate()` in
#     MainApplication.onCreate fell through to `_name_match_targets("onCreate")`
#     (targets = every corpus `onCreate`, including itself) and self-tainted the
#     startup closure -> 137 rows read `unproven_ambiguous_call`.  Kotlin
#     `super.foo()` dispatches deterministically to the supertype chain and can
#     NEVER reach an arbitrary same-named corpus method, so the name-match was a
#     WRONG edge, not conservative.  Fix (`_super_receiver_fqcn`): nearest
#     corpus supertype declaring the member wins; else a resolved EXTERNAL
#     supertype means the call leaves the corpus (`EXACT_SYNCHRONOUS` external,
#     no targets); else fail closed (unchanged `UNRESOLVED_TARGET` name-match).
#
# STEP-0 PROJECTION GATE (mandatory, ran BEFORE the engine edit):
#   build/guard-debug/gr14u6/project_super_fix.py monkey-patches the super fix
#   and diffs the whole board.
#     - run 1 (pre-guard): 5 rows flipped `unproven_ambiguous_call ->
#       counterexample_unguarded_call_path` (GR13_UNGUARDED_CALL_PATH, root
#       framework_callback, local none) -> VERDICT: HARD STOP / escalate.
#       This is what exposed part (A): the false taint was HIDING 5 real
#       unguarded paths.
#     - after part (A): 5 rows flipped to `proven_helper` / GR13_ALL_PATHS_GUARDED
#       (local direct), 0 counterexamples -> VERDICT: PROCEED.
#   Honesty note: the census headline "137 rows decided by super.onCreate" was
#   misleading — removing the edge only promotes the NEXT uncertain edge for
#   ~132 rows (the taint is layered), so this batch proves 5, not 137.
#
# Shadow delta (baseline = committed GR-14u5 board b8f701e1.../290b582e...):
#   entries 406 -> 406 (key sets EQUAL); summary moves EXACTLY:
