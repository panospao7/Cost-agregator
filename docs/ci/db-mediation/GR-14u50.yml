#   2. CHAIN TYPING for local val initializers (_resolve_member_chain +
#      _local_val_type_of_name): when a local val's initializer is a
#      no-arg dotted member chain, the HEAD receiver resolves through the
#      established order (local vals -> loop vars -> fun params -> CAPTURE
#      typing for synthetic members -> owner properties -> corpus types),
#      and each segment matches the corpus callable(s) on (owner, name),
#      contributing its captured return_type to the next segment; the
#      final segment's return type becomes the val's type.  FAIL-CLOSED AT
