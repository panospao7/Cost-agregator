#      DISTINCT return types -> None; a missing return_type -> None; a
#      return type that fails to resolve to exactly one corpus FQCN or
#      known external -> None; argument-bearing segments, properties,
#      assignments, indexing -> None; mutual local-val chains guarded by
#      a resolution-depth cap.  NO inference beyond explicit declared
#      return types.  The explicit-annotation path is distinguished from
#      the ctor-shape fallback text (an annotation `: T` is authoritative;
#      the initializer-head text is not a type).  The u49 loop-var
#      _explicit_iterable_source_type is UNCHANGED (it requires explicit
#      annotations).  _local_val_type now delegates to the chain-aware
#      lookup, falling back to the historical raw-text path byte-
