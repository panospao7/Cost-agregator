manifestStatement: >
  Collaborator receivers declared as dagger.Lazy or Provider were typed as the
  wrapper spelling, which resolves to nothing in the corpus, so every
  accessor chain through them failed closed to an uncertain edge and blocked
  the proof of all mutations inside the wrapped collaborator.  The engine now
  types such receivers as the wrapped type and resolves the accessor chain as
  an ordinary member call, reusing the existing dispatch and name-match
  protections; every other chained shape keeps its fail-closed edge.  Nine
  RecurringRuleLifecycleCoordinator rows move from unproven_ambiguous_call to
  proven_helper; the live board double run is byte-identical, counterexamples
  remain 0, and policy, baseline and exception bytes are unchanged.
