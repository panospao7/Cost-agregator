# GR-14u22 — DI wrapper receivers (`dagger.Lazy` / `Provider`) resolve through
# the wrapped type; `<ident>.get().member()` chains become exact member calls.
#
# ROOT CAUSE (engine): production repositories inject collaborators as
#   `dagger.Lazy<T>` (13 production files).  The `.get` accessor is a control
#   keyword and never becomes a call record, so
#       ruleLifecycleCoordinator.get().activateRule(id)
#   arrived at the resolver as a CHAINED call with an untracked receiver and
#   failed closed to UNRESOLVED_TARGET (`_resolve_invocation`, chained branch).
#   That uncertain edge stops the tier-5 proof for every mutation inside the
#   wrapped collaborator — 9 policy rows of
#   RecurringRuleLifecycleCoordinator (activateRule / advanceNextDate /
#   deactivateRule), all of which are guard-in-body.  Triaged 2026-09-10
#   (GUARDRAIL_STATE_REPORT §3.3.1); this batch is the fix.
#
# CHANGE (callgraph.py, receiver typing only — no proof-tier changes):
#   1. `receiver_fqcn_for_call` unwraps `Wrapper<Inner>` declared texts for the
#      three closed wrapper FQCNs (dagger.Lazy, javax.inject.Provider,
#      jakarta.inject.Provider) at the local/param/property lookup sites, so a
#      wrapper-typed receiver types as the wrapped corpus/external type.
#   2. `_resolve_invocation`'s chained branch first tries
#      `_resolve_di_get_chain`: `<ident>.get().member()` re-resolves as a
#      member call with receiver `ident` (reusing `_resolve_member_call` and
#      all name-match/override protections).  Every non-matching shape keeps
#      the previous fail-closed untracked-chain edge.
#   Soundness: `get()` on these wrappers yields an instance of the wrapped
#   type, so exact dispatch to the wrapped corpus member is what the language
#   guarantees.  Everything not matching the closed wrapper set or the chain
#   shape fails closed exactly as before.
#
# STEP-0 GATE (build/guard-debug/gr14w0/project_lazyget.py — same monkeypatch
#   semantics as the landed edit, projected against board fe40d369):
#       changed rows: 9, ALL unproven_ambiguous_call -> proven_helper
#       new counterexamples: 0 ; proven -> unproven: 0 ; total CE 0
#   Pin: CB-16 `call_binding/cb16_lazy_get_chain.kt` — RED pre-fix
#   (fixture_runner 58/59, exit 1: expected EXACT_SYNCHRONOUS, got
#   unresolved_target), GREEN post-fix.
#
# Validation:
#   - fixture scenarios 59 / 59 (CB-16 RED before, GREEN after the fix)
#   - scripts/db_guard unit tests 235 passed (test_models.py excluded as usual)
#   - engine battery 99 passed
#   - live board double run BYTE-IDENTICAL; delta vs fe40d369 is exactly the
#     9 projected rows; policy sha 7851adc2... and source-root manifest
#     unchanged; counterexamples 0
#
# NOTES
#   - Found during review of the first landed edit: the property branch of
#     `receiver_fqcn_for_call` returns unconditionally on a name match even
#     when resolution is unknown, so an end-of-function unwrap fallback is
#     unreachable for property-typed receivers.  The unwrap is therefore
#     applied AT the three declared-type lookup sites (this is also the
#     semantics the projection validated).
