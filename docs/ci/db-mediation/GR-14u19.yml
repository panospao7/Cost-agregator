# FIX: with SEVERAL star imports, resolve a simple name only when exactly ONE
# candidate is confident — a corpus owner, or a package under a known external root
# (`_KNOWN_EXTERNAL_ROOTS`).  Two plausible candidates stays fail-closed `unknown`.
# The single-star path is untouched.
