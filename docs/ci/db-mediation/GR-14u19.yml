manifestStatement: >
  A file importing several packages with wildcards could not resolve any simple
  type name, so RoomDatabase stayed unknown in AppDatabase.kt and the super.onCreate
  inside its anonymous RoomDatabase.Callback fell back to matching onCreate by name,
  which tainted the reachability of 137 policy rows.  This batch resolves a simple
  name through multiple star imports only when exactly one candidate is confident,
  and stays fail-closed unknown when two packages could both provide it, so no
  ambiguity is ever resolved by guessing.  The change is evidence-backed and
  regression-free: 18 rows move from unproven_ambiguous to proven_helper with zero
  counterexample flips and zero regressions, on a deterministic board, with policy,
  baseline and exception bytes unchanged, and the report remains shadow-only
