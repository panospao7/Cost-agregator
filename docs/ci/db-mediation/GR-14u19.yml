#   137 of the 169 `unproven_ambiguous_call` rows.  Same defect class as GR-14u6,
#   which fixed the four other `super.onCreate` sites (all of which had explicit
#   imports, so `_super_receiver_fqcn` succeeded there and the multi-star gap stayed
#   hidden).
