# GR-14u23 — anonymous `object : T { }` implementor sites are counted per
# corpus type.  Zero board movement by design (latent capability); this is the
# soundness prerequisite for the §4.D4 step-c exactness rule (GR-14u24).
#
# ROOT CAUSE (engine): anonymous objects never enter the owner table
#   (probe_anon.py: 0 owners that look anonymous), so implementor enumeration
#   over named owners alone under-counts wherever an anonymous object
#   implements a corpus interface.  Measured instances on the production
#   corpus: 12 `object : PrivacyGate` sites and 1 `object : WorkerLeaseRegistry`
#   (RestoreMaintenanceMode.kt:36) — the latter makes the named-only count of 1
#   for WorkerLeaseRegistry a FALSE UNIQUE, exactly the shape that would make a
#   naive "exactly one implementor => exact dispatch" rule unsound (fail-OPEN).
#
# CHANGE (callgraph.py):
#   - `build()` scans every file's masked text for anonymous object expressions
#     (`object\s*:\s*` with the colon directly after the keyword, so named
#     `object Name : T` declarations never match) and counts each site once per
#     CORPUS supertype it lists, resolving each supertype through the file's
#     imports (`_scan_anonymous_implementors`, `_split_top_level`).
#   - External supertypes (`object : Runnable`) are not implementors of
#     anything here; constructor arguments do not confuse the tokenisation
#     (depth-aware top-level comma split).
#   - Nothing consumes the counts yet — the capability is stored for the
#     exactness rule, which must also apply it TRANSITIVELY (an anonymous
#     implementor of a sub-interface is an implementor of the super-interface).
#
# Production measurement (this batch, read-only):
#   10 corpus types carry anonymous sites: PrivacyGate 12, RetentionTarget 10,
#   RestoreDatabaseOpener / AiSettingsRepository / DiagnosticEventWriter /
#   OperationRunRecorder / PrivacyAuditLogger / PrivacySettingsRepository /
#   WorkerLease / WorkerLeaseRegistry 1 each.  NONE of the six §4.D4 row
#   interfaces (GroupTransactionCoordinator, SharedExpenseDataPort,
#   LocationCachePort, SavingsGoalRepository, GroupsRepository,
#   DatabaseBackupRepository) has an anonymous site — consistent with the
#   2026-09-10 textual scan.
#
# PINS (scripts/ci/test_gr14u23_anon_implementors.py, 7) — all RED pre-fix:
#   property-initialiser site counted; named object NOT counted; multi-
#   supertype site counts each corpus supertype; constructor args do not break
#   the count; external supertype not counted; two sites count two; interface
#   extension is not an implementor (anonymous counts only list listed types —
#   transitive application is the consumer's duty).
#
# Validation:
#   - engine battery 106 passed (99 + 7 new pins); scripts/db_guard 235 passed;
#     fixture scenarios 59/59.
#   - live board re-captured with the capability landed: BYTE-IDENTICAL to the
#     GR-14u22 board 6a18b4bf... (0 rows move), confirming latency.
#   - policy, baseline and exception bytes unchanged.
