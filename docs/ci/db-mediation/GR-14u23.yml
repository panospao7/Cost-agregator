manifestStatement: >
  Anonymous object expressions implement corpus interfaces without entering the
  owner table, so implementor enumeration over named owners alone under-counted
  wherever one exists - a false unique waiting to mislead any
  single-implementor exactness rule into proving a dispatch that has two
  runtime targets.  The builder now counts anonymous implementor sites per
  corpus supertype over the masked source.  Nothing consumes the counts in
  this batch: it is landed as its own latent capability with its own pins so
  the exactness rule can be built on a complete enumeration and cannot be
  credited with a delta it does not have.  The board remains byte-identical at
  6a18b4bf with policy, baseline and exception bytes unchanged.
