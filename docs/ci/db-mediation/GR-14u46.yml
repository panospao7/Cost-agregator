# GR-14u46 — ENGINE chained-carrier admission: carrier chains of N>=2
# segments (u33/u39/u40 family, fail-closed).
#
# DEFECT: the u33 head-carrier rule and u39 chained-carrier rule both
# require the carrier's trailing lambda to END the statement.  The
# idiomatic Kotlin chain `runCatching { ... }.onFailure { ... }` matched
# neither: the first lambda is followed by `.onFailure { }`, so the whole
# composite fell to the generic opacity gate — a mutation inside the
# runCatching lambda then refused as lambda-escape and blanked the whole
# callable.  This was the LAST blocker for RestoreJournalImporter's 4 rows
# (the barrier checks are real since u45b, but GR-12 could not prove
# dominance over an unmodelable body).  Both `runCatching` and `onFailure`
# are in PRODUCTION_TRANSPARENT_INLINE_METHODS (the closed reviewed set).
#
# FIX (tokenizer, one feature, fail-closed):
#   - _match_carrier_chain: locates the FIRST segment of
#     `[val/var prefix]? [chain.]c1(args?) {` with the u39 prefix charset
#     exclusions (no brace/semicolon/question mark/assignment); the head
#     form (empty prefix — `runCatching {` leading the statement) is
#     admitted too, because the u33 head branch rejects it only on the
#     tail check the chain now satisfies.  Segment-by-segment scanning
#     happens in the parser.
#   - _parse_carrier_chain: each segment's lambda parses recursively as
#     its own TRANSPARENT_SCOPE carrier region (param-header skip,
#     scope-label save/restore); segments are SIBLING regions at statement
#     level, each carrying its OWN scope_method and scope_receiver=None
#     (chain — the u39 precedent: carrier regions are never canonical
#     scopes).  The bridge unions all carrier spans by name-exact
#     membership over the recursive region walk
#     (direct_barrier_bridge._walk_carrier_spans yields children too), so
#     intermediate segments join exactly like nested transparent scopes
#     already do — matching by the last name alone was NOT needed.
#   - CRITICAL fail-closed fallback (u33 hard-stop precedent): the chain
#     is claimed ONLY when the attempt parses cleanly — every segment
#     name in the closed set, the last lambda ending the statement, no
#     structural failure.  On ANY failure the attempt's findings are
#     ROLLED BACK (findings_before checkpoint) and the statement re-parses
#     through the generic opacity gate — pre-u46 behavior exactly.  A
#     claim-then-reject that hard-fails a currently-absorbed no-mutation
