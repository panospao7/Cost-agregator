manifestStatement: >
  This batch stops the mediator from reporting a definitely-unguarded call path
  when what actually happened is that the GR-12 body model refused to model the
  callable and a canonical barrier call precedes the mutation.  A counterexample
  now requires a definitively unguarded site; an unmodelable-but-preceded site is
  reported as unproven with a distinct reason code and its own remediation family.
  The change is provably inert on the current board (byte-identical report), never
  fabricates a proof (the propagation callback stays boolean and only a genuine
  PROVEN grants direct context), and never suppresses a counterexample it has no
  evidence about (an unknown callable still reads unguarded).  No policy,
  baseline, exception or authorization bytes change, and the report remains
  shadow-only (reportOnly: true).
