# GR-14u20 (§D3/§E) — a Kotlin arrow is not a generic close bracket.
# proven_helper 87 -> 155 (+68); unproven_ambiguous_call 151 -> 77;
# 0 counterexamples; 0 regressions.
#
# ROOT CAUSE (engine): the parameter-list comma splitter in `CallGraphBuilder`
#   tracked bracket depth over `"(<["` / `")>]"`.  In a function type such as
#   `onDismiss: () -> Unit` the ARROW's `>` was counted as a CLOSING bracket,
#   driving the depth to -1.  No later comma is ever at depth 0 after that, so
#   the whole parameter list collapsed into ONE unnamed piece:
#       params_named == [("", "onDismiss: () -> Unit,\n amount: ...,\n viewModel: ...")]
#   With no parameter NAMES recorded, `receiver_fqcn_for_call`'s parameter branch
#   could never match, so `viewModel.<member>()` — the receiver of every Compose
#   screen in this app — fell through to the name-match fallback and stayed an
#   UNCERTAIN edge.  Measured: 195 callables had a collapsed parameter list and
#   239 call sites with receiver `viewModel` were unresolved; 91 of the 151
#   unproven_ambiguous_call rows were decided by that one shape.
#
#   `_skip_return_type` ALREADY carried the correct guard, with the exact comment
#   "Kotlin arrow (`->`): not a generic close bracket."  The splitters were simply
#   never given it.  This is a pre-existing parser defect, not a regression.
#
# FIX (engine): make the parameter splitter arrow-aware, reusing that same rule.
#   After the fix: unnamed entries 255 -> 24, arrow-collapsed lists 195 -> 0,
#   unresolved `viewModel` call sites 239 -> 0, parameter entries 10337 -> 10719.
#
# THE STEP-0 GATE FIRED — and that is the point of it.  The first projection of
#   the ENGINE FIX ALONE was a HARD STOP:
#     NEW counterexamples: 2   (updateExpenseMerchant, refreshToken)
#   Resolving `viewModel` made two paths EXACT that had previously been
#   name-matched, and both turned out to be genuine unguarded direct DAO writes:
#     * ExpenseRepository.updateExpenseMerchant -> pendingReviewDao.bulkRenameMerchant
#       (the `applyToAll` branch; the expense write routes through the coordinator,
#       but this cross-table pendingReview write did not).  Reached from
#       TransactionsViewModel.updateMerchant (user edits a merchant, "apply to all").
#     * BankApiIntegration.refreshToken -> bankConnectionDao.updateToken
#       (the demo/stub token-refresh path).  Reached from
#       BankConnectionsViewModel.syncConnection -> BankConnectionLifecycleCoordinator
#       -> BankApiIntegration.syncTransactions -> refreshToken.
#   Both classes ALREADY injected `DatabaseWriteBarrier`; both now check it as the
#   established `writeBarrier.checkWritesAllowed("Class.method")` form.  This is
#   the same shape as GR-14u6, where removing the wrong `super` edge revealed 5
#   genuinely unguarded notification-capture writers.
#
# THE 6 LATERAL MOVES ARE A CORRECTION, NOT A REGRESSION.
#   `unproven_ambiguous_call -> unproven_external_entry` for ExpenseWriteStore.updateMerchant,
#   GroupLifecycleCoordinator.{addExpense,addMember,createGroup} and
#   TransactionLifecycleCoordinator.deleteExpense (x2): their callableKeys are
#   IDENTICAL before and after, so nothing was re-keyed.  Those rows previously
#   reported deciding `unresolved_target`; that edge was a name-match FALSE
#   inbound, and once the receiver resolved it disappeared, leaving the truth:
#   GR13_ZERO_INBOUND_CALL_SITES.  These are exactly the production-dead /
#   owner-decision callables of handoff §E item 3 — they were never reachable,
#   and the engine now says so.
#
# SHADOW DELTA (baseline = the committed GR-14u19 board 2b282860...):
#   entries 406 -> 406 (key sets EQUAL; no row added or removed)
#     proven_helper           87 -> 155   (+68)
#     unproven_ambiguous_call 151 -> 77   (-74)
#     unproven_external_entry  21 -> 27   (+6, the corrected zero-inbound above)
#     proven_worker_mediated   14 (unchanged); async 133 (unchanged)
#   changed rows: EXACTLY 74 = 68 `unproven_ambiguous_call -> proven_helper`
#   + 6 `unproven_ambiguous_call -> unproven_external_entry`.
#   **0 counterexample transitions, 0 proven->unproven regressions.**
#   Deterministic double-run BYTE-IDENTICAL
#   (fe40d36915c153dc4894acf0905dc572cee8767bc9d49284f85c9b6082b7133a).
#   Policy bytes UNCHANGED (7851adc2...); baseline/exception bytes unchanged.
#
# FIXTURE PINS (scripts/ci/test_gr14u20_arrow_param_split.py, 5):
