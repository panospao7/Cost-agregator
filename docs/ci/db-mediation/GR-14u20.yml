manifestStatement: >
  A Kotlin arrow inside a function type was counted as a closing bracket by the
  parameter-list splitter, so any declaration whose parameter list contained a
  lambda type lost every parameter name after it.  Compose screens all take their
  ViewModel as such a parameter, so their calls resolved by name-matching instead
  of by type, and the reachability those calls carry stayed uncertain.  This batch
  makes the splitter arrow-aware, reusing the guard the return-type scanner already
  had, so parameter lists split and parameter receivers resolve to their declared
  types.  Because that made previously ambiguous paths exact, the safety gate
  surfaced two genuinely unguarded direct DAO writes; both are now guarded with the
  canonical barrier.  The result is 68 rows moving from unproven_ambiguous to
  proven_helper and 6 rows correctly reclassified as zero-inbound, with zero
  counterexamples, zero regressions, a deterministic board, and policy, baseline
  and exception bytes unchanged; the report remains shadow-only (reportOnly: true).
