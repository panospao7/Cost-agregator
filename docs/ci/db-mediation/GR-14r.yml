# GR-14r — finality-aware dispatch (engine batch).
#
# STRATEGIC FINDING THIS BATCH RESOLVES (surfaced by GR-14q's
# concretization wave): the engine classified every call to an `override`
# member as VIRTUAL_DISPATCH-uncertain even when the receiver's declared
# type is a FINAL concrete class.  Kotlin finality makes that impossible:
# a final class cannot be subclassed, so the dispatched implementation is
# exactly the member found in scope (its own declaration or the nearest
# inherited one).
#
# Engine changes:
#   - OwnerModel.is_final_class: kind in (class, object) without
#     open/abstract modifiers in the declaration header (defect en route:
#     the detection regex was transport-mangled to literal backspaces and
#     matched nothing — caught by the CB-07 regression fixture flipping,
#     root-caused, fixed before conclusions).
#   - _resolve_invocation: member call on a final-class-typed receiver
#     resolves EXACT (own or nearest-inherited implementation).  Open/
#     abstract receivers keep VIRTUAL_DISPATCH (CB-07 pin); interface
#     receivers keep INTERFACE_DISPATCH (CB-06 pin); generic members stay
#     AMBIGUOUS.
#
# Shadow delta (before = post-GR-14q): counterexamples 2 -> 4 (the honest
# inversion: two unscoped writers through newly exact final-dispatch
# edges — the GR-14k scope queue); ambiguous 176 -> 174.  Net unproven
# 384 -> 383.  The bulk of the interface-dispatch class (2154 edges) is
# interface-TYPED receivers — those need the GR-14t concretization tranche
# (PrivacyGate module decision + per-interface work), not finality.
#
# Validation:
#   - finality module 3/3 (detection pins: open=False, final-derived=True,
#     object=True, abstract=False; final-override→EXACT edge;
#     open-override→VIRTUAL preserved);
#   - fixture battery 58/58 (CB-15 new pin EXACT; CB-07 VIRTUAL contrast
#     intact); mediation suite 27/27; carrier/launch/composable/CLI
#     suites green;
#   - no production Kotlin changed; GATE-00R + Gradle DB owed at merge
#     (carried).
