# GR-14m — argument-lambda false-positive fix: named-argument lambdas are
# not assigned-literal escapes.
#
# PROBLEM (taint-traced to source in this batch): the escaping scanner's
# `= {` heuristic flagged every named-argument lambda (`onConfirm = { ... }`,
# `onDismiss = { ... }`) inside dialog/button call sites as an
# assigned-literal ESCAPE.  Argument lambdas execute in-process with
# inherited context and never leave the enclosing callable — the two UI
# "escapes" blocking the async family (SharedExpenseGroupsScreen.
# CreateGroupDialog, TransactionsScreen) were both this false positive.
#
# Engine fix: the escaping pass computes the paren depth of each `= {`
# match within the callable body; matches at depth > 0 are named-argument
# lambdas and are skipped.  Statement-level assignments (`val x = { ... }`,
# `x = { ... }`) remain at depth 0 and stay ESCAPING (HP-18 pin holds).
#
# Shadow delta (before = post-GR-14l): the escaping taint cleared for the
# two traced rows and the whole dialog-handler surface — async 303 -> 139
# (-164), ambiguous 12 -> 176 (+164; net unchanged) as the affected rows
# now expose their TRUE blockers: 137 unresolved_target (dominant shape:
# Compose screens receive ViewModels via initializer properties like
# `viewModel: XViewModel = hiltViewModel()` — the owner-property pass
# does not yet type-infer constructor-call initializers; local vals
# already get this inference), 14 function_reference, 13 interface_dispatch.
# proven/counterexample/entry: unchanged; diagnostics: unchanged.
#
# GR-14n (next engine batch): owner-property initializer type inference
# (same inference the local-val pass already performs) — targets the 137
# unresolved_target rows.
#
# Validation:
#   - new regression fixture HP-21 (named-argument lambda + guarded caller
#     -> PROVEN_HELPER; would have been escaping-tainted before the fix);
#     corpus 63 -> 64 rows, battery 56/56;
#   - assigned-literal escape pin HP-18 still passes (depth-0 stays
#     escaping); carrier/structured-launch/CLI/mediation suites all green;
#   - no production Kotlin changed; GATE-00R + Gradle DB owed at merge
#     (carried).
