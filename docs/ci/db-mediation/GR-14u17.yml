  the now-unused wrapper.  The change is semantically identical, alters no business
  rule or lifecycle path, changes no policy, baseline, exception or authorization
  bytes, leaves the current mediation board unchanged, and reduces the D6
  projection from seven rows to one genuinely unguarded path with zero
  regressions.  Main-source Kotlin compilation passes; the single targeted test
