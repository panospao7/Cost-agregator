manifestStatement: >
  A transparent scope is just as transparent when its result is bound as when the
  call stands alone, but the tokenizer only recognised the standalone form: its
  scope pattern was anchored directly onto the receiver and method, so a statement
  beginning with val never matched, the lambda took the escape path, and because
  the opacity gate refuses to model a mutation-carrying lambda as opaque the whole
  callable became unsupported.  A barrier that already dominated the mutation was
  thrown away with it.  Allowing a declaration or assignment prefix lets the
  tokenizer see these candidates without granting anything: admission is still
  receiver-exact and import-exact, so a bound scope that cannot be resolved stays
  fail-closed, and no contract or policy byte changes.  Six rows move to proven
  helper, three of which had been reported as zero-inbound dead code, so that list
  needs re-deriving rather than acting on.  Two adjacent options were measured and
  declined as disproportionate: relaxing the anti-shadowing guard to admit
  default-imported inline names buys one net row, and adding a single withLock
  wrapper is clean but would cost a contract revision for one row.  The board is
  deterministic with zero counterexamples and zero regressions.
