manifestStatement: >
  The inherit check used for override and implementor enumeration followed only
  the first resolvable supertype at each hop, so a class that listed an
  interface as a non-first supertype was not recognised as implementing it.  Two
  consequences followed, both weakening the analysis: implementation sets were
  under-counted, and an override could be missed, letting a virtually dispatched
  call be treated as exact.  This batch makes the traversal complete and
  transitive, with cycle-safe termination.  No policy row changes status - the
  defect was latent - so the change is landed as its own batch with its own pins
  rather than credited with a delta, and the board remains byte-identical at
  fe40d369 with policy, baseline and exception bytes unchanged.
