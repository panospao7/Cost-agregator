# GR-14u5 — self-scoped helper precedence (D1 row-classification fix).
#
# Engine-only batch: NO policy bytes change, NO source removal, NO schema
# migration.  The mediation proof engine gains one precedence rule so that
# a helper whose mutation sits inside the writer's OWN canonical direct
# scope proves INDEPENDENT of its callers.
#
# Root cause (D1, docs/ci/DEFERRED_ISSUES_AND_DEBUG_HANDOFF.md §D1):
#   ReviewQueueRepository.recoverStuckReviews is barrierMode: helper and
#   guards its own mutation with
#     writeBarrier.runWrite(DatabaseAccessOperation(...)) {
#         pendingReviewDao.recoverStuckProcessing()
#     }
#   (runWrite is the sole guarded_scope_method on DatabaseWriteBarrier per
#   CANONICAL_BARRIER_CONTRACT_V2).  Its only caller lives in
#   ReviewViewModel's `init {}` block:
#     init { viewModelScope.launch { reviewQueueRepository
#                                       .recoverStuckReviews() } }
#   Class init{} regions belong to no callable in the regex call-graph
#   parser, so the writer registers ZERO inbound edges.  MediationProver
#   .prove() step 4 returned UNPROVEN_EXTERNAL_ENTRY / GR13_ZERO_INBOUND_
#   CALL_SITES for any non-doWork subject with zero inbound edges BEFORE
#   the local-direct evidence could award PROVEN_HELPER — so a self-guarded
#   writer was misreported as a zero-inbound external entry.
#
# Fix (single hunk, scripts/db_guard/mediation_analysis/proof.py):
#   In step 4, exempt a helper whose own mutation-site local context is
#   `direct` from the zero-inbound short-circuit, so it falls through to
#   the local-guard decision (step 7/8) and returns PROVEN_HELPER /
#   GR13_ALL_PATHS_GUARDED.  Same principle already recorded for the
#   GR-14j structured-launch admission ("a writer whose mutations sit
#   behind their own canonical scope proves INDEPENDENT of callers").
#
# Deliberately NOT changed (invariant preserved):
#   * step 5 (uncertain inbound edge stops the proof) is untouched — the
#     exemption covers ONLY the zero-inbound case.  This keeps the GR-14f
#     pin (test_gr14f_inline_carriers.py::
#     test_inline_carrier_site_keeps_uncertain_evidence_when_unbindable)
#     green: a self-scoped helper reached through an unbindable chain stays
#     UNPROVEN_ASYNC/AMBIGUOUS, never proven.
#   * workerMediated semantics untouched.
#   * no new reason code.
#   * SYMMETRY NOTE (strict-review nit): a zero-inbound helper whose OWN
#     worker guard (runGuarded) covers the mutation is NOT exempted — it
#     still reads unproven_external_entry.  Same class as Defect I, but the
#     direction is fail-closed (under-proves, cannot prove an unguarded
#     writer) and 0 current rows have that shape.  Deferred deliberately;
#     worth a one-line mention in a future batch to prevent rediscovery.
#
# Downstream-artifact note (raised in strict review): the GR-13 planning
# seed docs/ci/db-mediation/GR-13_UNPROVEN_WRITERS.yml is generated by
# scripts/ci/generate_gr13_unproven_writers.py from a shadow report, but it
# is NOT regenerated per batch and is NOT gate-validated (no test/gate reads
# it — verified by repo-wide grep).  It is ALREADY stale well before this
# batch (header reportSha256 559f0c81, activePolicySha256 643b526f, 447
# policy rows vs the current 406 / 7851adc2), so GR-14u5 does not newly
# stale it.  Regenerating it here would mix an unrelated 408 -> 343-row
# artifact refresh into a one-hunk engine fix (diff-discipline violation);
# it remains a separate docs task for the merge-time recapture.
#
# Explicitly OUT OF SCOPE (re-scoped, not dissolved):
#   Defect II — init{} block call sites are invisible to the parser.  For
#   an UNGUARDED writer first-called from an init{} block the engine still
#   reports zero-inbound external entry instead of a counterexample (a
#   fail-open gap).  That needs a larger engine change (synthetic
#   class-initialiser callables) with its own fixture-first plan + shadow
#   delta.  Documented in the handoff §D1.
#
# Shadow delta (before = post-GR-14u4 board at 7a07d184; the baseline was
# captured clean this time and is BYTE-IDENTICAL to the committed GR-14u4
# after-artifact b8f701e1..., confirming that shape is reproducible):
