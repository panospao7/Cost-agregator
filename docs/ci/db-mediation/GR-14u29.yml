# GR-14u29 — A1 labelled-return precision (plan item A1,
# docs/ci/GUARDRAIL_ISSUES_PLAN.md).
#
# DEFECT (ledger §B1 / §E-adjacent): the jump-statement handler gated the
# labelled-return refusal on the crude substring test `"@" in rest`.  A
# `return` statement whose rest merely CONTAINS an `@` inside nested text
# (an annotation, or a `return@withTransaction` inside a wrapper lambda of
# a `return try { ... }` statement) was misclassified as an unsupported
# labelled return with the WHOLE statement's span — the try-construct
# parser was never reached.  Three production bodies refused this way
# (probe build/guard-debug/gr14w0/probe_exception_flow.py, re-run on the
# u28 board): BankStatementLifecycleProcessor.processBankStatement,
# ReceiptLinkService.unlinkReceiptFromExpense,
# TransactionLifecycleCoordinator.deleteExpense (14 row-findings).
#
# FIX (tokenizer.py, one gate): the labelled-return branch now requires
# the label to LEAD the rest (`_RE_LABEL_NAME.match(rest_s)`), which the
# old code already computed but only used after the substring gate.  A
# genuinely label-led return keeps the exact old behavior: matching-scope
# returns become LAMBDA_RETURN; mismatched/unscoped ones refuse
# fail-closed (labelled-return / labelled-break / labelled-throw pins
# unchanged).  Statements with a non-leading `@` now reach the existing
# `return try/if/when` construct parsing and the plain-return leaf.
# No contract, policy, baseline, or production-Kotlin change.
#
# FIXTURES (test_tokenizer.py, added BEFORE the fix, both failed on the
# pre-fix tree):
