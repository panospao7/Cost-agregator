    guard-calling reminder snooze action handler; not startup-scheduled;
    no DB mutations, so no mediation rows — the disposition only clears
    the registry/source cross-check mismatch.
- workerFqcn: com.yourname.expensetracker.service.reminder.DismissReminderActionWorker
  disposition: EVENT_ACTION_TRIGGERED_ONE_SHOT
  policyMutationRows: 0
  note: >-
    guard-calling reminder dismiss action handler; not startup-scheduled;
    no DB mutations, so no mediation rows — the disposition only clears
    the registry/source cross-check mismatch.
- workerFqcn: com.yourname.expensetracker.domain.provenance.SourceLinkBackfillWorker
  disposition: NOT_A_WORKER_ROOT_DOCUMENTED
  policyMutationRows: 3
  note: >-
    not a CoroutineWorker at all — a @Singleton backfill callable whose
    three helper-mode policy rows (backfillLegacySource /
    backfillNotificationLinks / backfillReceiptLinks, each
    sourceLinkDao.insert) are guarded by the GR-12 canonical direct
    barrier (writeBarrier.checkWritesAllowed at the top of runBackfill);
    it is outside the worker-guard surface BY DESIGN and is never a
    worker-root candidate.  Documented here as the freeze doc's owed
    disposition; not a worker_root_dispositions.yml entry because that
    file governs CoroutineWorker classes only.

