# GR-14d remediation manifest (PR-GR-14 batch).
#
# Batch scope: the GR14_REGISTER_WORKER_ROOT family of the GR-13
# unproven-writers seed — the five counterexample_non_worker_root rows
# (GR13_WORKER_ROOT_NOT_REGISTERED), all NotificationIntakeWorker doWork
# intake mutations — plus the registry/source gap dispositions owed by
# GR-13_EVIDENCE_FREEZE.md.
#
# Root cause: WorkerRegistry.kt is the SCHEDULING registry — every
# Entry.schedule runs at startup/after restore-resume and every key pairs
# with a WorkerSpec.DEFAULTS pause spec.  NotificationIntakeWorker is a
# coordinator-driven one-shot (NotificationIntakeCoordinator /
# NotificationIntakeRecoveryScheduler) whose absence from WorkerSpec.DEFAULTS
# is documented as intentional in its own doWork source comment; all five
# intake mutations already sit inside the canonical runGuardedWithContext
# scope with requiresDatabaseWrite = true.  Registering it in the scheduling
# registry would be a runtime behavior change (startup scheduling of a
# one-shot with no input data) that the design explicitly rejects.
#
# Remediation (shadow-only tooling + tracked config, NO production Kotlin,
# NO policy/baseline change): a tracked, fail-closed dispositions config
# (config/guards/worker_root_dispositions.yml, closed vocabulary, corpus
# membership + registry-conflict validation) explicitly dispositions the
# worker classes that are intentionally not registry-scheduled.  A
# dispositioned class's doWork root is RECOGNIZED for mediation proof only
# and never changes scheduling, pause semantics, or any runtime behavior.
# This is the freeze doc's required explicit justification of the
# registry/source gap — never a silent pass; any undispositioned mismatch
# still classifies as a counterexample.
#
# Schema deviations from the PR-GR-14 plan (documented, intentional):
#   1. selectedPattern is C (canonical worker scope): the five callables
#      ALREADY satisfy Pattern C structurally; the batch supplies the
#      missing recognition authority (the tracked disposition), not a
#      refactor.  No production Kotlin path changed.
#   2. behaviorPreservation is N/A per field: no transaction, cancellation,
#      retry, lifecycle, worker-result, or privacy path is touched.  The
#      engine change is shadow-only (inspect_db_mediation_proof.py and
#      scripts/db_guard/mediation_analysis/); the normal DB CLI is
#      unchanged (exit 0 / 0 findings / 20 advisory).
