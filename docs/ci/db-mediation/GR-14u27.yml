manifestStatement: >
  A mutation whose own body carries a canonical guard the dominance engine
  proved, or which sits inside a canonical barrier scope, is guarded every time
  it runs: the barrier is evaluated at the mutation site against app-global
  maintenance state, so no caller can change the outcome.  The prover already
  said so - it collapses the effective guard context to "direct" for exactly
  these rows - but two earlier checks returned first, so any uncertain inbound
  edge, or merely the lack of a discoverable exact path, suppressed a proof the
  local evidence had already established.  This batch lets those rows prove from
  their own evidence while keeping every fail-closed behaviour: an
  async-carried mutation is still rejected before this point, an unproven or
  unmodelable local guard still leaves the row unproven, and worker mediation is
  untouched.  It does change one previously pinned policy - a self-guarded row
  with an uncertain caller used to stay unproven - so that expectation is
  amended in two existing pins with their reachability and
  no-external-entry-misdiagnosis assertions preserved verbatim; the change makes
  the prover self-consistent rather than relaxing a safety check.  Ninety-four
  rows move, all of them to proven helper, the board is deterministic with zero
  counterexamples and zero regressions, and policy, baseline and exception bytes
  are unchanged.
