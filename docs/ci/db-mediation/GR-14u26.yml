# GR-14u26 — receiver-aware `::` function-reference resolution.
# unproven_ambiguous_call 58 -> 45 (-13); proven_helper 173 -> 186; the
# function_reference bucket is DRAINED.  0 counterexamples; 0 regressions.
#
# ROOT CAUSE (engine): a `::` member reference was always emitted as ONE
#   uncertain FUNCTION_REFERENCE edge carrying name-matched targets, whatever its
#   receiver.  The reference record carried NO receiver at all: the dedicated
#   `::` scan used `_REFERENCE_RE = re.compile(r"::\s*(name)")`, which captured
#   only the method name, so the invocation path's receiver-typing machinery
#   never had a chance to run for references.
#
#   Measured consequence: 14 rows were decided by such an edge, all of the shape
#   `viewModel::method` where the receiver is a COMPOSE SCREEN PARAMETER with a
#   declared type (`viewModel: ReviewViewModel = hiltViewModel()`) — exactly the
#   parameter typing GR-14u20/u22 already resolve for invocations.  The
#   name-match target counts were 1, 2, 3 and 13, i.e. the engine was guessing
#   among same-named corpus methods when the receiver type was already known.
#
# FIX (engine):
#   * `_REFERENCE_RE` now captures the optional dotted receiver as well as the
#     name, and the scan records it in `receiver_text`.
#   * `_resolve_call`'s reference branch tries `_bound_reference_target()` first:
#     resolve the receiver through `receiver_fqcn_for_call` (local binding,
#     enclosing parameter, owner property, corpus type — the same machinery as
#     an invocation), then require a single non-generic member of that name in
#     the receiver's declaring owner.  On success the edge is EXACT_SYNCHRONOUS
#     bound to that one callable; otherwise today's uncertain name-matched edge
#     is kept unchanged.
#
#   FAIL-CLOSED by construction.  `_bound_reference_target` returns None (so the
#   historical uncertain edge stands) for: no receiver (`::name` could be a
#   top-level function); a CHAINED receiver (`a.b::name` — the qualification path
#   is not modelled for references and guessing it would be unsound); an
#   unresolved or non-corpus receiver; a member absent from the receiver type; a
#   GENERIC member; and an OVERLOADED name (more than one member of that name in
#   the declaring owner).  Each of those is pinned.
#
# BEHAVIOUR CHANGE THE FIXTURE CORPUS CAUGHT (kept, not suppressed): HP-04
#   (`this::writeRow`) previously read FUNCTION_REFERENCE /
#   UNPROVEN_AMBIGUOUS_CALL.  Now the reference binds exactly, so the helper is
#   REACHABLE — and it mutates with no guard of its own, so the honest verdict is
#   COUNTEREXAMPLE_UNGUARDED_CALL_PATH.  The fixture expectations were updated to
#   the new truth, and HP-04 therefore no longer pins "references stay
#   uncertain".  This is the strictness model working: a newly-reachable
#   unguarded writer must surface, not stay hidden behind an uncertain edge.
#   (On the LIVE board no such flip occurs — all 13 rows that moved are already
#   guarded — so the counterexample count stays 0.)
#
# PINS (scripts/ci/test_gr14u26_reference_resolution.py, 7; 3 RED pre-fix):
#   proving: typed receiver + unique member resolves exactly / is not uncertain /
#   `this::member` resolves to the owner.
#   fail-closed (green before and after): bare `::name`; overloaded member;
#   unresolved receiver type; member absent from the typed receiver.
#   Fixture CB-18 (bound reference -> EXACT_SYNCHRONOUS) added; consolidated rows
#   69 -> 70; fixture_runner 62/62.
#
# BOARD (captured twice, byte-identical):
#   sha256 04e6a21a976bad3f3dfb93a9529250761cb963afb1f06c1d35f33f4a8c58d986
#   proven_helper 173 -> 186 | proven_restore_internal 1 | worker 14 |
