manifestStatement: >
  A bound member reference such as viewModel::confirmQuickApprove was treated as
  an uncertain name match even though the receiver's type is declared in the
  same parameter list, so the engine guessed among same-named methods when it
  could have known.  This batch captures the receiver of a `::` reference and
  resolves it exactly when the receiver type is known and declares exactly one
  member of that name, keeping the previous uncertain edge for every shape it
  cannot decide - no receiver, a chained receiver, an unresolved type, or a
  missing, generic or overloaded member.  Thirteen of the fourteen affected rows
  become proven helpers and the remaining one moves to a different unresolved
  edge and stays unproven, so the bucket is emptied without over-claiming.
  Making a referenced member reachable also means an unguarded writer reached
  only through a reference now surfaces as a definite counterexample, which the
  fixture corpus demonstrates (HP-04) and the live board confirms costs nothing
  there.  The board is deterministic with zero counterexamples and zero
  regressions, and policy, baseline and exception bytes are unchanged.
