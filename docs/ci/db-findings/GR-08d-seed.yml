# GR-08 batch 4 (GR-08d) reviewed exact v2 policy seed rows (MIT-DB-08D).
#
# Consumed ONLY via `scripts/migrate_db_policy_signatures.py --seed-rows`.
# This document is a full v2-shaped policy document: it is loaded through
# `scripts.db_guard.policy_v2_loader.load_policy_v2` (exact field set,
# type/enum/signature validation, canonical path syntax, within-document
# duplicate mutation-key rejection) and merged into the generated candidate
# only after seed/legacy duplicate-key rejection.  Seeds never bypass the
# loader, the evidence verifier, or the promotion gates.
#
# Scope: ReviewQueueRepository.kt -- 27 DB_UNAUTHORIZED_MUTATION findings
# collapsing to 19 UNIQUE fingerprints (dedup key: callable identity +
# daoAccessor + daoFqcn + operation; the triage fingerprint excludes
# line/column, so per-call-site repeats share one fingerprint -- e.g.
# approveReview's three pendingReviewDao.updateStatus call sites at lines
# 310/337/343 share one).  Unique count 19 <= the 25-fingerprint batch cap,
# so NO split was required.  This is the REPOSITORY layer -- a legal writer
# layer per docs/architecture/LEGAL_PATHS.md -- so every row is a
# legal-writer EXACT_POLICY authorization.  Expense creation itself is
# delegated to TransactionLifecycleCoordinator.createExpenseDbOnlyV2 (the
# coordinator's own writes live in that file's batch scope); the rows here
# are the review-lifecycle bookkeeping mutations around that delegation.
#
# barrierMode is `helper` for every row: the write barrier runs at the
# repository public entrypoints (writeBarrier.checkWritesAllowed at
# approveReview / rejectReview / approveAllReview / rejectAllReviews /
# markAsRelevant / updatePendingReviewCategoryBulk /
# updatePendingReviewMerchantBulk), not directly before each individual
# mutation inside the transaction bodies, and no direct-barrier proof is
# claimed.
#
# Closure additions (GR-08d blind-spot sweep): THREE closure rows for
# body-carrying @Transaction PendingReviewDao convenience methods the
# findings scanner never reported (GR-08b pattern).  EVERY dao-accessor
# call in ALL mutating-callable bodies was enumerated, not just the
# findings:
#   - markAsRelevant -> pendingReviewDao.upsertByRawNotificationId (line 648)
#   - updatePendingReviewCategoryBulk ->
#     pendingReviewDao.bulkUpdateCategoryByMerchant (line 743)
#   - updatePendingReviewMerchantBulk ->
#     pendingReviewDao.bulkRenameMerchant (line 750)
# All three are legal writer mutations in this same repository-layer class.
# The remaining PendingReviewDao convenience methods called from this file
# (getPending, getPendingByMerchant) are READ-ONLY (SELECT-only bodies) and
# carry no closure obligation.  Seed accounting: 19 findings-derived rows
# PLUS these 3 closure rows = 22 rows.
#
# Constructor-property DAO aliases (GR-08a pattern): all six DAO accessors
# used in this file (pendingReviewDao, rawNotificationDao, expenseDao,
# sourceStatsDao, userCorrectionDao, transactionEventDao) are direct
# constructor properties -- the evidence verifier resolves them natively and
# no alias bridging is required.  expenseDao appears ONLY in a read
# (isDuplicateCurrencyAware) and carries no row.
#
# NOTE: the migration CLI accepts a SINGLE --seed-rows value, so the
# generation run consumes the COMBINED document
# docs/ci/db-findings/GR-08-seeds.yml (GR-08a + GR-08b + GR-08c1 + GR-08c2
# + these rows); passing only this file would drop the earlier batches'
# rows from the rendered candidate.
