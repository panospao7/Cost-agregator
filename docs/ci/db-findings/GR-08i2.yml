# EXACT_POLICY: this is the recurring occurrence persistence layer -- the
# AUTHORITATIVE writer for materialized occurrences per
# docs/architecture/LEGAL_PATHS.md ("GENERATE occurrences":
# RecurringLifecycleCoordinator.generateOccurrences() uses
