# dao-accessor call in the mutating-callable body was enumerated, not just
# the findings: the 15 findings == the 15 mutating DAO call sites, and every
# called mutating DAO method (RecurringOccurrenceDao.insert/update,
# RecurringLifecycleEventDao.insert, PlannedExpenseDao.fulfillByOccurrenceKey,
# RecurringReminderDeliveryDao.insert/suppressByOccurrenceId) is an abstract
# Room-annotated method.  All four touched DAOs (RecurringOccurrenceDao,
# RecurringLifecycleEventDao, PlannedExpenseDao,
# RecurringReminderDeliveryDao) carry ZERO @Transaction methods at all --
# fully abstract interfaces -- so no convenience-method closure row exists
# for this batch.  The only other DAO-accessor calls in the body are the
# read-only lookups occurrenceDao.getByKey (2 sites) and
# reminderDeliveryDao.getByOccurrenceAndWindow (1 site).  Constructor-
# property DAO aliases (GR-08a pattern): all four DAO accessors
