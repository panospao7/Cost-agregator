# GR-08 batch 13, part 1 (GR-08m1) tracked batch manifest -- file group 1:
# data/repository/AiChatRepositoryImpl.kt (repository-layer AI chat history
# writer) + domain/diagnostics/OperationRunRecorder.kt (THE canonical
# run-ledger writer) + data/backup/RestoreJournalImporter.kt (restore-path
# post-restore diagnostics ingestion).
#
# Batch scope (plan): GR-08m covered FIVE files as ONE batch, with a forced
# split if the combined unique fingerprint count exceeded 25.  Scope
# verification against the trusted START report
# (build/guard-debug/gr08m/before.json == trusted GR-08l after-l3.json,
# 121 findings / 20 advisory diagnostics; reference-copy SHA-256 recorded
# below): AiChatRepositoryImpl.kt carries exactly 6 DB_UNAUTHORIZED_MUTATION
# findings collapsing to 6 UNIQUE fingerprints, OperationRunRecorder.kt
# carries exactly 6 findings collapsing to 6 UNIQUE fingerprints, and
# RestoreJournalImporter.kt carries exactly 5 findings collapsing to 4
# UNIQUE fingerprints (dedup key: callable identity + daoAccessor + daoFqcn
# + operation; importLastSuccessJournalIfPresent carries the SAME
# operationRunDao.insert fingerprint at TWO call sites -- the legacy
# zero-event branch line 39 and the get-or-insert branch line 64 -- so the
# two findings share one fingerprint).  Combined batch unique count
# 28 > the 25-fingerprint batch cap, so the batch was SPLIT into GR-08m1
# (this manifest: AiChatRepositoryImpl.kt + OperationRunRecorder.kt +
# RestoreJournalImporter.kt, 17 findings / 16 unique fingerprints) and
# GR-08m2 (ReceiptLifecycleCoordinator.kt + WarrantyExpirationWorker.kt,
# 12 findings / 12 unique fingerprints) per the
# GR-08c/GR-08e/GR-08i/GR-08j/GR-08k/GR-08l precedent; each part is within
# the cap.
#
# AICHATREPOSITORYIMPL LAYER LEGALITY: repository-layer writer for AI
# assistant chat history (AiChatSessionDao + AiChatMessageDao per
# docs/architecture/dao-map.md).  Every mutating method runs
# writeBarrier.checkWritesAllowed at its entrypoint.  History persistence
# is privacy-gated (W34): createSession/appendMessage no-op (return null)
# unless shouldPersistHistory(); appendMessage stores payloadJson only in
# RAW mode and redacts text via CloudPayloadRedactor in REDACTED mode
# (NLP-6), OFF returns null before any write; appendMessage wraps the
# message insert + session updateLastTouched in one database.withTransaction
# (atomicity); clearSession/clearAllHistory/purgeOldMessages are
# user-initiated deletion / retention cleanup via SQL deletes (no raw
# payloads materialized).
#
# OPERATIONRUNRECORDER LAYER LEGALITY: RoomOperationRunRecorder (+ its
# private Handle) is THE canonical run-ledger writer for the
# OperationRun/OperationRunEvent diagnostics ledger used by every pipeline
# (workers, backup/restore, bank, email, export/import) -- the
# diagnostics/logging-persistence writer layer.  All six sites are
# diagnostics-ledger writes: start inserts the RUNNING row with
# sanitizer-sanitized metadataJson; Handle.event inserts a best-effort
# event (CancellationSafe.runCatchingCancellable -- failure is recorded to
# the durable MaintenanceSafeDiagnosticSink and NEVER fails the business
# operation, DDL-016-02); Handle.increment persists counters best-effort
# (DDL-A8-10); Handle.finalizeNonCancellable finalizes inside
# withContext(NonCancellable) via the idempotent finalizeIfRunning
# (WHERE status = 'RUNNING' -- only the first terminal state wins,
# DDL-81-07); recoverStaleRunningOperationRuns is the startup crash
# recovery (finalizeIfRunning to STALE_ABORTED + best-effort
# STALE_RECOVERY event, DDL-A8-11).  CancellationException is never
# swallowed (runCatchingCancellable rethrows; runOperation rethrows after
# recording CANCELLED).  Metadata and exception text pass through
# EventMetadataSanitizer -- no raw payloads persisted; reason-code fields
# carry controlled DiagnosticReasonCode constants only.
#
# RESTOREJOURNALIMPORTER LAYER LEGALITY (restore path): post-restore
# diagnostics ingestion (P7-CURRENT-016).  The restore/reset path bans Room
# after the DB swap (P7-CURRENT-005), so terminal restore/reset trails
# survive only in the on-disk journal until this class ingests them into
# the queryable OperationRun/OperationRunEvent ledger on the NEXT healthy
# startup.  Restore/write barrier semantics: the importer performs no
# direct writeBarrier call -- the temporal barrier is enforced by its ONLY
# caller AppStartupCoordinator.importRestoreJournals(), which runs it on
# startup when writes are allowed (DB healthy); the importer is the
# sanctioned post-barrier ingestion point, not a barrier bypass.  Idempotent
# per event (isSuccessJournalImported/isFailureJournalImported gates,
# get-or-insert run row, per-eventId dedup via getByRunId + importedIds set
# blocking in-journal duplicates too, DDL-F876-13); partial imports keep
# the journal for retry on the next startup; CancellationException is
# rethrown at every handler; exceptionMessage comes from
# event.exceptionMessageSafe (pre-sanitized at journal write time).
#
# Chain-form census AFTER review: ZERO database-chained
# `appDatabase.xxxDao()` mutation receivers and ZERO method-local DAO
# aliases in ALL THREE files.  AiChatRepositoryImpl's
# `database.withTransaction` is the androidx.room.withTransaction
# extension, not a DAO accessor; OperationRunRecorder and
# RestoreJournalImporter do not inject AppDatabase at all.  Every DAO call
# goes through the injected constructor properties sessionDao / messageDao
# / runDao / eventDao / operationRunDao / operationRunEventDao.
# NO accessor-normalization source change is needed for this part.
#
# Closure additions (GR-08m1 blind-spot sweep): ZERO closure rows.  Every
# dao-accessor call in ALL batch callable bodies was enumerated, not just
# the findings: every called mutating DAO method (AiChatSessionDao.insert /
# updateLastTouched / deleteById / deleteAll, AiChatMessageDao.insert /
# deleteOlderThan, OperationRunDao.insert / finalizeIfRunning /
# incrementCounters, OperationRunEventDao.insert) is an abstract
# Room-annotated method -- AiChatSessionDao, AiChatMessageDao,
# OperationRunDao and OperationRunEventDao are fully abstract interfaces
# with ZERO @Transaction methods, so no convenience-method closure row
# exists (the GR-08b/GR-08d pattern does not trigger).  The only other
# DAO-accessor calls in the bodies are read-only lookups
