# GR-08 batch 3a (GR-08c1) reviewed exact v2 policy seed rows (MIT-DB-08C).
#
# Consumed ONLY via `scripts/migrate_db_policy_signatures.py --seed-rows`.
# This document is a full v2-shaped policy document: it is loaded through
# `scripts.db_guard.policy_v2_loader.load_policy_v2` (exact field set,
# type/enum/signature validation, canonical path syntax, within-document
# duplicate mutation-key rejection) and merged into the generated candidate
# only after seed/legacy duplicate-key rejection.  Seeds never bypass the
# loader, the evidence verifier, or the promotion gates.
#
# Scope: the four occurrence/expense-link lifecycle callables of
# RecurringLifecycleCoordinator.kt (linkExpenseToOccurrence,
# reconcileExpenseLinkAfterUpdate, unlinkExpenseFromOccurrenceDetailed,
# updateOccurrenceStatus).  This is the DOMAIN LIFECYCLE COORDINATOR -- the
# MOST authoritative writer layer per docs/architecture/LEGAL_PATHS.md
# (recurring rule mutations MUST go through the recurring rule lifecycle
# coordinator), so every row is a legal-writer EXACT_POLICY authorization.
# The original batch plan (GR-08c, 28 findings) collapsed to 26 UNIQUE
# fingerprints, which exceeds the 25-fingerprint batch cap, so the batch was
# split by callable groups: GR-08c1 carries the occurrence/expense-link
# group (10 findings / 10 unique fingerprints) and GR-08c2 carries the
# reminder-delivery group (18 findings / 16 unique fingerprints).
#
# barrierMode is `helper` for every row: the write barrier runs at the
# coordinator pipeline entrypoints (writeBarrier.checkWritesAllowed at each
# public entry), not directly before each individual mutation inside the
# transaction bodies, and no direct-barrier proof is claimed.
#
# Closure sweep (GR-08c planning): the known findings-scanner blind spot
# (body-carrying @Transaction DAO convenience methods produce NO findings
# but DO produce evidence closure requirements, as in GR-08b's
# upsertByRawNotificationId rows) was enumerated by reading EVERY
# dao-accessor call in ALL batch callable bodies.  Result: ZERO closure
# rows.  Every mutating DAO method called from this file's callables is an
# abstract Room-annotated method (@Insert/@Update/mutating @Query) on the
# four touched DAOs (RecurringOccurrenceDao, RecurringReminderDeliveryDao,
# PlannedExpenseDao, RecurringLifecycleEventDao -- all fully abstract), and
# every one of those call sites produced a findings row.  The remaining
# collaborators are non-DAO types whose internal mutations belong to their
# own files' batch scope: eventWriter (RecurringLifecycleEventWriter ->
# RoomRecurringLifecycleEventWriter.dao.insert lives in
# RecurringLifecycleEventWriter.kt), materializer (RecurringOccurrenceMaterializer.kt),
# and transactionRunner (DomainTransactionRunner, a transaction wrapper).
#
# NOTE: the migration CLI accepts a SINGLE --seed-rows value, so the
# generation run consumes the COMBINED document
# docs/ci/db-findings/GR-08-seeds.yml (GR-08a rows + GR-08b rows + these
# rows + GR-08c2 rows); passing only this file would drop the earlier
# batches' rows from the rendered candidate.
