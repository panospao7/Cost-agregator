# GR-08 batch 11, part 1 (GR-08k1) reviewed exact v2 policy seed rows --
# DB_UNAUTHORIZED_MUTATION EXACT_POLICY authorization for
# di/RetentionModule.kt and data/repository/RecommendationRepository.kt.
#
# Scope verification against the trusted START report
# (build/guard-debug/gr08k/before.json == trusted GR-08j after.json,
# 200 findings / 20 advisory diagnostics): RetentionModule.kt carries
# exactly 10 DB_UNAUTHORIZED_MUTATION findings / 10 UNIQUE fingerprints and
# RecommendationRepository.kt carries exactly 9 findings / 9 UNIQUE
# fingerprints (dedup key: callable identity + daoAccessor + daoFqcn +
# operation; expireOld appears behind BOTH the expireOld and the expireAll
# callables, and saveAll carries two distinct RecommendationDao operations,
# so no two findings share a fingerprint).  ZERO closure rows for BOTH
# files: the blind-spot sweep found every mutating DAO call is an abstract
# Room-annotated method already covered by a finding (all ten RetentionModule
# DAOs and RecommendationDao carry ZERO body-carrying @Transaction convenience
# methods reachable from these files -- PendingReviewDao's mutating
# upsertByRawNotificationId/bulkUpdateCategoryByMerchant/bulkRenameMerchant
# are NOT called from RetentionModule, whose only PendingReviewDao call is
# the abstract redactNotificationTextOlderThan; the remaining
# RetentionModule DAO calls getUnpurgedRawNotificationsOlderThan /
# getUnpurgedScannedReceiptsOlderThan / getUnpurgedIntakeOlderThan and all
# other RecommendationRepository calls are read-only).
#
# Layer legality:
# * RetentionModule is the CANONICAL PRIVACY RETENTION-CLEANUP path --
#   the Hilt registration point of the RetentionTarget set that
#   DataRetentionWorker drives through RetentionRegistry.allTargets
#   (PRIV-441-12).  Every row nulls/redacts/deletes expired RAW PII
#   (raw notification text, OCR text, notification intake payloads,
#   email sensitive fields, pending-review notification text, background
#   job error messages, bank-statement merchant names, AI artifacts and
#   chat messages, pipeline diagnostic events) exactly as AGENTS.md
#   requires: privacy cleanup workers must be able to run so they can
#   delete raw data.  These purges ARE the legal retention mechanism;
#   there is no other writer for them.  Failure handling stays sanitized
#   (errorMessage carries only the RETENTION_PURGE_FAILED:<class-simpleName>
#   constant) and CancellationSafe.runCatchingCancellable rethrows
#   CancellationException.
# * RecommendationRepository is a repository-layer writer (legal writer
#   layer) for dashboard follow-through recommendations; every mutating
#   method runs writeBarrier.checkWritesAllowed directly before the
#   delegated DAO mutation.  It is the SOLE writer of RecommendationDao
#   (only AppDatabase/DaoModule/the DAO file itself also reference it).
#
# ACCESSOR NORMALIZATION (GR-08k1 source change, GR-08e precedent): the
# START findings spell 7 chain-form accessors (appDatabase.aiArtifactDao()
# etc.) and 3 method-local aliases all named `dao` behind THREE different
# DAOs.  No chain-form spelling can pass both the scanner gate (exact
# receiver-text match) and the v2 evidence verifier (canonical accessor
# identity), and the colliding `dao` aliases resolve last-write-wins to one
# identity with three FQCNs (DB_V2_POLICY_DAO_AMBIGUOUS).  The source
# change renames each target's local to its DAO-named accessor
# (rawNotificationDao / scannedReceiptDao / notificationIntakeDao) and
# introduces the same DAO-named locals for the 7 chain-form sites; the
# seed rows spell those normalized accessors.  A wrong accessor spelling --
# including the historical chain text -- stays unauthorized.
#
# barrierMode is `helper` for every row (the GR-08a..k batch convention; no
# direct-barrier proof is claimed -- RetentionModule's barrier is mediated
# by DataRetentionWorker's WorkerExecutionGuard, and every
# RecommendationRepository mutation is preceded by its own
# writeBarrier.checkWritesAllowed call).
#
# Consumed ONLY via the combined generation input
# docs/ci/db-findings/GR-08-seeds.yml (the migration CLI accepts a SINGLE
# --seed-rows value).
