# statement of that callable), so the scanner never reported it as a
# finding.  Evidence: build/guard-debug/gr08i/probe-gr08i-scanner-exp.json
# (empty-policy scan emits line 1032; the active-policy report does not)
# and build/guard-debug/gr08i/probe-gr08i-line1032-history.json (line 1032
# absent from every batch report GR-08a..GR-08h).  CONSEQUENCE FOR THE
# DELTA: the batch resolves 44 findings (14 + 15 + 15), so the rescan delta
# expectation is 291 -> 247, NOT the plan-prose 291 -> 246.
#
# All 14 file findings are DB_UNAUTHORIZED_MUTATION with disposition
# EXACT_POLICY: this is the data/database layer coordinator -- the
# AUTHORITATIVE writer for atomic group mutations per
# docs/architecture/LEGAL_PATHS.md ("Group Mutations": CREATE group ->
# GroupLifecycleCoordinator.createGroup() ->
# GroupTransactionCoordinator.createGroupWithMembersAtomic(); ADD member ->
# GroupTransactionCoordinator.addMemberToGroup(); ADD expense to group ->
# GroupTransactionCoordinator.addExpenseToGroup() / addExpenseWithLink();
# CREATE system expense AND link to group (atomic) ->
# GroupTransactionCoordinator.createSystemExpenseAndLinkToGroup(); ARCHIVE /
# DELETE group -> GroupTransactionCoordinator.permanentlyDeleteGroup() hard
# delete with cascade cleanup via ExpenseGroupDao + GroupExpenseDao +
# GroupMemberDao; FORBIDDEN: ExpenseGroupDao.insert() /
# GroupMemberDao.insert() / GroupExpenseDao.insert() outside
# GroupTransactionCoordinator).
#
# Chain-form census: ZERO database-chained `database.xxxDao()` call sites
# in this file (every finding reports identity.call_form=receiver with a
# plain constructor-property accessor; the injected `database: AppDatabase`
# constructor property is only ever used as the androidx.room.withTransaction
# extension receiver and is NEVER dereferenced as a DAO factory in the file
# body).  NO GR-08e accessor-normalization source change is needed for this
# batch; every seed row spells the constructor-property accessor exactly as
# the scanner reports it.
#
# Closure additions (GR-08i1 blind-spot sweep): ZERO closure rows.  EVERY
# dao-accessor call in every mutating-callable body was enumerated, not just
# the findings: the 14 findings == the 14 uncovered mutating DAO call sites,
# and every called mutating DAO method (ExpenseGroupDao.insert/archiveGroup/
# delete, GroupMemberDao.insert/insertAll/deleteAllForGroup,
# GroupExpenseDao.insert/deleteAllForGroup, ExpenseDao.clearSharedExpenseFlags)
