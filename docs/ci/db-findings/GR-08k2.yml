# files, group 2: domain/groups/GroupLifecycleCoordinator.kt (authoritative
# group lifecycle coordinator) + domain/split/EnhancedSplitManager.kt
# (authoritative split/template manager).
#
# Batch scope (plan): GR-08k covered FOUR files as ONE batch, with a forced
# split if the combined unique fingerprint count exceeded 25 (see
# GR-08k1.yml for the split arithmetic: 37 combined unique > 25).  Scope
# verification against the trusted START report
# (build/guard-debug/gr08k/before.json == trusted GR-08j after.json,
# 200 findings / 20 advisory diagnostics): GroupLifecycleCoordinator.kt
# carries exactly 9 DB_UNAUTHORIZED_MUTATION findings / 9 UNIQUE fingerprints
# and EnhancedSplitManager.kt carries exactly 9 findings / 9 UNIQUE
# fingerprints (dedup key: callable identity + daoAccessor + daoFqcn +
# operation).  This part is within the cap (18 unique).
#
# LAYER LEGALITY:
# * GroupLifecycleCoordinator is the AUTHORITATIVE group lifecycle
#   coordinator named by docs/architecture/LEGAL_PATHS.md ("Group
#   Mutations"): GroupSettlementDao.insert outside it is FORBIDDEN (so the
#   recordSettlement row IS the legal path), GroupLifecycleEventDao.insert
#   directly is forbidden (must go through the coordinator -- these rows ARE
#   the coordinator writing its own audit trail), and removeMember's
#   memberDao.update is the documented leftAt soft-remove path
#   ("GroupMemberDao.delete or leftAt update").  Every public entrypoint
#   runs writeBarrier.checkWritesAllowed first; the removeMember
#   balance-check + soft-remove + event and the recordSettlement
#   settlement + event pairs run inside database.withTransaction.  The five
#   coordinator-method event inserts are the lambda callbacks handed to the
#   GroupTransactionCoordinator port (already authorized in GR-08i1); the
#   emitLifecycleEvent row is the private helper recordSettlement calls
#   inside its transaction (chain-form site: recordSettlement ->
#   emitLifecycleEvent -> lifecycleEventDao.insert; the guard attributes
#   the insert to the immediate enclosing callable).
# * EnhancedSplitManager is the AUTHORITATIVE split/template manager named
#   by docs/architecture/LEGAL_PATHS.md ("Split / Template Mutations"):
#   createTemplate -> SplitTemplateDao.insertTemplate and
#   assignItemsToParticipants -> deleteAllForExpense + insertAssignments
#   inside database.withTransaction are the documented legal paths, and
#   "SplitTemplateDao.insertTemplate outside EnhancedSplitManager" is
#   FORBIDDEN -- the manager is the SOLE writer of SplitTemplateDao and
#   SplitItemAssignmentDao.  updateTemplate/deleteTemplate/
#   setDefaultTemplate/useTemplate/markAssignmentAsPaid are the same
#   manager's owned template/assignment lifecycle with the write barrier
#   checked at each entrypoint.  Split math stays on Money/BigDecimal; no
#   money semantics changed.  CODE_FIX was rejected for BOTH files: the
#   domain split manager writing its own DAOs is the documented legal
#   layer, not a forbidden layer.
#
# barrierMode is `helper` for every row (the GR-08a..k batch convention; no
# direct-barrier proof is claimed even though every covered callable places
# writeBarrier.checkWritesAllowed at its entrypoint).
#
# Chain-form census: ZERO database-chained `database.xxxDao()` mutation
# receivers in EITHER file (every DAO call goes through the injected
# constructor properties; the database.withTransaction calls are the
# androidx.room.withTransaction extension, not DAO accessors).  NO
# accessor-normalization source change is needed for this part.
#
# Closure additions (GR-08k blind-spot sweep): ZERO closure rows for BOTH
# files.  Every mutating DAO call is an abstract Room-annotated method
# already covered by a finding (GroupLifecycleEventDao, GroupSettlementDao,
# GroupMemberDao, SplitTemplateDao and SplitItemAssignmentDao carry no
# body-carrying @Transaction convenience method reachable from these files
# -- GroupMemberDao's mutating setCurrentUser convenience is NOT called
# from GroupLifecycleCoordinator, whose memberDao calls are the reads
# getActiveMembersForGroup/getMemberById plus the abstract update).
#
