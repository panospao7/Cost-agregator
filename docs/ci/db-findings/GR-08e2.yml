# GR-08 batch 5, part 2 (GR-08e2) tracked batch manifest -- DB_UNAUTHORIZED_MUTATION
# exact-policy authorization for WarrantyTrackerRepository.kt.
#
# Batch scope (plan): GR-08e covered TWO files (NotificationRepository.kt 23
# findings + WarrantyTrackerRepository.kt 23 findings) as ONE batch, with a
# forced split if the combined unique fingerprint count exceeded 25.  Scope
# verification against the trusted START report
# (build/guard-debug/gr08e/before.json == trusted GR-08d after.json,
# 391 findings / 20 advisory diagnostics): this file carries exactly 23
# DB_UNAUTHORIZED_MUTATION findings collapsing to 23 UNIQUE fingerprints
# (dedup key: callable identity + daoAccessor + daoFqcn + operation; every
# finding here is a distinct tuple -- no per-call-site repeats).  Combined
# unique count 46 > the 25-fingerprint batch cap, so the batch was SPLIT
# into GR-08e1 (NotificationRepository.kt) / GR-08e2 (this manifest) per the
# GR-08c precedent; each part is within the cap.
# All 23 file findings are DB_UNAUTHORIZED_MUTATION with disposition
# EXACT_POLICY: this file is the REPOSITORY layer and the legal writer for
# warranty and return-window rows per docs/architecture/LEGAL_PATHS.md (the
# file's own KDoc: WarrantyDao/ReturnWindowDao have no lifecycle abstraction
# above them).  Receipt data itself is still reached only through
# ReceiptRepository (getReceiptById / insertReceipt), never through
# ScannedReceiptDao; the manual placeholder path is the documented,
# intentional bypass for FK-satisfying placeholder rows (no OCR, no
# dedupe, no warranty side effects).
#
# GR-08e SOURCE CHANGE (accessor normalization, both parts): 9 of the 46
# batch findings (1 in GR-08e1, 8 here) reached their DAO through the
# database-chained form `database.xxxDao().insert(...)`.  The findings
# scanner reports that receiver text verbatim, but the v2 source-evidence
# verifier resolves chain-form bodies to the Room accessor identity and
# fails any row spelled with the chain text (DB_V2_POLICY_MUTATION_NOT_FOUND
# -- empirically evidenced in build/guard-debug/gr08e/
# probe-accessor-spellings.json), so NO spelling of a chain-form row can
# pass both gates.  The batch normalizes those call sites to the
# codebase-standard constructor-property injection (ReviewQueueRepository.kt
# precedent, GR-08d): `warrantyLifecycleEventDao` is now an @Inject
# constructor property provided by DaoModule.  Room caches DAO instances per
# database, so the injected instance is the same object the chained calls
# returned; every write keeps its surrounding transaction and
# cancellation-safe try/catch semantics (CancellationException rethrown).
# Callable signatures are unchanged, so every finding fingerprint is
# unchanged and the 391 -> 345 delta accounting holds.  End-to-end
# pre-validation with the real scanner over the changed source
# (build/guard-debug/gr08e/probe-delta-final.json): 345 findings, both batch
# files at 0, out-of-batch byte-stable, zero added findings.
#
# Closure additions (GR-08e blind-spot sweep): ZERO closure rows.  EVERY
# dao-accessor call in ALL mutating-callable bodies was enumerated, not just
# the findings: 23 findings == 23 abstract-method mutating call sites, and
# this file calls NO body-carrying @Transaction DAO convenience method
# (WarrantyDao, ReturnWindowDao and WarrantyLifecycleEventDao are fully
# abstract interfaces).  The receiptRepository calls (getReceiptById,
# insertReceipt) are repository-layer delegation through the receipt
# lifecycle path, not DAO accessors, and carry no closure obligation here.
# Read-only callables (getAllWarranties, getActiveWarranties,
# getWarrantiesByStatus, getWarrantiesExpiringSoon, getWarrantyByReceiptId,
# getActiveWarrantyCount, getTotalProtectedValue,
# getTotalProtectedValueAggregate, getAllReturnWindows,
# getActiveReturnWindows, getReturnWindowsExpiringSoon,
# getReturnWindowByReceiptId, extractWarrantyFromReceipt,
# extractWarrantyResult, extractReturnWindow, processReceiptForWarranty)
# perform no mutations.  Constructor-property DAO aliases (GR-08a pattern):
# all DAO accessors except the normalized warrantyLifecycleEventDao are
# direct constructor properties resolved natively by the evidence verifier;
# after the GR-08e source change warrantyLifecycleEventDao is one too.
# Multi-seed note: the migration CLI accepts a SINGLE --seed-rows value, so
