# GR-08l2 + GR-08m1 + GR-08m2 + GR-08n1 + GR-08n2 rows verbatim, 353 rows
# after GR-08n); passing only GR-08n1-seed.yml would drop the earlier
# batches' rows from the rendered candidate.
