# GR-08 batch 14, part 1 (GR-08n1) tracked batch manifest -- file group 1:
# data/repository/AiArtifactRepositoryImpl.kt (repository-layer AI artifact
# writer) + data/repository/BudgetRepository.kt (repository-layer budget
# maintenance/notification writer) + data/repository/MerchantLocationRepository.kt
# (repository-layer merchant-location cache/correction writer).
#
# Batch scope (plan): GR-08n covered SIX files as ONE batch, with a forced
# split if the combined unique fingerprint count exceeded 25.  Scope
# verification against the trusted START report
# (build/guard-debug/gr08n/before.json == trusted GR-08m after.json,
# 92 findings / 20 advisory diagnostics; reference-copy SHA-256 recorded
# below): AiArtifactRepositoryImpl.kt carries exactly 5
# DB_UNAUTHORIZED_MUTATION findings collapsing to 5 UNIQUE fingerprints,
# BudgetRepository.kt carries exactly 5 findings collapsing to 5 UNIQUE
# fingerprints, and MerchantLocationRepository.kt carries exactly 4
# findings collapsing to 4 UNIQUE fingerprints (dedup key: callable
# identity + daoAccessor + daoFqcn + operation; the two BudgetRepository
# deleteAll sites live in DIFFERENT callables -- deleteAll() line 800 and
# restoreDebugSnapshot() line 840 -- so they are distinct fingerprints).
# Combined batch scope (all SIX GR-08n files) is 29 findings / 29 UNIQUE
# fingerprints > the 25-fingerprint batch cap, so the batch was SPLIT into
# GR-08n1 (this manifest: AiArtifactRepositoryImpl.kt + BudgetRepository.kt
# + MerchantLocationRepository.kt, 14 findings / 14 unique fingerprints /
# 16 seed rows) and GR-08n2 (ReceiptRepository.kt + InvestmentTracker.kt +
# SubscriptionManagerEngine.kt, 15 findings / 15 unique fingerprints /
# 15 seed rows) per the GR-08c/GR-08e/GR-08i/GR-08j/GR-08k/GR-08l/GR-08m
# precedent; each part is within the cap.
#
# AIARTIFACTREPOSITORYIMPL LAYER LEGALITY: repository-layer legal writer
# for AI artifact persistence (the AiArtifactRepository interface impl;
# sole writer of AiArtifactDao per docs/architecture/dao-map.md).  Every
# mutating method runs writeBarrier.checkWritesAllowed at its entrypoint
# (upsert/markDismissed/markApplied/deleteExpired/deleteByTargetKey);
# observeLatest/getLatest are read-only.  upsert is the
# OnConflictStrategy.REPLACE artifact upsert keyed by the
# (targetKey, capability, promptVersion, sourceHash) unique index, so
# re-running a provider with the same inputs overwrites rather than
# accumulating duplicates; markDismissed/markApplied preserve the record
# for diagnostics while flipping status; deleteExpired is the TTL cleanup
# (SQL delete, no raw payloads materialized); deleteByTargetKey is the
# target-scoped cleanup (e.g. when a PendingReview is approved/rejected).
#
# BUDGETREPOSITORY LAYER LEGALITY: repository-layer legal writer for
# budgets (the legacy MIT-003 rows already cover addBudget/deleteBudget/
# updateBudget; THIS batch covers the maintenance/notification surface).
# deleteAll is the documented bulk delete: the budget_forecasts -> budgets
# FK is CASCADE (schema v142), so DELETE FROM budgets purges every forecast
# and no orphan forecast rows can survive (P6-CURRENT-005 / P6-P1-15);
# restoreDebugSnapshot is BuildConfig.DEBUG-gated (returns an error in
# release builds) AND write-barrier-checked before any mutation, and both
# of its branches delete all budgets before re-inserting so the CASCADE
# leaves no orphans; updateExceededNotification/updateCriticalNotification/
# updateWarningNotification are the barrier-checked notification-timestamp
# stamps (lastExceededNotifiedAt/lastCriticalNotifiedAt/
# lastWarningNotifiedAt) written by the budget threshold notifier.
#
# MERCHANTLOCATIONREPOSITORY LAYER LEGALITY: repository-layer legal writer
# for the merchant-location cache (MerchantLocation) and user-location
# corrections (MerchantLocationCorrection) -- the sole MerchantLocationDao
# writer.  Every mutating method runs writeBarrier.checkWritesAllowed at
# its entrypoint.  getCachedLocation/getCachedLocationForArea are cache
# lookups that increment the hit counter AFTER the TTL freshness check
# (the hit-count write is the cache's only mutation on the read path);
# saveCorrection is the W13-fixed correction upsert (OnConflictStrategy.
# IGNORE returns 0 on conflict so callers can detect silent failures) that
# then mirrors the user's fix into the main cache; evictStaleCache is the
# TTL maintenance delete (SQL delete by cutoff, no payloads materialized).
#
# barrierMode is `helper` for every row (the GR-08a..m batch convention;
# the write barrier runs at each callable entrypoint and no direct-barrier
# proof is claimed per row).
#
# Chain-form census AFTER review: ZERO database-chained
# `appDatabase.xxxDao()` mutation receivers and ZERO method-local DAO
# aliases in ALL THREE files.  None of the three files injects AppDatabase
# at all; every DAO call goes through the injected constructor properties
# dao (AiArtifactRepositoryImpl/MerchantLocationRepository) and budgetDao /
# categoryDao / expenseDao / budgetForecastDao (BudgetRepository).
# NO accessor-normalization source change is needed for this part.
#
# Closure additions (GR-08n1 blind-spot sweep): TWO closure rows for
# body-carrying @Transaction DAO convenience methods the findings scanner
# never reported (the GR-08b/GR-08d/GR-08l1 pattern):
# * BudgetRepository.restoreDebugSnapshot ->
#   budgetDao.replaceAllAndEnforceActiveScopes (the non-empty snapshot
#   branch; the @Transaction convenience wraps the scope deactivations +
#   insertAll so active-scope enforcement stays atomic with the re-insert);
# * MerchantLocationRepository.saveCorrection -> dao.upsertLocation (the
#   cache-mirror write after the correction insert; the @Transaction
#   convenience wraps the get-or-update/insert so hitCount carry-forward
#   stays atomic).
# Every dao-accessor call in ALL batch callable bodies was enumerated, not
# just the findings.  Out-of-scope blind spots (documented, NOT rowed --
# they live in callables that carry NO findings, so they are outside this
# batch's findings-derived scope, are invisible to the scanner for the same
# convenience-method reason, and the coverage section either cannot see
# them at all or lists them as observation-only): BudgetRepository.
# toggleBudget -> budgetDao.setActiveAndEnforceScope, BudgetRepository.
# updateBudgetOrThrow -> budgetDao.updateAndEnforceActiveScope, and
# MerchantLocationRepository.saveLocation -> dao.upsertLocation.  All other
# DAO-accessor calls in the batch callable bodies are read-only lookups
# (AiArtifactDao.observeLatest/getLatest/getAll, BudgetDao.getAll/getById/
# getActiveBudgets/getAllFlow/getActiveBudgetsFlow, CategoryDao.getAll/
# getAllFlow, ExpenseDao.getOldestExpenseDate/observeExpenseMutationClock,
# MerchantLocationDao.getGlobalByNormalizedName/getByNormalizedNameAndArea/
# getCorrectionCandidates/getLatestGlobalCorrection, MerchantLocationDao.
# count/correctionCount).
#
# Multi-seed note: the migration CLI accepts a SINGLE --seed-rows value, so
# every generation run consumes the combined document
# docs/ci/db-findings/GR-08-seeds.yml (GR-08a + GR-08b + GR-08c1 + GR-08c2
