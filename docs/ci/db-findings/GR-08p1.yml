# GR-08 batch 16 (GR-08p1) tracked batch manifest -- TWELVE files, ONE batch:
# data/privacy/DataRetentionWorker.kt (privacy retention CoroutineWorker) +
# data/repository/SpendingChallengeRepository.kt (spending-challenge
# repository writer) + data/repository/UserCorrectionRepository.kt
# (notification user-correction repository writer) +
# domain/negotiation/SmartBillNegotiationEngine.kt (negotiation engine; sole
# NegotiationOutcomeDao/SubscriptionPriceHistoryDao writer) +
# domain/notification/capture/NotificationIntakeCoordinator.kt (capture-side
# intake writer) + domain/notification/capture/
# NotificationIntakePayloadRepairer.kt (legacy plaintext transient-row
# privacy repairer) + domain/recurring/RecurringPlanProjectionService.kt
# (recurring projection bridge) + domain/recurring/lifecycle/
# RecurringLifecycleEventWriter.kt (THE sanctioned recurring lifecycle event
# writer) + domain/transaction/DefaultExpenseCategoryAssignmentService.kt
# (ExpenseCategoryAssignmentPort implementation) +
# domain/transaction/lifecycle/DebugExpenseAuditWriter.kt (debug-only
# aggregate audit writer) + domain/workers/WorkerRunLogger.kt (worker
# run-diagnostics ledger) + util/JsonExpenseImporter.kt (JSON import path).
#
# Batch scope (plan): GR-08p1 covers the 2-finding files of the trusted
# START report as ONE batch, with a forced split if the combined unique
# fingerprint count exceeded 25.  Scope verification against the trusted
# START report (build/guard-debug/gr08p/before.json == trusted GR-08o
# after-residual.json, 39 findings / 20 advisory diagnostics;
# reference-copy SHA-256 recorded below): TWELVE files carry exactly 2
# DB_UNAUTHORIZED_MUTATION findings each (24 findings).
# DataRetentionWorker.kt's two auditDao.insert sites
# (RAW_NOTIFICATION_RETENTION line 196 and RAW_OCR_RETENTION line 206)
# share ONE fingerprint; every other file contributes 2 distinct
# fingerprints (dedup key: callable identity + daoAccessor + daoFqcn +
# operation).  Combined batch scope is 24 findings / 23 UNIQUE
# fingerprints <= the 25-fingerprint batch cap, so NO split was required
# and GR-08p2 was NOT created (unlike
# GR-08c/GR-08e/GR-08i/GR-08j/GR-08k/GR-08l/GR-08m/GR-08n).
#
# LAYER ADJUDICATIONS:
# * DataRetentionWorker is a REAL CoroutineWorker (WorkerExecutionGuard
#   verified in the doWork body: the ENTIRE mutating body runs inside
#   executionGuard.runGuardedWithContext(WorkerGuardRequest(workerName =
#   "data_retention", requiredCapabilities = emptyList(),
#   allowDuringBackupExport = false, blockedPolicy = BlockedPolicy.RETRY,
#   ...))).  The two audited writes are the P8 privacy-retention audit
#   trail after the checkpointed purge loop: one PrivacyAuditEvent per
#   successful raw-notification / raw-OCR purge (counts and retention days
#   only -- never purged payloads).  requiredCapabilities is EMPTY so the
#   privacy-cleanup path stays runnable (never gated on the raw-retention
#   capability it enforces).  CancellationException is rethrown at both
#   catch sites; per-target failures are counted and the run continues.
#   The active policy's legacy MIT-003 row spells the DERIVED accessor
#   identity (privacyAuditDao) while the scanner reports the method-local
#   alias (val auditDao = appDatabase.privacyAuditDao()) verbatim, so the
#   exact-policy match never fired; the row spells the SOURCE local alias
#   auditDao (the GR-08a alias bridge resolves it to the same
#   privacyAuditDao identity for the evidence verifier's daoFqcn
#   cross-check).
# * SpendingChallengeRepository is the repository-layer legal writer for
#   spending-challenge persistence (sole SpendingChallengeDao mutation
#   writer): both callables are writeBarrier.checkWritesAllowed-checked at
#   their entrypoints; deactivateChallenges short-circuits an empty
#   id-list before any write.
# * UserCorrectionRepository is the repository-layer legal writer for
#   notification user-correction persistence (sole UserCorrectionDao
#   mutation writer): both callables are barrier-checked at their
#   entrypoints; deleteAll is a SQL DELETE (no payloads materialized);
#   every other method is a read-only lookup.
# * SmartBillNegotiationEngine is the domain negotiation ENGINE and the
#   sole writer of NegotiationOutcomeDao and SubscriptionPriceHistoryDao
#   (codebase-wide census).  recordNegotiationOutcome is barrier-checked
#   at entry, validates the outcome (E1-REMAINING-001 currency
#   normalization before validation/persistence), then inserts the
#   NegotiationOutcome row and -- only for SUCCESS/PARTIAL with a valid
#   newPrice -- the SubscriptionPriceHistory row (PR8 monthly-equivalent
#   back-conversion) inside ONE database.withTransaction; the subscription
#   amount update is delegated to RecurringExpenseRepository.update (the
#   recurring-rule legal writer).  CancellationException is rethrown;
#   failures return Result.failure with the transaction rolled back.
# * NotificationIntakeCoordinator is the capture-side intake writer (the
#   machine counterpart of the GR-08i3-authorized NotificationIntakeWorker
#   processing side): capture is fingerprint-deduplicated
#   (existsByFingerprint first; insertOrIgnore -1 is the Dropped path),
#   DO_NOT_STORE never reaches durable intake, TRANSIENT modes store only
#   encrypted transient-payload columns with visible fields nulled, and
#   the worker is enqueued only after a successful insert.
#   captureForRetry persists the deferred-capture row (encrypted transient
#   payload or DEFERRED metadata-only) under a DEFERRED_-prefixed
#   fingerprint.  Raw notification text is persisted ONLY in the
#   STORE_RAW mode the user explicitly granted.
# * NotificationIntakePayloadRepairer is the privacy repair writer for
#   legacy plaintext transient rows: a batched (100-row batches, 100-batch
#   cap) get-then-fix loop -- terminal rows get their visible payload
#   columns purged (SQL update, no payloads materialized), non-terminal
#   rows get the plaintext encrypted and cleared in one targeted SQL
#   update.  Invoked from NotificationCaptureService at listener startup;
#   per-row failures are logged and the batch continues.
# * RecurringPlanProjectionService is the recurring-projection writer
#   bridging the recurring lifecycle system and the forecasting pipeline:
#   projectFromRule is barrier-checked at entry and materializes
#   occurrences via RecurringLifecycleCoordinator.generateOccurrences (the
#   GR-08c1 recurrence-expansion authority) before inserting;
#   projectFromOccurrencesInCurrentTransaction deliberately has NO
#   barrier/transaction of its own and is invoked ONLY from
#   RecurringRuleLifecycleCoordinator createRule/activateRule/updateRule
#   bodies INSIDE their barrier-checked database.withTransaction blocks.
#   Both variants guard every insert with a sourceOccurrenceKey existence
#   check (idempotent re-runs create nothing).
# * RecurringLifecycleEventWriter (RoomRecurringLifecycleEventWriter) is
#   THE sanctioned recurring lifecycle event writer: its own writes ARE
#   the audit trail itself -- the RecurringLifecycleEvent rows emitted by
#   the GR-08c1-authorized RecurringLifecycleCoordinator and the
#   GR-08f-authorized RecurringRuleLifecycleCoordinator through the
#   Hilt-bound interface
#   (DiagnosticsModule.bindRecurringLifecycleEventWriter).
#   writeCritical never swallows failures; writeDiagnostic is best-effort
#   but rethrows CancellationException.
# * DefaultExpenseCategoryAssignmentService is the domain
#   ExpenseCategoryAssignmentPort implementation (the P3-03EA-09 default
#   category assignment path): barrier-checked at entry, then ONE
#   database.withTransaction containing the get-if-unset check, the
#   targeted ExpenseDao.updateCategory and the EXPENSE_CATEGORY_ASSIGNED
#   TransactionEvent audit row (atomic update + event).
#   CancellationException is rethrown.
# * DebugExpenseAuditWriter is the debug-only aggregate-operation audit
#   writer: its two callables are invoked ONLY from
#   ExpenseRepository.deleteAllExpenses / restoreDebugSnapshot, which gate
#   with requireDebugExpenseOperation (BuildConfig.DEBUG throw in release)
#   AND writeBarrier.checkWritesAllowed, and run the writer's inserts
#   inside the caller's database.withTransaction.  Events carry counts and
#   controlled constants only (debugOnly=true) -- never expense payloads.
# * WorkerRunLogger is the worker run-diagnostics logger (the PR8/PR12B
#   BackgroundJobRun ledger every guarded worker writes through):
#   WorkerRunLoggerImpl.start inserts the RUNNING row inside the workers'
#   WorkerExecutionGuard.runGuardedWithContext contexts (the GR-08i3
#   precedent explicitly cites this callable as workerMediated); the
#   nested Handle.terminal is the PR12B mutex-serialized terminal state
#   machine (5s withTimeout backstop; affected==1 durable; affected==0
#   with a non-RUNNING row already-terminal; TimeoutCancellationException
#   classified NotDurable and retriable, never marked complete; plain
#   CancellationException rethrown).  All reason/error fields carry
#   sanitized controlled codes only.  The legacy MIT-003 start row spells
#   the DERIVED accessor identity (backgroundJobRunDao) while the scanner
#   reports the constructor-property alias (dao); the rows spell the
#   SOURCE alias dao.  Handle.terminal is a NEW row (the nested-class
#   terminal writer was never rowed before this batch).
# * JsonExpenseImporter is the JSON import path (ImportCoordinator
#   JSON_V1/JSON_V2 formats, debug import UI): ALL expense mutations route
#   through TransactionLifecycleCoordinator.createExpense (the
#   authoritative expense path); the audited categoryDao.insert sites are
#   the get-or-create category convenience inside parseV2Row/parseV1Row
#   (getByName first; default icon/color insert only when the named
#   category does not exist).
#
# barrierMode is `workerMediated` for the DataRetentionWorker.doWork and
# WorkerRunLogger (start + Handle.terminal) rows (the writes run inside
# WorkerExecutionGuard.runGuardedWithContext contexts -- the established
# mode of the active policy's worker rows; no direct-barrier proof is
# claimed) and `helper` for every other row (the GR-08a..o batch
# convention: the barrier runs at the callable entrypoint, at the
# barrier-checked transactional callers, or the write is the sanctioned
# audit/intake surface itself; no direct-barrier proof is claimed per
# row).
#
# Chain-form census AFTER review: ONE database-chained
# `appDatabase.xxxDao()` mutation receiver existed at batch start --
# SmartBillNegotiationEngine.recordNegotiationOutcome's
