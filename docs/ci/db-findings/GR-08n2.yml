# 15 unique fingerprints / 15 seed rows) per the
# GR-08c/GR-08e/GR-08i/GR-08j/GR-08k/GR-08l/GR-08m precedent; each part is
# within the cap.
#
# RECEIPTREPOSITORY LAYER LEGALITY: repository-layer legal writer for the
# receipt MAINTENANCE surface (the match-mutation and insert surfaces are
# retired or delegated: saveMatchSuggestion is a documented no-op,
# insertReceipt/insertOrResolve delegate to ReceiptInsertResolver, and the
# lifecycle paths live in ReceiptLifecycleCoordinator (GR-08m2) /
# ReceiptMatchLifecycleService (GR-08h) / ReceiptLinkService (GR-08j1) --
# all already authorized).  Every mutating method runs
# writeBarrier.checkWritesAllowed at its entrypoint:
# updateCategorizationStatus stamps itemCategorizationStatus for the
# categorization pipeline; deleteReceipt (WARNING-deprecated shim pointing
# at ReceiptLifecycleCoordinator.deleteReceipt) deletes the row after the
# image cleanup; clearAllScannedReceipts (WARNING-deprecated, P3-0D5-09)
# deletes all rows after per-receipt image cleanup; clearMatchForReceipt
# (ERROR-deprecated shim pointing at
# ReceiptMatchLifecycleService.clearMatchForReceipt -- the GR-08h legal
# path; Kotlin callers are compile-time blocked, the body survives only as
# a source-compatibility shim) clears the match fields via the abstract
# @Update; writeReceiptEvent is the private Pipeline-3 event helper --
# best-effort (failures are logged and never fail the business operation),
# CancellationException is rethrown (catch order: CancellationException
# rethrow, then generic catch), and the message/errorDetails payloads are
# bounded with take(500) before persistence.
#
# INVESTMENTTRACKER LAYER LEGALITY: THE domain investment tracker -- the
# sanctioned investment writer per docs/architecture/LEGAL_PATHS.md
# "Investment Mutations": ADD HOLDING names
# InvestmentTracker.addHolding(investment) (DatabaseWriteBarrier check ->
# validation -> database.withTransaction { InvestmentDao.insert +
# InvestmentValueDao.insert initial snapshot + InvestmentTransactionDao.
# insert type="BUY" }) and UPDATE PRICE names
# InvestmentTracker.updatePrice(investmentId, newPrice)
# (DatabaseWriteBarrier check -> require(newPrice > 0 finite) ->
# database.withTransaction { InvestmentDao.updatePrice +
# InvestmentValueDao.insert snapshot with dayChange/dayChangePercent });
# FORBIDDEN: InvestmentDao.insert()/update()/updatePrice() outside
# InvestmentTracker, InvestmentValueDao.insert() outside the
# updatePrice/addHolding transaction, InvestmentTransactionDao.insert()
# outside the addHolding transaction.  Validation (symbol/name/quantity/
# purchasePrice/currency/purchaseDate/currentPrice/purchaseFees) runs
# BEFORE any write; both callables are barrier-checked and atomic.
#
# SUBSCRIPTIONMANAGERENGINE LAYER LEGALITY: THE subscription ENGINE -- the
# sanctioned engine surface per docs/architecture/LEGAL_PATHS.md
# "Subscription Mutations": CREATE/ACCEPT names validateAndCreate (barrier
# check -> validation -> database.withTransaction { subscription insert via
# RecurringExpenseRepository + baseline SubscriptionPriceHistoryDao.insert
# gated on request.recordPriceHistory }); the FORBIDDEN clause
# "SubscriptionCandidateDao.insert/delete outside
# validateAndCreate/acceptCandidate" names acceptCandidate as the second
# sanctioned engine surface (barrier check -> validation ->
# database.withTransaction { subscription insert + baseline price history +
# candidateDao.markAsConverted }); RECORD price change names
# recordPriceChange (barrier check -> validation -> existence check ->
# change-gated database.withTransaction { priceHistoryDao.insert + REC-7
# subscription amount update via RecurringExpenseRepository }); RECORD
# usage names recordUsage (barrier check -> SubscriptionUsageDao.insert
# within transaction scope, the documented single-write form).  FORBIDDEN:
# SubscriptionPriceHistoryDao.insert() outside
# recordPriceChange/validateAndCreate/acceptCandidate and direct DAO
# mutations bypassing engine validation -- every row here IS the engine
# surface, so no bypass is created.
#
# barrierMode is `helper` for every row (the GR-08a..m batch convention;
# the write barrier runs at each callable entrypoint and no direct-barrier
# proof is claimed per row).
#
# Chain-form census AFTER review: ZERO database-chained
# `appDatabase.xxxDao()` mutation receivers and ZERO method-local DAO
# aliases in ALL THREE files.  ReceiptRepository, InvestmentTracker and
# SubscriptionManagerEngine each inject AppDatabase but use it ONLY as the
