# Closure additions (GR-08c planning): NONE.  The known findings-scanner
# blind spot (body-carrying @Transaction DAO convenience methods produce NO
# findings but DO produce evidence closure requirements -- GR-08b carried 2
# such closure rows for pendingReviewDao.upsertByRawNotificationId) was
# enumerated by reading EVERY dao-accessor call in ALL 12 mutating-callable
# bodies of this file, not just the findings.  Result: ZERO closure rows.
# Every mutating DAO method called from this file's callables is an abstract
# Room-annotated method (@Insert/@Update/mutating @Query) on the four touched
# DAOs (RecurringOccurrenceDao, RecurringReminderDeliveryDao,
# PlannedExpenseDao, RecurringLifecycleEventDao -- all fully abstract, no
# body-carrying @Transaction convenience methods), and every one of those
# call sites produced a findings row (28 findings == 28 mutating call sites).
# Non-DAO collaborators carry no closure obligations for THIS file:
# eventWriter (RecurringLifecycleEventWriter; its RoomRecurringLifecycleEventWriter
# implementation's dao.insert call sites live in RecurringLifecycleEventWriter.kt
# -- that file's own batch scope), materializer (RecurringOccurrenceMaterializer.kt),
# and transactionRunner (DomainTransactionRunner, a transaction wrapper, not a
# DAO accessor).  Seed accounting is therefore findings-derived rows only:
# GR-08c1-seed.yml carries exactly 10 rows.
# Multi-seed note: the migration CLI accepts a SINGLE --seed-rows value, so
