# EXACT_POLICY: this file is the DOMAIN LIFECYCLE COORDINATOR, the MOST
# authoritative writer layer per docs/architecture/LEGAL_PATHS.md (recurring
# rule mutations MUST go through the recurring rule lifecycle coordinator).
