# 418 findings / 20 advisory diagnostics): the file carries exactly 27
# DB_UNAUTHORIZED_MUTATION findings collapsing to 19 UNIQUE fingerprints
# (dedup key: callable identity + daoAccessor + daoFqcn + operation; the
# triage fingerprint excludes line/column, so per-call-site repeats share
# one fingerprint -- approveReview's three pendingReviewDao.updateStatus
# call sites at lines 310/337/343 share one, its three
# sourceStatsDao.decrementPending call sites at lines 295/336/342 share one,
# its two sourceStatsDao.incrementDuplicate call sites at lines 335/341
# share one, and markAsRelevant's four userCorrectionDao.insert call sites
# at lines 629/638/664/672 share one).  Unique count 19 <= the
# 25-fingerprint batch cap, so NO split was required (GR-08c precedent
# applied: a split is forced only above 25).
# All 27 file findings are DB_UNAUTHORIZED_MUTATION with disposition
# EXACT_POLICY: this file is the REPOSITORY layer, a legal writer layer per
# docs/architecture/LEGAL_PATHS.md.  Expense creation itself is delegated to
# TransactionLifecycleCoordinator.createExpenseDbOnlyV2 inside the same
# transactions (the coordinator's writes live in that file's batch scope);
# the authorized rows are the review-lifecycle bookkeeping mutations around
# that delegation (status transitions, per-source counters, relevance
# bookkeeping, provenance events, correction records, crash recovery).
#
# Closure additions (GR-08d blind-spot sweep): THREE closure rows.  The
# known findings-scanner blind spot (body-carrying @Transaction DAO
# convenience methods produce NO findings but DO produce evidence closure
# requirements -- GR-08b carried 2 such rows for
# pendingReviewDao.upsertByRawNotificationId) was enumerated by reading
# EVERY dao-accessor call in ALL mutating-callable bodies of this file, not
# just the findings.  Result: 27 findings == 27 abstract-method mutating
# call sites, PLUS 3 unevidenced-by-findings mutations through
# body-carrying @Transaction PendingReviewDao convenience methods:
#   - markAsRelevant -> upsertByRawNotificationId (line 648)
#   - updatePendingReviewCategoryBulk -> bulkUpdateCategoryByMerchant
#     (line 743; wraps bulkUpdateCategoryByMerchantKey +
#     bulkUpdateCategoryByMerchantName)
#   - updatePendingReviewMerchantBulk -> bulkRenameMerchant (line 750;
#     wraps bulkRenameMerchantByKey + bulkRenameMerchantByName)
# All three are legal writer mutations in this same repository-layer class,
# so the seed closure (GR-08d-seed.yml / GR-08-seeds.yml) carries 22 rows:
# the 19 findings-derived rows mirrored below PLUS these 3 closure rows.
# Fingerprint accounting is unchanged (27 findings / 19 unique
# fingerprints -- the closure mutations had no findings), so
# selectedFingerprints and counts stay findings-derived only.
# Remaining callables carry no closure obligations: the read-only callables
# (getAllPendingReviews, getPendingReviewsBatch, getPendingReviewCount,
# getReviewById, getPendingReviewWithReceiptById,
# hasCanonicalApprovalDuplicate, getPendingReviewsByMerchant) perform no
# mutations; approveAllReview / rejectAllReviews delegate to
# approveReview / rejectReview (same-class calls, not DAO accessors) and
# their own DAO call (getPendingUncapped) is a read; runPostCommitSafely is
# a post-commit wrapper with no DAO access.  The read-only
# @Transaction PendingReviewDao convenience methods reached from this file
# (getPending, getPendingByMerchant) have SELECT-only bodies.
# Constructor-property DAO aliases (GR-08a pattern): all six DAO accessors
# (pendingReviewDao, rawNotificationDao, expenseDao, sourceStatsDao,
# userCorrectionDao, transactionEventDao) are direct constructor properties;
# the evidence verifier resolves them natively and no alias bridging is
# required.  expenseDao appears only in a read.
# Multi-seed note: the migration CLI accepts a SINGLE --seed-rows value, so
# every generation run consumes the combined document
# docs/ci/db-findings/GR-08-seeds.yml (GR-08a + GR-08b + GR-08c1 + GR-08c2
