# GR-08 batch 2 (GR-08b) reviewed exact v2 policy seed rows (MIT-DB-08B).
#
# Consumed ONLY via `scripts/migrate_db_policy_signatures.py --seed-rows`.
# This document is a full v2-shaped policy document: it is loaded through
# `scripts.db_guard.policy_v2_loader.load_policy_v2` (exact field set,
# type/enum/signature validation, canonical path syntax, within-document
# duplicate mutation-key rejection) and merged into the generated candidate
# only after seed/legacy duplicate-key rejection.  Seeds never bypass the
# loader, the evidence verifier, or the promotion gates.
#
# Scope: the three remaining NotificationProcessingPipeline.kt callables
# (repository layer = legal writer layer; expense creation itself goes
# through TransactionLifecycleCoordinator.createExpenseDbOnlyV2 per
# docs/architecture/LEGAL_PATHS.md).  barrierMode is `helper` for every
# row: the write barrier runs in the pipeline entrypoints (process /
# processBatch, NotificationProcessingPipeline.kt lines 187/212), not
# directly before each mutation in these bodies, and no direct-barrier
# proof is claimed.
#
# Closure additions (GR-08b evidence run): the GR-08a alias-bridge fix made
# the constructor-property accessor `pendingReviewDao` fully evidenced, so
# the v2 evidence verifier now sees one additional REAL mutation per
# callable that the FINDINGS report never carried (the findings scanner's
# gating did not report the body-carrying @Transaction PendingReviewDao
# convenience method upsertByRawNotificationId).  Both are legal writer
# mutations in this same repository-layer class, so two closure rows are
# added: processInternal and handleNeedsReviewInTransaction each gain
# pendingReviewDao.upsertByRawNotificationId (13 rows total; the 11
# findings-derived rows are unchanged).
#
# NOTE: the migration CLI accepts a SINGLE --seed-rows value, so the
# generation run consumes the COMBINED document
# docs/ci/db-findings/GR-08-seeds.yml (GR-08a rows + these rows); passing
# only this file would drop the GR-08a rows from the rendered candidate.
