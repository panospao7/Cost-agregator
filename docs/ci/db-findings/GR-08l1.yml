# EXPENSEREPOSITORY LAYER LEGALITY: repository-layer read/maintenance facade
# for expenses.  Its 8 mutating sites are the documented
# EXPENSE_DAO_MUTATION_ALLOWLIST maintenance/debug paths, each carrying
# @OptIn(RestrictedExpenseDaoMutation::class) +
# writeBarrier.checkWritesAllowed at the entrypoint:
# * deleteAllExpenses / restoreDebugSnapshot: BuildConfig.DEBUG-gated
