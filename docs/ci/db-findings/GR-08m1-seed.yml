# Scope verification against the trusted START report
# (build/guard-debug/gr08m/before.json == trusted GR-08l after-l3.json,
# 121 findings / 20 advisory diagnostics): AiChatRepositoryImpl.kt carries
# exactly 6 DB_UNAUTHORIZED_MUTATION findings / 6 UNIQUE fingerprints,
# OperationRunRecorder.kt carries exactly 6 findings / 6 UNIQUE
# fingerprints, and RestoreJournalImporter.kt carries exactly 5 findings
# collapsing to 4 UNIQUE fingerprints (dedup key: callable identity +
