# (line 64) -- so the two findings share one fingerprint and one seed row).
# Combined batch scope (all FIVE GR-08m files) is 29 findings / 28 UNIQUE
# fingerprints > the 25-fingerprint batch cap, so the batch was SPLIT into
# GR-08m1 (this manifest: AiChatRepositoryImpl.kt + OperationRunRecorder.kt
# + RestoreJournalImporter.kt, 17 findings / 16 unique fingerprints) and
# GR-08m2 (ReceiptLifecycleCoordinator.kt + WarrantyExpirationWorker.kt,
# 12 findings / 12 unique fingerprints) per the
# GR-08c/GR-08e/GR-08i/GR-08j/GR-08k/GR-08l precedent; each part is within
# the cap.
#
# Layer legality:
# * AiChatRepositoryImpl is the repository-layer writer for AI assistant
#   chat history (AiChatSessionDao + AiChatMessageDao per
#   docs/architecture/dao-map.md).  Every mutating method runs
#   writeBarrier.checkWritesAllowed at its entrypoint
#   (createSession/appendMessage/clearSession/clearAllHistory/
#   purgeOldMessages).  History persistence is privacy-gated (W34):
#   createSession/appendMessage no-op (return null) unless
#   shouldPersistHistory(); appendMessage stores payloadJson only in RAW
#   mode and redacts text via CloudPayloadRedactor in REDACTED mode
#   (NLP-6), OFF returns null before any write; appendMessage wraps the
#   message insert + session updateLastTouched in one
#   database.withTransaction (atomicity); clearSession/clearAllHistory/
#   purgeOldMessages are user-initiated deletion / retention cleanup via
#   SQL deletes (no raw payloads materialized).
# * OperationRunRecorder (RoomOperationRunRecorder + its Handle) is THE
#   canonical run-ledger writer for the OperationRun/OperationRunEvent
#   diagnostics ledger used by every pipeline (workers, backup/restore,
#   bank, email, export/import).  All six sites are diagnostics-ledger
#   writes: start inserts the RUNNING row; Handle.event inserts a
#   best-effort event (CancellationSafe.runCatchingCancellable -- failure
#   is recorded to the durable MaintenanceSafeDiagnosticSink and NEVER
#   fails the business operation); Handle.increment persists counters
#   best-effort; Handle.finalizeNonCancellable finalizes inside
#   withContext(NonCancellable) via the idempotent finalizeIfRunning
#   (WHERE status = 'RUNNING' -- only the first terminal state wins);
#   recoverStaleRunningOperationRuns is the startup crash recovery
#   (finalizeIfRunning to STALE_ABORTED + best-effort STALE_RECOVERY
#   event).  CancellationException is never swallowed
#   (runCatchingCancellable rethrows; runOperation rethrows after
#   recording CANCELLED).  Metadata and exception text pass through
#   EventMetadataSanitizer.sanitizeJsonString/sanitizeExceptionMessage --
#   no raw payloads persisted.  This is the sanctioned
#   diagnostics/logging-persistence writer layer.
# * RestoreJournalImporter is the restore-path post-restore diagnostics
#   ingestion (P7-CURRENT-016): the restore/reset path bans Room after the
#   DB swap (P7-CURRENT-005), so terminal restore/reset trails survive
#   only in the on-disk journal until this class ingests them into the
#   queryable OperationRun/OperationRunEvent ledger on the NEXT healthy
#   startup.  Restore/write barrier semantics: the importer performs no
#   direct writeBarrier call -- the temporal barrier is enforced by its
#   ONLY caller AppStartupCoordinator.importRestoreJournals(), which runs
#   it on startup when writes are allowed (DB healthy); the importer is
#   the sanctioned post-barrier ingestion point, not a barrier bypass.
#   Idempotent per event (isSuccessJournalImported/isFailureJournalImported
#   gates, get-or-insert run row, per-eventId dedup via getByRunId +
#   importedIds set blocking in-journal duplicates too); partial imports
#   keep the journal for retry on the next startup;
#   CancellationException is rethrown at every handler;
#   exceptionMessage comes from event.exceptionMessageSafe (pre-sanitized
#   at journal write time).
#
# barrierMode is `helper` for every row (the GR-08a..l batch convention; no
# direct-barrier proof is claimed -- AiChatRepositoryImpl places
# writeBarrier.checkWritesAllowed at each entrypoint, the run-ledger
# writer's protection is its best-effort/idempotent diagnostics contract,
# and the restore importer's protection is the caller-enforced temporal
# restore barrier).
#
# Closure additions (GR-08m1 blind-spot sweep): ZERO closure rows.  Every
# dao-accessor call in ALL batch callable bodies was enumerated, not just
# the findings: every called mutating DAO method (AiChatSessionDao.insert /
