# GR-08 batch 13, part 2 (GR-08m2) tracked batch manifest -- file group 2:
# domain/receipt/lifecycle/ReceiptLifecycleCoordinator.kt (THE receipt
# lifecycle authority) + service/warranty/WarrantyExpirationWorker.kt
# (worker; WorkerExecutionGuard verified in the body).
#
# Batch scope (plan): GR-08m covered FIVE files as ONE batch, with a forced
# split if the combined unique fingerprint count exceeded 25.  Scope
# verification against the trusted START report
# (build/guard-debug/gr08m/before.json == trusted GR-08l after-l3.json,
# 121 findings / 20 advisory diagnostics; reference-copy SHA-256 recorded
# below): ReceiptLifecycleCoordinator.kt carries exactly 6
# DB_UNAUTHORIZED_MUTATION findings collapsing to 6 UNIQUE fingerprints and
# WarrantyExpirationWorker.kt carries exactly 6 findings collapsing to 6
# UNIQUE fingerprints (dedup key: callable identity + daoAccessor + daoFqcn
# + operation).  Combined batch unique count 28 > the 25-fingerprint batch
# cap, so the batch was SPLIT into GR-08m1 (AiChatRepositoryImpl.kt +
# OperationRunRecorder.kt + RestoreJournalImporter.kt, 17 findings / 16
# unique fingerprints) and GR-08m2 (this manifest, 12 findings / 12 unique
# fingerprints) per the GR-08c/GR-08e/GR-08i/GR-08j/GR-08k/GR-08l
# precedent; each part is within the cap.
#
# RECEIPTLIFECOORDINATOR LAYER LEGALITY: ReceiptLifecycleCoordinator is THE
# receipt lifecycle authority -- the single entry point for processing
# receipt input through any path (camera scan, gallery pick, email
# ingestion, bank statement import) per its own contract and
# docs/architecture/LEGAL_PATHS.md receipt lifecycle rules; receipt
# mutations MUST route through it, so its own DAO writes are the legal
# lifecycle path, not bypasses.  Both mutating entrypoints run
# writeBarrier.checkWritesAllowed (processReceiptInput line 250,
# processEmailReceipt line 749).  Every flagged site sits inside a
# transactionRunner.runInTransaction block with the lifecycle event written
# in the SAME transaction:
#   - processReceiptInput receipt.dedup_hash_delete: exact-hash duplicate
#     cleanup -- pendingReviewDao.deleteByScannedReceiptId +
#     scannedReceiptDao.delete atomically with the DUPLICATE_DETECTED
#     lifecycle event (legacy persisted-duplicate path only; drafts never
#     touch the DB);
#   - processReceiptInput receipt.dedup_post_ocr: post-OCR duplicate
#     marking -- scannedReceiptDao.update with fingerprints +
#     DUPLICATE_DETECTED event in one transaction (NEW-P3-005 no
#     check-then-write gap);
#   - processReceiptInput receipt.save_with_review: MIT-041 atomicity --
#     pendingReviewDao.insert inside the same transaction as the resolver
#     insert + RECEIPT_SAVED event so a crash cannot leave a saved receipt
#     without its review row;
#   - processEmailReceipt receipt.process_email: emailReceiptDao.insertOrIgnore
#     (source row with storage-mode-sanitized sender/subject and hash-based
#     dedup keys, PRIV-441/PRIV-6825) and pendingReviewDao.insert (MIT-041
#     NeedsReview atomicity) inside the single email transaction.
#   Pre-existing coverage note: deleteReceipt's three DAO sites
#   (receiptEventDao.insert / receiptExpenseLinkDao.deleteAllLinksForReceipt
#   / scannedReceiptDao.delete) are ALREADY authorized by MIT-003 entries
#   in the active v2 policy and correctly produce NO findings.
#   Delegating writers invoked by the coordinator (ReceiptInsertResolver,
#   ReceiptLifecycleEventWriter, ReceiptLinkService,
#   TransactionLifecycleCoordinator, SourceLinkWriter, DiagnosticEventWriter)
#   are separate files with their own coverage/deferral -- out of batch
#   scope.
#
# WARRANTYEXPIRATIONWORKER LAYER LEGALITY (worker): WORKER-GUARD VERIFIED
# before EXACT_POLICY -- the ENTIRE mutating body of doWork (and the
# deliverReminder calls it makes) runs inside
# executionGuard.runGuardedWithContext(WorkerGuardRequest(workerName =
# "warranty_expiration_check", requiresNotificationPermission = true,
# allowDuringBackupExport = false, blockedPolicy = BlockedPolicy.RETRY,
# workId, runAttemptCount)) { ctx -> ... }: the guard checks the
# restore/write barrier FIRST and records a durable SKIPPED run when
# blocked.  CancellationException is rethrown (catch order:
# CancellationException rethrow, then generic rethrow -- no swallowed
# cancellation).  The six sites implement the durable claim-before-notify
# sent-state machine (S9/P9-P1-09): recoverStaleClaimed (crash recovery of
# CLAIMED rows), insertOrIgnore (idempotent SCHEDULED seed on the
# (warrantyId, windowDays, expiryDate) unique key), claim (atomic
# SCHEDULED/FAILED -> CLAIMED -- durable cross-reboot dedup, two concurrent
# runs can never both claim), markSentFromClaimed (the ONLY transition into
# SENT, only from CLAIMED, persists notificationId), markFailed (records
# the transient reason, stays re-claimable), deleteOlderThan (90-day
# prune).  Notification permission gates notification posting only (guard
# SKIPPED run with the controlled NOTIFICATION_PERMISSION_DENIED reason
# code); notification metrics (ctx.addNotificationsSent) increment only
# after a real successful send.  Idempotent across WorkManager retries by
# construction (claim returns 0 for already-SENT rows).
#
# Chain-form census AFTER review: ZERO database-chained
# `appDatabase.xxxDao()` mutation receivers and ZERO method-local DAO
# aliases in BOTH files.  ReceiptLifecycleCoordinator injects AppDatabase
# but NEVER uses it as a DAO accessor (all 1415 lines enumerated -- every
# transaction goes through the injected DomainTransactionRunner and every
# DAO call through the injected constructor properties scannedReceiptDao /
# pendingReviewDao / emailReceiptDao / receiptEventDao /
# receiptExpenseLinkDao); WarrantyExpirationWorker does not inject
# AppDatabase at all.  NO accessor-normalization source change is needed
# for this part.
#
# Closure additions (GR-08m2 blind-spot sweep): ZERO closure rows.  Every
# dao-accessor call in ALL batch callable bodies was enumerated, not just
# the findings: every called mutating DAO method
# (PendingReviewDao.insert / deleteByScannedReceiptId,
# ScannedReceiptDao.update / delete, EmailReceiptDao.insertOrIgnore,
# WarrantyReminderDeliveryDao.insertOrIgnore / claim / markSentFromClaimed /
# markFailed / recoverStaleClaimed / deleteOlderThan) is an abstract
# Room-annotated method.  The body-carrying @Transaction methods that DO
# exist in PendingReviewDao (upsertByRawNotificationId and the
# getPendingWithReceipt-style composites) are NOT called from any batch
# callable, and WarrantyReminderDeliveryDao's unused update/claimById are
# likewise never invoked from the worker -- no convenience-method closure
# row exists for this part (the GR-08b/GR-08d pattern does not trigger).
# Other DAO-accessor calls in the bodies are read-only lookups
# (scannedReceiptDao.getById/getRecentReceipts/getBySourceFingerprint,
# emailReceiptDao.getByFingerprint/getByMessageId/getByMessageIdHash/
# getByContentFingerprintHash, deliveryDao.getByKey).
