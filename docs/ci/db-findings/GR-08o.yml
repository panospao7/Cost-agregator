#
# LAYER ADJUDICATIONS:
# * ReceiptSideEffectPlanner is a receipt-lifecycle legal writer
#   (domain/receipt/lifecycle/): the post-commit matcher side-effect planner
#   executed by PostCommitActionRunner after receipt save.  Its writes are
#   exactly the P3-P1-03 match-event taxonomy (MATCH_SUGGESTED with the
#   SUGGESTED status update, MATCH_NOT_FOUND durable event, and the
#   writeMatchEvent diagnostics events MATCH_ATTEMPTED / MATCH_FAILED /
#   MATCH_SKIPPED_ALREADY_LINKED / AUTO_MATCHED / SIDE_EFFECT_SKIPPED_PRIVACY /
#   RAW_USED_EPHEMERALLY) -- the machine counterpart of the
#   ReceiptMatchLifecycleService user-facing match path GR-08h authorized.
#   Every mutating site runs writeBarrier.checkWritesAllowed at its
#   entrypoint (suggestedMatch / noMatch / writeMatchEvent); the two-site
#   Suggested branch is atomic under database.withTransaction; auto-link
#   delegates to ReceiptLinkService (the LEGAL_PATHS "LINK/UNLINK receipt"
#   authority); CancellationException is rethrown, never swallowed; event
#   metadata carries only IDs/scores (message.take(500), controlled
#   errorDetails constants -- never raw OCR text).
# * CategoryRepository is the repository-layer legal writer for category
#   seeding/maintenance (legacy MIT-003 rows already cover addCategory/
#   deleteCategory; THIS batch covers the ensureDefaultCategories seeding
#   surface).  ensureDefaultCategories is barrier-checked at its entrypoint:
#   categoryDao.seedDefaultsIfEmpty is the atomic count-check + insertAll
#   @Transaction convenience (B4 race fix); merchantCategoryDao.insertAll
#   seeds the merchant dictionary (OnConflictStrategy.IGNORE); the
#   categoryDao.insert branch is the BUG-012 "Uncategorized" backfill for
#   existing users; merchantCategoryDao.updateNormalizedCanonicalName is the
#   canonical-name normalization backfill over getMappingsMissingCanonicalName.
# * ReceiptItemCategorizationRepository is the repository-layer legal writer
#   for receipt item categorization persistence (sole writer of
#   ReceiptItemCategorizationDao mutations from this repository; status
#   transitions are deliberately NOT managed here per the N4 KDoc -- the
#   calling use cases drive them).  All three mutating methods are
#   barrier-checked at their entrypoints; deleteByReceiptId is the
#   receipt-scoped SQL delete (no payloads materialized);
#   saveCategorizationResult inserts per-item rows (OnConflictStrategy.ABORT)
#   and counts successful inserts; updateUserCorrection records the user's
#   category correction without overriding receipt status.
# * SharedExpenseDataPortAdapter is the data-layer adapter implementing the
#   domain SharedExpenseDataPort (Hilt-bound in GroupsModule) -- the legal
#   port boundary of the LEGAL_PATHS "Shared Expense Management (Groups --
#   Alternative Facade)" section, which explicitly legalizes
#   SharedExpenseDataPort.removeMember().  removeMember is the soft-left
#   write (leftAt = timeProvider.now()) via the abstract @Update
#   GroupMemberDao.update; archiveGroup/restoreGroup are soft isActive flips
#   via abstract @Query updates (the LEGAL_PATHS group FORBIDDEN list
#   prohibits INSERTs outside GroupTransactionCoordinator, not these status
#   updates).  All multi-table/atomic mutations (createGroupWithMembers/
#   addMember/addExpense/deleteGroup) delegate to GroupTransactionCoordinator
#   per LEGAL_PATHS.  Every mutating method is barrier-checked at its
#   entrypoint.
# * BankApiIntegration is the stub-mode-gated bank API integration
#   (domain/bank/): requireStubMode() errors in release builds AND requires
#   BankApiConfig.isStubMode, so every row below is demo-only code.
#   completeConnection persists the demo BankConnection (barrier-checked);
#   syncTransactions runs inside OperationRunRecorder.runOperation with the
#   write barrier checked inside the operation (DDL-016-14: blocked sync
#   keeps a durable record), creates low-confidence PendingReview rows only
#   after the getPendingDuplicateCandidateInRangeTypeAware dedup check and
#   inside database.withTransaction with a second barrier check, and routes
#   ALL expense mutations through
#   TransactionLifecycleCoordinator.createExpenseStandaloneV2 (the
#   authoritative expense path); refreshToken is PRIVATE with the single
#   caller syncTransactions, which barrier-checks before the refresh branch,
#   and persists refreshed stub tokens via the abstract @Query
#   BankConnectionDao.updateToken (P10-P1-06).  CancellationException is
#   rethrown (P10-CURRENT-018), never recorded as a per-transaction failure.
# * FinancialHealthScoreV2 is the domain health scoring engine and the SOLE
#   writer of HealthScoreHistoryDao (codebase-wide census: no other file
#   writes it).  saveToHistory is its only mutating callable:
#   barrier-checked at entry, get-or-update by (periodStart, periodEnd) so
#   re-scoring a period updates instead of duplicating, insert only when no
#   row exists, and deleteOlderThan is the 90-day TTL cleanup (SQL delete,
#   no payloads materialized).  CancellationException is rethrown; failures
#   are logged without propagating (history persistence is best-effort and
#   must not fail the score computation).
# * SourceLinkBackfillWorker is named "Worker" but is NOT a WorkManager
#   worker: it is a plain @Singleton suspend runner invoked from
#   SourceLinkBackfillViewModel (debug/manual provenance backfill, PR8), so
#   WorkerExecutionGuard does not apply and barrierMode is `helper` (the
#   GR-08a..n barrier-at-entrypoint convention), NOT `workerMediated` (that
#   mode is reserved for actual CoroutineWorker bodies running inside
#   WorkerExecutionGuard).  Guard semantics verified in source:
#   runBackfill checks the write barrier at entry AND re-checks per expense;
#   CancellationException is caught and RETHROWN (never swallowed); per-
#   expense failures are counted and the run continues; idempotency comes
#   from EntitySourceLinkDao.insert OnConflictStrategy.IGNORE (re-runs
#   return 0/-1 and are counted as skipped) plus the per-expense
#   getForExpense existence checks (LEGACY_BACKFILL/CREATED_FROM role guard,
#   SCANNED_RECEIPT/RAW_NOTIFICATION sourceEntityType guards).  All three
#   callables write only EntitySourceLink provenance rows -- no raw
#   notification/receipt payloads are persisted (metadataJson is a
#   SafeProvenanceMetadata map with the legacy source name only).
#
# barrierMode is `helper` for every row (the GR-08a..n batch convention; the
# write barrier runs at each findings-carrying callable entrypoint -- for the
# private refreshToken helper the barrier runs at its sole caller
# syncTransactions before the refresh branch -- and no direct-barrier proof
# is claimed per row).
