# domain/receipt/lifecycle/ReceiptLinkService.kt (seed path).
#
# Batch scope (plan): GR-08j covered FOUR top-density files as ONE batch,
# with a forced split if the combined unique fingerprint count exceeded 25.
# Scope verification against the trusted START report
