# 247 findings / 20 advisory diagnostics; reference copy SHA-256 recorded
# below): AppDatabase.kt carries exactly 14
# DB_FORBIDDEN_STRUCTURAL_OPERATION findings collapsing to 2 UNIQUE
# fingerprints (MIGRATION_16_17.migrate execSQL x10 sites, MIGRATION_41_42.migrate
# execSQL x4 sites) and ReceiptLinkService.kt carries exactly 12
# DB_UNAUTHORIZED_MUTATION findings collapsing to 11 UNIQUE fingerprints
# (dedup key: callable identity + daoAccessor + daoFqcn + operation; the two
# unlinkReceiptFromExpense scannedReceiptDao.update sites share one
# fingerprint).  Combined batch unique count 34 > the 25-fingerprint batch
# cap, so the batch was SPLIT into GR-08j1 (this manifest: AppDatabase.kt +
# ReceiptLinkService.kt, 26 findings / 13 unique fingerprints) and GR-08j2
# (ExpenseWriteStore.kt + SourceStatsRepository.kt, 21 findings / 21 unique
# fingerprints) per the GR-08c/GR-08e/GR-08i precedent; each part is within
# the cap.
#
# APPDATABASE ADJUDICATION (GR-08j task-2 gate): the 14 findings are the
# migrate(SupportSQLiteDatabase) bodies of the two NAMED-OBJECT Room
# migrations `object MIGRATION_16_17` (merchant canonical/alias schema
# v16->v17: CREATE TABLE merchant_canonicals + merchant_aliases, unique/
# plain indexes, and the in-migration backfill of existing expenses into
# both tables) and `object MIGRATION_41_42` (exchange_rates schema v41->v42:
# CREATE TABLE exchange_rates, unique + cleanup indexes, default EUR rate
# seeding).  Adjudicated as LEGITIMATE DB-INFRASTRUCTURE WRITERS, NOT
# business-logic writers: execSQL on SupportSQLiteDatabase is the ONLY way
# to perform a Room schema migration, and the data backfill/seeding must
# stay inside the migration to keep schema + data atomic (a CODE_FIX that
# moved the SQL out of the migration would break Room's migration contract).
# The named-object form is deliberate (see the in-source comments: it gives
# the G-TIME-01 time-guard scanner an exact per-migration attribution).
# The db_access structural contract already authorizes the ANONYMOUS-object
# migrations via the bounded `class: AppDatabase, method_pattern:
# MIGRATION_\d+_\d+` entry, but the scanner attributes NAMED-object migrate
# bodies to the object's OWN class (owner simple name MIGRATION_16_17 /
# MIGRATION_41_42, method migrate), which that entry can never match.
# Disposition: STRUCTURAL_EXCEPTION -- TWO exact tuples (class
# MIGRATION_16_17 / MIGRATION_41_42, method_pattern migrate, operation
# execSQL) added to config/guards/db_structural_exceptions.yml, mirrored in
# config/guards/db_structural_exceptions_expected_methods.yml (counts
# structural_entries 62 -> 64), and pinned in the immutable contract
# MANIFEST_IMMUTABLE_EXPECTED_TUPLES + PINNED_STRUCTURAL_ENTRY_COUNT in
# scripts/verify_db_access_boundaries.py.  These two tuples are NOT seed
# rows (the findings carry no DAO identity; the v2 seed loader requires
# daoAccessor/daoFqcn) and are NOT part of the GR-08-seeds.yml
# concatenation.
#
# RECEIPTLINKSERVICE LAYER LEGALITY (LEGAL_PATHS.md, "LINK/UNLINK receipt"):
# ReceiptLinkService.linkReceiptToExpense() / unlinkReceiptFromExpense() IS
# the authoritative legal path -- it "Owns: join table + legacy field +
# warranty/return/itemCategorization + event".  All 11 seed rows are
# mutations inside that owned set, written inside the DomainTransactionRunner
# transaction with the write barrier checked at the callable entrypoint
# (writeBarrier.checkWritesAllowed first statement; CancellationException
# rethrown, other barrier failures converted to Result.failure).  The S6
# claimForAutoMatch compare-and-set is the load-bearing auto-match overlap
# guard named by LEGAL_PATHS.md.  barrierMode is `helper` for every seed row
# (the GR-08a..j batch convention; no direct-barrier proof is claimed).
#
# Chain-form census: ZERO database-chained `database.xxxDao()` call sites in
# EITHER file.  ReceiptLinkService injects AppDatabase but never chains a
# DAO accessor off it (every DAO call goes through an injected constructor
