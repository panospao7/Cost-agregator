#   ReceiptMatchLifecycleService.clearMatchForReceipt -- the GR-08h legal
#   path; Kotlin callers are compile-time blocked, the body survives only as
#   a source-compatibility shim) clears the match fields via the abstract
#   @Update; writeReceiptEvent is the private Pipeline-3 event helper --
#   best-effort (failures are logged and never fail the business
#   operation), CancellationException is rethrown (catch order:
#   CancellationException rethrow, then generic catch), and the message/
#   errorDetails payloads are bounded with take(500) before persistence.
# * InvestmentTracker is THE domain investment tracker -- the sanctioned
#   investment writer per docs/architecture/LEGAL_PATHS.md "Investment
#   Mutations": ADD HOLDING names InvestmentTracker.addHolding(investment)
#   (DatabaseWriteBarrier check -> validation -> database.withTransaction {
#   InvestmentDao.insert + InvestmentValueDao.insert initial snapshot +
#   InvestmentTransactionDao.insert type="BUY" }) and UPDATE PRICE names
#   InvestmentTracker.updatePrice(investmentId, newPrice)
#   (DatabaseWriteBarrier check -> require(newPrice > 0 finite) ->
#   database.withTransaction { InvestmentDao.updatePrice +
#   InvestmentValueDao.insert snapshot with dayChange/dayChangePercent });
#   FORBIDDEN: InvestmentDao.insert()/update()/updatePrice() outside
#   InvestmentTracker, InvestmentValueDao.insert() outside the
#   updatePrice/addHolding transaction, InvestmentTransactionDao.insert()
#   outside the addHolding transaction.  Validation (symbol/name/quantity/
#   purchasePrice/currency/purchaseDate/currentPrice/purchaseFees) runs
