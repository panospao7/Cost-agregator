# * SubscriptionManagerEngine is THE subscription ENGINE -- the sanctioned
#   engine surface per docs/architecture/LEGAL_PATHS.md "Subscription
#   Mutations": CREATE/ACCEPT names validateAndCreate (barrier check ->
#   validation -> database.withTransaction { subscription insert via
