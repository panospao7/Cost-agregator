#   single-write form).  FORBIDDEN: SubscriptionPriceHistoryDao.insert()
#   outside recordPriceChange/validateAndCreate/acceptCandidate and direct
#   DAO mutations bypassing engine validation -- every row here IS the
#   engine surface, so no bypass is created.
#
# barrierMode is `helper` for every row (the GR-08a..m batch convention; the
