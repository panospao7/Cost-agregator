# local (row spells `auditDao`; alias bridge resolves the identity) and
# the WorkerRunLogger `dao` constructor properties (rows spell `dao`).
# No other accessor-normalization source change is needed.
#
# Blind-spot sweep: ZERO body-carrying @Transaction DAO convenience
# methods are invoked from any batch callable (the GR-08b/GR-08d/
