# GR-08 batch 16 (GR-08p1) reviewed exact v2 policy seed rows --
# DB_UNAUTHORIZED_MUTATION EXACT_POLICY authorization for
# data/privacy/DataRetentionWorker.kt,
# data/repository/SpendingChallengeRepository.kt,
# data/repository/UserCorrectionRepository.kt,
# domain/negotiation/SmartBillNegotiationEngine.kt,
# domain/notification/capture/NotificationIntakeCoordinator.kt,
# domain/notification/capture/NotificationIntakePayloadRepairer.kt,
# domain/recurring/RecurringPlanProjectionService.kt,
# domain/recurring/lifecycle/RecurringLifecycleEventWriter.kt,
# domain/transaction/DefaultExpenseCategoryAssignmentService.kt,
# domain/transaction/lifecycle/DebugExpenseAuditWriter.kt,
# domain/workers/WorkerRunLogger.kt and util/JsonExpenseImporter.kt.
#
# Consumed ONLY via `scripts/migrate_db_policy_signatures.py --seed-rows`.
# This document is a full v2-shaped policy document: it is loaded through
# `scripts.db_guard.policy_v2_loader.load_policy_v2` (exact field set,
# type/enum/signature validation, canonical path syntax, within-document
# duplicate mutation-key rejection) and merged into the generated candidate
# only after seed/legacy duplicate-key rejection.  Seeds never bypass the
# loader, the evidence verifier, or the promotion gates.
#
# Scope verification against the trusted START report
# (build/guard-debug/gr08p/before.json == trusted GR-08o after-residual.json,
# 39 findings / 20 advisory diagnostics; reference-copy SHA-256 recorded in
# the batch manifest): each of the TWELVE files carries exactly 2
# DB_UNAUTHORIZED_MUTATION findings; DataRetentionWorker.kt's two
# auditDao.insert sites (RAW_NOTIFICATION_RETENTION line 196 and
# RAW_OCR_RETENTION line 206) share ONE fingerprint, every other file
# contributes 2 distinct fingerprints.  Combined batch scope is 24
# findings / 23 UNIQUE fingerprints <= the 25-fingerprint batch cap, so NO
# split was required; GR-08p2 was NOT created (unlike
# GR-08c/GR-08e/GR-08i/GR-08j/GR-08k/GR-08l/GR-08m/GR-08n).
#
# Layer legality:
# * DataRetentionWorker is a REAL CoroutineWorker whose ENTIRE mutating body
#   runs inside executionGuard.runGuardedWithContext(WorkerGuardRequest(
#   workerName = "data_retention", requiredCapabilities = emptyList(),
#   allowDuringBackupExport = false, blockedPolicy = BlockedPolicy.RETRY,
#   ...)) -- the same mediation the active policy's existing
#   DataRetentionWorker.doWork row (MIT-003) records.  The two audited
#   writes are the P8 privacy-retention audit trail: after the purge loop
#   completes (checkpoint cleared), the worker inserts one PrivacyAuditEvent
#   per successful raw-notification / raw-OCR purge (counts and retention
#   days only in the context JSON -- never purged payloads).  The legacy
#   MIT-003 row spells the DERIVED accessor identity
#   (`privacyAuditDao`) while the scanner reports the method-local alias
#   `val auditDao = appDatabase.privacyAuditDao()` verbatim
#   (`auditDao`), so the exact-policy match never fired; the rows below
#   spell the SOURCE local alias `auditDao` (the GR-08a alias bridge
#   resolves it to the same privacyAuditDao identity for the evidence
#   verifier's daoFqcn cross-check).  CancellationException is rethrown at
#   both catch sites (per-target purge and diagnostic emit); per-target
#   failures are counted and the run continues; the privacy-cleanup path
#   stays runnable (requiredCapabilities = emptyList()).
# * SpendingChallengeRepository is the repository-layer legal writer for
#   spending-challenge persistence (sole writer of SpendingChallengeDao
#   mutations): saveChallenge is the barrier-checked insert (rowId <= 0
#   keeps the client-supplied id) and deactivateChallenges is the
#   barrier-checked bulk soft-deactivation (targeted SQL update; empty
#   id-list short-circuits before any write).
# * UserCorrectionRepository is the repository-layer legal writer for
#   notification user-correction persistence (sole writer of
#   UserCorrectionDao mutations): insert is the barrier-checked correction
#   record and deleteAll is the barrier-checked full reset (SQL DELETE, no
#   payloads materialized); every other method is a read-only lookup.
# * SmartBillNegotiationEngine is the domain negotiation engine and the
#   sole writer of NegotiationOutcomeDao and SubscriptionPriceHistoryDao.
#   recordNegotiationOutcome is barrier-checked at entry, validates the
#   outcome against the subscription (E1-REMAINING-001 currency
#   normalization before validation/persistence), then inserts the
#   NegotiationOutcome row and -- only for SUCCESS/PARTIAL with a valid
#   newPrice -- the SubscriptionPriceHistory row (PR8 monthly-equivalent
#   back-conversion before storing) inside ONE database.withTransaction;
#   the subscription amount update is delegated to
#   RecurringExpenseRepository.update (the recurring-rule legal writer).
#   CancellationException is rethrown; failures return Result.failure
#   without persisting partial state (the transaction rolls back).
# * NotificationIntakeCoordinator is the capture-side intake writer (the
#   machine counterpart of the GR-08i3-authorized NotificationIntakeWorker
#   processing side): capture persists the deduplicated NotificationIntake
#   row (fingerprint-checked first; DO_NOT_STORE never reaches durable
#   intake; TRANSIENT payloads stored only as encrypted transient-payload
#   columns -- visible fields nulled) and captureForRetry persists the
#   deferred-capture row (encrypted transient payload or DEFERRED
#   metadata-only).  Both insert with insertOrIgnore (fingerprint/content
#   dedup at the DB level; -1 return is the Dropped/conflict path) and
#   enqueue the worker only after a successful insert.  Raw notification
#   text is persisted ONLY in the STORE_RAW mode the user explicitly
#   granted; metadata-only modes store ciphertext or nothing.
# * NotificationIntakePayloadRepairer is the privacy repair writer for
#   legacy plaintext transient rows: batched (100-row batches, 100-batch
#   cap) get-then-fix loop that either purges the visible payload columns
#   of terminal rows (SQL update, no payloads materialized) or encrypts
#   and clears them for non-terminal rows (ciphertext written back, visible
#   fields nulled).  Invoked from NotificationCaptureService at listener
#   startup; per-row failures are logged and the batch continues.
# * RecurringPlanProjectionService is the recurring-projection writer
#   bridging the recurring lifecycle system and the forecasting pipeline:
#   projectFromRule is barrier-checked at entry, materializes occurrences
#   via RecurringLifecycleCoordinator.generateOccurrences (the GR-08c1
#   recurrence-expansion authority) and inserts a PlannedExpense row per
#   PLANNED occurrence lacking one (sourceOccurrenceKey existence check
#   first -- idempotent re-runs create nothing); 
#   projectFromOccurrencesInCurrentTransaction is the transaction-safe
#   variant with NO barrier/transaction of its own, invoked ONLY from
#   RecurringRuleLifecycleCoordinator createRule/activateRule/updateRule
#   bodies INSIDE their barrier-checked database.withTransaction blocks.
# * RecurringLifecycleEventWriter (RoomRecurringLifecycleEventWriter) is
#   THE sanctioned recurring lifecycle event writer: its own writes ARE
#   the audit trail itself (the RecurringLifecycleEvent rows the
#   GR-08c1-authorized RecurringLifecycleCoordinator and the
#   GR-08f-authorized RecurringRuleLifecycleCoordinator emit through the
#   Hilt-bound interface).  writeCritical never swallows failures;
#   writeDiagnostic is best-effort but rethrows CancellationException.
# * DefaultExpenseCategoryAssignmentService is the domain
#   ExpenseCategoryAssignmentPort implementation (the P3-03EA-09 default
#   category assignment path): barrier-checked at entry, then ONE
#   database.withTransaction containing the get-if-unset check, the
#   targeted ExpenseDao.updateCategory and the EXPENSE_CATEGORY_ASSIGNED
#   TransactionEvent audit row (atomic update + event).  CancellationException
#   is rethrown.
# * DebugExpenseAuditWriter is the debug-only aggregate-operation audit
#   writer: its two callables are invoked ONLY from
#   ExpenseRepository.deleteAllExpenses / restoreDebugSnapshot, which are
#   gated by requireDebugExpenseOperation (BuildConfig.DEBUG throw in
#   release) AND writeBarrier.checkWritesAllowed, and run the writer's
#   inserts inside the caller's database.withTransaction.  The events
#   carry counts and controlled constants only (DEBUG_DELETE_ALL_EXPENSES /
#   RESTORED_FROM_DEBUG_SNAPSHOT, debugOnly=true) -- never expense
#   payloads.
# * WorkerRunLogger is the worker run-diagnostics logger (the PR8/PR12B
#   BackgroundJobRun ledger every guarded worker writes through):
#   WorkerRunLoggerImpl.start inserts the RUNNING row (invoked inside the
#   workers' WorkerExecutionGuard.runGuardedWithContext contexts -- the
#   GR-08i3 precedent explicitly cites this callable as workerMediated);
#   Handle.terminal is the PR12B mutex-serialized terminal state machine
#   (5s withTimeout backstop; affected==1 marks durable; affected==0 with
#   a non-RUNNING row is AlreadyCompletedDb; TimeoutCancellationException
#   is classified NOT-DURABLE and retriable, never swallowed; plain
#   CancellationException is rethrown).  All reason/error fields carry
#   sanitized controlled codes (WorkerReasonCodes.sanitizeReasonCode /
#   classifyDiagnostic / EventMetadataSanitizer) -- never raw exception
#   text.
# * JsonExpenseImporter is the JSON import path (ImportCoordinator
#   JSON_V1/JSON_V2 format, debug import UI): ALL expense mutations route
#   through TransactionLifecycleCoordinator.createExpense (the
#   authoritative expense path); the audited categoryDao.insert sites are
#   the get-or-create category convenience inside parseV2Row/parseV1Row
#   (getByName first, insert with the default icon/color only when the
#   named category does not exist).
#
# barrierMode is `workerMediated` for the DataRetentionWorker.doWork and
# WorkerRunLogger (start + Handle.terminal) rows: the writes run inside
# WorkerExecutionGuard.runGuardedWithContext contexts (the established mode
# of the active policy's worker rows -- GR-08i3 precedent) and NO
# direct-barrier proof is claimed.  Every other row uses `helper` (the
# GR-08a..o batch convention): the write barrier runs at the callable
# entrypoint (SpendingChallengeRepository, UserCorrectionRepository,
# SmartBillNegotiationEngine, RecurringPlanProjectionService.projectFromRule,
# DefaultExpenseCategoryAssignmentService), at the barrier-checked
# transactional callers (projectFromOccurrencesInCurrentTransaction,
# DebugExpenseAuditWriter), or the write is the sanctioned audit/intake
# surface itself (RecurringLifecycleEventWriter,
# NotificationIntakeCoordinator, NotificationIntakePayloadRepairer,
# JsonExpenseImporter) -- no direct-barrier proof is claimed per row.
#
# Chain-form census AFTER review: ONE database-chained
# `appDatabase.xxxDao()` mutation receiver existed at batch start --
# SmartBillNegotiationEngine.recordNegotiationOutcome's
# `database.negotiationOutcomeDao().insert(outcomeEntity)` (line 614).
# The GR-08e accessor-normalization rule applies (the findings scanner
# reports the chain text verbatim while the v2 source-evidence verifier
# resolves chain-form bodies to the Room accessor identity and fails any
# row spelled with the chain text, so NO spelling of a chain-form row can
# pass both gates): the batch NORMALIZED the call site to the
# codebase-standard constructor-property injection
# (`negotiationOutcomeDao: NegotiationOutcomeDao` -- Room caches DAO
# accessor implementations, so the injected instance is the same object
# the chained call returned; the surrounding withTransaction and
# cancellation-safe try/catch semantics are unchanged) and the row below
# spells the NORMALIZED accessor.  The read-only
# `database.negotiationOutcomeDao().getAll()` in getNegotiationHistory
