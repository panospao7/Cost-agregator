# scope is 15 findings / 15 UNIQUE fingerprints <= the 25-fingerprint batch
# cap and NO split was required.
#
# LAYER ADJUDICATIONS:
# * ExpenseGroupDao.insertGroupWithMembers is THE DAO-default-method special
#   case: a body-carrying @Transaction convenience ON the DAO itself whose
#   flagged mutation is the CROSS-DAO `memberDao.insertAll` inside its body
#   (the GroupMemberDao arrives as an explicit DAO-typed method parameter --
#   the Room-recommended shape for cross-DAO @Transaction conveniences).
#   The method is the atomic group+members creation path (insert group ->
#   remap members to the new groupId -> insertAll -> throw when any rowId
#   <= 0, rolling back the whole @Transaction).  The self-DAO
#   `insert(group)` call in the same body is the DAO's OWN abstract @Insert
#   -- DAO-owned by definition and never scanner-flagged (only the cross-DAO
#   accessor fires).  Census note: zero production call sites today; the
#   convenience is the sanctioned atomic path whenever used and the scanner
#   flags it regardless of callers.
# * PrivacyAuditLoggerImpl is THE sanctioned privacy audit logger
#   (Hilt-bound PrivacyAuditLogger via PrivacyModule): its writes ARE the P8
#   privacy decision audit trail itself.  Context maps are sanitized through
#   the allowlist (allowedContextKeys, 200-char per-value cap) before
#   persistence; decision strings are controlled constants
#   (ALLOWED/DENIED/NOT_APPLICABLE/DENIED_FAIL_CLOSED) and reason comes from
#   the typed PrivacyDecision -- never raw payloads.
# * DatabaseBackupRepositoryImpl.restoreReceiptAssets is the backup/RESTORE
#   path: the flagged `dao.update(receipt.copy(imagePath = ...))` runs
#   inside `restoreInternalWriteScope.run("restoreReceiptAssets.updateImagePath")`
#   -- the formal RestoreInternalWriteScope gate that `require`s the restore
#   maintenance mode to be ASSETS_RESTORING or RESTORE_VERIFYING (fail-closed
#   otherwise; only DatabaseBackupRepositoryImpl may inject the scope), so
#   restore-internal writes are explicit and auditable rather than silently
#   bypassing the global write barrier.  The update retargets the restored
#   receipt's imagePath after the asset copy (copy -> DB update -> rename,
#   temp-file cleanup on failure, CancellationException rethrown).  The
#   accessor is the method-local alias `val dao = db.scannedReceiptDao()`
#   (line 1182) -- the row spells the SOURCE local alias `dao` (the GR-08p1
#   DataRetentionWorker auditDao precedent; the GR-08a alias bridge resolves
#   the ScannedReceiptDao identity for the evidence verifier's daoFqcn
#   cross-check).
# * GroupsRepositoryImpl.deleteMember is a repository-layer legal group
#   writer: barrier-checked at entry (writeBarrier.checkWritesAllowed),
#   pre-flight member/split-reference checks, then inside
#   database.withTransaction the re-checks plus the
#   groupExpenseDao.countExpensesPaidByMember guard and the SOFT delete
#   (`memberDao.update(member.copy(leftAt = timeProvider.now()))` -- the
#   member row is retained with a leftAt timestamp, never hard-deleted).
#   SQLiteConstraintException is mapped to typed results.
# * ReceiptInsertResolver.insertOrResolve is the P3-BLOCKER-11/P3-P1-06
#   centralized receipt-insert conflict resolver: attempts
#   scannedReceiptDao.insert and, when the insert is ignored/conflicted
#   (id <= 0), deterministically resolves the pre-existing receipt by
#   fingerprint order (imageHash > sourceFingerprint > textFingerprint >
#   semanticFingerprint -- all read-only lookups).  Invoked ONLY from the
#   barrier-checked receipt-lifecycle writers (ReceiptRecordWriter.
#   insertOrResolve checks writes allowed; ReceiptLifecycleCoordinator;
#   BankStatementLifecycleProcessor.processBankStatement; ReceiptRepository
#   delegates) -- the resolver is the shared low-level insert surface of the
#   receipt lifecycle layer and the insert IS the sanctioned receipt
#   creation path.
# * BankConnectionLifecycleCoordinator.disconnectConnection is the
#   bank-connection lifecycle COORDINATOR (the legal path for connection
#   mutations): barrier-checked at entry, existence-checked first (getById
#   -> NotFound), then the targeted `disconnect` mutating query (clears
#   isConnected/isActive/access/refresh tokens).  CancellationException is
#   rethrown; failures map to RetryableFailure.
# * BudgetForecastingEngine.updateForecastAccuracy is the forecasting
#   engine's post-period accuracy write: barrier-checked at entry,
#   get-if-missing guard, then the accuracy ratio
#   1 - |predicted-actual| / max(predicted, actual) clamped to [-1, 1]
#   (a dimensionless metric -- not currency math) persisted with the
#   targeted entity update.
# * DiagnosticEventWriter (RoomDiagnosticEventWriter.emit) is THE sanctioned
#   pipeline-diagnostics event writer (Hilt-bound; CompositeDiagnosticEvent
#   Writer fronts it): its writes ARE the diagnostics trail itself.  All
#   payloads pass EventMetadataSanitizer (metadata JSON sanitized;
#   exceptionClass = javaClass.simpleName only; exceptionMessage sanitized);
#   reasonCode is a typed DiagnosticReasonCode enum name.
# * SettlementCalculator.recordSettlement is the domain settlement
#   calculator's persistence entry point (KDoc: "Record a settlement
#   transaction for a group, persisting it to the database"): validates
#   amount > 0 and from != to, barrier-checked at entry, then inserts the
#   GroupSettlementEntity via the `settlementDao` PARAMETER (caller-supplied
#   DAO -- the same explicit-parameter pattern as ExpenseGroupDao.
#   insertGroupWithMembers' memberDao).  Census note: zero production call
#   sites today -- the LEGAL settlement path per LEGAL_PATHS.md ("RECORD
