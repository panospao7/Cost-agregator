#   delegate to the calculator; the FORBIDDEN rule targets arbitrary
#   uncoordinated callers, and this row authorizes the calculator's own
#   validated, barrier-checked entry point with this adjudication on record.
# * NotificationIntakeRecoveryScheduler.recoverPending is the intake
#   RECOVERY scheduler (invoked from NotificationCaptureService at listener
#   startup; KDoc: call on app start / listener connected / restore
#   complete): releases stale PROCESSING rows via the targeted
#   `releaseStaleProcessing` mutating query (status/lockedAt-guarded SQL
#   UPDATE -- no payloads materialized) and re-enqueues ready rows through
#   WorkManager (unique work, KEEP policy).  The processing side is the
#   GR-08i3-authorized NotificationIntakeWorker; this callable is the
#   crash-recovery counterpart on the capture side.
# * SourceLinkWriterImpl.linkTarget is THE sanctioned provenance source-link
#   writer (Hilt-bound SourceLinkWriter via ProvenanceModule.
#   bindSourceLinkWriter): exists-check first (idempotent dedup), external
#   IDs/fingerprints/account IDs HMAC-hashed via SensitiveHashingService
