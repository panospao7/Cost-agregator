#   OnConflictStrategy.IGNORE (rowId <= 0 -> AlreadyExists).  Deliberately
#   opens NO transaction of its own -- callers wrap in a Room transaction
#   for atomicity with expense/event insertion (KDoc-documented contract).
# * ReceiptLifecycleEventWriter (RoomReceiptLifecycleEventWriter.write) is
#   THE sanctioned receipt lifecycle event writer -- the event-writer layer
#   the architecture mandates (LEGAL_PATHS "Each operation:
#   DatabaseWriteBarrier check -> withTransaction -> ReceiptEvent"): its own
#   writes ARE the ReceiptEvent audit trail emitted by the barrier-checked
#   receipt lifecycle services through the Hilt-bound interface.
#   errorDetails pass sanitizer.sanitizeExceptionMessage; the
#   DeprecationLevel.ERROR legacy write(event) overload delegates to this
#   (context) overload -- a single insert site.
# * TransactionLifecycleEventWriter (RoomTransactionLifecycleEventWriter.
#   write) is THE sanctioned transaction lifecycle event writer (the same
#   event-writer layer): its writes ARE the TransactionEvent audit trail
#   emitted by the GR-08l2-authorized TransactionLifecycleCoordinator and
#   the other lifecycle callers through the Hilt-bound interface.
#   beforeSnapshot/afterSnapshot are explicitly null (no expense payloads);
#   metadata carries correlation/operation/transaction ids only.  The
