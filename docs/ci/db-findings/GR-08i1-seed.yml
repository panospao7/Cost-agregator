#
# Scope: data/database/GroupTransactionCoordinator.kt -- 14
# DB_UNAUTHORIZED_MUTATION findings collapsing to 14 UNIQUE fingerprints
# (dedup key: callable identity + daoAccessor + daoFqcn + operation; every
# one of the 14 per-call-site findings is its own tuple -- no two sites
# share a callable+DAO+operation identity).  Unique count 14 <= the
# 25-fingerprint batch cap, so this part needed NO further split.  This is
# the data/database layer coordinator -- the AUTHORITATIVE writer for atomic
# group mutations per docs/architecture/LEGAL_PATHS.md ("Group Mutations":
# CREATE group -> GroupLifecycleCoordinator.createGroup() ->
# GroupTransactionCoordinator.createGroupWithMembersAtomic(); ADD member ->
# GroupTransactionCoordinator.addMemberToGroup(); ADD expense to group ->
# GroupTransactionCoordinator.addExpenseToGroup() / addExpenseWithLink();
# CREATE system expense AND link to group (atomic) ->
# GroupTransactionCoordinator.createSystemExpenseAndLinkToGroup(); ARCHIVE /
# DELETE group -> GroupTransactionCoordinator.permanentlyDeleteGroup() hard
# delete with cascade cleanup via ExpenseGroupDao + GroupExpenseDao +
# GroupMemberDao; FORBIDDEN: ExpenseGroupDao.insert() /
# GroupMemberDao.insert() / GroupExpenseDao.insert() outside
# GroupTransactionCoordinator) -- so every row is a legal-writer EXACT_POLICY
# authorization.
#
# NOTE on the plan's "15 findings": the trusted START report
# (build/guard-debug/gr08i/before.json == trusted GR-08h after.json,
# 291 findings / 20 advisory) carries exactly 14 findings for this file.
# The 15th mutating DAO call site, addExpenseToGroupAtomic's
# groupExpenseDao.insert (line 1032), is ALREADY authorized by the active
# policy's legacy MIT-003 direct row (barrierMode=direct;
# writeBarrier.checkWritesAllowed is the first statement of that callable),
# so the scanner never reported it.  Blind-spot sweep evidence:
# build/guard-debug/gr08i/probe-gr08i-scanner-exp.json (empty-policy scan
# emits line 1032; the active-policy report does not).
#
# barrierMode is `helper` for every row: the write barrier runs at each
# callable entrypoint (writeBarrier.checkWritesAllowed is the FIRST
# statement of every mutating callable in the file), then the mutations run
# inside the database.withTransaction block -- the barrier is NOT re-checked
# directly before each individual mutation, and no direct-barrier proof is
# claimed.
#
# Closure additions (GR-08i1 blind-spot sweep): ZERO closure rows.  EVERY
# dao-accessor call in every mutating-callable body was enumerated, not just
# the findings: the 14 findings == the 14 uncovered mutating DAO call sites,
# and every called mutating DAO method (ExpenseGroupDao.insert/archiveGroup/
# delete, GroupMemberDao.insert/insertAll/deleteAllForGroup,
# GroupExpenseDao.insert/deleteAllForGroup, ExpenseDao.clearSharedExpenseFlags)
# is an abstract Room-annotated method.  The two body-carrying @Transaction
# convenience methods that EXIST in the touched DAOs --
# ExpenseGroupDao.insertGroupWithMembers and GroupMemberDao.setCurrentUser --
# are NOT called from this file, so no convenience-method closure row exists
# for this batch (ExpenseDao's @Transaction methods are read-only composites
# and equally unreached).  The only other DAO-accessor calls in the mutating
# bodies are read-only lookups (groupDao.getById/getGroupById,
# memberDao.getActiveMembersForGroup/getCurrentUser,
# groupExpenseDao.getByIdempotencyKey/getGroupExpenseForExpense/
# getExpensesForGroupOnce, expenseDao.getById).  The database.withTransaction
# calls are the androidx.room.withTransaction extension on the injected
# AppDatabase, not DAO accessors, and carry no closure obligation.
# Constructor-property DAO aliases (GR-08a pattern): all four DAO accessors
# (groupDao, memberDao, groupExpenseDao, expenseDao) are direct @Inject
# constructor properties resolved natively by the evidence verifier; there
# are NO alias indirections and NO database-chained `database.xxxDao()`
# call sites (chain-form census: 0 -- the injected `database: AppDatabase`
# constructor property is only ever used as the withTransaction receiver,
# so NO GR-08e accessor-normalization source change is needed for this
# batch).
