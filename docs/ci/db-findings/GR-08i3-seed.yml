# type/enum/signature validation, canonical path syntax, within-document
# duplicate mutation-key rejection) and merged into the generated candidate
# only after seed/legacy duplicate-key rejection.  Seeds never bypass the
# loader, the evidence verifier, or the promotion gates.
#
# Scope: worker/NotificationIntakeWorker.kt -- 15 DB_UNAUTHORIZED_MUTATION
# findings collapsing to 7 UNIQUE fingerprints (dedup key: callable identity
# + daoAccessor + daoFqcn + operation; 5 tuples live on doWork --
# 5x markTerminal, 3x markRetryableFailure, 3x markFinalFailure, 1x
# claimForProcessing, 1x markPrivacyDeniedAndPurgeAllPayload -- plus 1x
# purgePayloadBestEffort/purgeAllPayload and 1x
# runPrivacyCleanupGuarded/markPrivacyDeniedAndPurgeAllPayload).  Unique
# count 7 <= the 25-fingerprint batch cap, so this part needed NO further
# split.  This is the worker layer for notification intake processing: the
# worker owns the intake-row state machine (claim -> process -> terminal)
# and the privacy purge of stored notification payloads, so every row is a
# legal-writer EXACT_POLICY authorization.
#
# WORKER-GUARD VERIFICATION (GR-08i task-4 gate, satisfied for EVERY row
# before EXACT_POLICY disposition):
# * doWork -- the ENTIRE mutating body runs inside
#   executionGuard.runGuardedWithContext(WorkerGuardRequest(workerName =
#   WORKER_NAME, requiresDatabaseWrite = true, requiredCapabilities =
#   listOf(PrivacyCapability.NOTIFICATION_CAPTURE), blockedPolicy =
#   BlockedPolicy.RETRY, ...)) { ctx -> ... }: the guard checks the
#   restore/write barrier FIRST, then logs the run (WorkerRunLogger), and
#   every intakeDao mutation below happens inside that guard lambda.
# * runPrivacyCleanupGuarded -- wraps its own body in a SECOND
#   executionGuard.runGuardedWithContext with requiresDatabaseWrite = true
#   and requiredCapabilities = emptyList(): the privacy-cleanup path runs
#   when the guard itself skipped the main run for privacy denial, and it
#   must stay runnable so it can delete raw data (never gated on the
#   raw-retention capability it enforces -- AGENTS.md privacy-cleanup rule).
# * purgePayloadBestEffort -- performs no guard check of its own but is
#   invoked ONLY from inside the doWork guard lambda (8 call sites), rethrows
#   CancellationException, and swallows non-cancellation cleanup failures so
#   post-terminal cleanup can never regress a committed terminal state.
# * Cancellation propagation: doWork catches TimeoutCancellationException
#   FIRST (intentional timeout handling -> retryable/final mark +
#   RetryableWorkerException or terminal failure), then
#   RetryableWorkerException (rethrow), then CancellationException (rethrow),
#   and additionally CancellationSafe.rethrowIfCancellation in the generic
#   handler -- no swallowed cancellation anywhere.
# * Retry contract: retries are signalled ONLY by RetryableWorkerException
#   (WORKER_RETRYABLE_ERROR / WORKER_TIMEOUT / WORKER_UNHANDLED_EXCEPTION
#   reason codes); plain RuntimeExceptions are intentional terminal
#   failures (PERMANENT), never retry signals.
# * Idempotency across WorkManager retries: claimForProcessing is an atomic
#   conditional claim; claimed == 0 returns idempotent NO_WORK success.
# * Privacy posture: payload is loaded ONLY after the mid-run privacy
#   recheck; denial marks privacy-denied AND purges all payload columns in
#   one statement; failureCode fields carry controlled constants only
#   (MAX_ATTEMPTS_EXCEEDED / TIMEOUT / WORKER_EXCEPTION / RETRYABLE_ERROR),
#   never raw exception text or notification payloads.
#
# barrierMode is `workerMediated` for every row (the established mode of the
# active policy's worker rows, e.g. DataRetentionWorker.doWork and
# WorkerRunLoggerImpl.start): the write barrier is mediated by
# WorkerExecutionGuard.runGuardedWithContext, and NO direct-barrier proof is
# claimed.  The v2 evidence verifier imposes no local direct-barrier
# requirement on workerMediated rows.
#
# Closure additions (GR-08i3 blind-spot sweep): ZERO closure rows.  EVERY
# dao-accessor call in every mutating-callable body was enumerated, not just
# the findings: the 15 findings == the 15 mutating DAO call sites, and every
# called mutating DAO method (NotificationIntakeDao.claimForProcessing /
# markTerminal / markRetryableFailure / markFinalFailure /
# markPrivacyDeniedAndPurgeAllPayload / purgeAllPayload) is an abstract
# Room-annotated method.  NotificationIntakeDao carries ZERO @Transaction
# methods at all -- a fully abstract interface -- so no convenience-method
# closure row exists for this batch.  The only other DAO-accessor calls in
# the bodies are the read-only lookups intakeDao.getProcessingMetadataById
# (2 sites) and intakeDao.getPayloadForProcessing (1 site).  All pipeline
# writes (raw notification, expense, review rows) happen inside
