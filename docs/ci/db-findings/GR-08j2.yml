# GR-08 batch 10, part 2 (GR-08j2) tracked batch manifest -- top-density
# files, group 2: data/store/ExpenseWriteStore.kt +
# data/repository/SourceStatsRepository.kt.
#
# Batch scope (plan): GR-08j covered FOUR top-density files as ONE batch,
# with a forced split if the combined unique fingerprint count exceeded 25
# (see GR-08j1.yml for the split arithmetic: 34 combined unique > 25).
# Scope verification against the trusted START report
# (build/guard-debug/gr08j/before.json == trusted GR-08i after.json,
# 247 findings / 20 advisory diagnostics): ExpenseWriteStore.kt carries
# exactly 11 DB_UNAUTHORIZED_MUTATION findings / 11 UNIQUE fingerprints and
# SourceStatsRepository.kt carries exactly 10 findings / 10 UNIQUE
# fingerprints (dedup key: callable identity + daoAccessor + daoFqcn +
# operation).  This part is within the cap (21 unique).
#
# LAYER LEGALITY:
# * ExpenseWriteStore is the SANCTIONED expense write facade -- its contract
#   ("Coordinators receive this store. Direct DAO mutation outside
#   coordinators/repositories is a static guard violation") makes it the
#   barrier-mediated write path of the TransactionLifecycleCoordinator
#   layer; every method runs writeBarrier.checkWritesAllowed as its FIRST
#   statement, directly before the delegated DAO mutation.  LEGAL_PATHS.md
#   forbids ExpenseDao.insert/update/delete from repositories directly --
#   routing them through this barrier-checked store is the established
#   coordinator-mediated path, not a bypass.  The deleteAll delegate is the
#   debug-only expense wipe (doc comment requires BuildConfig.DEBUG at the
#   caller), mirroring the GR-08e1 NotificationRepository.deleteAll
#   expenseDao.deleteAll row.
# * SourceStatsRepository is a repository-layer writer (legal writer layer)
#   for per-source notification stats; every method runs
#   writeBarrier.checkWritesAllowed directly before the delegated DAO
#   mutation.  Its counters mirror the GR-08a/GR-08b/GR-08d/GR-08e1
#   sourceStatsDao rows already authorized on the pipeline/review paths.
#
# barrierMode is `helper` for every row (the GR-08a..j batch convention; no
# direct-barrier proof is claimed even though both files place the barrier
# check immediately before each mutation).
#
# Chain-form census: ZERO database-chained `database.xxxDao()` call sites in
# EITHER file (every DAO call goes through the injected expenseDao / dao
# constructor properties; neither file injects AppDatabase).  NO GR-08e
# accessor-normalization source change is needed for this batch.
#
# Closure additions (GR-08j blind-spot sweep): ZERO closure rows for BOTH
# files.  Every method in both files is a single-statement delegate (or
# barrier-check + delegate) with no @Transaction convenience methods and no
# constructor aliases; every mutating call site is covered by a finding
# (the remaining SourceStatsRepository methods getByPackage/getAll are
# read-only; ExpenseWriteStore has no read methods at all).
#
# Multi-seed note: the migration CLI accepts a SINGLE --seed-rows value, so
# every generation run consumes the combined document
# docs/ci/db-findings/GR-08-seeds.yml (GR-08a + GR-08b + GR-08c1 + GR-08c2
# + GR-08d + GR-08e1 + GR-08e2 + GR-08f + GR-08g + GR-08h + GR-08i1 +
# GR-08i2 + GR-08i3 + GR-08j1 + GR-08j2 rows verbatim, 212 rows); passing
