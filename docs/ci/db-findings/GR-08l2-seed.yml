# GR-08 batch 12, part 2 (GR-08l2) reviewed exact v2 policy seed rows --
# DB_UNAUTHORIZED_MUTATION EXACT_POLICY authorization for
# data/repository/SavingsGoalRepository.kt,
# domain/transaction/lifecycle/TransactionLifecycleCoordinator.kt and
# data/repository/SubscriptionManagementRepository.kt.
#
# Scope verification against the trusted START report
# (build/guard-debug/gr08l/before.json == trusted GR-08k after.json,
# 163 findings / 20 advisory diagnostics): SavingsGoalRepository.kt carries
# exactly 8 DB_UNAUTHORIZED_MUTATION findings / 8 UNIQUE fingerprints,
# TransactionLifecycleCoordinator.kt carries exactly 8 findings / 8 UNIQUE
# fingerprints and SubscriptionManagementRepository.kt carries exactly 7
# findings / 7 UNIQUE fingerprints (dedup key: callable identity +
# daoAccessor + daoFqcn + operation; the coordinator's two bulkUpdateCategory
# overloads and two deleteExpense overloads are DISTINCT callables, each
# carrying two distinct DAO operations, so no two findings share a
# fingerprint).
#
# Layer legality:
# * TransactionLifecycleCoordinator is THE expense lifecycle authority named
#   by docs/architecture/LEGAL_PATHS.md ("Expense Mutations"): "DELETE
#   expense -> TransactionLifecycleCoordinator.deleteExpense(id) ... loads
#   snapshot INSIDE transaction -> TransactionEvent with
#   LifecycleEventType.DELETED", and bulk category reassignment is the
#   coordinator's own documented bulk-update path (single SQL UPDATE + one
#   BULK_UPDATED TransactionEvent inside database.withTransaction +
#   aggregate post-commit side effects via
#   dispatchBulkPostCommitSideEffects).  "ExpenseDao.delete() from
#   repositories directly" is FORBIDDEN -- these rows ARE the coordinator
#   writing through its own injected expenseDao, i.e. the legal path
#   itself.  Every entrypoint runs checkWritesAllowed (writeBarrier
#   delegation) first; the class carries
#   @OptIn(RestrictedExpenseDaoMutation::class).  The coordinator's OTHER
#   mutating callables (createExpenseMutation, updateExpense, updateCategory,
#   updateMerchant, updateType, updateTransferDetails,
#   updateTypeAndTransferDetails, updateOwnershipDbOnlyV2, bulkUpdateMerchant,
#   writeDuplicateEvent, writeUpdateValidationFailedEventBestEffort) are
#   ALREADY authorized by the active policy -- only the two
#   bulkUpdateCategory overloads and the two deleteExpense overloads were
#   still unauthorized.
# * SavingsGoalRepository is the repository-layer legal writer for savings
#   goals (implements the domain.savings.SavingsGoalRepository interface; it
#   is the SOLE writer of SavingsGoalDao).  Every mutating method runs
#   writeBarrier.checkWritesAllowed directly before the delegated DAO
#   mutation.  The deprecated entity-typed aliases (addGoal/deleteGoal/
#   updateGoalAmount/addToGoalAmount) are distinct callables from the
#   domain-typed overrides and are authorized separately.  Mirrors the
#   GR-08k1 RecommendationRepository adjudication.
# * SubscriptionManagementRepository is a repository-layer legal writer for
#   the subscription MANAGEMENT surface (edit/delete/usage
#   logging/candidate disposition) consumed by
#   SubscriptionManagementViewModel.  Every mutating method runs
#   writeBarrier.checkWritesAllowed directly before the delegated DAO
#   mutation.  LEGAL_PATHS.md ("Subscription Mutations") keeps
#   SubscriptionManagerEngine.validateAndCreate/acceptCandidate/
#   recordPriceChange as the validated CREATE/ACCEPT/price-change authority
#   (the engine's own DAO writes are the sanctioned path and stay
#   authorized there); the FORBIDDEN rows target RAW DAO writes bypassing
#   that validation from arbitrary layers -- this repository is the
#   sanctioned barrier-checked writer layer for the management flows that
#   have no engine-owned alternative (updateSubscription/
#   deleteSubscriptionById/insertUsage/markCandidateAsConverted/
#   markCandidateAsRejected), the same repository-layer-writer precedent as
#   GR-08k1 RecommendationRepository and GR-08j2 SourceStatsRepository.
#   insertSubscription remains the raw writer behind the documented external
#   entry points (SubscriptionManagementViewModel KDoc) while the UI create
#   flow routes through validateAndCreate.
#
# Closure additions (GR-08l blind-spot sweep): ZERO closure rows for ALL
# THREE files.  Every dao-accessor call in ALL batch callable bodies was
# enumerated: SavingsGoalDao, UserCorrectionDao, TransactionEventDao,
# ManualRecurringExpenseDao, SubscriptionPriceHistoryDao,
# SubscriptionUsageDao and SubscriptionCandidateDao are fully abstract
# interfaces with ZERO body-carrying @Transaction convenience methods; the
# coordinator's body-carrying @Transaction ExpenseDao composites
# (findDuplicateIdCurrencyAware / isDuplicateCurrencyAware) are strictly
# read-only, and its database.withTransaction calls are the
# androidx.room.withTransaction extension, not DAO accessors.
#
# Chain-form census: ZERO database-chained `database.xxxDao()` mutation
# receivers in ALL THREE files (every DAO call goes through the injected
# constructor properties expenseDao / transactionEventDao / savingsGoalDao /
# subscriptionDao / priceHistoryDao / usageDao / candidateDao).  NO
# accessor-normalization source change is needed for this part.
#
# barrierMode is `helper` for every row (the GR-08a..k batch convention; no
# direct-barrier proof is claimed even though every covered callable places
# writeBarrier.checkWritesAllowed at its entrypoint).
