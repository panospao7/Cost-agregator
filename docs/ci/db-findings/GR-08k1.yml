# GR-08 batch 11, part 1 (GR-08k1) tracked batch manifest -- top-density
# files, group 1: di/RetentionModule.kt (privacy retention-cleanup path) +
# data/repository/RecommendationRepository.kt (repository legal writer).
#
# Batch scope (plan): GR-08k covered FOUR files as ONE batch, with a forced
# split if the combined unique fingerprint count exceeded 25.  Scope
# verification against the trusted START report
# (build/guard-debug/gr08k/before.json == trusted GR-08j after.json,
# 200 findings / 20 advisory diagnostics; reference-copy SHA-256 recorded
# below): RetentionModule.kt carries exactly 10 DB_UNAUTHORIZED_MUTATION
# findings collapsing to 10 UNIQUE fingerprints and
# RecommendationRepository.kt carries exactly 9 findings collapsing to 9
# UNIQUE fingerprints (dedup key: callable identity + daoAccessor + daoFqcn
# + operation; expireOld appears behind BOTH the expireOld and the expireAll
# callables, and saveAll carries two distinct RecommendationDao operations,
# so no two findings share a fingerprint).  Combined batch unique count
# 37 > the 25-fingerprint batch cap, so the batch was SPLIT into GR-08k1
# (this manifest: RetentionModule.kt + RecommendationRepository.kt,
# 19 findings / 19 unique fingerprints) and GR-08k2
# (GroupLifecycleCoordinator.kt + EnhancedSplitManager.kt, 18 findings /
# 18 unique fingerprints) per the GR-08c/GR-08e/GR-08i/GR-08j precedent;
# each part is within the cap.
#
# RETENTIONMODULE ADJUDICATION (GR-08k task-2 gate): the 10 findings are the
# purge mutations of the RetentionTarget set registered by the PRIV-441-12
# Hilt module that DataRetentionWorker drives through
# RetentionRegistry.allTargets.  Adjudicated as the CANONICAL PRIVACY
# RETENTION-CLEANUP path, NOT a forbidden writer: every row nulls/redacts/
# deletes expired RAW PII (raw notification text, OCR text, notification
# intake payloads, email sensitive fields, pending-review notification text,
# background-job error messages, bank-statement merchant names, AI artifacts
# and chat messages, pipeline diagnostic events) exactly as the privacy
# rules require -- privacy cleanup workers must be able to run so they can
# delete raw data.  These purges ARE the legal retention mechanism; there is
# no other writer for them.  Failure handling stays sanitized
# (errorMessage carries only the RETENTION_PURGE_FAILED:<class-simpleName>
# constant) and CancellationSafe.runCatchingCancellable rethrows
# CancellationException.  CODE_FIX was rejected: moving the purges out of
# the retention targets would break the RetentionRegistry contract and
# gate cleanup on the very capability it enforces.
#
# RECOMMENDATIONREPOSITORY LAYER LEGALITY: repository-layer writer (legal
# writer layer) for dashboard follow-through recommendations; every
# mutating method runs writeBarrier.checkWritesAllowed directly before the
# delegated DAO mutation, and the repository is the SOLE writer of
# RecommendationDao.  Mirrors the GR-08j2 SourceStatsRepository
# adjudication.
#
# ACCESSOR NORMALIZATION (GR-08k1 source change, GR-08e precedent): the
# START findings spell 7 chain-form accessors (appDatabase.aiArtifactDao()
# etc.) and 3 method-local aliases all named `dao` behind THREE different
# DAOs (RawNotificationDao / ScannedReceiptDao / NotificationIntakeDao).
# No chain-form spelling can pass both the scanner gate (exact
# receiver-text match) and the v2 evidence verifier (canonical accessor
# identity), and the colliding `dao` aliases resolve last-write-wins to one
# identity carrying three FQCNs (DB_V2_POLICY_DAO_AMBIGUOUS).  The source
# change renames each target's local to its DAO-named accessor
# (rawNotificationDao / scannedReceiptDao / notificationIntakeDao) and
# introduces the same DAO-named locals for the 7 chain-form sites; the seed
# rows spell those normalized accessors.  A wrong accessor spelling --
# including the historical chain text -- stays unauthorized.
#
# Chain-form census AFTER the normalization: ZERO database-chained
# `appDatabase.xxxDao()` mutation receivers remain in RetentionModule.kt;
# RecommendationRepository.kt never had one (every DAO call goes through
# the injected `dao` constructor property).
#
# Closure additions (GR-08k blind-spot sweep): ZERO closure rows for BOTH
# files.  Every mutating DAO call in both files is an abstract
# Room-annotated method already covered by a finding (all ten RetentionModule
# DAOs and RecommendationDao carry ZERO body-carrying @Transaction
# convenience methods reachable from these files -- PendingReviewDao's
# mutating upsertByRawNotificationId / bulkUpdateCategoryByMerchant /
# bulkRenameMerchant are NOT called from RetentionModule, whose only
# PendingReviewDao call is the abstract redactNotificationTextOlderThan;
# the remaining RetentionModule DAO calls
# getUnpurgedRawNotificationsOlderThan /
# getUnpurgedScannedReceiptsOlderThan / getUnpurgedIntakeOlderThan and all
# other RecommendationRepository calls are read-only).
#
# Multi-seed note: the migration CLI accepts a SINGLE --seed-rows value, so
# every generation run consumes the combined document
# docs/ci/db-findings/GR-08-seeds.yml (GR-08a + GR-08b + GR-08c1 + GR-08c2
# + GR-08d + GR-08e1 + GR-08e2 + GR-08f + GR-08g + GR-08h + GR-08i1 +
# GR-08i2 + GR-08i3 + GR-08j1 + GR-08j2 + GR-08k1 + GR-08k2 rows verbatim,
# 249 rows); passing only GR-08k1-seed.yml would drop the earlier batches'
# rows from the rendered candidate.
