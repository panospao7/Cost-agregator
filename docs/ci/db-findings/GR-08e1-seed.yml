# (MIT-DB-08E).
#
# Consumed ONLY via `scripts/migrate_db_policy_signatures.py --seed-rows`.
# This document is a full v2-shaped policy document: it is loaded through
# `scripts.db_guard.policy_v2_loader.load_policy_v2` (exact field set,
# type/enum/signature validation, canonical path syntax, within-document
# duplicate mutation-key rejection) and merged into the generated candidate
# only after seed/legacy duplicate-key rejection.  Seeds never bypass the
# loader, the evidence verifier, or the promotion gates.
#
# Scope: NotificationRepository.kt -- 23 DB_UNAUTHORIZED_MUTATION findings
# collapsing to 23 UNIQUE fingerprints (dedup key: callable identity +
# daoAccessor + daoFqcn + operation; every finding in this file is a distinct
# tuple -- no per-call-site repeats).  Unique count 23 <= the 25-fingerprint
# batch cap.  The COMBINED GR-08e batch (this file + GR-08e2-seed.yml) would
# carry 46 unique fingerprints > the cap, so the batch was SPLIT into
# GR-08e1 (this file) / GR-08e2 per the GR-08c precedent (a split is forced
# only above 25).  This is the REPOSITORY layer -- a legal writer layer per
# docs/architecture/LEGAL_PATHS.md -- so every row is a legal-writer
# EXACT_POLICY authorization: raw-notification persistence and deletion,
# package blocking, per-source stats bookkeeping, review/correction cleanup,
# and the BULK_DELETED audit event, all guarded by
# writeBarrier.checkWritesAllowed at each public entrypoint.
#
# barrierMode is `helper` for every row: the write barrier runs at the
# repository public entrypoints (every mutating callable opens with
# writeBarrier.checkWritesAllowed), not directly before each individual
# mutation inside the transaction bodies, and no direct-barrier proof is
# claimed.
#
# GR-08e SOURCE CHANGE (accessor normalization): the BULK_DELETED audit
# write in deleteAllNotifications previously reached the DAO through the
# database-chained form `database.transactionEventDao().insert(...)`.  The
# findings scanner reports that receiver text verbatim
# (`database.transactionEventDao()`), but the v2 source-evidence verifier
# resolves chain-form bodies to the Room accessor identity
# (`transactionEventDao`) and fails any row spelled with the chain text
# (DB_V2_POLICY_MUTATION_NOT_FOUND -- empirically evidenced in
# build/guard-debug/gr08e/probe-accessor-spellings.json), so NO spelling of a
# chain-form row can pass both gates.  The batch therefore normalizes the
# call site to the codebase-standard constructor-property injection
# (ReviewQueueRepository.kt precedent, GR-08d): `transactionEventDao` is now
# an @Inject constructor property (provided by DaoModule) and the row below
# spells `transactionEventDao`.  Room caches DAO instances per database, so
# the injected instance is the same object the chained call returned; the
# mutation stays inside the same database.withTransaction block and all
# lifecycle/privacy semantics are preserved.  Callable signatures are
# unchanged, so every finding fingerprint is unchanged.
#
# Closure additions (GR-08e blind-spot sweep): ZERO closure rows.  EVERY
# dao-accessor call in ALL mutating-callable bodies was enumerated, not just
# the findings: the 23 findings == the 23 mutating DAO call sites, and every
# called DAO method (RawNotificationDao, BlockedPackageDao, SourceStatsDao,
# UserCorrectionDao, PendingReviewDao, ExpenseDao.deleteAll,
# TransactionEventDao.insert) is an abstract Room-annotated method -- this
# file calls NO body-carrying @Transaction DAO convenience method (the
# PendingReviewDao calls are getByRawId/deleteByRawId/deleteAll, all
# abstract).  Read-only callables (getAllNotifications,
# getRecentNotifications, getNotificationsByPackage, getAllPackages,
# getCount, exists, getSourceStats, getClassifierStatsFlow,
# getClassifierStats, isPackageBlocked, getBlockedPackages,
# createDebugSnapshot, getSourceStatsSnapshot) perform no mutations;
# processAndSave/processAndSaveAll/retrainClassifier delegate to the
# pipeline/classifier whose own writes live in already-authorized batch
# scopes (GR-08a/GR-08b).
#
# NOTE: the migration CLI accepts a SINGLE --seed-rows value, so the
# generation run consumes the COMBINED document
# docs/ci/db-findings/GR-08-seeds.yml (GR-08a + GR-08b + GR-08c1 + GR-08c2
# + GR-08d + GR-08e1 + GR-08e2 rows verbatim); passing only this file would
