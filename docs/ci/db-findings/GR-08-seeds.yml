#
# Consumed ONLY via `scripts/migrate_db_policy_signatures.py --seed-rows`.
# The migration CLI accepts a SINGLE --seed-rows value, so every generation
# run that must keep earlier batches authorized consumes THIS combined
# document: it contains the GR-08a rows (docs/ci/db-findings/GR-08a-seed.yml),
# the GR-08b rows (docs/ci/db-findings/GR-08b-seed.yml), the GR-08c1 rows
