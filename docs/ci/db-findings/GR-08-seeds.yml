# (docs/ci/db-findings/GR-08d-seed.yml) VERBATIM.  The
# per-batch seed files remain the reviewed batch-scope records; this file is
# the generation input.  scripts/test_migrate_db_policy_seed_rows.py guards
# the concatenation so the combined document can never drift from the five
# batch files.
#
# Loaded through `scripts.db_guard.policy_v2_loader.load_policy_v2` (exact
