#
# Consumed ONLY via `scripts/migrate_db_policy_signatures.py --seed-rows`.
# The migration CLI accepts a SINGLE --seed-rows value, so every generation
# run that must keep earlier batches authorized consumes THIS combined
# document: it contains the GR-08a rows (docs/ci/db-findings/GR-08a-seed.yml)
# and the GR-08b rows (docs/ci/db-findings/GR-08b-seed.yml) VERBATIM.  The
# per-batch seed files remain the reviewed batch-scope records; this file is
# the generation input.  scripts/test_migrate_db_policy_seed_rows.py guards
# the concatenation so the combined document can never drift from the two
# batch files.
#
# Loaded through `scripts.db_guard.policy_v2_loader.load_policy_v2` (exact
# field set, type/enum/signature validation, canonical path syntax,
# within-document duplicate mutation-key rejection) and merged into the
# generated candidate only after seed/legacy duplicate-key rejection.
# Seeds never bypass the loader, the evidence verifier, or the promotion
# gates.
#
# barrierMode is `helper` for every row: the write barrier runs in the
# pipeline entrypoints (process / processBatch), not directly before each
# mutation in these bodies, and no direct-barrier proof is claimed.
