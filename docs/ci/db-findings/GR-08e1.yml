# GR-08 batch 5, part 1 (GR-08e1) tracked batch manifest -- DB_UNAUTHORIZED_MUTATION
# exact-policy authorization for NotificationRepository.kt.
#
# Batch scope (plan): GR-08e covered TWO files (NotificationRepository.kt 23
# findings + WarrantyTrackerRepository.kt 23 findings) as ONE batch, with a
# forced split if the combined unique fingerprint count exceeded 25.  Scope
# verification against the trusted START report
# (build/guard-debug/gr08e/before.json == trusted GR-08d after.json,
# 391 findings / 20 advisory diagnostics): NotificationRepository.kt carries
# exactly 23 DB_UNAUTHORIZED_MUTATION findings collapsing to 23 UNIQUE
# fingerprints (dedup key: callable identity + daoAccessor + daoFqcn +
# operation; every finding here is a distinct tuple -- no per-call-site
# repeats), and WarrantyTrackerRepository.kt carries 23 findings / 23 unique
# fingerprints.  Combined unique count 46 > the 25-fingerprint batch cap, so
# the batch was SPLIT into GR-08e1 (this manifest) / GR-08e2
# (GR-08e2.yml) per the GR-08c precedent; each part is within the cap.
# All 23 file findings are DB_UNAUTHORIZED_MUTATION with disposition
# EXACT_POLICY: this file is the REPOSITORY layer, a legal writer layer per
# docs/architecture/LEGAL_PATHS.md (raw-notification persistence/deletion,
# package blocking, per-source stats bookkeeping, review/correction cleanup,
# BULK_DELETED audit event; every entrypoint opens with
# writeBarrier.checkWritesAllowed).
#
# GR-08e SOURCE CHANGE (accessor normalization, both parts): 9 of the 46
# batch findings (1 here, 8 in GR-08e2) reached their DAO through the
# database-chained form `database.xxxDao().insert(...)`.  The findings
# scanner reports that receiver text verbatim, but the v2 source-evidence
# verifier resolves chain-form bodies to the Room accessor identity and
# fails any row spelled with the chain text (DB_V2_POLICY_MUTATION_NOT_FOUND
# -- empirically evidenced in build/guard-debug/gr08e/
# probe-accessor-spellings.json), so NO spelling of a chain-form row can
# pass both gates.  The batch normalizes those call sites to the
# codebase-standard constructor-property injection (ReviewQueueRepository.kt
# precedent, GR-08d): `transactionEventDao` (here) and
# `warrantyLifecycleEventDao` (GR-08e2) are now @Inject constructor
# properties provided by DaoModule.  Room caches DAO instances per database,
# so the injected instances are the same objects the chained calls returned;
# every write keeps its surrounding transaction and cancellation-safe
# semantics.  Callable signatures are unchanged, so every finding fingerprint
# is unchanged and the 391 -> 345 delta accounting holds.  End-to-end
# pre-validation with the real scanner over the changed source
# (build/guard-debug/gr08e/probe-delta-final.json): 345 findings, both batch
# files at 0, out-of-batch byte-stable, zero added findings.
#
# Closure additions (GR-08e blind-spot sweep): ZERO closure rows.  EVERY
# dao-accessor call in ALL mutating-callable bodies was enumerated, not just
# the findings: 23 findings == 23 abstract-method mutating call sites, and
# this file calls NO body-carrying @Transaction DAO convenience method (the
# PendingReviewDao calls are getByRawId/deleteByRawId/deleteAll, all
# abstract; RawNotificationDao, BlockedPackageDao, SourceStatsDao,
# UserCorrectionDao, ExpenseDao.deleteAll and TransactionEventDao.insert are
# abstract too).  Read-only callables perform no mutations;
# processAndSave/processAndSaveAll/retrainClassifier delegate to the
# pipeline/classifier whose own writes live in already-authorized batch
# scopes (GR-08a/GR-08b).  Constructor-property DAO aliases (GR-08a
# pattern): all DAO accessors except the normalized transactionEventDao are
# direct constructor properties resolved natively by the evidence verifier;
# after the GR-08e source change transactionEventDao is one too.
# Multi-seed note: the migration CLI accepts a SINGLE --seed-rows value, so
# every generation run consumes the combined document
# docs/ci/db-findings/GR-08-seeds.yml (GR-08a + GR-08b + GR-08c1 + GR-08c2
# + GR-08d + GR-08e1 + GR-08e2 rows verbatim); passing only GR-08e1-seed.yml
# would drop the earlier batches' rows from the rendered candidate.
