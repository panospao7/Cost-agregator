meta:
  repo: "panospao7/Cost-agregator"
  commit: "4113e38f0d838a29d2d13d82a483ba573280721c"
  pipeline: "10 - Bank Integration / Bank API Sync / Bank Statement Imports"
  review_mode: "static GitHub source/debugging session; no local Gradle/device execution"
  verdict: "PROTOTYPE_SHELL_NOT_CLEAN"
  summary: >
    Pipeline 10 is still not production-clean. The dangerous part from the old
    report is partly mitigated: demo bank API methods are now guarded by
    BuildConfig.DEBUG and BankApiConfig.isStubMode, and BankApiIntegration checks
    DatabaseWriteBarrier before stub connect/sync calls. However, the feature
    remains mostly a demo shell. There is no real provider port, no repository,
    no connection lifecycle coordinator, no OAuth state/PKCE model, no sync-run
    ledger/checkpoint, no account-level model, no durable token-refresh lifecycle,
    no bank sync worker, and no low-confidence review routing for API transactions.
    Bank statement import is stronger than before for duplicate checks, but still
    has atomicity, privacy, review-createdAt, insert-result, and shared-deduper gaps.

tracker_reconciliation:
  P10-P0-01_bank_api_demo_stub:
    tracker_status: "FIXED"
    actual_status: "SAFETY_GUARD_FIXED_FEATURE_STILL_STUB"
    notes:
      - "requireStubMode() blocks all demo methods in !BuildConfig.DEBUG."
      - "BankApiConfig.isStubMode must also be true."
      - "This prevents release mock imports, but no real provider implementation exists."
      - "BankApiConfig.isStubMode is still true by default for debug/demo."

  P10-P0-02_bank_connection_viewmodel_noop:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "BankConnectionsViewModel injects no repository."
      - "init creates fake disconnected BankConnection rows from SUPPORTED_BANKS."
      - "syncConnection() and disconnect() are comments/no-ops."
      - "The fake rows use createdAt=0L."

  P10-P1-01_completeConnection_no_persist:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL"
    notes:
      - "completeConnection() now sets createdAt=timeProvider.now()."
      - "It still returns a BankConnection entity and does not persist/upsert it."
      - "There is still no updatedAt, connection event, repository, or lifecycle coordinator."

  P10-P1-02_no_oauth_state_pkce:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "initiateConnection() returns placeholder oauth.<bank>.example.com URL."
      - "completeConnection(bankId, authCode) accepts bankId + authCode only."
      - "No BankAuthSession/state/PKCE/redirect/session replay protection."

  P10-P1-03_no_sync_run_ledger_checkpoint:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "syncTransactions() returns in-memory SyncResult."
      - "No BankSyncRun, BankTransactionImport, provider cursor, page checkpoint, or per-row outcome."

  P10-P1-04_no_low_confidence_review_route:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "API sync maps every mock/provider transaction directly to CreateExpenseRequest."
      - "TODO for BankTransactionClassifier remains in source."
      - "Statement imports create PendingReview, but API sync does not."

  P10-P1-05_bank_metadata_not_preserved:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "CreateExpenseRequest has no bankConnectionId/providerId/accountId/syncRunId/providerTransactionId fields."
      - "Only source=BANK_API_SYNC and notes carry weak origin data."

  P10-P1-06_token_refresh_not_persisted:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "refreshToken() only decrypts refreshToken and returns true/false."
      - "BankConnectionDao.updateToken() exists but is unused."
      - "No reauth-required state or durable token refresh event."

  P10-P1-07_no_restore_barrier:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL"
    notes:
      - "BankApiIntegration now injects DatabaseWriteBarrier and checks it."
      - "Raw BankConnectionDao mutators remain public and unguarded."
      - "No bank lifecycle coordinator owns all bank writes."

  P10-P1-08_statement_dedupe_weaker:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL_FIXED"
    notes:
      - "BankStatementLifecycleProcessor now checks existing approved expenses and pending reviews with amount/date/currency/type."
      - "But there is still no shared BankTransactionDeduper used by API sync and statements."
      - "PendingReview insert result is not checked."

  P10-P1-09_one_by_one_no_sync_semantics:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "syncTransactions() imports each transaction one by one."
      - "No durable sync transaction semantics, partial run status, retry cursor, or per-transaction import state."

positive_findings:
  - "Demo bank API sync is now release-blocked by BuildConfig.DEBUG in requireStubMode()."
  - "BankApiIntegration checks DatabaseWriteBarrier before initiateConnection(), completeConnection(), and syncTransactions()."
  - "Bank-created expenses still route through TransactionLifecycleCoordinator."
  - "BankTokenCipher uses Android Keystore AES/GCM with an enc:v1 prefix."
  - "BankConnection schema has useful fields: lastSyncStatus, lastError, consecutiveErrors, tokenExpiry, tokenEncryptionVersion, autoSync, syncFrequency."
  - "BankStatementLifecycleProcessor now checks existing approved expenses before creating statement PendingReview rows."
  - "BankStatementLifecycleProcessor also checks pending review duplicates with currency and transaction-type awareness."
  - "BankStatementLifecycleProcessor uses ReceiptEvent records for statement receipt saved/complete stages."
  - "BankStatementParser resolves home currency instead of hardcoding EUR in the main parse call."
  - "API sync source is marked as ExpenseSource.BANK_API_SYNC."

issues:
  - id: "P10-CURRENT-001"
    severity: "P0_FEATURE_BLOCKER"
    status: "OPEN"
    title: "Bank integration is still demo-only; release is safe but feature is not real"
    evidence:
      - "BankApiIntegration core methods are annotated @StubForDemo."
      - "requireStubMode() errors in !BuildConfig.DEBUG."
      - "syncTransactions() calls generateMockTransactions()."
      - "No BankProvider interface or provider implementation exists under domain/bank."
    impact:
      - "Real bank connection/sync cannot work in production."
      - "Debug sync creates fake randomized expenses."
    fix:
      - "Split current class into DemoBankProvider."
      - "Add BankProvider port and provider registry."
      - "Hide bank UI unless a real provider is registered or app is debug/demo."
    tests:
      - "release_build_cannot_register_demo_bank_provider"
      - "production_without_bank_provider_shows_feature_unavailable"
      - "debug_demo_sync_is_explicitly_labeled_demo"

  - id: "P10-CURRENT-002"
    severity: "P0_FEATURE_BLOCKER"
    status: "OPEN"
    title: "BankConnectionsViewModel is still non-functional and shows fake rows"
    evidence:
      - "ViewModel injects no repository."
      - "init maps SUPPORTED_BANKS into disconnected BankConnection rows."
      - "syncConnection() and disconnect() are no-ops."
      - "createdAt=0L in those fake rows."
    impact:
      - "Screen cannot load real connections, sync, disconnect, or persist state."
      - "User can see fake bank rows that are not DB-backed."
    fix:
      - "Introduce BankConnectionRepository."
      - "Observe BankConnectionDao through repository."
      - "Expose supported banks separately from connected accounts."
      - "Wire sync/disconnect to lifecycle coordinator."
    tests:
      - "viewmodel_observes_real_connections"
      - "viewmodel_does_not_emit_fake_BankConnection_entities"
      - "sync_button_invokes_repository"
      - "disconnect_button_persists_disconnect_or_rolls_back"

  - id: "P10-CURRENT-003"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "No bank connection lifecycle coordinator/repository owns connect/disconnect/token writes"
    evidence:
      - "BankConnectionDao exposes insert/update/delete/disconnect/updateSyncStatus/updateToken."
      - "No BankConnectionRepository or BankConnectionLifecycleCoordinator exists."
      - "DaoModule does not expose a dedicated BankConnectionDao provider; AppDatabase has bankConnectionDao only."
    impact:
      - "Future callers can bypass restore barrier, timestamps, encryption, token policy, lifecycle events, and duplicate handling."
    fix:
      - "Add BankConnectionLifecycleCoordinator with DatabaseWriteBarrier and AppDatabase.withTransaction."
      - "All connect/refresh/sync/disconnect writes go through it."
      - "Add BankConnectionEvent or PipelineDiagnosticEvent records."
    tests:
      - "connect_disconnect_token_refresh_use_bank_lifecycle_coordinator"
      - "raw_BankConnectionDao_mutators_not_called_outside_allowlist"

  - id: "P10-CURRENT-004"
    severity: "P1_HIGH"
    status: "PARTIAL"
    title: "completeConnection() returns an entity instead of a durable lifecycle result"
    evidence:
      - "completeConnection() constructs and returns BankConnection."
      - "It does not call dao.insert/upsert."
      - "It sets createdAt but BankConnection still has no updatedAt."
      - "Unique index on bankId means duplicate insert would throw instead of structured outcome."
    impact:
      - "Connection completion is not durable."
      - "A future caller can insert stale/default fields or lose duplicate/connect audit behavior."
    fix:
      - "Provider returns token/account payload, not Room entity."
      - "Coordinator validates, encrypts, upserts, sets createdAt/updatedAt, and writes CONNECTED event."
    tests:
      - "complete_connection_persists_connection"
      - "complete_connection_sets_createdAt_updatedAt"
      - "duplicate_bank_connection_returns_existing_or_updates_tokens"
      - "connect_writes_bank_connection_event"

  - id: "P10-CURRENT-005"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "OAuth state/PKCE/callback validation is absent"
    evidence:
      - "initiateConnection() returns placeholder URL only."
      - "completeConnection(bankId, authCode) lacks state, sessionId, redirectUri, and PKCE verifier."
    impact:
      - "Real OAuth flow would be vulnerable to callback spoofing, CSRF, replay, wrong-bank completion, and expired auth sessions."
    fix:
      - "Add BankAuthSession entity with stateHash, encrypted pkceVerifier, expiresAt, consumedAt."
      - "Complete callback must atomically consume session and create/update connection."
    tests:
      - "callback_wrong_state_rejected"
      - "callback_replay_rejected"
      - "expired_auth_session_rejected"
      - "wrong_bank_callback_rejected"
      - "successful_callback_consumes_session"

  - id: "P10-CURRENT-006"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Provider transaction idempotency key is passed but ignored"
    evidence:
      - "mapTransactionToExpense() sets idempotencyKey = transaction.id."
      - "CreateExpenseRequest default deduplicationMode is STANDARD."
      - "TransactionLifecycleCoordinator only uses idempotencyKey in STRICT_EXTERNAL_ID mode."
    impact:
      - "Provider transaction ID does not create the persisted idem:BANK_API_SYNC:<id> dedupeKey."
      - "Re-sync of same provider transaction can duplicate if merchant/date/amount text changes outside standard duplicate window/tolerance."
    fix:
      - "Set deduplicationMode = STRICT_EXTERNAL_ID for bank API imports."
      - "Use providerId/accountId/transactionId namespaced externalFingerprint."
    tests:
      - "bank_api_sync_uses_STRICT_EXTERNAL_ID"
      - "same_provider_transaction_id_retries_return_duplicate_existing_id"
      - "same_provider_id_with_changed_description_does_not_duplicate"

  - id: "P10-CURRENT-007"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "No durable BankSyncRun or BankTransactionImport ledger"
    evidence:
      - "syncTransactions() returns SyncResult only."
      - "No sync-run/import entities exist in AppDatabase entity list."
      - "BankConnectionDao.updateSyncStatus() exists but is not called."
    impact:
      - "Crash mid-sync leaves unknown partial import state."
      - "Retry cannot resume by cursor/page."
      - "Debug cannot answer which transaction imported/skipped/failed."
    fix:
      - "Add BankSyncRun and BankTransactionImport."
      - "Record RECEIVED, IMPORTED_EXPENSE, DUPLICATE_SKIPPED, PENDING_REVIEW, FAILED_VALIDATION, FAILED_DB."
      - "Persist cursor/page checkpoint after each provider page."
    tests:
      - "sync_run_records_started_completed"
      - "sync_crash_after_page_resumes_from_checkpoint"
      - "failed_middle_transaction_finalizes_PARTIAL"
      - "retry_processes_only_unfinished_import_rows"

  - id: "P10-CURRENT-008"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Connection lastSyncStatus/lastError/consecutiveErrors are never updated by sync"
    evidence:
      - "BankConnectionDao has updateSyncStatus()."
      - "syncTransactions() does not call updateSyncStatus/updateLastError."
      - "BankConnectionDao TODO says detailed last-error helpers are still missing."
    impact:
      - "UI and future autosync cannot know if a sync succeeded, partially failed, or needs reauth."
    fix:
      - "BankSyncCoordinator finalizer updates BankConnection from BankSyncRun outcome."
      - "Add updateLastError/updateErrorCounters/updateReauthRequired."
    tests:
      - "successful_sync_updates_lastSyncStatus_SUCCESS"
      - "partial_sync_updates_lastSyncStatus_PARTIAL"
      - "failed_sync_updates_lastError_and_consecutiveErrors"

  - id: "P10-CURRENT-009"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Expired token refresh is stub-only and not durable"
    evidence:
      - "refreshToken() decrypts refresh token and returns true."
      - "No provider call is made."
      - "No new access token/refresh token/expiry is persisted."
      - "No auth status or reauth-required state exists."
    impact:
      - "Expired connections cannot recover in a real integration."
      - "Sync failure may not leave durable action-needed state."
    fix:
      - "Provider returns TokenRefreshResult.Refreshed/ReauthRequired/Failed."
      - "Coordinator persists encrypted tokens, tokenExpiry, error counters, and TOKEN_REFRESHED/REAUTH_REQUIRED events."
    tests:
      - "expired_token_refresh_persists_new_tokens"
      - "refresh_failure_imports_zero_transactions"
      - "reauth_required_marks_connection_attention_needed"
      - "refresh_failure_updates_connection_error_state"

  - id: "P10-CURRENT-010"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Raw BankConnectionDao write surface is public and unguarded"
    evidence:
      - "BankConnectionDao exposes insert/update/delete/disconnect/updateSyncStatus/updateToken."
      - "No DatabaseWriteBarrier is enforced inside DAO."
      - "No static allowlist was verified."
    impact:
      - "Future code can mutate bank credentials/state during backup/restore or without encryption/event policy."
    fix:
      - "Restrict DAO usage to bank lifecycle coordinator and migrations."
      - "Add CI guard for BankConnectionDao mutators."
    tests:
      - "restore_blocks_bank_connect_sync_disconnect_token_refresh"
      - "bank_dao_mutator_guard_blocks_unapproved_callers"

  - id: "P10-CURRENT-011"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "No low-confidence review route for API bank transactions"
    evidence:
      - "syncTransactions() maps all fetched transactions directly to CreateExpenseRequest."
      - "TODO says BankTransactionClassifier should route low-confidence transactions to PendingReview."
    impact:
      - "Ambiguous transfers, refunds, fees, pending authorizations, unknown merchants, and missing currency records can become approved expenses immediately."
    fix:
      - "Add BankTransactionClassifier and BankImportRouter."
      - "Auto-create only high-confidence posted purchases/deposits/transfers."
      - "Send uncertain rows to PendingReview with bank metadata."
    tests:
      - "low_confidence_bank_transaction_creates_pending_review"
      - "high_confidence_bank_purchase_auto_imports"
      - "ambiguous_transfer_goes_to_review"
      - "missing_currency_goes_to_review"

  - id: "P10-CURRENT-012"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Bank/source metadata is not preserved on imported expenses"
    evidence:
      - "CreateExpenseRequest source link fields include notification/review/receipt/email/group/csv but no bank fields."
      - "BankApiIntegration only passes source=BANK_API_SYNC and notes."
      - "Expense has no providerTransactionId/accountId/bankConnectionId columns or source-link table."
    impact:
      - "Cannot trace expense to bank/account/provider/sync run."
      - "Disconnecting/reconciling one bank account cannot find its imported rows."
    fix:
      - "Add expense_source_links or bank_transaction_import link table."
      - "Persist connectionId, accountId, providerId, providerTransactionId, syncRunId, bookingDate/valueDate."
    tests:
      - "bank_import_persists_connection_id"
      - "bank_import_persists_provider_transaction_id"
      - "transaction_event_contains_bank_sync_run_id"

  - id: "P10-CURRENT-013"
    severity: "P1_PRIVACY"
    status: "OPEN"
    title: "Bank raw description/reference are persisted into Expense.notes and transferAccountName"
    evidence:
      - "notes = transaction.description + reference."
      - "transferAccountName falls back to transaction.description."
    impact:
      - "Raw bank descriptions, counterparties, IBAN fragments, references, or PII can be copied into normal expense fields."
      - "Raw storage/privacy policy does not govern this path."
    fix:
      - "Store structured redacted display description separately from raw provider metadata."
      - "Use privacy-safe notes or no notes by default."
      - "Use structured transferAccountName/counterpartyName fields only."
    tests:
      - "bank_import_does_not_persist_raw_reference_in_notes_without_consent"
      - "transfer_account_name_uses_structured_field_not_raw_description"
      - "redacted_bank_import_masks_counterparty_metadata"

  - id: "P10-CURRENT-014"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Bank account model is too coarse: unique bankId only"
    evidence:
      - "BankConnection has unique index on bankId."
      - "No provider item/account entity exists."
    impact:
      - "User cannot link multiple accounts at same bank, personal/business accounts, joint/individual accounts, or same bank through different providers."
    fix:
      - "Split institution connection and account connection."
      - "Unique by providerId+providerItemId and providerId+providerAccountId."
    tests:
      - "same_bank_multiple_accounts_allowed"
      - "same_provider_account_duplicate_rejected"
      - "disconnect_one_account_does_not_disconnect_whole_bank"

  - id: "P10-CURRENT-015"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "No bank autosync worker despite autoSync/syncFrequency fields"
    evidence:
      - "BankConnection has autoSync and syncFrequency."
      - "shouldSync(connection) exists."
      - "No BankSyncWorker/WorkerSpec/WorkerRegistry bank sync entry was observed."
    impact:
      - "Autosync settings are inert."
      - "Connections will not sync in background."
    fix:
      - "Add BankSyncWorker using WorkerExecutionGuard."
      - "Schedule from WorkerRegistry and respect privacy/restore/token/auth state."
    tests:
      - "bank_auto_sync_worker_registered"
      - "worker_syncs_due_active_connections"
      - "worker_skips_manual_or_inactive_connections"

  - id: "P10-CURRENT-016"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Demo sync is random and non-idempotent in debug"
    evidence:
      - "generateMockTransactions() chooses random count, merchants, amounts, references."
      - "transaction.id includes date derived from start/now and loop index."
    impact:
      - "Repeated debug sync can import different fake expenses."
      - "Tests cannot rely on deterministic mock data."
    fix:
      - "Make demo provider deterministic per connection/since/cursor."
      - "Use fixed fixture transactions for tests."
    tests:
      - "demo_sync_same_cursor_returns_same_provider_transaction_ids"
      - "demo_sync_repeated_run_does_not_create_new_fake_expenses"

  - id: "P10-CURRENT-017"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Transaction type inference is fragile and sign-convention dependent"
    evidence:
      - "inferTransactionType() uses description substrings and amount > 0 => DEPOSIT, amount < 0 => PURCHASE."
      - "BankTransaction has no providerTransactionCode/status/direction fields."
    impact:
      - "Providers with debit-positive conventions, pending card authorizations, chargebacks, card fees, and internal transfers can be misclassified."
    fix:
      - "Provider adapters must map native codes to canonical TransactionType."
      - "Add direction, status, provider code, posting/value dates."
    tests:
      - "provider_debit_purchase_maps_PURCHASE_regardless_sign_convention"
      - "provider_refund_maps_refund_policy"
      - "internal_transfer_maps_TRANSFER_with_direction"
      - "atm_fee_not_misclassified_as_purchase_or_deposit"

  - id: "P10-CURRENT-018"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "CancellationException is swallowed by sync"
    evidence:
      - "syncTransactions() has broad catch (e: Exception) around whole sync."
      - "Each transaction import also catches Exception."
    impact:
      - "Coroutine/worker cancellation can be converted into SyncResult errors and processing may continue."
      - "Restore/backup cancellation semantics can be violated once a worker is added."
    fix:
      - "Rethrow CancellationException in all broad catches."
      - "Add static guard for broad catch in bank sync pipeline."
    tests:
      - "bank_sync_cancellation_rethrows_and_does_not_continue_imports"

  - id: "P10-CURRENT-019"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "SyncResult exposes raw transaction IDs and exception messages"
    evidence:
      - "errors.add('Validation failed for transaction ${transaction.id}: ...')."
      - "errors.add('Failed to import transaction ${transaction.id}: ${e.message}')."
    impact:
      - "UI/logs/debug exports can expose provider transaction IDs, references, descriptions, or API messages."
    fix:
      - "Use BankSyncError(code, providerTransactionIdHash, userMessage, debugMessageRedacted)."
      - "Store raw debug only behind debugDataPersistence consent."
    tests:
      - "sync_error_hashes_provider_transaction_id"
      - "sync_error_does_not_include_raw_description_or_reference"

  - id: "P10-CURRENT-020"
    severity: "P1_HIGH"
    status: "PARTIAL"
    title: "Statement import duplicate logic improved but not shared with API sync"
    evidence:
      - "BankStatementLifecycleProcessor checks approved expenses and pending reviews."
      - "Comment says shared BankTransactionDeduper is planned."
      - "API sync still relies on TransactionLifecycleCoordinator STANDARD dedupe only."
    impact:
      - "Statement import and API sync can diverge on duplicate policy."
      - "CSV/import/accounting paths cannot reuse the same bank transaction identity."
    fix:
      - "Create BankTransactionDeduper used by statement, API sync, CSV import, and review approval."
    tests:
      - "statement_import_skips_existing_api_sync_expense"
      - "api_sync_skips_existing_statement_pending_review"
      - "csv_bank_import_uses_same_dedupe_policy"

  - id: "P10-CURRENT-021"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Bank statement PendingReview rows are created with createdAt=0"
    evidence:
      - "BankStatementLifecycleProcessor creates PendingReview without createdAt."
      - "PendingReview.createdAt default is 0L sentinel."
    impact:
      - "Review queue ordering/debugging can be wrong."
      - "Lifecycle timestamp invariant is violated."
    fix:
      - "Set createdAt=timeProvider.now() for every bank statement PendingReview."
      - "Or route through ReviewQueueRepository."
    tests:
      - "bank_statement_pending_review_createdAt_is_now_not_zero"

  - id: "P10-CURRENT-022"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Bank statement PendingReview insert result is ignored"
    evidence:
      - "pendingReviewDao.insert(review) is called."
      - "reviewsCreated++ increments unconditionally."
      - "DAO uses OnConflictStrategy.IGNORE."
    impact:
      - "Ignored/failed inserts can be counted as created."
      - "Import result can lie to user/debugger."
    fix:
      - "Check insertedId > 0 before incrementing."
      - "Record duplicate/failed status when insert is ignored."
    tests:
      - "bank_statement_insert_ignore_not_counted_as_review_created"
      - "bank_statement_review_insert_conflict_records_duplicate_or_error"

  - id: "P10-CURRENT-023"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Bank statement import is not atomic or resumable"
    evidence:
      - "Statement receipt insert, RECEIPT_SAVED event, per-review inserts, status update, PROCESSING_COMPLETE event are separate operations."
      - "Per-transaction exceptions are caught and processing continues."
    impact:
      - "Crash can leave receipt saved with partial reviews and no completion event."
      - "No resumable import state exists."
    fix:
      - "Use bank-statement import run ledger or one transaction with explicit partial semantics."
      - "Persist per-transaction outcomes."
    tests:
      - "bank_statement_crash_mid_import_has_resumable_state"
      - "receipt_review_complete_event_atomic_or_partial_status_explicit"

  - id: "P10-CURRENT-024"
    severity: "P1_PRIVACY"
    status: "OPEN"
    title: "Bank statement stores raw OCR/debug text outside raw-storage policy"
    evidence:
      - "ScannedReceipt(rawOcrText = ocrResult.fullText)."
      - "DebugData(rawText = ocrResult.fullText)."
      - "No PrivacySettingsRepository/RawContentSanitizer in BankStatementLifecycleProcessor."
    impact:
      - "Full bank statement text can be persisted/exposed even when user expects redaction or DO_NOT_STORE."
    fix:
      - "Separate ephemeral OCR text from stored OCR text."
      - "Sanitize stored rawOcrText and debug rawText according to rawOcrStorageMode/debugDataPersistenceEnabled."
    tests:
      - "bank_statement_do_not_store_persists_no_raw_ocr_text"
      - "bank_statement_debug_raw_text_hidden_without_debug_consent"

  - id: "P10-CURRENT-025"
    severity: "P1_PRIVACY"
    status: "OPEN"
    title: "Bank statement AI validation prompt includes raw OCR text"
    evidence:
      - "ValidateBankStatementTransactionsUseCase.buildValidationPrompt() appends rawOcrText up to 4000 chars."
      - "Cloud fallback is gated but relies on downstream SmartReceiptAssist/CloudReceiptAssist redaction behavior."
    impact:
      - "Statement text is highly sensitive; any cloud path must have purpose-specific redaction and audit."
    fix:
      - "Use PreparedCloudPayload with BANK_STATEMENT_VALIDATION purpose."
      - "Audit provider/model/redaction/rawTextIncluded/payloadHash."
    tests:
      - "bank_statement_cloud_payload_uses_bank_statement_redaction_purpose"
      - "bank_statement_cloud_audit_records_redaction_and_payload_hash"

  - id: "P10-CURRENT-026"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Bank token backup/restore policy is undefined"
    evidence:
      - "BankTokenCipher uses Android Keystore."
      - "BankConnection tokens live in Room."
      - "No authStatus/reauthRequired field or restore decryptability check exists."
    impact:
      - "After DB restore to another install/device, encrypted token payloads may be undecryptable while connection still appears connected."
    fix:
      - "On startup/restore, attempt token decryptability check."
      - "Mark authStatus=REAUTH_REQUIRED when decrypt fails."
      - "Redacted backups should remove bank tokens."
    tests:
      - "restored_undecryptable_bank_token_marks_reauth_required"
      - "redacted_backup_excludes_bank_tokens"
      - "bank_sync_blocked_when_auth_status_reauth_required"

  - id: "P10-CURRENT-027"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "BankConnection auth/status model is too thin"
    evidence:
      - "BankConnection has booleans isActive/isConnected and lastSyncStatus."
      - "No CONNECTING, AUTH_PENDING, REAUTH_REQUIRED, DISCONNECTED_BY_USER, TOKEN_INVALID, PROVIDER_ERROR."
    impact:
      - "UI and workers cannot distinguish recoverable auth errors from disconnected accounts."
    fix:
      - "Add authStatus/syncState enums."
      - "Drive UI/actions from these enums."
    tests:
      - "refresh_reauth_required_sets_authStatus_REAUTH_REQUIRED"
      - "disconnect_sets_authStatus_DISCONNECTED_BY_USER"

  - id: "P10-CURRENT-028"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Payment method/account/card semantics are lost"
    evidence:
      - "mapTransactionToExpense() does not set paymentMethod."
      - "BankTransaction has no account/card fields."
      - "Expense default paymentMethod is UNKNOWN."
    impact:
      - "Credit-card benefits, card/account reporting, transfer semantics, and bank reconciliation are weaker."
    fix:
      - "Provider should expose account/card/payment instrument."
      - "Map paymentMethod and link to BankAccountConnection/CardAccount."
    tests:
      - "card_bank_transaction_sets_paymentMethod_CARD"
      - "bank_transfer_sets_paymentMethod_BANK_TRANSFER"
      - "expense_links_to_source_bank_account"

  - id: "P10-CURRENT-029"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Bank statement parser/AI currency fallback can silently use EUR"
    evidence:
      - "BankStatementParser.resolveHomeCurrencySuspend() falls back to EUR on settings failure."
      - "ValidateBankStatementTransactionsUseCase.parseAiResponse() defaults blank currency to EUR."
    impact:
      - "Statement transactions can be created/reviewed with wrong currency if OCR/AI omits currency and settings fail."
    fix:
      - "Track currency assumption in PendingReview metadata."
      - "For unknown currency, require review with warning rather than silent EUR."
    tests:
      - "statement_unknown_currency_marks_review_currency_assumed"
      - "home_currency_settings_failure_surfaces_warning_not_silent_EUR"

  - id: "P10-CURRENT-030"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "No durable bank diagnostics/events"
    evidence:
      - "No BankConnectionEvent/BankSyncEvent table exists."
      - "BankApiIntegration uses Timber and SyncResult only."
      - "Statement import uses ReceiptEvent for statement receipt but not bank transaction import outcomes."
    impact:
      - "Debugging connect/sync/token/statement outcomes requires logs and manual DB inspection."
    fix:
      - "Add BankLifecycleEvent or PipelineDiagnosticEvent events for CONNECT_STARTED, CONNECTED, SYNC_STARTED, PAGE_FETCHED, TX_IMPORTED, TX_REVIEW, TX_DUPLICATE, TOKEN_REFRESHED, REAUTH_REQUIRED, SYNC_FAILED."
    tests:
      - "bank_connect_writes_lifecycle_event"
      - "bank_sync_writes_per_transaction_outcome_event"
      - "token_refresh_failure_writes_reauth_event"

recommended_fix_order:
  - pr: "PR1"
    title: "Make bank feature explicitly unavailable unless real provider exists"
    include:
      - "Move current implementation to DemoBankProvider."
      - "Provider registry and release/demo guard."
      - "Bank UI shows unavailable state in release with no provider."
    closes:
      - "P10-CURRENT-001"
      - "P10-CURRENT-002"

  - pr: "PR2"
    title: "Bank connection lifecycle/repository"
    include:
      - "BankConnectionRepository."
      - "BankConnectionLifecycleCoordinator with DatabaseWriteBarrier."
      - "createdAt/updatedAt, authStatus, events."
      - "Raw DAO mutator allowlist."
    closes:
      - "P10-CURRENT-003"
      - "P10-CURRENT-004"
      - "P10-CURRENT-010"
      - "P10-CURRENT-027"

  - pr: "PR3"
    title: "OAuth/session/token lifecycle"
    include:
      - "BankAuthSession with state/PKCE/expiry/consumedAt."
      - "Provider token exchange/refresh result model."
      - "Persist refreshed encrypted tokens and reauth-required state."
      - "Define backup/restore token decryptability policy."
    closes:
      - "P10-CURRENT-005"
      - "P10-CURRENT-009"
      - "P10-CURRENT-026"

  - pr: "PR4"
    title: "Sync ledger/checkpoint/idempotency"
    include:
      - "BankSyncRun and BankTransactionImport."
      - "Provider cursor/page checkpoint."
      - "STRICT_EXTERNAL_ID for provider transaction IDs."
      - "Connection finalization status/error counters."
      - "Cancellation safety."
    closes:
      - "P10-CURRENT-006"
      - "P10-CURRENT-007"
      - "P10-CURRENT-008"
      - "P10-CURRENT-018"

  - pr: "PR5"
    title: "Review routing and shared dedupe"
    include:
      - "BankTransactionClassifier."
      - "Low-confidence API rows to PendingReview."
      - "Shared BankTransactionDeduper for API sync, statement import, CSV import, review approval."
      - "Durable bank diagnostics/events."
    closes:
      - "P10-CURRENT-011"
      - "P10-CURRENT-020"
      - "P10-CURRENT-030"

  - pr: "PR6"
    title: "Source/account metadata model"
    include:
      - "Institution/item/account split."
      - "Expense source links or import rows with connectionId/accountId/providerTransactionId/syncRunId."
      - "Payment method/card/account mapping."
    closes:
      - "P10-CURRENT-012"
      - "P10-CURRENT-014"
      - "P10-CURRENT-028"

  - pr: "PR7"
    title: "Privacy-safe bank payloads"
    include:
      - "Do not store raw bank description/reference in notes/account fields by default."
      - "PreparedCloudPayload for bank statement AI."
      - "Raw OCR/debug policy for bank statements."
      - "Sanitized sync errors."
    closes:
      - "P10-CURRENT-013"
      - "P10-CURRENT-019"
      - "P10-CURRENT-024"
      - "P10-CURRENT-025"

  - pr: "PR8"
    title: "Bank statement import correctness"
    include:
      - "Set PendingReview.createdAt."
      - "Check PendingReview insert result."
      - "Atomic/resumable statement import state."
      - "Currency-assumption warnings."
    closes:
      - "P10-CURRENT-021"
      - "P10-CURRENT-022"
      - "P10-CURRENT-023"
      - "P10-CURRENT-029"

  - pr: "PR9"
    title: "Provider semantics and autosync"
    include:
      - "Provider-specific transaction type mapper."
      - "Explicit sign convention and posting status."
      - "BankSyncWorker in WorkerRegistry."
      - "Deterministic demo fixtures."
    closes:
      - "P10-CURRENT-015"
      - "P10-CURRENT-016"
      - "P10-CURRENT-017"

definition_of_done:
  - "Demo/mock bank provider cannot run in release and is not shown as real banking."
  - "Bank screen loads real DB-backed connections/accounts and sync/disconnect methods are functional."
  - "Connection completion is durable, restore-guarded, evented, timestamped, and idempotent."
  - "OAuth callback validates state, PKCE, expiry, bank/provider identity, and replay."
  - "Every sync has a BankSyncRun and every provider transaction has a BankTransactionImport outcome."
  - "Provider transaction IDs use STRICT_EXTERNAL_ID or equivalent unique import identity."
  - "Sync crash/retry resumes from cursor/checkpoint and does not reprocess completed rows."
  - "Token refresh persists encrypted new tokens or marks REAUTH_REQUIRED."
  - "Bank connection status distinguishes connected, disconnected, auth pending, reauth required, provider error."
  - "Low-confidence/ambiguous bank API transactions become PendingReview, not approved expenses."
  - "Bank API sync, statement import, CSV import, and review approval share one dedupe service."
  - "Imported expenses preserve bank connection/account/provider/sync-run/source metadata."
  - "Multiple accounts per bank/provider are supported."
  - "Bank raw descriptions/references are redacted or stored only under explicit debug/raw policy."
  - "Bank statement OCR/debug text respects rawOcrStorageMode and debugDataPersistenceEnabled."
  - "Bank statement PendingReview rows have nonzero createdAt and checked insert results."
  - "Statement import is atomic or explicitly resumable with partial state."
  - "Bank autosync worker exists, is guarded, and respects auth/restore/privacy state."
  - "Provider transaction type mapping uses structured provider fields, not only text/sign heuristics."
  - "Bank token backup/restore policy marks undecryptable restored tokens as REAUTH_REQUIRED."

