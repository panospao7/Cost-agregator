meta:
  repo: "panospao7/Cost-agregator"
  commit: "4113e38f0d838a29d2d13d82a483ba573280721c"
  engine_group: "#5 - Money / Time Primitives"
  review_mode: "static GitHub source/debugging session; no local Gradle execution"
  verdict: "IMPROVED_BUT_NOT_CLEAN"
  summary: >
    Money/time primitives are improved, especially ConvertedMoney identity/failure
    semantics, CurrencyCode digit rejection, finite MoneyAmount validation, and
    MoneyAggregate failed-transaction counting. But this layer is still transitional,
    not clean. The approved MoneyAmount still stores Double, BigDecimal is converted
    back to Double, formatting remains underspecified, raw Double public models
    dominate, two PeriodRange types still coexist, BudgetCalculator still uses the
    old range type, TimePeriodUtils still uses system-zone Calendar helpers, week
    keys are inconsistent, direct wall-clock calls remain, and PeriodKind has serious
    regressions around CUSTOM and LAST_7_DAYS.

tracker_reconciliation:
  M01_convertedMoney_identity_failed:
    tracker_status: "FIXED"
    actual_status: "FIXED"
    notes:
      - "ConvertedMoney.identity() is now success/isExactIdentity=true."
      - "ConvertedMoney.failed() preserves FailureReason and failureMessage."
      - "ConversionStatus.SAME_CURRENCY isSuccess=true."

  M02_moneyAmount_raw_double:
    tracker_status: "DEFERRED"
    actual_status: "PARTIAL"
    notes:
      - "MoneyAmount now rejects NaN/Infinity."
      - "It still stores Double and does not enforce currency minor units, scale, or precision."
      - "fromBigDecimal() converts to Double, losing precision."

  M03_currencyCode_validation:
    tracker_status: "FIXED"
    actual_status: "PARTIAL"
    notes:
      - "Digits are rejected."
      - "Lowercase parses by uppercasing."
      - "But any 3 uppercase non-digit chars can pass; unsupported/fake ISO-like codes such as ZZZ still parse."
      - "Unicode uppercase letters may pass because validation uses Char.isUpperCase(), not ASCII A-Z."
      - "Active/inactive supported-currency policy is not enforced."

  M04_periodKind_timezone_math:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL_BUGGY"
    notes:
      - "PeriodKind.toPeriodRangeZoned() now uses java.time and the supplied zoneId."
      - "But TimePeriodUtils still uses system-default Calendar helpers."
      - "PeriodKind.toPeriodRange() ignores customStart/customEnd."
      - "CUSTOM returns a default last-30-days range instead of throwing or using explicit bounds."

  M05_two_PeriodRange_types:
    tracker_status: "DEFERRED"
    actual_status: "OPEN"
    notes:
      - "domain.model.PeriodRange is deprecated but still present."
      - "BudgetCalculator still imports domain.model.PeriodRange."
      - "Deprecation is WARNING, not ERROR."

  M06_money_vs_moneyAmount_split:
    tracker_status: "DEFERRED"
    actual_status: "OPEN_PARTIAL_BRIDGE"
    notes:
      - "domain.util.Money still uses BigDecimal."
      - "domain.core.money.MoneyAmount still uses Double."
      - "MoneyAmount.fromBigDecimal() is only a lossy bridge."

  M07_failedTransactionCount:
    tracker_status: "FIXED"
    actual_status: "MOSTLY_FIXED_WITH_MAPPER_GAP"
    notes:
      - "ConversionFailure has transactionCount."
      - "MoneyAggregate.failedTransactionCount sums failure.transactionCount."
      - "MoneyAggregateBuilder maps aggregate bucket counts correctly when callers pass transactionCounts."
      - "MoneyMappers.toMoneyAggregate() still creates failures without transactionCount and warning uses failures.size."

  M08_failed_reason_ignored:
    tracker_status: "FIXED"
    actual_status: "FIXED"
    notes:
      - "ConvertedMoney.failed(reason,message) now stores reason/message."

  M09_formatting_underspecified:
    tracker_status: "DEFERRED"
    actual_status: "OPEN"
    notes:
      - "MoneyAmount.formatDisplay() still uses default-locale String.format and always 2 decimals."
      - "CurrencyFormatter has explicit-currency replacements but still has deprecated default-EUR APIs."
      - "formatForExport() silently converts non-finite amounts to 0.00."

  M10_direct_wall_clock_calls:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "TimeProvider exists and many paths use it."
      - "Direct System.currentTimeMillis() remains in RestoreJournal and GroupTransactionCoordinator hard-delete audit."
      - "No CI guard was verified."

  M11_week_helpers_inconsistent:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN"
    notes:
      - "TimePeriodUtils.getWeekOfYear() uses Monday + minimalDaysInFirstWeek=1."
      - "getWeekBasedYear() uses ISO WeekFields(MONDAY,4)."
      - "Docs still say to use them together, which is wrong around year boundaries."

  M12_last_7_days_semantics:
    tracker_status: "TODO_ONLY"
    actual_status: "OPEN_BUG"
    notes:
      - "TimePeriodUtils.getLastNCalendarDaysRange(now,7) correctly starts today.minusDays(6)."
      - "PeriodKind.LAST_7_DAYS starts today.minusDays(7) and ends tomorrow, covering 8 calendar days."
      - "It also includes future remainder of today by design."

  M13_entity_time_sentinel_types:
    tracker_status: "DEFERRED"
    actual_status: "OPEN"
    notes:
      - "Expense.createdAt and Budget.createdAt remain Long with 0 sentinel."
      - "No CreatedAt/UpdatedAt value types or factories are enforced globally."

  M14_raw_double_public_money_models:
    tracker_status: "DEFERRED"
    actual_status: "OPEN"
    notes:
      - "Expense.amount, Budget.amount, ForecastInput values, TaxEstimate fields, PeriodTotal, dashboard models, and many UI DTOs still expose bare Double money."
      - "No 'no new bare Double money' guard was verified."

positive_findings:
  - "ConvertedMoney identity/failure semantics are now much safer."
  - "CurrencyCode rejects digits and has SupportedCurrency.ALL_SUPPORTED available."
  - "MoneyAmount rejects NaN and Infinity."
  - "MoneyAggregate has failedTransactionCount and failedBucketCount separation."
  - "MoneyAggregateBuilder can preserve transaction counts when callers pass them."
  - "PeriodKind.toPeriodRangeZoned() uses java.time and explicit ZoneId for many standard periods."
  - "core.time.PeriodRange documents half-open boundaries."
  - "TimeProvider is bound through Hilt."
  - "TimePeriodUtils documents half-open intervals and avoids fetching now internally."
  - "There is at least one direct core/time PeriodRange test file."

issues:
  - id: "E5-CURRENT-001"
    severity: "P0_FINANCIAL_CORRECTNESS"
    status: "OPEN"
    title: "Approved MoneyAmount still uses Double"
    evidence:
      - "MoneyAmount is documented as the single approved money type."
      - "It stores amount: Double."
      - "Only NaN/Infinity are rejected."
    impact:
      - "0.1 + 0.2 precision drift remains possible."
      - "Currency-specific scale/minor-unit rules are not enforced."
      - "Financial primitives remain weaker than the older BigDecimal Money type."
    fix:
      - "Redesign MoneyAmount around minorUnits: Long plus CurrencyCode, or BigDecimal plus explicit scale."
      - "Add currency minor-unit metadata."
    tests:
      - "moneyAmount_0_1_plus_0_2_equals_0_30"
      - "moneyAmount_jpy_rejects_fractional_minor_units"
      - "moneyAmount_split_policy_handles_remainders"

  - id: "E5-CURRENT-002"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "MoneyAmount.fromBigDecimal() is a lossy bridge"
    evidence:
      - "MoneyAmount.fromBigDecimal(value,currency) returns MoneyAmount(value.toDouble(), currency)."
      - "domain.util.Money still preserves BigDecimal."
    impact:
      - "Migrating from precise Money to MoneyAmount can lose precision."
      - "Large or high-precision values can be rounded before domain logic sees them."
    fix:
      - "Do not convert BigDecimal to Double in the approved type."
      - "Keep BigDecimal/minorUnits all the way through."
    tests:
      - "fromBigDecimal_preserves_exact_cents"
      - "fromBigDecimal_large_value_does_not_round"

  - id: "E5-CURRENT-003"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "CurrencyCode still accepts unsupported/fake codes"
    evidence:
      - "CurrencyCode.parse uppercases and accepts any valid 3 uppercase non-digit code."
      - "ALL_SUPPORTED exists but parse() does not use it."
      - "symbolFor() returns raw code when unsupported."
    impact:
      - "ZZZ/ABC can enter MoneyAmount and aggregates as if valid."
      - "Unsupported currency is not represented as a typed failure."
    fix:
      - "Choose explicit policy: strict supported currencies, ISO-like plus isSupported flag, or commodity support."
      - "For app money, reject unsupported/inactive currencies unless feature explicitly allows them."
    tests:
      - "currencyCode_rejects_ZZZ_when_supported_policy_strict"
      - "currencyCode_marks_HRK_inactive_for_new_transactions"
      - "unsupported_currency_creates_conversion_failure_not_crash"

  - id: "E5-CURRENT-004"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "CurrencyCode validation is Unicode-uppercase based, not ISO A-Z"
    evidence:
      - "Validation uses code.all { it.isUpperCase() } and none { it.isDigit() }."
    impact:
      - "Non-ASCII uppercase letters can satisfy validation even though ISO 4217 codes are ASCII letters."
    fix:
      - "Require code.all { it in 'A'..'Z' }."
    tests:
      - "currencyCode_rejects_non_ascii_uppercase_letters"

  - id: "E5-CURRENT-005"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "MoneyAggregate and MoneyBucket constructors do not validate finite amounts"
    evidence:
      - "MoneyAmount validates finite amount."
      - "MoneyBucket.amount and MoneyAggregate.displayAmount are raw Double without init validation."
    impact:
      - "NaN/Infinity can enter aggregate models directly."
      - "formatDisplay() may later throw when wrapping displayAmount in MoneyAmount."
    fix:
      - "Add init validation to MoneyBucket and MoneyAggregate."
      - "Reject or explicitly mark invalid-source money failures."
    tests:
      - "moneyAggregate_rejects_nan_displayAmount"
      - "moneyBucket_rejects_infinite_amount"

  - id: "E5-CURRENT-006"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "MoneyMappers.toMoneyAggregate() regresses failed transaction counts"
    evidence:
      - "MoneyMappers.toMoneyAggregate() maps old FailedConversion to ConversionFailure without transactionCount."
      - "Its warning says failures.size transaction(s)."
    impact:
      - "Any caller using the bridge can undercount failed transactions."
      - "M07 is not globally fixed."
    fix:
      - "Require source bucket counts when mapping MultiConversionAggregate."
      - "Or mark count unknown separately instead of zero/size."
    tests:
      - "moneyMappers_preserve_failed_transaction_count"
      - "moneyMappers_warning_distinguishes_bucket_count_from_transaction_count"

  - id: "E5-CURRENT-007"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "MoneyAggregateBuilder crashes on invalid currency instead of returning partial invalid-currency failure"
    evidence:
      - "Builder constructs CurrencyCode(ccy) for grouped DB currency strings."
      - "CurrencyCode constructor throws for invalid strings."
    impact:
      - "One invalid legacy DB currency can fail the whole aggregate."
      - "Data quality cannot show '1 invalid currency excluded'."
    fix:
      - "Use CurrencyCode.parse() and produce ConversionFailure(reason=INVALID_AMOUNT or INVALID_CURRENCY-style reason)."
      - "Add FailureReason.INVALID_CURRENCY."
    tests:
      - "aggregate_builder_invalid_currency_returns_partial_failure_not_throw"

  - id: "E5-CURRENT-008"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "MoneyAmount.formatDisplay() is not currency/minor-unit aware"
    evidence:
      - "formatDisplay() always uses String.format('%.2f')."
      - "CurrencyFormatter has java.util.Currency fraction-digit logic, but MoneyAmount does not use it."
    impact:
      - "JPY displays with two decimals."
      - "BHD/KWD-style 3-decimal currencies cannot be represented correctly if added later."
    fix:
      - "Route display formatting through CurrencyFormatter/NumberFormat."
      - "Split display/export/accounting formatters."
    tests:
      - "moneyAmount_jpy_displays_zero_decimals"
      - "moneyAmount_exportStable_uses_locale_US"

  - id: "E5-CURRENT-009"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "CurrencyFormatter.formatForExport silently coerces non-finite money to zero"
    evidence:
      - "formatForExport(amount) uses safeAmount = if (amount.isFinite()) amount else 0.0."
    impact:
      - "Corrupt NaN/Infinity financial values can become plausible 0.00 in CSV/accounting exports."
    fix:
      - "Return validation error or explicit invalid marker; never silently coerce financial corruption."
    tests:
      - "formatForExport_nan_returns_error_not_zero"
      - "export_rejects_infinite_money"

  - id: "E5-CURRENT-010"
    severity: "P1_TIME_CORRECTNESS"
    status: "OPEN"
    title: "PeriodKind.CUSTOM ignores explicit customStart/customEnd"
    evidence:
      - "toPeriodRange(now, zoneId, customStart, customEnd) calls toPeriodRangeZoned(now, zoneId) and discards customStart/customEnd."
      - "toPeriodRangeZoned(CUSTOM) returns default last-30-days."
      - "KDoc says CUSTOM requires explicit bounds and throws if missing."
    impact:
      - "Custom analytics/export/budget periods can silently become last-30-days."
      - "Tests may pass standard periods but miss custom period behavior."
    fix:
      - "Handle CUSTOM in toPeriodRange(): require customStart/customEnd and return those exact bounds."
      - "Remove fallback default."
    tests:
      - "custom_period_uses_explicit_start_end"
      - "custom_period_without_bounds_throws"

  - id: "E5-CURRENT-011"
    severity: "P1_TIME_CORRECTNESS"
    status: "OPEN"
    title: "PeriodKind.LAST_7_DAYS covers 8 calendar days"
    evidence:
      - "PeriodKind.LAST_7_DAYS sets end=today.plusDays(1).startOfDay."
      - "It sets start=today.minusDays(7).startOfDay."
      - "TimePeriodUtils.getLastNCalendarDaysRange(now,7) starts at today minus 6 days."
    impact:
      - "Last-7-days widgets can overcount by one full day."
      - "PeriodKind and TimePeriodUtils disagree."
    fix:
      - "Use today.minusDays(6) for seven calendar days including today, or rename to previous-7-plus-today."
    tests:
      - "last_7_days_contains_exactly_7_local_dates"
      - "periodKind_last7_matches_TimePeriodUtils_getLastNCalendarDaysRange"

  - id: "E5-CURRENT-012"
    severity: "P1_TIME_CORRECTNESS"
    status: "OPEN"
    title: "TimePeriodUtils and PeriodKind now have competing time-boundary engines"
    evidence:
      - "PeriodKind.toPeriodRangeZoned uses java.time with explicit ZoneId."
      - "TimePeriodUtils still uses Calendar.getInstance() and system default timezone."
      - "TimePeriodUtils.toPeriodRange(pair,kind,label) constructs PeriodRange with default system zone."
    impact:
      - "Different callers can compute different ranges for the same semantic period."
      - "Export/analytics/budget may disagree under non-system timezone requirements."
    fix:
      - "Make TimePeriodUtils zone-aware or deprecate range helpers in favor of PeriodKind/PeriodRangeCalculator."
      - "All typed range creation should carry explicit ZoneId."
    tests:
      - "timePeriodUtils_and_periodKind_same_zone_same_boundaries"
      - "toPeriodRange_pair_requires_explicit_zone"

  - id: "E5-CURRENT-013"
    severity: "P1_TIME_CORRECTNESS"
    status: "OPEN"
    title: "Week number helpers remain inconsistent"
    evidence:
      - "getWeekOfYear() uses Monday first day and minimalDaysInFirstWeek=1."
      - "getWeekBasedYear() uses WeekFields.of(MONDAY,4)."
      - "Docs say to use them together."
    impact:
      - "Week keys around New Year can pair an ISO week-based year with a non-ISO week number."
    fix:
      - "Add explicit getIsoWeekNumber/getIsoWeekBasedYear/getIsoWeekKey."
      - "Add app-calendar week helpers separately."
      - "Deprecate ambiguous getWeekOfYear/getWeekBasedYear pairing."
    tests:
      - "iso_week_key_2021_01_01_is_2020_W53"
      - "app_calendar_week_key_uses_consistent_year_and_week_rules"

  - id: "E5-CURRENT-014"
    severity: "P1_ARCHITECTURE"
    status: "OPEN"
    title: "Old domain.model.PeriodRange is still used in BudgetCalculator"
    evidence:
      - "domain.model.PeriodRange remains as deprecated type."
      - "BudgetCalculator imports com.yourname.expensetracker.domain.model.PeriodRange."
    impact:
      - "Budget periods lose kind, zoneId, and label metadata."
      - "Two period semantics remain live."
    fix:
      - "Migrate BudgetCalculator to core.time.PeriodRange."
      - "Make old PeriodRange DeprecationLevel.ERROR after migration."
    tests:
      - "budgetCalculator_returns_core_time_PeriodRange"
      - "no_production_import_domain_model_PeriodRange"

  - id: "E5-CURRENT-015"
    severity: "P1_TESTABILITY"
    status: "OPEN"
    title: "Direct wall-clock calls remain outside SystemTimeProvider"
    evidence:
      - "RestoreJournal.JournalEntry default startedAt uses System.currentTimeMillis()."
      - "RestoreJournal.fromJson fallback uses System.currentTimeMillis()."
      - "GroupTransactionCoordinator.deleteGroupAtomic() uses System.currentTimeMillis() for TransactionEvent."
    impact:
      - "Restore/group audit behavior is harder to test and replay."
      - "M10 is not enforced."
    fix:
      - "Inject TimeProvider into RestoreJournal and data GroupTransactionCoordinator."
      - "Add static CI guard allowlisting only SystemTimeProvider and tests."
    tests:
      - "restoreJournal_uses_TimeProvider"
      - "group_hard_delete_event_uses_TimeProvider"
      - "no_direct_wall_clock_guard"

  - id: "E5-CURRENT-016"
    severity: "P1_ARCHITECTURE"
    status: "OPEN"
    title: "Entity timestamp sentinel contracts remain plain Long"
    evidence:
      - "Expense.createdAt default is 0L with KDoc sentinel."
      - "Budget.createdAt default is 0L with KDoc sentinel."
      - "Many entities follow the same convention across prior pipeline reports."
    impact:
      - "Callers can still forget timestamps."
      - "Invariants depend on repository discipline, not types."
    fix:
      - "Introduce CreatedAt/UpdatedAt value types or entity factories."
      - "Block direct production entity construction for write paths where feasible."
    tests:
      - "expense_factory_rejects_createdAt_zero"
      - "budget_factory_rejects_createdAt_zero"

  - id: "E5-CURRENT-017"
    severity: "P1_ARCHITECTURE"
    status: "OPEN"
    title: "Bare Double money still dominates public models"
    evidence:
      - "Expense.amount, Budget.amount, TaxEstimate totals, ForecastInput values, PeriodTotal, dashboard widgets, and many DTOs expose Double money."
      - "MoneyAmount KDoc says no new bare Double monetary fields, but no guard was verified."
    impact:
      - "Money primitives cannot fully protect the app because most APIs bypass them."
    fix:
      - "Add no-new-bare-money-Doubles static guard."
      - "Permit Double only in Room entities/legacy DTOs with explicit allowlist."
      - "Public domain/UI state should use MoneyAmount/MoneyAggregate."
    tests:
      - "static_guard_blocks_new_public_Double_money_field"
      - "dashboard_public_money_fields_use_MoneyAmount_or_MoneyAggregate"

  - id: "E5-CURRENT-018"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Core money primitive tests are missing or not in the expected package"
    evidence:
      - "app/src/test/.../domain/core contains only time directory in reviewed GitHub listing."
      - "MoneyAmountTest/CurrencyCodeTest direct paths returned 404."
      - "Only PeriodRangeTest was found under domain/core/time."
    impact:
      - "Critical money contracts are not locked down."
      - "Future refactors can regress precision, currency validation, and aggregate failure counts."
    fix:
      - "Add direct tests for MoneyAmount, CurrencyCode, ConvertedMoney, MoneyAggregateBuilder, MoneyMappers."
    tests:
      - "MoneyAmountPrecisionContractTest"
      - "CurrencyCodeContractTest"
      - "ConvertedMoneyStatusTest"
      - "MoneyAggregatePartialContractTest"

  - id: "E5-CURRENT-019"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Time tests do not cover the current highest-risk PeriodKind cases"
    evidence:
      - "PeriodRangeTest covers month, week, DST day, leap February."
      - "No visible tests for CUSTOM, LAST_7_DAYS exact date count, week-key year boundary, or non-system zone mismatch."
    impact:
      - "The current CUSTOM and LAST_7_DAYS bugs are untested."
    fix:
      - "Add targeted PeriodKind contract tests."
    tests:
      - "custom_period_uses_custom_bounds"
      - "last_7_days_exactly_7_dates"
      - "week_key_new_year_consistency"
      - "utc_vs_athens_boundary_difference"

  - id: "E5-CURRENT-020"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Deprecated unsafe formatter APIs still exist with default EUR fallback"
    evidence:
      - "CurrencyFormatter.format/formatCompact/formatWithSign/getCurrencySymbol still default to EUR."
      - "They are deprecated with WARNING only."
    impact:
      - "New callers can still silently label values as EUR."
    fix:
      - "Upgrade to DeprecationLevel.ERROR after replacing callers."
      - "Use explicit HomeCurrencyResolution and explicit currency everywhere."
    tests:
      - "no_production_call_to_CurrencyFormatter_default_EUR_overloads"

recommended_fix_order:
  - pr: "PR1"
    title: "Fix PeriodKind correctness regressions"
    include:
      - "CUSTOM uses explicit customStart/customEnd or throws."
      - "LAST_7_DAYS covers exactly seven local dates or is renamed."
      - "Add tests for custom/last7/week-boundary/zone."
    closes:
      - "E5-CURRENT-010"
      - "E5-CURRENT-011"
      - "E5-CURRENT-019"

  - pr: "PR2"
    title: "Finish time primitive consolidation"
    include:
      - "Migrate BudgetCalculator to core.time.PeriodRange."
      - "DeprecationLevel.ERROR for domain.model.PeriodRange."
      - "Unify TimePeriodUtils and PeriodKind around one zone-aware calculator."
      - "Explicit ISO/app week helper split."
    closes:
      - "E5-CURRENT-012"
      - "E5-CURRENT-013"
      - "E5-CURRENT-014"

  - pr: "PR3"
    title: "Wall-clock guard"
    include:
      - "Inject TimeProvider into RestoreJournal and data GroupTransactionCoordinator."
      - "Add CI static guard for System.currentTimeMillis/Instant.now/LocalDate.now/Date/Calendar-now."
    closes:
      - "E5-CURRENT-015"

  - pr: "PR4"
    title: "MoneyAmount v2 precision"
    include:
      - "Replace Double with minorUnits or BigDecimal."
      - "Remove lossy fromBigDecimal."
      - "Add currency minor-unit policy."
    closes:
      - "E5-CURRENT-001"
      - "E5-CURRENT-002"
      - "E5-CURRENT-008"

  - pr: "PR5"
    title: "Currency and aggregate hardening"
    include:
      - "Strict ASCII currency validation."
      - "Supported/inactive currency policy."
      - "Aggregate constructors validate finite amounts."
      - "Invalid DB currency becomes partial failure, not crash."
      - "Fix MoneyMappers transaction counts."
    closes:
      - "E5-CURRENT-003"
      - "E5-CURRENT-004"
      - "E5-CURRENT-005"
      - "E5-CURRENT-006"
      - "E5-CURRENT-007"

  - pr: "PR6"
    title: "Formatting and export safety"
    include:
      - "Display/export/accounting formatter split."
      - "No non-finite-to-zero coercion."
      - "ERROR-deprecate default-EUR formatter overloads."
    closes:
      - "E5-CURRENT-009"
      - "E5-CURRENT-020"

  - pr: "PR7"
    title: "Primitive adoption guardrails"
    include:
      - "CreatedAt/UpdatedAt value types or factories."
      - "No-new-bare-money-Double guard for public domain/UI models."
      - "Add direct core money tests."
    closes:
      - "E5-CURRENT-016"
      - "E5-CURRENT-017"
      - "E5-CURRENT-018"

definition_of_done:
  - "MoneyAmount cannot represent NaN, Infinity, precision drift, invalid scale, or unsupported currency."
  - "BigDecimal/minor-unit precision is preserved end-to-end."
  - "CurrencyCode validation is explicit: supported app currency vs ISO-like vs unsupported."
  - "MoneyAggregate/MoneyBucket cannot contain non-finite amounts."
  - "Aggregate failures preserve failed transaction counts across all bridge paths."
  - "No formatter silently coerces corrupt money to 0.00."
  - "Display, export-stable, and accounting formatting are separate APIs."
  - "Only one production PeriodRange type exists."
  - "CUSTOM ranges always use explicit caller bounds."
  - "LAST_7_DAYS semantics are exact and tested."
  - "All time-boundary APIs are zone-aware or explicitly system-zone-only."
  - "ISO week and app-calendar week helpers are separate and internally consistent."
  - "No production code calls wall-clock APIs outside SystemTimeProvider/test allowlist."
  - "CreatedAt/UpdatedAt sentinel 0L is impossible through production factories/coordinators."
  - "No new public domain/UI money fields are bare Double."
  - "Core money/time primitive tests lock down precision, validation, periods, DST, and week keys."

sources:
  engine_tracker:
    url: "https://raw.githubusercontent.com/panospao7/Cost-agregator/4113e38f0d838a29d2d13d82a483ba573280721c/docs/analyses%20and%20debug%20master/ENGINE_ISSUES_MASTER_TRACKER.md"
  prior_money_time_report:
    url: "https://raw.githubusercontent.com/panospao7/Cost-agregator/4113e38f0d838a29d2d13d82a483ba573280721c/docs/analyses%20and%20debug%20master/debugging/money-time-primitives-debug-report.md"
  money_amount:
