# DB Ownership Policy — canonical legal writers
# 
# This file defines the EXACT set of classes, DAOs, and operations that
# are allowed to perform database writes. Every direct DAO mutation call
# in the codebase MUST match an entry here, a structural exception, or
# be recorded as unresolved debt in the ratchet baseline.
#
# Each entry requires: path, class, method, daos, operation, 
# barrier_required, reason, owner, linked_issue.
#
# - method: "*" means the class owns all write methods for the listed DAOs.
# - operation: "write" means all mutation operations (insert, update, delete, etc.).
# - barrier_required: true means the method must call writeBarrier.checkWritesAllowed()
#   before the DAO mutation. Set false for lifecycle coordinators that handle
#   their own guarding (e.g., withTransaction).

entries:

  # ── Expenses / Transaction events ──────────────────────────────
  - path: TransactionLifecycleCoordinator.kt
    class: TransactionLifecycleCoordinator
    method: "*"
    daos: [expenseDao, transactionEventDao]
    operation: write
    barrier_required: false
    reason: "Canonical transaction lifecycle writer — guards at entry via withTransaction"
    owner: "@panospao7"
    linked_issue: "MIT-003"

  # ── Notifications ───────────────────────────────────────────────
  - path: NotificationRepository.kt
    class: NotificationRepository
    method: "*"
    daos: [rawNotificationDao, pendingReviewDao, pipelineDiagnosticEventDao, blockedPackageDao, expenseDao, userCorrectionDao, sourceStatsDao]
    operation: write
    barrier_required: true
    reason: "Canonical notification writer — includes purge/restore DAOs needed for maintenance"
    owner: "@panospao7"
    linked_issue: "MIT-003"

  # ── Receipts / OCR / Email ──────────────────────────────────────
