# DB Ownership Policy — canonical legal writers (H2 exact contract)
#
# This file defines the EXACT set of classes, methods, DAOs, and operations
# that are allowed to perform database writes. Every direct DAO mutation call
# in app/src/main/java MUST match an entry here, a structural exception, or
# be recorded as unresolved debt in the ratchet baseline.
#
# Hardened (H2) contract — every entry requires:
#   - path:           canonical repository-relative POSIX path under
#                     app/src/main/java with '/' separators (bare basenames,
#                     backslashes, and non-.kt paths are rejected by the loader);
#   - class:          exact Kotlin class/object name as declared in the file;
#   - method:         EXACT method name (no wildcard "*" — every writer method
#                     is individually enumerated);
#   - daos:           non-empty list of EXACT Room accessor names (the DAO
#                     interface simple name with its first character lowercased,
#                     e.g. ExpenseGroupDao -> expenseGroupDao) that this method
#                     writes to for the listed operation;
#   - operation:      the EXACT DAO method name the method body invokes
#                     (e.g. "insert", "insertAtomic", "archiveGroup",
#                     "staleAbortIfStillRunning", "deleteAllForGroup").
#                     The universal value "write" is invalid policy metadata
#                     and is rejected by the loader (verify_db_access_boundaries.py);
#   - barrier_required: real boolean. true only when the method body contains a
#                     direct writeBarrier.checkWritesAllowed(...) /
#                     writeBarrier.runWrite(...) call BEFORE the DAO mutation.
#                     Lifecycle coordinators that guard via a private helper
#                     (TransactionLifecycleCoordinator.checkWritesAllowed) or
#                     workers whose write protection is mediated by
#                     WorkerExecutionGuard set false;
#   - barrier_via:    ONLY for mediated WorkerExecutionGuard entries — documents
#                     that write protection is provided by the guard, not by a
#                     direct barrier call in the method;
#   - reason, owner, linked_issue: controlled documentation fields.
#
# No wildcard methods, no "operation: write", no permanent expiry/allowed_until
# fields. Structural exceptions live in db_structural_exceptions.yml (untouched).

entries:

