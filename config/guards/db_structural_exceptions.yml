# DB Structural Exceptions — exact operation tuples only
#
# These are NOT architectural debt — they are proven structural necessities
# that cannot be routed through the ownership policy because they operate
# at the database infrastructure level (migrations, rescue, maintenance,
# backup/restore, diagnostics, privacy export).
#
# Each entry requires: path, class, method_pattern, operation, reason, owner,
# linked_issue.
# - method_pattern: EXACT method/object name (e.g., "verify", "onCreate",
#   "FRESH_INSTALL_CALLBACK") or the single bounded migration form
#   "MIGRATION_\\d+_\\d+" (fullmatch only).  Alternation and broad regex
#   constructs are rejected by the loader (verify_db_access_boundaries.py).
# - operation: the EXACT file/SQL operation that must appear in the exact
#   method body.  Supported operation names are the exact call/token forms
#   only: execSQL, openDatabase, getDatabasePath, deleteRecursively,
#   writableDatabase.
#
# This file contains EXACT operation tuples only — there is NO generic
# authorization: no "raw_" wildcard categories (raw_sqlite / raw_db_file),
# no class-level or method-level catch-all, and no basename or permanent
# expiry.  Every entry authorizes one concrete (path, class, method_pattern,
# operation) tuple backed by exact source evidence in the method body.
#
# No ".*" wildcard patterns are allowed — every entry must use an exact
# method name or the bounded migration form (no alternation).

entries:

  # ── Room migrations (DatabaseMigrations.kt — post-v145) ─────────
  - path: app/src/main/java/com/yourname/expensetracker/data/database/DatabaseMigrations.kt
    class: DatabaseMigrations
    method_pattern: "MIGRATION_\\d+_\\d+"
    operation: execSQL
    reason: "Room migration SQL — canonical migration file (v145+ baseline)"
    owner: "@panospao7"
    linked_issue: "MIT-003"

  # ── Room migrations (AppDatabase.kt companion object — pre-v145) ─
  - path: app/src/main/java/com/yourname/expensetracker/data/database/AppDatabase.kt
    class: AppDatabase
    method_pattern: "MIGRATION_\\d+_\\d+"
