# DB Structural Exceptions — Expected Method Manifest
#
# Purpose
# -------
# Semantic-equivalence contract for the exact-operation split of
# `config/guards/db_structural_exceptions.yml`.
#
# The pre-split (approved) method set used class-level `.*` patterns for the
# structural classes.  This manifest records, per structural class, the EXACT
# approved method(s) and operation category that were covered by the approved
# prior coverage — nothing more, nothing less.
#
# This file now contains EXACT OPERATION TUPLES ONLY — no generic
# authorization.  Every entry is a concrete (path, class, method_pattern,
# operation) tuple where:
#   - method_pattern is an exact Kotlin identifier or the single bounded
#     migration form `MIGRATION_\d+_\d+`;
#   - operation is one of the supported exact operation names:
#     `execSQL`, `openDatabase`, `getDatabasePath`, `deleteRecursively`,
#     `writableDatabase`.
# No raw_ values (raw_sqlite / raw_db_file), no wildcard method patterns, no
# generic operation categories, no basenames, and no permanent expiry are
# present in this file or in the structural exceptions YAML it contracts.
#
# Sections
# --------
#   expected:  the pre-split approved method set expressed as exact
#              method_pattern values (or the single bounded migration form
#              `MIGRATION_\d+_\d+`) with their exact operation tuples.  Every
#              entry here MUST be present in the current structural
#              exceptions YAML.
#   fixtures:  explicit records of why additional (unexpected) methods are
#              present in the current YAML.  The validation suite requires a
#              fixture entry before any method outside `expected` is accepted.
#
# This file is consumed by `scripts/test_verify_db_access_boundaries.py`:
#   - semantic set equivalence (no missing expected methods, no unexpected
#     methods without a fixture, no duplicate/overlapping entries);
#   - operation evidence (each expected method exists in its exact source
#     class and its operation token occurs in that exact method body);
#   - fixture existence (each fixture method exists in its source class).
#
# Baseline
# --------
# The pre-split approved set is the structural exceptions YAML at commit
# c891c3bb ("feat(ci): H2 — separate DB ownership policy from architecture
# debt").  All structural source classes referenced below are unchanged
# between that baseline and the current working tree (verified via git status).

baseline:
  commit: "c891c3bb"
  description: >
    Pre-split approved set — class-level `.*` method_pattern entries plus the
    bounded migration form for DatabaseMigrations.  This manifest rewrites that
    approved set as exact operation tuples only (execSQL, openDatabase,
    getDatabasePath, deleteRecursively, writableDatabase).  No generic
    authorization remains: every approved method is enumerated with the exact
    operation token(s) that appear in its method body.
  source_note: >
    Structural source classes are unchanged between the pre-split baseline
    and the current working tree.

# Canonical structural entry-count contract for the DB policy gate.
#
# `verify_db_access_boundaries.py` enforces this EXACT count at load time.
# Changing the number of entries in `config/guards/db_structural_exceptions.yml`
# WITHOUT updating this contract is a configuration error (exit 2) — a silent
# count change is never accepted.  This manifest governs structural exceptions
# only; ownership cardinality is an observational migration metric and is not
# pinned here.
counts:
  structural_entries: 64

