# resolution-state vocabulary only.  CB-19/CB-20 are the GR-14u45
# lambda-parameter typing positives (callee-signature / receiver-generic
# binding); CB-21..CB-26 are its fail-closed pins (arity mismatch, generic
# component, two distinct signatures, async-region param, no explicit type
# argument, named non-trailing argument).  CB-27..CB-29 are the GR-14u47
# external-exact rows (preservation-rule exemption, unique-extension
# carve-out, ambiguous-extension carve-out); CB-30 is the GR-14u48
# inline-wrapper carrier positive.  CB-31..CB-40 are the GR-14u49
# anonymous-object rows (member modelling, phantom suppression, naming
# determinism, capture fail-closed, bounded fan-out positive/incomplete/
# all-or-nothing, multi-supertype, wrapped-supertype pin); CB-41..CB-48
# are its loop-variable typing rows (explicit-annotation positive,
# unannotated/destructuring/map/string/scope-leak negatives, shadow and
# inferred-only pins, set-headed fan-out positive).
