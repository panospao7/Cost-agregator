# cloud_payload_allowlist.yml
# G-CLOUD-01: Known-safe exemptions for cloud payload boundary detection.
#
# Matching is EXACT (verify_cloud_payload_boundaries.is_allowlisted). Every
# entry MUST have:
#   - rule: G-CLOUD-01
#   - path:  exact repository-relative file path, e.g.
#            "app/src/main/java/com/yourname/expensetracker/<...>/<File>.kt"
#            (no basename, suffix, absolute, drive-letter, ".." or "*" paths)
#   - symbol: exactly one of "raw_RequestBody" (R1) or "unproved_post_body" (R2);
#             "*" and empty symbols never match
#   - reason: why this file is safe without the standard policy check
#   - owner: @github-handle
#   - expires: YYYY-MM-DD or "permanent"
#   - linked_issue: "MIT-###" (recommended)
#
# Keep this list minimal. The guard is the rule; allowlist is the exception.
#
# The list is intentionally empty: the former CloudPayloadPolicy.kt entry
# suppressed no finding (that file contains no RequestBody.create call), so it
# was removed. A comments-only file is rejected by allowlist_compliance, hence
# the explicit empty list below.

[]
