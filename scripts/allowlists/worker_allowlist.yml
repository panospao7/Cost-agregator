# worker_allowlist.yml
# G-WORKER-01: Known-safe worker exemptions from the WorkerExecutionGuard requirement.
#
# Every entry MUST have:
#   - rule: G-WORKER-01
#   - path:   relative file path from project root
#   - symbol: per-violation match key (ClassName.category)
#   - reason: why this worker/site is safe
#   - owner: @github-handle
#   - expires: YYYY-MM-DD or "permanent"
#
# MATCHING: a violation is suppressed only when rule, path, AND symbol all
# match exactly — other violations in the same file are still detected.
#
# Keep this list minimal. The guard is the rule; allowlist is the exception.
#
- rule: G-WORKER-01
  path: app/src/main/java/com/yourname/expensetracker/data/location/LocationBackfillWorker.kt
  symbol: LocationBackfillWorker.broadCatch
  reason: "Pre-existing backfill worker — broad catch with Log diagnostic, CancellationSafe check uses fully-qualified name; worker uses WorkerExecutionGuard"
  owner: "@panospao7"
  expires: "permanent"
  linked_issue: "MIT-003"

