# Receipt Link Ownership Guard Allowlist
# Guard: verify_receipt_link_boundaries.py
# Rule: G-RCPT-LINK-01
#
# Files approved for ScannedReceipt.expenseId mutations and scannedReceiptDao writes.
#
# Every entry MUST have:
#   - rule: G-RCPT-LINK-01
#   - path: Kotlin class name (without .kt extension)
#   - reason: why this class is allowed to mutate receipt link state
#   - owner: @github-handle or team name
#   - expires: YYYY-MM-DD or "permanent"
#
# Add or remove entries ONLY when the codebase architecture changes.

- rule: G-RCPT-LINK-01
  path: ReceiptLinkService
  symbol: "direct_dao_mutation"
  reason: "Single canonical owner of receipt-expense linking. Writes expenseId via copy+update and atomic claim."
  owner: "@receipt-team"
  expires: "2027-01-01"
  linked_issue: "MIT-003"

- rule: G-RCPT-LINK-01
  path: ReceiptLifecycleCoordinator
  symbol: "direct_dao_mutation"
  reason: "Central lifecycle coordinator for receipt processing. Needs write access for deduplication, save, and maintenance."
  owner: "@receipt-team"
  expires: "2027-01-01"
  linked_issue: "MIT-003"

- rule: G-RCPT-LINK-01
  path: RoomReceiptLifecycleEventWriter
  symbol: "direct_dao_mutation"
  reason: "Event writer implementation that persists receipt lifecycle events. May read receipt state; writes are event-audit-only."
  owner: "@receipt-team"
  expires: "2027-01-01"
  linked_issue: "MIT-003"

- rule: G-RCPT-LINK-01
  path: ReceiptLifecycleEventWriter
  symbol: "direct_dao_mutation"
  reason: "Interface definition — no actual DAO mutations, but included for completeness."
  owner: "@receipt-team"
  expires: "2027-01-01"
  linked_issue: "MIT-003"

- rule: G-RCPT-LINK-01
  path: BankStatementLifecycleProcessor
  symbol: "direct_dao_mutation"
  reason: "Bank statement import path uses ScannedReceiptDao and receipt lifecycle event writer for statement processing."
  owner: "@receipt-team"
  expires: "2027-01-01"
  linked_issue: "MIT-003"

- rule: G-RCPT-LINK-01
  path: ReceiptRepository
  symbol: "direct_dao_mutation"
  reason: "Repository layer for receipt CRUD. Authorized to insert/update receipts. Legacy path predates lifecycle coordinator."
  owner: "@data-team"
  expires: "2027-01-01"
  linked_issue: "MIT-003"

- rule: G-RCPT-LINK-01
  path: ReceiptMatchLifecycleService
  symbol: "direct_dao_mutation"
  reason: "Receipt matching service that links receipts to expenses via ReceiptLinkService. May read receipt state."
  owner: "@receipt-team"
  expires: "2027-01-01"
  linked_issue: "MIT-003"

- rule: G-RCPT-LINK-01
  path: ScannedReceiptDao_Impl
  symbol: "direct_dao_mutation"
  reason: "Room-generated DAO implementation. The actual database operations live here."
  owner: "@data-team"
  expires: "2027-01-01"

# Migration/backfill paths
  linked_issue: "MIT-003"
- rule: G-RCPT-LINK-01
  path: SourceLinkBackfillWorker
  symbol: "direct_dao_mutation"
  reason: "Provenance backfill worker reads ScannedReceipt state to reconstruct source links."
  owner: "@provenance-team"
  expires: "2027-01-01"
  linked_issue: "MIT-003"

- rule: G-RCPT-LINK-01
  path: SourceLinkWriterImpl
  symbol: "direct_dao_mutation"
  reason: "Writes source link metadata referencing receipt IDs."
  owner: "@provenance-team"
  expires: "2027-01-01"
  linked_issue: "MIT-003"

- rule: G-RCPT-LINK-01
  path: ReceiptSideEffectPlanner
  symbol: "direct_dao_mutation"
  reason: "Receipt lifecycle side-effect planning. Updates suggestedExpenseId and matchStatus (NOT expenseId) via scannedReceiptDao.update. Uses writeBarrier for all writes."
  owner: "@receipt-team"
  expires: "2027-01-01"
  linked_issue: "MIT-003"

- rule: G-RCPT-LINK-01
  path: WarrantyTrackerRepository
  symbol: "direct_dao_mutation"
  reason: "Warranty tracking reads receipt state to associate warranties with expenses."
  owner: "@feature-team"
  expires: "2027-01-01"
  linked_issue: "MIT-003"

- rule: G-RCPT-LINK-01
  path: ExportAnonymizer
  symbol: "direct_dao_mutation"
  reason: "Privacy/export sanitization that nulls rawOcrText on scanned_receipts during export. Does NOT touch expenseId or receipt link state. Legitimate privacy operation."
  owner: "@privacy-team"
  expires: "2027-01-01"
  linked_issue: "MIT-003"

- rule: G-RCPT-LINK-01
  path: LegacyDataConsistencyChecker
  symbol: "direct_dao_mutation"
  reason: "Consistency checker reads receipt state to detect orphaned/mislinked receipts."
  owner: "@data-team"
  expires: "2027-01-01"

# Room migration classes are always allowed for schema changes.
# They are identified by file names matching *Migration*.kt
  linked_issue: "MIT-003"
