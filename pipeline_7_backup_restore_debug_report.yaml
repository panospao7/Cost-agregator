      - "Add write mutex or enforce global write barrier."
      - "Wait for active workers/jobs to stop or return busy."
    closes:
      - "P7-CURRENT-006"
      - "P7-CURRENT-007"

  - pr: "PR4"
    title: "Durable asset restore"
    include:
      - "Per-asset restore task ledger."
      - "Resume ASSETS_RESTORING on startup."
      - "Validate before copy; temp-copy + DB update + atomic rename; cleanup on failure."
    closes:
      - "P7-CURRENT-008"
      - "P7-CURRENT-009"

  - pr: "PR5"
    title: "Backup privacy contract"
    include:
      - "Fix BackupPrivacyMode image semantics and manifest fields."
      - "Expand ExportAnonymizer to AI/email/location/privacy-sensitive tables."
      - "Decide privacy_audit_events preserve/exclude policy."
    closes:
      - "P7-CURRENT-010"
      - "P7-CURRENT-011"
      - "P7-CURRENT-012"

  - pr: "PR6"
    title: "Verifier hardening and semantic restore tests"
    include:
      - "Manifest completeness check before swap."
      - "Fail backup creation on required table count errors."
      - "Golden restore equivalence tests for dashboard, analytics, budget, receipts, recurring, privacy audit."
    closes:
      - "P7-CURRENT-013"
      - "P7-CURRENT-014"
      - "P7-CURRENT-015"

  - pr: "PR7"
    title: "UX, diagnostics, and import/export guardrails"
    include:
      - "BackupRestoreEvent/PipelineDiagnosticEvent operation ledger."
      - "Restore URI preflight size/header check."
      - "Global restart-required app lock."
      - "Raw export debug-only interface."
      - "Reset database journaled/maintenance-guarded."
    closes:
      - "P7-CURRENT-016"
      - "P7-CURRENT-017"
      - "P7-CURRENT-019"
      - "P7-CURRENT-020"
      - "P7-CURRENT-021"

  - pr: "PR8"
    title: "Worker registry and journal durability cleanup"
    include:
      - "WorkerRegistry/WorkerSpec parity tests and enabled handling."
      - "fsync/checked atomic journal writes."
      - "Update stale KDoc/comments."
    closes:
      - "P7-CURRENT-018"
      - "P7-CURRENT-022"
      - "P7-CURRENT-024"

definition_of_done:
  - "Restoring .costbackup deletes/replaces DB, WAL, and SHM sidecars atomically."
  - "Any rollback failure leaves app in persistent critical-failure mode with writes blocked across restarts."
  - "Startup recovery verifies integrity/FK/schema after safety-backup copy."
  - "No injected/stale Room instance is used after DB file swap."
  - "Backup creation is a real point-in-time snapshot under concurrent writes."
  - "Restore/write barrier is enforced globally or by CI guard across all DB mutators."
  - "Receipt asset restore is resumable, idempotent, and leaves no orphan files."
  - "Backup privacy modes match manifest and actual included assets."
  - "Redacted backups sanitize all PII-bearing tables according to a versioned policy."
  - "privacy_audit_events are either preserved exactly or explicitly excluded by manifest."
  - "Pre-swap verification fails missing Tier 1 manifest counts."
  - "Backup creation fails if required table count collection fails."
  - "Golden tests prove restored dashboard, analytics, budget, receipt, recurring, and audit behavior."
  - "Restore URI is size/header-validated before full copy."
  - "Restart-required state is globally blocking and cannot be dismissed into stale app use."
  - "resetDatabase is journaled, guarded, and typed-confirmation enforced."
  - "WorkerRegistry and WorkerSpec are mechanically kept in sync."
  - "RestoreJournal writes are checked and crash-durable."
  - "Stale comments about legacy import and worker defaults are removed."

