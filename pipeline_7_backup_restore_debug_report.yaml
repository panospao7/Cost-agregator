      - "Use fresh one-shot DB for live verification and receipt asset imagePath repair."
      - "Never reopen injected singleton after file swap."
    closes:
      - "P7-CURRENT-005"

  - pr: "PR3"
    title: "True backup snapshot and write quiescence"
    include:
