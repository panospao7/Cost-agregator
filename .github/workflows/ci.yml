name: CI

on:
  push:
    branches: [main, master, 'atomicity-**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" -Dorg.gradle.caching=true -Dorg.gradle.parallel=true

defaults:
  run:
    shell: bash

jobs:
  # ── Workflow Validation ──────────────────────────────────────────
  # Runs actionlint to validate all workflow YAML files before any
  # expensive build/test jobs start. Catches syntax errors, invalid
  # action references, and common mistakes early.
  #
  # Reproduce locally:
  #   brew install actionlint   # macOS
  #   actionlint                # lint all workflows
  validate-workflow:
    name: Validate Workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint workflows (actionlint v1.7.7)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # ── Compile Gate ─────────────────────────────────────────────────
  # PR-GR-10a: mandatory pre-test compile gate. Rounds R12/R13 landed
  # consecutive compileDebugKotlin breakages (setZone misuse; a
  # @Deprecated(ERROR) call site) and zeroed all Kotlin validation for
  # those rounds because the unit-test job never ran. Compiling first
  # fails fast and blocks the ~20+ min unit-test cycle on broken builds.
  #
  # Reproduce locally:
  #   ./gradlew :app:compileDebugKotlin --console=plain
  compile:
    needs: validate-workflow
    name: Compile (Debug Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Compile debug Kotlin sources
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Upload compile reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  # ── Evidence Gate (PR-GR-10d) ────────────────────────────────────────────
  # Runs the §5 two-run DB-guard evidence capture (docs/ci/
  # GR00-GR04_validation_checklist.md) on every PR: two capture runs of
  # scripts/ci/capture_db_guard_evidence.py at the caller-pinned
  # merge-commit SHA, then a byte-equality comparison of the two
  # deterministic semantic-summary.json files. The capture tool exits 0
  # only when a capture is complete/trusted with every required artifact
  # present (including the observed DB gate child result); this job fails
  # if either capture exits nonzero or the two summaries are not
  # byte-identical.
  #
  # Runtime / scoping decision: the tool's argparse exposes NO subset or
  # scoping flags (only --root / --out / --expected-sha / --allow-dirty),
  # so the full declared command matrix runs twice per PR: registry
  # validation, focused Python tests, inventory-only scan, DB CLI, DB
  # ratchet, the full static guard suite, and two Gradle invocations
  # (verifyDbAccessBoundaries + check --dry-run). Estimated ~15-30 min per
  # run on a CI runner (~30-60 min total; the static-guards job bounds the
  # suite at ~10 min and the DB gate child is ~4 min cached), so the job
  # timeout is sized at 120 min for cold-cache variance. If this proves too
  # heavy per-PR, the follow-up is an explicit subset flag in the capture
  # tool itself (a strict-review change to its fixed declared matrix), not
  # workflow-side scoping.
  #
  # PYTEST_ADDOPTS zero-side-effect pin: the static suite's guard_tests
  # child runs pytest without disabling cacheprovider, and .pytest_cache/ is
  # not git-ignored — a plain run would materialize an untracked
  # .pytest_cache/ and the capture's post-matrix `git status` re-check would
  # fail the capture closed (drift). Disabling cacheprovider for every
  # pytest child keeps the captured checkout status-clean (same rationale as
  # the tool's own focused-tests matrix entry).
  #
  # Reproduce locally:
  #   python3 scripts/ci/capture_db_guard_evidence.py --root . \
  #     --expected-sha $(git rev-parse HEAD) \
  #     --out build/guard-evidence/<sha>/run-1
  evidence-gate:
    needs: [validate-workflow, compile]
    name: Evidence Gate (Two-Run Capture)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTEST_ADDOPTS: "-p no:cacheprovider"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pytest pyyaml

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Resolve pinned commit SHA (caller-stated run pin)
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Capture evidence (run 1)
        run: python3 scripts/ci/capture_db_guard_evidence.py --root . --expected-sha ${{ steps.sha.outputs.sha }} --out build/guard-evidence/${{ steps.sha.outputs.sha }}/run-1

      - name: Capture evidence (run 2)
        run: python3 scripts/ci/capture_db_guard_evidence.py --root . --expected-sha ${{ steps.sha.outputs.sha }} --out build/guard-evidence/${{ steps.sha.outputs.sha }}/run-2

      - name: Compare semantic summaries (must be byte-identical)
        run: |
          run1="build/guard-evidence/${{ steps.sha.outputs.sha }}/run-1/semantic-summary.json"
          run2="build/guard-evidence/${{ steps.sha.outputs.sha }}/run-2/semantic-summary.json"
          if ! cmp -s "$run1" "$run2"; then
            echo "::error::semantic-summary.json differs between run-1 and run-2 (non-deterministic evidence capture)"
            diff "$run1" "$run2" || true
            exit 1
          fi
          echo "Semantic summaries are byte-identical"

      - name: Upload evidence bundle (run 1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-run-1
          path: build/guard-evidence/${{ steps.sha.outputs.sha }}/run-1/
          if-no-files-found: error
          retention-days: 7

      - name: Upload evidence bundle (run 2)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-run-2
          path: build/guard-evidence/${{ steps.sha.outputs.sha }}/run-2/
          if-no-files-found: error
          retention-days: 7

  # ── Static Guard Scripts ─────────────────────────────────────────
  # Runs all Python-based architecture guard scripts and their pytest
  # test suites. These enforce project-specific rules that Gradle-based
  # checks cannot easily express (privacy boundaries, DAO ownership,
  # event provenance, money rules, source link safety).
  #
  # Reproduce locally:
  #   python3 scripts/verify_privacy_boundaries.py --root .
  #   python3 scripts/verify_db_access_boundaries.py --fail-on-violation
  #   python3 scripts/verify_event_writers.py --fail-on-violation
  #   python3 scripts/verify_money_boundaries.py --root .
  #   python3 scripts/verify_source_provenance_boundaries.py --root .
  #   python3 scripts/verify_cancellation_boundaries.py
  #   python3 scripts/verify_ui_dao_boundaries.py --fail-on-violation
  #   python3 scripts/verify_worker_boundaries.py --fail-on-violation
  #   python3 scripts/verify_receipt_link_boundaries.py --fail-on-violation
  #   python3 scripts/verify_import_lifecycle_boundaries.py --fail-on-violation
  #   python3 scripts/verify_cloud_payload_boundaries.py --fail-on-violation
#   python3 scripts/verify_pii_logging_boundaries.py --fail-on-violation
#   python3 scripts/verify_di_release_boundaries.py
  #   python3 scripts/verify_allowlist_compliance.py --fail-on-violation
  #   python3 scripts/verify_time_boundaries.py --root . --allowlist config/guards/time_boundary_exceptions.yml --fail-on-violation
  #   python3 scripts/verify_migration_matrix.py --fail-on-violation
  #   python3 scripts/verify_ignored_test_budget.py --fail-on-violation --baseline 29
  #   python3 scripts/ci/verify_deprecation_escalations.py --root .
  #   python -m pytest scripts/test_*.py -v
  static-guards:
    needs: validate-workflow
    name: Static Guards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pytest pyyaml

      - name: Run static guard suite
        id: guard-suite
        run: python3 scripts/ci/run_static_guard_suite.py

      - name: Upload guard suite outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-guard-results
          path: build/ci/static-guards/
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    needs: [validate-workflow, compile]
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Verify Room schema snapshots
        run: ./gradlew :app:verifyRoomSchemaSnapshots -PstrictRoomSchemas=true --no-daemon --stacktrace

      - name: Verify no ignored-test growth
        run: ./gradlew :app:verifyNoIgnoredGrowth -PmaxIgnoredTests=29 --no-daemon --stacktrace

      - name: Run currency guardrails
        shell: pwsh
        run: pwsh scripts/currency_guardrails.ps1 -SourceDir app/src/main/java -ProjectRoot ${{ github.workspace }}

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload Room schema verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-results
          path: app/build/reports/roomSchemaVerification/
          retention-days: 7

  lint-and-check:
    needs: validate-workflow
    name: Lint & Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Assemble debug build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run Gradle check (all wired verification tasks)
        run: ./gradlew :app:check --stacktrace

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html
          retention-days: 7

      - name: Upload Gradle build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  release-check:
    needs: validate-workflow
    name: Release Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify release artifact
        run: python3 scripts/verify_release_artifact.py --fail-on-violation

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/
          retention-days: 7

  instrumented-tests:
    needs: validate-workflow
    name: Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Don't block required CI checks on instrumented tests (they're flaky on emulators)
    continue-on-error: true

    # Run on main/master pushes and manual dispatch only
    if: >
      github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
      || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        api-level: [34]
        target: [google_apis]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run instrumented tests (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          avd-name: ci-android-${{ matrix.api-level }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  migration-proof:
    needs: validate-workflow
    name: Migration Proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run on main/master pushes and manual dispatch only (needs emulator)
    if: >
      github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
      || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        api-level: [34]
        target: [google_apis]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew
      - name: Run migration proof tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          avd-name: ci-migration-${{ matrix.api-level }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --tests "*DatabaseMigration*" --stacktrace
      - name: Upload migration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-proof-results
          path: app/build/reports/androidTests/
          retention-days: 7
