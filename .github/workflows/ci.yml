name: CI

on:
  push:
    branches: [main, master, 'atomicity-**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" -Dorg.gradle.caching=true -Dorg.gradle.parallel=true

defaults:
  run:
    shell: bash

jobs:
  # ── Workflow Validation ──────────────────────────────────────────
  # Runs actionlint to validate all workflow YAML files before any
  # expensive build/test jobs start. Catches syntax errors, invalid
  # action references, and common mistakes early.
  #
  # Reproduce locally:
  #   brew install actionlint   # macOS
  #   actionlint                # lint all workflows
  validate-workflow:
    name: Validate Workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint workflows (actionlint v1.7.7)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # ── Static Guard Scripts ─────────────────────────────────────────
  # Runs all Python-based architecture guard scripts and their pytest
  # test suites. These enforce project-specific rules that Gradle-based
  # checks cannot easily express (privacy boundaries, DAO ownership,
  # event provenance, money rules, source link safety).
  #
  # Reproduce locally:
  #   python3 scripts/verify_privacy_boundaries.py --root .
  #   python3 scripts/verify_db_access_boundaries.py --fail-on-violation
  #   python3 scripts/verify_event_writers.py --fail-on-violation
  #   python3 scripts/verify_money_boundaries.py --root .
  #   python3 scripts/verify_source_provenance_boundaries.py --root .
  #   python3 scripts/verify_cancellation_boundaries.py
  #   python3 scripts/verify_ui_dao_boundaries.py --fail-on-violation
  #   python3 scripts/verify_worker_boundaries.py --fail-on-violation
  #   python3 scripts/verify_receipt_link_boundaries.py --fail-on-violation
  #   python3 scripts/verify_import_lifecycle_boundaries.py --fail-on-violation
  #   python3 scripts/verify_cloud_payload_boundaries.py --fail-on-violation
#   python3 scripts/verify_pii_logging_boundaries.py --fail-on-violation
#   python3 scripts/verify_di_release_boundaries.py
  #   python3 scripts/verify_allowlist_compliance.py --fail-on-violation
  #   python3 scripts/verify_migration_matrix.py --fail-on-violation
  #   python3 scripts/verify_ignored_test_budget.py --fail-on-violation --baseline 29
  #   python -m pytest scripts/test_*.py -v
  static-guards:
    needs: validate-workflow
    name: Static Guards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pytest pyyaml

      - name: Run static guard suite
        id: guard-suite
        run: python3 scripts/ci/run_static_guard_suite.py

      - name: Upload guard suite outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-guard-results
          path: build/ci/static-guards/
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    needs: validate-workflow
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Verify Room schema snapshots
        run: ./gradlew :app:verifyRoomSchemaSnapshots -PstrictRoomSchemas=true --no-daemon --stacktrace

      - name: Verify no ignored-test growth
        run: ./gradlew :app:verifyNoIgnoredGrowth -PmaxIgnoredTests=310 --no-daemon --stacktrace

      - name: Run currency guardrails
        shell: pwsh
        run: pwsh scripts/currency_guardrails.ps1 -SourceDir app/src/main/java -ProjectRoot ${{ github.workspace }}

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload Room schema verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-results
          path: app/build/reports/roomSchemaVerification/
          retention-days: 7

  lint-and-check:
    needs: validate-workflow
    name: Lint & Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Assemble debug build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run Gradle check (all wired verification tasks)
        run: ./gradlew :app:check --stacktrace

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html
          retention-days: 7

  release-check:
    needs: validate-workflow
    name: Release Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify release artifact
        run: python3 scripts/verify_release_artifact.py --fail-on-violation

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/
          retention-days: 7

  instrumented-tests:
    needs: validate-workflow
    name: Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Don't block required CI checks on instrumented tests (they're flaky on emulators)
    continue-on-error: true

    # Run on main/master pushes and manual dispatch only
    if: >
      github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
      || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        api-level: [34]
        target: [google_apis]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run instrumented tests (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          avd-name: ci-android-${{ matrix.api-level }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
