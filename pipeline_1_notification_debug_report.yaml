meta:
  repo: "panospao7/Cost-agregator"
  commit: "4113e38f0d838a29d2d13d82a483ba573280721c"
  pipeline: "1 - Notification Capture -> Expense -> Dashboard"
  review_mode: "static source/debugging session"
  verdict: "NOT CLEAN"
  summary: >
    Pipeline 1 is significantly improved, but it is not fully clean. The core
    processing pipeline now has a sealed outcome type, write barrier, post-commit
    side effects, and generic diagnostic events. However, the live listener path
    still has serious gaps in filtering, raw-storage privacy modes, service-level
    diagnostics, shutdown durability, dedupe correctness, and listener lifecycle.

tracker_reconciliation:
  P1-P1-01_processing_outcomes_flattened:
    tracker_status: "FIXED"
    actual_status: "MOSTLY_FIXED_BUT_REPOSITORY_API_STILL_DROPS_RESULT"
    notes:
      - "NotificationProcessingPipeline.process() now returns NotificationPipelineOutcome."
      - "NotificationRepository.processAndSave() still returns Unit, so service callers cannot programmatically inspect the outcome."
      - "Old ProcessingResult sealed type and TODO are stale/dead code."

  P1-P1-02_no_durable_drop_reason_ledger:
    tracker_status: "PARTIAL"
    actual_status: "PARTIAL"
    notes:
      - "Generic PipelineDiagnosticEvent exists."
      - "Pipeline outcomes are recorded."
      - "Service-level exits are still only Timber logs: restore blocked, fast privacy denied, filter rejected, blocked package, shutdown skip."
      - "No durable RECEIVED event before filtering."

  P1-P1-03_extraction_misses_textLines_messages:
    tracker_status: "FIXED"
    actual_status: "PARTIAL_BUGGY"
    notes:
      - "textLines are extracted."
      - "MessagingStyle messages extraction is likely wrong: Android EXTRA_MESSAGES is message Bundle/Parcelable array, not CharSequence."
      - "The live onNotificationPosted filter still passes parts.bigText, not parts.combinedBody, so extracted textLines/messages/infoText/summaryText can still be ignored."

  P1-P1-05_privacy_gate_after_extraction:
    tracker_status: "TODO_ONLY"
    actual_status: "MOSTLY_FIXED_WITH_STARTUP_RACE"
    notes:
      - "A cached pre-extraction privacy flag now exists."
      - "Default is fail-closed until the settings flow emits; notifications can be silently dropped during startup."
      - "Privacy-denied drops are not diagnostically persisted."

  P1-P1-06_restore_guard_in_service_not_pipeline:
    tracker_status: "FIXED"
    actual_status: "FIXED_FOR_MAIN_PROCESSING_PATH"
    notes:
      - "NotificationCaptureService checks restore mode."
      - "NotificationProcessingPipeline checks DatabaseWriteBarrier."
      - "NotificationRepository.processAndSave delegates to guarded pipeline."

  P1-P1-07_service_shutdown_loses_notifications:
    tracker_status: "TODO_ONLY"
    actual_status: "PARTIAL"
    notes:
      - "Dedupe key is removed in finally for launched jobs."
      - "But onDestroy cancels serviceJob and there is still no durable intake/raw queue before async processing."
      - "A process kill before DB insert can still lose an accepted notification."

positive_findings:
  - "NotificationProcessingPipeline now has NotificationPipelineOutcome sealed interface."
  - "Pipeline writes PipelineDiagnosticEvent for final outcomes."
  - "DatabaseWriteBarrier is injected into pipeline and repository write methods."
  - "Auto-accept uses TransactionLifecycleCoordinator.createExpense(..., SideEffectMode.DEFER)."
  - "Post-creation side effects are dispatched after outer transaction completion."
  - "RawNotification has unique dedupeFingerprint index."
  - "NotificationFilter currency regex now supports more currencies than old report."
  - "Finance package list is centralized via NotificationFilter.FINANCE_PACKAGES."

issues:
  - id: "P1-CURRENT-001"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Live onNotificationPosted filter ignores combinedBody"
    evidence:
      - "NotificationTextParts extracts combinedBody from title/text/bigText/subText/infoText/summaryText/textLines/messages."
      - "onNotificationPosted calls NotificationFilter.shouldCapture(packageName, parts.title, parts.text, parts.bigText)."
      - "processNotificationBypassDedupe uses parts.combinedBody, so manual refresh behaves differently from live capture."
    impact:
      - "Valid bank/SMS notifications with amount only in summaryText/infoText/textLines/messages can be dropped before persistence."
      - "The documented unified extraction contract is not honored in the primary path."
    fix:
      - "Pass parts.combinedBody to NotificationFilter.shouldCapture in onNotificationPosted."
      - "Prefer a new NotificationCapturePayload with explicit combinedBody."
    tests:
      - "live_posted_amount_only_in_summaryText_is_captured"
      - "live_posted_amount_only_in_textLines_is_captured"
      - "live_and_manual_refresh_filter_same_payload"

  - id: "P1-CURRENT-002"
    severity: "P0_PRIVACY"
    status: "OPEN"
    title: "RawStorageMode.DO_NOT_STORE falls through to raw storage"
    evidence:
      - "RawStorageMode enum includes DO_NOT_STORE."
      - "NotificationCaptureService only special-cases STORE_METADATA_ONLY and STORE_REDACTED; all other modes use raw title/text/bigText/extrasJson branch."
    impact:
      - "User selecting DO_NOT_STORE for raw notifications can still persist raw notification text and extras."
      - "This violates the raw-storage privacy contract."
    fix:
      - "Use exhaustive when(settings.rawNotificationStorageMode)."
      - "For DO_NOT_STORE, do not insert a raw body row; either process ephemerally or insert a metadata-only non-raw processing stub if product semantics allow."
    tests:
      - "do_not_store_mode_persists_no_raw_notification_text"
      - "do_not_store_mode_persists_no_extrasJson_body"
      - "do_not_store_mode_has_explicit_pipeline_outcome"

  - id: "P1-CURRENT-003"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "STORE_REDACTED and STORE_METADATA_ONLY break parsing"
    evidence:
      - "NotificationCaptureService builds RawNotification with null/redacted title/text/bigText before calling repository.processAndSave()."
      - "NotificationProcessingPipeline parses from RawNotification fields."
    impact:
      - "If user enables redacted or metadata-only raw storage, the parser receives null or '[REDACTED]' instead of the actual notification text."
      - "Capture may degrade into parser failure/auto-reject even though in-memory text was available."
    fix:
      - "Separate processing payload from storage payload."
      - "Parser should receive ephemeral raw NotificationTextParts; DB should receive sanitized RawNotification according to storage mode."
    tests:
      - "store_redacted_parses_original_text_but_persists_redacted_text"
      - "metadata_only_parses_original_text_but_persists_no_body"
      - "raw_mode_matrix_preserves_expected_processing_outcome"

  - id: "P1-CURRENT-004"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "In-memory dedupe is too coarse: sbn.key only"
    evidence:
      - "onNotificationPosted uses coarseDedupeKey = sbn.key."
      - "computeNotificationContentHash(parts) exists but is not used in the live dedupe key."
    impact:
      - "If an app updates a notification with the same StatusBarNotification key but changed text within 5 seconds, the new financial event can be dropped."
      - "Messaging/grouped notifications are especially at risk."
    fix:
      - "After privacy is allowed, dedupe using sbn.key + hash(combinedBody)."
      - "For strict pre-extraction privacy, keep only package/key pre-gate and apply content dedupe after extraction."
    tests:
      - "same_sbn_key_changed_combinedBody_within_window_is_not_dropped"
      - "same_sbn_key_same_combinedBody_within_window_is_dropped"

  - id: "P1-CURRENT-005"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "MessagingStyle EXTRA_MESSAGES extraction is likely incorrect"
    evidence:
      - "Code attempts getParcelableArrayList(EXTRA_MESSAGES, CharSequence::class.java) or casts parcelables to CharSequence."
      - "Android docs describe EXTRA_MESSAGES as MessagingStyle.Message bundles / Parcelable array."
    impact:
      - "Messaging-style SMS/bank/email notifications can still have invisible transaction text."
    fix:
      - "Use Notification.MessagingStyle.Message.getMessagesFromBundleArray(extras.getParcelableArray(Notification.EXTRA_MESSAGES))."
      - "Map each message.text into NotificationTextParts.messages."
    tests:
      - "messaging_style_message_text_is_extracted"
      - "amount_only_in_messaging_style_message_is_captured"

  - id: "P1-CURRENT-006"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Service-level drops are not written to durable diagnostics"
    evidence:
      - "PipelineDiagnosticEvent is written inside NotificationProcessingPipeline only."
      - "Drops before repository call return from NotificationCaptureService with Timber only."
    missing_events:
      - "RECEIVED"
      - "DROPPED_RESTORE_MODE"
      - "DROPPED_PRIVACY_FAST"
      - "DROPPED_FILTER"
      - "DROPPED_BLOCKED_PACKAGE"
      - "DROPPED_SHUTTING_DOWN"
      - "PIPELINE_CANCELLED"
    impact:
      - "User/device debugging still cannot answer: Android delivered it, but where did it die?"
    fix:
      - "Inject a lightweight NotificationCaptureDiagnostics writer into the service."
      - "Write a durable event before every return path."
    tests:
      - "restore_drop_writes_diagnostic"
      - "privacy_fast_drop_writes_diagnostic"
      - "filter_drop_writes_diagnostic"
      - "blocked_package_drop_writes_diagnostic"

  - id: "P1-CURRENT-007"
    severity: "P1_HIGH"
    status: "PARTIAL"
    title: "Shutdown durability is still not guaranteed"
    evidence:
      - "onDestroy sets isShuttingDown=true and cancels serviceJob."
      - "Comment says durable NotificationIntake table is planned."
    impact:
      - "If the service/process dies after accepting a callback but before DB insert, the notification can be lost."
    fix:
      - "Introduce durable intake: insert raw/metadata row synchronously after gates, then process by rawId via worker/resumable pipeline."
      - "Or use a foreground-safe drain that completes first durable write."
    tests:
      - "service_cancel_after_receive_does_not_lose_raw_intake"
      - "unprocessed_raw_notification_resumes_after_restart"

  - id: "P1-CURRENT-008"
    severity: "P1_HIGH"
    status: "OPEN"
    title: "Listener lifecycle still uses risky foreground-service restart model"
    evidence:
      - "NotificationCaptureService schedules a repeating restart alarm."
      - "BootReceiver and ServiceRestartReceiver call startForegroundService()."
      - "onListenerDisconnected calls requestRebind() but also restarts foreground notification service."
    impact:
      - "Foreground service can be alive while NotificationListenerService is not actually bound."
      - "Android background foreground-service restrictions can make this unreliable."
    fix:
      - "Treat listener binding as truth: permission granted + onListenerConnected."
      - "Remove periodic restart alarm as reliability mechanism."
      - "Keep requestRebind() on disconnect and expose listener health in diagnostics."
    tests:
      - "device_test_reboot_listener_rebinds_without_periodic_fgs_restart"
      - "debug_health_distinguishes_fgs_running_from_listener_connected"

  - id: "P1-CURRENT-009"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Privacy cache fail-closed startup race can silently drop notifications"
    evidence:
      - "capturePrivacyDenied defaults to true until observeSettings emits."
      - "onNotificationPosted returns before extraction if isPrivacyDeniedFast() is true."
    impact:
      - "A notification arriving immediately after service creation can be dropped even when settings default to notificationCaptureEnabled=true."
    fix:
      - "Use tri-state cache: UNKNOWN, ALLOWED, DENIED."
      - "On UNKNOWN, either synchronously load settings once off main or record QUEUED/DROPPED_PRIVACY_UNKNOWN diagnostic."
    tests:
      - "startup_before_settings_emission_does_not_silently_drop_without_event"

  - id: "P1-CURRENT-010"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Blocked package drop happens after text extraction and has no diagnostic"
    evidence:
      - "processNotification checks repository.isPackageBlocked(packageName) after NotificationTextParts extraction and async privacy check."
    impact:
      - "Blocked packages still have text extracted in memory."
      - "No durable drop reason for blocked package."
    fix:
      - "Load/cache blocked packages before extraction when possible."
      - "Write DROPPED_BLOCKED_PACKAGE event."
    tests:
      - "blocked_package_does_not_extract_text_when_cache_loaded"
      - "blocked_package_records_diagnostic"

  - id: "P1-CURRENT-011"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Pipeline fallback currency detector is narrower than filter"
    evidence:
      - "NotificationFilter regex supports EUR, USD, GBP, CHF, PLN, RON, TRY, CAD, AUD, JPY, SEK, NOK, DKK, HUF, CZK."
      - "NotificationProcessingPipeline fallback CURRENCY_HINT_REGEX / AMOUNT_TOKEN_REGEX support only €, $, £, EUR, USD, GBP."
    impact:
      - "A notification can pass filter but fail parser fallback review creation for supported currencies like PLN/RON/TRY/CAD/AUD."
    fix:
      - "Share one NotificationAmountSignalDetector / MoneyParser across filter and pipeline fallback."
    tests:
      - "pln_notification_filter_and_fallback_agree"
      - "cad_notification_filter_and_fallback_agree"
      - "jpy_notification_filter_and_fallback_agree"

  - id: "P1-CURRENT-012"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Unknown financial packages still skip AI fallback"
    evidence:
      - "AppParserRegistry.shouldAttemptAiFallback returns true for finance packages, or communication packages with financial keywords; all other packages skip AI."
    impact:
      - "An unknown bank package can pass NotificationFilter heuristics but still miss AI fallback if deterministic generic parsing fails."
    fix:
      - "Add runtime package discovery / user-marked financial candidates."
      - "Allow AI fallback for unknown packages that already passed strong amount+financial filter, subject to privacy/AI settings."
    tests:
      - "unknown_bank_package_with_strong_signal_attempts_ai_fallback_when_allowed"

  - id: "P1-CURRENT-013"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Pending review context can lose combined notification text"
    evidence:
      - "PendingReview.notificationText uses notification.text ?: notification.bigText."
      - "When text is non-null but incomplete, combinedBody in bigText is ignored."
    impact:
      - "Manual review UI/debug context may omit summary/textLines/messages even though parser used them."
    fix:
      - "Use combined body for review context, or add separate rawPreview/combinedText field."
    tests:
      - "review_context_contains_summary_when_text_is_short"

  - id: "P1-CURRENT-014"
    severity: "P2_MEDIUM"
    status: "OPEN"
    title: "Post-commit recommendation enrichment uses synthetic local Expense, not persisted Expense"
    evidence:
      - "handleAutoAcceptInTransaction creates a local Expense object but inserts through TransactionLifecycleCoordinator using CreateExpenseRequest."
      - "runParsedPostCommitActions copies local Expense with inserted id for recommendation enrichment."
    impact:
      - "Recommendation/AI follow-through may miss fields populated by coordinator, such as createdAt/baseAmount/baseCurrency/exchangeRateUsed/source normalization."
    fix:
      - "After commit, fetch persisted Expense by id before enrichment."
    tests:
      - "auto_accept_recommendation_uses_persisted_expense_fields"

  - id: "P1-CURRENT-015"
    severity: "P3_LOW"
    status: "OPEN"
    title: "RawNotification.isProcessed is never updated"
    evidence:
      - "RawNotification has isProcessed field."
      - "RawNotificationDao exposes no updateProcessed method; pipeline marks relevance but not processed."
    impact:
      - "Debug/resumable processing cannot rely on isProcessed."
      - "Future raw queue work may misinterpret all rows as unprocessed."
    fix:
      - "Either update isProcessed at terminal outcome or remove/rename field."
    tests:
      - "terminal_pipeline_outcome_sets_isProcessed_true"

  - id: "P1-CURRENT-016"
    severity: "P3_LOW"
    status: "OPEN"
    title: "Stale/dead ProcessingResult and TODO remain"
    evidence:
      - "NotificationProcessingPipeline still declares ProcessingResult."
      - "Comment still says TODO return sealed outcome, but sealed NotificationPipelineOutcome already exists."
    impact:
      - "Confuses AI agents and future refactors."
    fix:
      - "Delete ProcessingResult."
      - "Replace stale TODO with current contract notes."
    tests:
      - "static grep no ProcessingResult in NotificationProcessingPipeline"

  - id: "P1-CURRENT-017"
    severity: "P3_LOW"
    status: "OPEN"
    title: "Parser provenance performs deterministic parse twice"
    evidence:
      - "processInternal calls parseWithAiFallback(), then calls parserRegistry.parse() again to infer provenance."
    impact:
      - "Extra CPU; provenance can become misleading if parsers later become stateful or time-sensitive."
    fix:
      - "Return ParseOutcome(parserName, usedAiFallback, parsed, failureReason) from AppParserRegistry."
    tests:
      - "deterministic_parser_invoked_once_per_notification"

  - id: "P1-CURRENT-018"
    severity: "P3_LOW"
    status: "OPEN"
    title: "ServiceDiagnostics remains too shallow"
    evidence:
      - "ServiceDiagnostics tracks service start/killed/disconnect counts only."
      - "Uses System.currentTimeMillis directly."
    impact:
      - "Debug screen cannot show last posted notification, last filter decision, listener connected timestamp, privacy/restore status, or last exception."
    fix:
      - "Move to TimeProvider."
      - "Extend diagnostics or rely on PipelineDiagnosticEvent for all capture stages."
    tests:
      - "diagnostics_records_last_listener_connected"
      - "diagnostics_uses_timeProvider"

  - id: "P1-CURRENT-019"
    severity: "P3_LOW"
    status: "OPEN"
    title: "NotificationCaptureService has too many responsibilities"
    evidence:
      - "Service owns listener lifecycle, FGS restart, privacy cache, extraction, filter, dedupe, raw mapping, extras JSON, and async processing."
    impact:
      - "Hard to test; regressions like combinedBody not used in live filter are easy."
    fix:
      - "Extract NotificationExtractor, NotificationCaptureGate, NotificationDeduper, NotificationRawMapper, NotificationCaptureDiagnostics."
    tests:
      - "pure unit tests cover extractor/filter/dedupe/raw mapper independently"

recommended_fix_order:
  - pr: "PR1"
    title: "Critical privacy/raw-storage fix"
    include:
      - "Exhaustive RawStorageMode handling."
      - "DO_NOT_STORE must not persist raw text/extras."
      - "Separate ephemeral processing payload from stored RawNotification."
    closes:
      - "P1-CURRENT-002"
      - "P1-CURRENT-003"

  - pr: "PR2"
    title: "Live extraction/filter/dedupe correctness"
    include:
      - "Use combinedBody in live shouldCapture."
      - "Fix MessagingStyle message extraction."
      - "Use sbn.key + content hash dedupe."
    closes:
      - "P1-CURRENT-001"
      - "P1-CURRENT-004"
      - "P1-CURRENT-005"

  - pr: "PR3"
    title: "Durable diagnostics for every exit path"
    include:
      - "Service-level RECEIVED and DROPPED_* events."
      - "Exception/cancellation events."
      - "Expose recent notification events in debug UI."
    closes:
      - "P1-CURRENT-006"
      - "P1-CURRENT-018"

  - pr: "PR4"
    title: "Durable intake / shutdown safety"
    include:
      - "Persist intake before async processing."
      - "Worker resumes unprocessed raw/intake rows."
    closes:
      - "P1-CURRENT-007"
      - "P1-CURRENT-015"

  - pr: "PR5"
    title: "Listener lifecycle cleanup"
    include:
      - "Remove periodic FGS restart reliability model."
      - "Use requestRebind and listener-health diagnostics."
    closes:
      - "P1-CURRENT-008"

  - pr: "PR6"
    title: "Parser/provenance/currency cleanup"
    include:
      - "Shared amount/currency signal detector."
      - "ParseOutcome provenance contract."
      - "AI fallback for user-marked financial packages."
    closes:
      - "P1-CURRENT-011"
      - "P1-CURRENT-012"
      - "P1-CURRENT-017"

definition_of_done:
  - "No raw notification text/extras are stored in DO_NOT_STORE."
  - "STORE_REDACTED and STORE_METADATA_ONLY still allow parsing from ephemeral in-memory text."
  - "Live callback and manual refresh use the same combinedBody filter/hash/parser payload."
  - "MessagingStyle messages are actually extracted."
  - "Same sbn.key with changed body is not dropped."
  - "Every service and pipeline exit writes a diagnostic event."
  - "Accepted notification has a durable intake record before cancellable async work."
  - "Listener health reports permission, bound/connected state, and foreground-service state separately."
  - "Pipeline outcome is not hidden by repository API when callers need it."
  - "Stale TODO/dead ProcessingResult removed."

